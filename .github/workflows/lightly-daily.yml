name: Lightly hourly lift
on:
  schedule:
    # Every hour from 8:07 to 21:07 Toronto time (covers both winter and summer time).
    # The script skips anything outside 8:00-21:59 Toronto time, so these extra hours are harmless.
    - cron: '7 12-23,0-2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lightly
      - name: Send a lift
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCHEDULE: ${{ github.event.schedule }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
        run: node lightly/notify.mjs
