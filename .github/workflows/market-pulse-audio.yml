name: Market Pulse audio
on:
  schedule:
    - cron: '35 2 * * *'    # about 8:05 IST, after the 7:43 IST sheet update
    - cron: '35 3 * * *'    # second pass in case the sheet update ran late
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-pulse-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            market-pulse
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python market-pulse/tools/make_audio.py
      - name: Commit audio
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add -A market-pulse/audio
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Market Pulse: refresh daily audio"
          git pull --rebase origin main && git push origin HEAD:main
