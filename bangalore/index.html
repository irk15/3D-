<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bengaluru · The Garden City</title>
<meta name="theme-color" content="#0b0a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --night:#0b0a1c; --panel:rgba(16,11,38,.66); --panel-hi:rgba(34,22,72,.84);
  --line:rgba(255,196,96,.22); --line-hi:rgba(255,196,96,.62);
  --marigold:#ffb02e; --kumkum:#e5322d; --kanyellow:#ffcc00; --metro:#9b4dff; --jac:#b49cff; --leaf:#74d68f; --chai:#e9a56b;
  --ink:#fff4e0; --dim:#b3a8c9; --bad:#ff6a5a;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; --kn:'Noto Sans Kannada','Manrope',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--night);color:var(--ink);font:500 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:minmax(0,270px) 1fr minmax(0,330px);grid-template-rows:auto 1fr auto;gap:12px;
  grid-template-areas:"top top top" "left . right" "dock dock dock";transition:opacity .4s}
#hud>*{pointer-events:auto;min-width:0}
body.vr #hud{opacity:0;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
  border-radius:14px;box-shadow:0 10px 40px rgba(8,2,30,.5),inset 0 0 30px rgba(255,176,46,.04)}
h2{margin:0 0 10px;font:700 10px/1 var(--sans);letter-spacing:.24em;color:var(--marigold);text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
#top{grid-area:top;display:flex;align-items:center;gap:22px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;margin-right:auto}
.kn{font:800 30px/1 var(--kn);background:linear-gradient(90deg,var(--kanyellow),var(--kumkum));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
.en{display:flex;flex-direction:column;line-height:1}
.en b{font:700 22px/1 var(--serif);letter-spacing:.01em}
.en i{font:500 9px/1 var(--sans);font-style:normal;letter-spacing:.38em;color:var(--marigold);margin-top:5px}
.clock{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono)}
.clock b{font:500 24px/1 var(--mono);color:var(--marigold)}
.clock span{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.chipwx{display:flex;gap:10px;align-items:center;font:600 12px var(--sans);color:var(--ink)}
.chipwx em{font-style:normal;color:var(--dim);font-weight:500}
#left{grid-area:left;align-self:start;padding:14px;max-height:100%;overflow:auto}
#llist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#llist li{display:grid;grid-template-columns:6px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.035);cursor:pointer;transition:background .2s,transform .2s}
#llist li:hover{background:rgba(255,176,46,.12);transform:translateX(2px)}
#llist li.sel{background:var(--panel-hi);box-shadow:inset 0 0 0 1px var(--line-hi)}
#llist .dot{width:6px;height:26px;border-radius:3px;background:var(--c)}
#llist b{display:block;font-weight:600;font-size:13px}
#llist small{font:500 10.5px/1.2 var(--kn);color:var(--dim)}
#card{grid-area:right;align-self:start;padding:16px;display:none;flex-direction:column;gap:8px}
#card.show{display:flex}
#card h3{margin:0;font:700 24px/1.1 var(--serif)}
#card .knn{font:700 16px var(--kn);color:var(--marigold)}
#card p{margin:0;color:#e9dfd0;font-size:12.5px;line-height:1.5}
#card .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn,.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:7px 12px;border-radius:999px;font:600 12px var(--sans);transition:background .2s,border-color .2s}
.btn:hover,.chip:hover{background:rgba(255,176,46,.16);border-color:var(--line-hi)}
.chip.on{background:var(--marigold);color:#2a1700;border-color:var(--marigold)}
.btn:focus-visible,.chip:focus-visible,#llist li:focus-visible{outline:2px solid var(--kanyellow);outline-offset:2px}
#dock{grid-area:dock;display:flex;gap:14px 22px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>label{font:700 9px/1 var(--sans);letter-spacing:.24em;color:var(--dim);margin-right:4px}
#tslide{width:140px;accent-color:var(--marigold)}
#vrbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:92px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto;transition:opacity .4s}
body.vr #vrbar{display:none}
#vrEnter{padding:12px 20px;border-radius:999px;border:0;font:700 14px var(--sans);letter-spacing:.04em;color:#240d3f;background:linear-gradient(90deg,var(--marigold),var(--kanyellow));box-shadow:0 8px 30px rgba(255,176,46,.35)}
#vrEnter:disabled{opacity:.45;filter:saturate(.4);box-shadow:none;cursor:default}
#vrQ{display:flex;gap:6px}
#vrNote{font:500 11px var(--sans);color:var(--dim);max-width:260px;text-align:right}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);background:var(--panel-hi);border:1px solid var(--line-hi);padding:9px 16px;border-radius:999px;font:600 12.5px var(--sans);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 100%,#3a1b52 0%,#0b0a1c 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;transition:opacity .8s}
#boot .kn{font-size:64px}
#boot b{font:700 30px var(--serif)}
#boot p{margin:0;font:600 11px var(--sans);letter-spacing:.34em;color:var(--marigold)}
#boot .bar{width:220px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;margin-top:8px}
#boot .bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--marigold),var(--kumkum));transition:width .25s}
#boot.hide{opacity:0;pointer-events:none}
#err{position:fixed;left:12px;bottom:12px;max-width:80vw;color:#ffb4a8;font:500 11px var(--mono);white-space:pre-wrap;z-index:30;pointer-events:none}
#hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);font:500 11px var(--sans);color:var(--dim);background:rgba(10,6,28,.55);padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .5s}
body.vr #hint{display:none}
@media (max-width:900px){
  #hud{grid-template-columns:1fr;grid-template-areas:"top" "." "dock"}
  #left,#card{display:none!important}
  .clock b{font-size:18px}.kn{font-size:22px}.en b{font-size:16px}
  #vrbar{bottom:130px}
}
</style>
</head>

</div>

<div id="toast" role="status"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

const SKY_GLSL = `
uniform vec3 uZen,uMid,uHor,uSunDir,uSunCol,uMoonDir; uniform float uNight,uTime,uCloud;

  }

    c=mix(c,vec3(0.82,0.86,1.15)*(1.5+cr*0.7),smoothstep(0.03,0.027,mdist)*uNight);

const WX = {rain: 0, target: 0};
