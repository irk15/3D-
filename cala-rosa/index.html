<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}</style>
<title>Cala Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed live WebGL diorama; caption top-left, one glass control dock bottom-left. Single sunlit look by design. */
:root{
  --ink:#fff6ea;
  --ink-dim:rgba(255,240,222,.74);
  --glass:rgba(26,40,48,.46);
  --edge:rgba(255,236,206,.2);
  --terra:#e8743c;
  --sea:#35c2cc;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#7fc4d4;color:var(--ink);overflow:hidden;font-family:var(--display)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.cap{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:3px;pointer-events:none;text-shadow:0 1px 16px rgba(20,40,50,.55)}
.cap h1{margin:0;font-weight:800;font-size:clamp(24px,3.4vw,38px);letter-spacing:-.02em;line-height:1}
.cap h1 b{color:#ffb27a;font-weight:800}
.cap p{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.dock{position:fixed;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  max-width:calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:9px;padding:3px;gap:2px}
.seg button,.tog{font:500 12px/1 var(--display);color:var(--ink-dim);background:transparent;border:0;border-radius:7px;padding:8px 11px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#2c3d44}
.tog[aria-pressed="true"]{color:#ffc58f}
.seg button:focus-visible,.tog:focus-visible,input:focus-visible{outline:2px solid #ffc58f;outline-offset:2px}
label.sl{display:flex;align-items:center;gap:8px;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
input[type=range]{width:96px;accent-color:var(--terra)}
.hint{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  font:400 11px/1.4 var(--mono);color:var(--ink-dim);letter-spacing:.06em;text-align:right;pointer-events:none;text-shadow:0 1px 10px rgba(20,40,50,.5)}
@media (max-width:700px){.hint{display:none}.cap p{font-size:10px}}
#err{position:fixed;inset:auto 16px 50% 16px;text-align:center;font:500 14px var(--display)}
</style>

</head>
<body>
<canvas id="stage" aria-label="Interactive 3D miniature of a Mediterranean seaside village with a harbour, plaza, terracotta roofs and people going about their day"></canvas>
<div class="cap"><h1><b>Cala</b> Rosa</h1><p>Live diorama · 1:30 scale · Three.js</p></div>
<div class="dock" role="toolbar" aria-label="Scene controls">
  <div class="seg" role="group" aria-label="Time of day">
    <button id="tDay" aria-pressed="true">Midday</button>
    <button id="tGold" aria-pressed="false">Golden hour</button>
    <button id="tBlue" aria-pressed="false">Blue hour</button>
  </div>
  <label class="sl" for="blur">Tilt-shift <input id="blur" type="range" min="0" max="1.6" step="0.01" value="1"></label>
  <button id="drift" class="tog" aria-pressed="true">Camera drift</button>
</div>
<div class="hint">Drag to orbit · Scroll to zoom</div>
<div id="err" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script>
(async function(){
'use strict';
if(!window.THREE){const e=document.getElementById('err');e.hidden=false;e.textContent='The 3D engine could not load. Check your connection and reload.';return;}
THREE.ColorManagement.legacyMode = false;
try{ await Promise.race([document.fonts.load('800 100px "Bricolage Grotesque"'), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
const DPR = Math.min(devicePixelRatio||1, 1.75);
renderer.setPixelRatio(DPR); renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.LinearEncoding; renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, innerWidth/innerHeight, 0.5, 600);
camera.position.set(-24, 35, 47);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

/* ---------- helpers ---------- */
const C = (h)=>new THREE.Color(h);
const matCache = new Map();
function mat(color, rough=0.7, opts={}){
  const key = color+'|'+rough+'|'+JSON.stringify(opts);
  if(matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial(Object.assign({color:C(color), roughness:rough, metalness:0, envMapIntensity:0.3}, opts));
  matCache.set(key,m); return m;
}
function glow(color, intensity=2){ return new THREE.MeshStandardMaterial({color:C('#1a0f08'), emissive:C(color), emissiveIntensity:intensity, roughness:0.4}); }
const rboxCache=new Map();
function rbox(w,h,d,r=0.06,seg=2){
  const key=[w,h,d,r,seg].map(v=>v.toFixed(3)).join(',');
  if(rboxCache.has(key)) return rboxCache.get(key);
  r = Math.min(r, w/2-0.005, h/2-0.005, d/2-0.005);
  const iw=w-2*r, ih=h-2*r, cr=Math.min(r*0.8, iw/2, ih/2);
  const s=new THREE.Shape(), x=-iw/2, y=-ih/2;
  s.moveTo(x+cr,y); s.lineTo(x+iw-cr,y); s.quadraticCurveTo(x+iw,y,x+iw,y+cr);
  s.lineTo(x+iw,y+ih-cr); s.quadraticCurveTo(x+iw,y+ih,x+iw-cr,y+ih);
  s.lineTo(x+cr,y+ih); s.quadraticCurveTo(x,y+ih,x,y+ih-cr);
  s.lineTo(x,y+cr); s.quadraticCurveTo(x,y,x+cr,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.001,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r*0.98,bevelSegments:seg,curveSegments:4});
  g.translate(0,0,-(d-2*r)/2); g.computeVertexNormals(); rboxCache.set(key,g); return g;
}
function add(parent, geo, material, x=0,y=0,z=0, opt={}){
  const m=new THREE.Mesh(geo,material); m.position.set(x,y,z);
  if(opt.rx) m.rotation.x=opt.rx; if(opt.ry) m.rotation.y=opt.ry; if(opt.rz) m.rotation.z=opt.rz;
  if(opt.s) m.scale.set(...(Array.isArray(opt.s)?opt.s:[opt.s,opt.s,opt.s]));
  m.castShadow = opt.cast!==false; m.receiveShadow = opt.receive!==false;
  parent.add(m); return m;
}
function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); return t;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const rand = (()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647;})();
const pick=(a)=>a[(rand()*a.length)|0];
const lerp=THREE.MathUtils.lerp;

/* ---------- textures ---------- */
function plasterTex(base,spread=10){
  return canvasTex(256,256,(c,w,h)=>{
    c.fillStyle=base;c.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){c.fillStyle=`rgba(${rand()>.5?'255,250,240':'150,120,90'},${0.03+rand()*0.05})`;const r=1+rand()*5;c.beginPath();c.arc(rand()*w,rand()*h,r,0,6.3);c.fill();}
    for(let i=0;i<10;i++){const g=c.createRadialGradient(rand()*w,rand()*h,2,rand()*w,rand()*h,60);g.addColorStop(0,'rgba(160,120,80,.06)');g.addColorStop(1,'rgba(160,120,80,0)');c.fillStyle=g;c.fillRect(0,0,w,h);}
  });
}
function tileTex(hues){
  return canvasTex(256,256,(c,w,h)=>{
    c.fillStyle='#5a2a1c';c.fillRect(0,0,w,h);
    const rows=12,cols=7,th=h/rows,tw=w/cols;
    for(let r=0;r<rows;r++)for(let k=-1;k<=cols;k++){
      const x=k*tw+(r%2?tw/2:0), y=r*th, v=rand();
      const hu=hues[0]+v*hues[1], sa=hues[2]+v*8, li=hues[3]+v*hues[4];
      const g=c.createLinearGradient(0,y,0,y+th*1.5);
      g.addColorStop(0,`hsl(${hu},${sa}%,${li+8}%)`);g.addColorStop(0.55,`hsl(${hu},${sa}%,${li}%)`);g.addColorStop(1,`hsl(${hu},${sa}%,${li-14}%)`);
      c.fillStyle=g;c.beginPath();c.moveTo(x+1,y);c.lineTo(x+tw-1,y);c.lineTo(x+tw-1,y+th*0.9);c.quadraticCurveTo(x+tw/2,y+th*1.5,x+1,y+th*0.9);c.closePath();c.fill();
      c.strokeStyle='rgba(60,20,10,.45)';c.lineWidth=1.4;c.stroke();
    }
  });
}
function voronoiTex(S,n,pal,crack){
  const pts=[];for(let i=0;i<n;i++)pts.push([rand()*S,rand()*S,rand()]);
  const cv=document.createElement('canvas');cv.width=cv.height=S;const ctx=cv.getContext('2d');const id=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    let d1=1e9,d2=1e9,k=0;
    for(let i=0;i<n;i++){for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const dx=pts[i][0]+ox*S-x,dy=pts[i][1]+oy*S-y,d=dx*dx+dy*dy;
      if(d<d1){d2=d1;d1=d;k=i;}else if(d<d2)d2=d;}}
    const e=Math.sqrt(d2)-Math.sqrt(d1);
    const col=pal[(pts[k][2]*pal.length)|0];
    const f=Math.min(1,e/3.2); const o=(y*S+x)*4;
    id.data[o]=col[0]*f+crack[0]*(1-f);id.data[o+1]=col[1]*f+crack[1]*(1-f);id.data[o+2]=col[2]*f+crack[2]*(1-f);id.data[o+3]=255;
  }
  ctx.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;
}
function blocksTex(){
  return canvasTex(256,256,(c,w,h)=>{
    c.fillStyle='#8b7e70';c.fillRect(0,0,w,h);const rows=6,rh=h/rows;
    for(let r=0;r<rows;r++){let x=-rand()*40;while(x<w){const bw=40+rand()*40,v=rand();c.fillStyle=`hsl(${34+v*10},${16+v*8}%,${72+v*10}%)`;rr(c,x+2,r*rh+2,bw-4,rh-4,6);c.fill();x+=bw;}}
  });
}
const tilesTerra=tileTex([14,14,72,48,10]), tilesRed=tileTex([6,8,62,36,8]), tilesTeal=tileTex([176,12,40,44,8]);
[tilesTerra,tilesRed,tilesTeal].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
const paveTex=voronoiTex(512,46,[[236,226,208],[228,216,196],[240,232,216],[222,210,190]],[150,138,120]);
paveTex.repeat.set(3,3);
const blocksT=blocksTex(); blocksT.wrapS=blocksT.wrapT=THREE.RepeatWrapping; blocksT.repeat.set(5,1);
Object.values({}).length;
const wallPlaster={cream:plasterTex('#f6ead3'),warm:plasterTex('#f2dfbd'),orange:plasterTex('#efb26b'),sand:plasterTex('#ecd5ae')};
Object.values(wallPlaster).forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/3,1/3);});

/* ---------- sky, fog, lights ---------- */
const skyU = { top:{value:C('#4f9fd8')}, mid:{value:C('#a9dcec')}, bot:{value:C('#f4efe0')} };
const sky = new THREE.Mesh(new THREE.SphereGeometry(300,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
  vertexShader:'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:'uniform vec3 top,mid,bot; varying vec3 vP; void main(){ float h=vP.y; vec3 c=mix(bot,mid,smoothstep(-0.02,0.14,h)); c=mix(c,top,smoothstep(0.14,0.65,h)); gl_FragColor=vec4(c,1.); }'
}));
scene.add(sky);
scene.fog = new THREE.Fog(C('#cfe6ea'), 60, 170);
const hemi = new THREE.HemisphereLight(C('#cfe8ff'), C('#b79a7c'), 0.5); scene.add(hemi);
const sun = new THREE.DirectionalLight(C('#fff0d6'), 1.9);
sun.position.set(-20, 30, 18); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-27,right:27,top:24,bottom:-24,near:1,far:110});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04;
scene.add(sun);
const fill = new THREE.DirectionalLight(C('#ffd9b0'), 0.35); fill.position.set(22,10,24); scene.add(fill);

/* ---------- land outline (world x,z) ---------- */
const OUT=[['M',-10,-4],['L',-10,3],['C',-10,6.6,-7.4,9.6,-4,9.9],['C',0,10.3,3.2,9.1,6.2,9.5],['C',9.8,9.9,13.2,8.2,14,4],['L',14,-4]];
function trace(t,f){ for(const c of OUT){
  if(c[0]==='M'){const p=f(c[1],c[2]);t.moveTo(p[0],p[1]);}
  else if(c[0]==='L'){const p=f(c[1],c[2]);t.lineTo(p[0],p[1]);}
  else {const a=f(c[1],c[2]),b=f(c[3],c[4]),d=f(c[5],c[6]);t.bezierCurveTo(a[0],a[1],b[0],b[1],d[0],d[1]);}
}}
function landShape(){const s=new THREE.Shape();trace(s,(x,z)=>[x,-z]);s.closePath();return s;}
function rectShape(x0,x1,z0,z1){const s=new THREE.Shape();s.moveTo(x0,-z0);s.lineTo(x1,-z0);s.lineTo(x1,-z1);s.lineTo(x0,-z1);s.closePath();return s;}
function slab(shape,yBot,yTop,topMat,sideMat){
  const g=new THREE.ExtrudeGeometry(shape,{depth:yTop-yBot,bevelEnabled:false,curveSegments:14});
  g.rotateX(-Math.PI/2); g.translate(0,yBot,0);
  const m=new THREE.Mesh(g,[topMat,sideMat]); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
paveTex.repeat.set(1/8,1/8); blocksT.repeat.set(0.25,0.48);
const paveMat=new THREE.MeshStandardMaterial({map:paveTex,color:C('#e0d4be'),roughness:0.85,envMapIntensity:0.15});
const blockMat=new THREE.MeshStandardMaterial({map:blocksT,color:C('#d6c9b3'),roughness:0.9,envMapIntensity:0.15});
const Yp=0.7, Yb=2.2, Yc=3.9;
slab(landShape(),-0.8,Yp,paveMat,blockMat);
slab(rectShape(-13,17,-10,-3.9),-0.8,Yb,paveMat,blockMat);
slab(rectShape(-14,18,-22,-10),-0.8,Yc,paveMat,blockMat);

/* ---------- shore mask + animated water ---------- */
const shoreTex=(function(){
  const S=512,k=S/80; const cv=document.createElement('canvas');cv.width=cv.height=S;const c=cv.getContext('2d');
  c.fillStyle='#000';c.fillRect(0,0,S,S);
  const f=(x,z)=>[(x+40)*k,(z+40)*k];
  const path=()=>{c.beginPath();trace({moveTo:(a,b)=>c.moveTo(a,b),lineTo:(a,b)=>c.lineTo(a,b),bezierCurveTo:(a,b,d,e,g,h)=>c.bezierCurveTo(a,b,d,e,g,h)},f);c.closePath();};
  const rect=(x0,x1,z0,z1)=>{const a=f(x0,z0),b=f(x1,z1);c.beginPath();c.rect(a[0],a[1],b[0]-a[0],b[1]-a[1]);};
  c.lineJoin='round';c.strokeStyle='#fff';
  [[70,.12],[54,.14],[40,.18],[28,.22],[18,.3],[9,.4]].forEach(([w,a])=>{c.lineWidth=w;c.globalAlpha=a;path();c.stroke();rect(-13,17,-22,-3.9);c.stroke();});
  c.globalAlpha=1;c.fillStyle='#fff';path();c.fill();rect(-14,18,-22,-3.9);c.fill();
  const t=new THREE.CanvasTexture(cv);t.flipY=false;return t;
})();
const waterU={time:{value:0},shore:{value:shoreTex},deep:{value:C('#0a74b4')},shallow:{value:C('#38d4d0')},skyC:{value:C('#bfe4f2')},sunDir:{value:new THREE.Vector3(-20,30,18).normalize()},sunC:{value:C('#fff0d6')},fogC:{value:C('#cfe6ea')}};
const water=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.ShaderMaterial({uniforms:waterU,
  vertexShader:'varying vec3 wp; void main(){ vec4 w=modelMatrix*vec4(position,1.); wp=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader:`uniform float time; uniform sampler2D shore; uniform vec3 deep,shallow,skyC,sunDir,sunC,fogC; varying vec3 wp;
    float hgt(vec2 p){ float t=time; return sin(p.x*1.1+t*1.0)*.5+sin(p.y*1.5-t*.8)*.5+sin((p.x+p.y)*2.2+t*1.6)*.3+sin((p.x-p.y)*3.3-t*1.3)*.2+sin(p.x*5.1+p.y*4.3+t*2.1)*.08; }
    void main(){
      vec2 p=wp.xz; float e=.05; float h0=hgt(p); float dx=hgt(p+vec2(e,0.))-h0, dz=hgt(p+vec2(0.,e))-h0;
      vec3 N=normalize(vec3(-dx/e*.07,1.,-dz/e*.07)); vec3 V=normalize(cameraPosition-wp);
      float m=texture2D(shore,(p+40.)/80.).r;
      vec3 col=mix(deep,shallow,smoothstep(.05,.85,m));
      float fres=pow(1.-max(dot(N,V),0.),3.);
      col=mix(col,skyC,fres*.55);
      vec3 R=reflect(-sunDir,N); float sp=pow(max(dot(R,V),0.),140.); col+=sunC*sp*1.6;
      float lines=smoothstep(.82,1.,sin(h0*7.+p.x*.6)*.5+.5)*smoothstep(.2,.8,m);
      col+=vec3(.9,1.,1.)*lines*.06;
      float foam=smoothstep(.9,.99,m)*(.55+.45*sin(h0*9.+time*1.5)); col=mix(col,vec3(.97,1.,1.),foam*.7);
      float d=length(wp.xz-cameraPosition.xz); col=mix(col,fogC,smoothstep(70.,190.,d));
      gl_FragColor=vec4(col,1.);
    }`}));
water.rotation.x=-Math.PI/2; water.position.y=0; scene.add(water);

/* ---------- boulders & curb ---------- */
const lumpy=[];
for(let n=0;n<8;n++){
  const g=new THREE.IcosahedronGeometry(1,3), pa=g.attributes.position, no=g.attributes.normal, ph=rand()*10;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);
    const k=1+0.13*Math.sin(x*2.3+ph)*Math.cos(z*2.1+ph*.7)+0.08*Math.sin(y*3.1+x*1.7+ph);
    pa.setXYZ(i,x*k,y*k*0.82,z*k);
  }
  for(let i=0;i<pa.count;i++){const v=new THREE.Vector3(pa.getX(i),pa.getY(i)/0.82,pa.getZ(i)).normalize();no.setXYZ(i,v.x,v.y,v.z);}
  lumpy.push(g);
}
const boulderMats=['#d9cab0','#cfbfa4','#ddd0b8','#c9b79b'].map(c=>mat(c,0.88,{envMapIntensity:0.25}));
function boulder(x,y,z,r){ const m=add(scene,pick(lumpy),pick(boulderMats),x,y,z,{s:[r*(0.9+rand()*0.3),r*(0.8+rand()*0.35),r*(0.9+rand()*0.3)]}); m.rotation.y=rand()*6.28; return m; }
const edgePts=landShape().getSpacedPoints(110).map(p=>({x:p.x,z:-p.y})).filter(p=>p.z>-3.3);

function setPose(u,t,dt,b){
  const ph=u.phase,L=u.legs,A=u.arms,to=u.torso,hd=u.head;
  const reset=()=>{L[0].rotation.set(0,0,0);L[1].rotation.set(0,0,0);A[0].rotation.set(0,0,0);A[1].rotation.set(0,0,0);to.position.y=0;hd.rotation.set(0,0,0);};

      hd.rotation.y=Math.sin(t*0.4+ph)*0.35;hd.rotation.z=Math.sin(t*0.7+ph)*0.05;

    case 'vendor': reset(); A[0].rotation.x=-0.9+Math.sin(t*3+ph)*0.3;A[1].rotation.x=-0.7-Math.sin(t*3+ph)*0.3;hd.rotation.x=0.25;hd.rotation.y=Math.sin(t*0.6+ph)*0.35;break;

function walk(p,t,dt){

  else{
    if(b.i===undefined){b.i=0;b.d=1;b.s=0;}
    const R=b.route; let j=b.i+b.d; if(j<0||j>=R.length){b.d*=-1;j=b.i+b.d;}
    const A=R[b.i],B=R[j],len=Math.hypot(B[0]-A[0],B[1]-A[1]);
    b.s+=dt*b.speed/len; if(b.s>=1){b.s=0;b.i=j;}

    p.position.set(x,groundY(x,z)+Math.abs(Math.sin(t*8+u.phase))*0.045,z);
    const want=Math.atan2(B[0]-A[0],B[1]-A[1]); let d=want-p.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); p.rotation.y+=d*Math.min(1,dt*6);
  }

}

  add(g,new THREE.ConeGeometry(0.025*sc,0.1*sc,6),mat(kind==='gull'?'#f2a52e':'#d8a85a',0.5),0,0.06*sc,0.37*sc,{rx:Math.PI/2,cast:false});
  const wings=[-1,1].map(sd=>{const pv=new THREE.Group();pv.position.set(sd*0.1*sc,0.03*sc,0);g.add(pv);
    const w=new THREE.Mesh(wingGeo,wm);w.position.x=sd*0.25*sc;w.scale.set(sc*(kind==='gull'?1.6:1),1,sc*(kind==='gull'?1.2:1));w.position.x=sd*0.25*sc*(kind==='gull'?1.6:1);pv.add(w);return pv;});
  add(g,new THREE.ConeGeometry(0.06*sc,0.2*sc,4),bm,0,0,-0.3*sc,{rx:-Math.PI/2,s:[1,1,0.4],cast:false});
  scene.add(g);return {g,wings,kind,sc};
}
for(let i=0;i<7;i++){const b=bird('gull');b.cx=-2+rand()*6;b.cz=12+rand()*4;b.r=11+rand()*14;b.sp=(0.12+rand()*0.08)*(i%2?1:-1);b.a=rand()*6.28;b.h=9+rand()*5;b.ph=rand()*6;birds.push(b);}
const homes=[[6.4,2.6],[7.0,3.1],[5.9,3.3],[6.8,2.1],[-2.5,6.0],[-3.1,5.6]];
homes.forEach(([x,z],i)=>{const b=bird('pigeon');b.hx=x;b.hz=z;b.state='ground';b.t=rand()*4;b.ph=rand()*6;b.g.position.set(x,Yp+0.1,z);b.g.rotation.y=rand()*6;birds.push(b);});
function updBird(b,t,dt){
  if(b.kind==='gull'){
    b.a+=dt*b.sp;const x=b.cx+Math.cos(b.a)*b.r,z=b.cz+Math.sin(b.a)*b.r*0.8,y=b.h+Math.sin(t*0.5+b.ph)*0.8;
    b.g.position.set(x,y,z);b.g.rotation.y=Math.atan2(-Math.sin(b.a)*Math.sign(b.sp),Math.cos(b.a)*0.8*Math.sign(b.sp));
    b.g.rotation.z=-0.25*Math.sign(b.sp);
    const f=Math.sin(t*3.2+b.ph)*0.35*(Math.sin(t*0.4+b.ph)>0.2?1:0.15);b.wings[0].rotation.z=f;b.wings[1].rotation.z=-f;return;
  }
  b.t-=dt;
  if(b.state==='ground'){
    b.g.position.y=Yp+0.1+Math.max(0,Math.sin(t*9+b.ph))*0.0; b.g.children[1].position.y=0.07*b.sc-Math.max(0,Math.sin(t*5+b.ph))*0.03;
    b.wings.forEach(w=>w.rotation.z=0.0);
    if(b.t<0){ if(rand()<0.25){b.state='fly';b.t=2.6+rand();b.from=b.g.position.clone();b.to=new THREE.Vector3(b.hx+(rand()-.5)*3,Yp+0.1,b.hz+(rand()-.5)*2.5);b.dur=b.t;b.hx=b.to.x;b.hz=b.to.z;}
      else{b.t=1+rand()*3;b.hop=true;} }
    else if(b.hop&&b.t>0.6&&Math.sin(t*2+b.ph)>0.9){ b.g.rotation.y+=dt*3; }
  } else {
    const k=1-b.t/b.dur; if(k>=1){b.state='ground';b.t=3+rand()*6;b.g.position.copy(b.to);return;}
    const p=b.from.clone().lerp(b.to,k);p.y+=Math.sin(k*Math.PI)*3.2;b.g.position.copy(p);
    b.g.rotation.y=Math.atan2(b.to.x-b.from.x,b.to.z-b.from.z);const f=Math.sin(t*22+b.ph)*0.7;b.wings[0].rotation.z=f;b.wings[1].rotation.z=-f;
  }
}

/* ---------- boats ---------- */
const boats=[];
function boat(x,z,ry,o={}){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
  const s=new THREE.Shape();s.moveTo(-1.5,-0.55);s.lineTo(0.5,-0.58);s.quadraticCurveTo(1.45,-0.35,1.75,0);s.quadraticCurveTo(1.45,0.35,0.5,0.58);s.lineTo(-1.5,0.55);s.closePath();
  const hg=new THREE.ExtrudeGeometry(s,{depth:0.4,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:2});hg.rotateX(-Math.PI/2);hg.translate(0,-0.12,0);
  add(g,hg,mat('#f6f2ea',0.45),0,0,0);
  add(g,new THREE.PlaneGeometry(3.0,1.0),mat('#a9733f',0.7),0.1,0.26,0,{rx:-Math.PI/2,cast:false});
  const st=mat(o.stripe||'#2aa0aa',0.5);add(g,rbox(3.1,0.07,1.12,0.03),st,0.05,0.4,0);
  if(o.canopy){[[-1,-0.45],[-1,0.45],[0.5,-0.45],[0.5,0.45]].forEach(([x,z2])=>add(g,new THREE.CylinderGeometry(0.025,0.025,1.0,6),mat('#f2ece0',0.6),x,0.85,z2));
    add(g,rbox(1.8,0.07,1.2,0.03),mat('#f6f0e4',0.7),-0.25,1.38,0);add(g,rbox(1.8,0.12,0.06,0.02),mat('#e0e8e6',0.7),-0.25,1.31,0.6);}
  if(o.sail){add(g,new THREE.CylinderGeometry(0.03,0.03,3,6),mat('#e8e2d4',0.6),0,1.7,0);
    const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute([0.05,0.4,0,0.05,3.1,0,1.2,0.5,0],3));sg.computeVertexNormals();
    add(g,sg,new THREE.MeshStandardMaterial({color:C('#fdfaf2'),roughness:0.9,side:THREE.DoubleSide}),0,0,0);}
  const b={g,x,z,ry,ph:rand()*6,o};boats.push(b);return b;
}
boat(-13.4,3.4,0.25,{canopy:true});
const skiff=boat(-17,8,-0.4,{stripe:'#e9573f'}); skiff.move={a:[-21,12],b:[-17,-2],s:0,d:1,sp:0.5};
const sailer=boat(32,-8,-2.2,{sail:true,stripe:'#e9573f'}); sailer.move={a:[34,6],b:[28,-30],s:0,d:1,sp:0.35};
person({top:T1[0],pants:'#2f4a68',hat:'#e8cf8e',skin:SK[2]},0,0,0,{type:'sit'},0.4);
(function(){const p=people.pop();scene.remove(p);skiff.g.add(p);p.position.set(0.1,0.3,0);p.rotation.y=Math.PI/2;p.scale.setScalar(0.62);people.push(p);p.userData.b.boat=true;})();
function updBoat(b,t,dt){
  if(b.move){const m=b.move,len=Math.hypot(m.b[0]-m.a[0],m.b[1]-m.a[1]);m.s+=dt*m.sp*m.d/len;if(m.s>1){m.s=1;m.d=-1;}if(m.s<0){m.s=0;m.d=1;}
    const x=m.a[0]+(m.b[0]-m.a[0])*m.s,z=m.a[1]+(m.b[1]-m.a[1])*m.s;b.g.position.x=x;b.g.position.z=z;
    const want=Math.atan2(m.b[1]-m.a[1],m.b[0]-m.a[0])*-1+(m.d>0?0:Math.PI);let d=want-b.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));b.g.rotation.y+=d*Math.min(1,dt*1.5);}
  b.g.position.y=Math.sin(t*1.3+b.ph)*0.05;b.g.rotation.z=Math.sin(t*1.1+b.ph)*0.03;b.g.rotation.x=Math.sin(t*0.9+b.ph*2)*0.02;
}

/* ---------- chimney smoke ---------- */
const puffT=canvasTex(64,64,(c)=>{const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(0,0,64,64);});
const smoke=[]; scene.updateMatrixWorld(true);
chimneys.forEach(ch=>{const wp=ch.g.localToWorld(ch.local.clone());for(let i=0;i<5;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:puffT,transparent:true,depthWrite:false,opacity:0,color:0xfff6ec}));sp.userData={t:i/5,o:wp,sd:rand()*6};scene.add(sp);smoke.push(sp);}});

/* ---------- post-processing ---------- */
if(innerWidth<700) sun.shadow.mapSize.set(1024,1024);
const size=new THREE.Vector2(innerWidth*DPR,innerHeight*DPR);
const rt=new THREE.WebGLRenderTarget(size.x,size.y,{type:THREE.HalfFloatType,samples:renderer.capabilities.isWebGL2?4:0});
const composer=new THREE.EffectComposer(renderer,rt);
composer.setPixelRatio(DPR);composer.setSize(innerWidth,innerHeight);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.3,0.7,0.92);composer.addPass(bloom);
const TiltShift={uniforms:{tDiffuse:{value:null},res:{value:size.clone()},dir:{value:new THREE.Vector2(1,0)},focus:{value:0.5},band:{value:0.12},amount:{value:1.0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:`uniform sampler2D tDiffuse; uniform vec2 res, dir; uniform float focus, band, amount; varying vec2 vUv;
    void main(){ float d=abs(vUv.y-focus); float k=smoothstep(band,band+0.34,d)*amount; vec2 st=dir/res*k*2.6*(res.y/900.);
      vec4 acc=vec4(0.); float ws=0.; for(int i=-7;i<=7;i++){ float fi=float(i); float w=exp(-fi*fi/18.); acc+=texture2D(tDiffuse,vUv+st*fi)*w; ws+=w; } gl_FragColor=acc/ws; }`};
const tsH=new THREE.ShaderPass(TiltShift),tsV=new THREE.ShaderPass(TiltShift);tsV.uniforms.dir.value.set(0,1);composer.addPass(tsH);composer.addPass(tsV);
const Grade={uniforms:{tDiffuse:{value:null},exposure:{value:1},time:{value:0},vig:{value:0.35},sat:{value:1.12},night:{value:0}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:`uniform sampler2D tDiffuse; uniform float exposure,time,vig,sat,night; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
    float l2s(float c){ return c<=0.0031308?12.92*c:1.055*pow(c,1./2.4)-0.055; }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb*exposure; c=aces(c);
      float l=dot(c,vec3(.299,.587,.114)); c=mix(vec3(l),c,sat);
      c*=mix(mix(vec3(1.04,.99,.95),vec3(.9,.96,1.08),night),vec3(1.),smoothstep(0.,.6,l));
      c=vec3(l2s(c.r),l2s(c.g),l2s(c.b)); vec2 q=vUv-.5; c*=1.-vig*dot(q,q)*1.6; c+=(hash(vUv*1000.+time)-.5)*.016; gl_FragColor=vec4(c,1.); }`};
const grade=new THREE.ShaderPass(Grade);composer.addPass(grade);

/* ---------- controls ---------- */
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(1,3.6,-4);controls.enableDamping=true;controls.dampingFactor=0.06;controls.enablePan=false;
controls.minDistance=20;controls.maxDistance=85;controls.minPolarAngle=0.5;controls.maxPolarAngle=1.3;controls.rotateSpeed=0.6;controls.zoomSpeed=0.7;controls.update();
const clock=new THREE.Clock();let lastInteract=-10,drift=!reduceMotion;
controls.addEventListener('start',()=>lastInteract=clock.getElapsedTime());
const sph=new THREE.Spherical(),off=new THREE.Vector3();off.copy(camera.position).sub(controls.target);sph.setFromVector3(off);const baseTheta=sph.theta;

/* ---------- time-of-day presets ---------- */
const lampLights=[[-8.5,5.6],[0.8,8.5],[11.2,5.8]].map(([x,z])=>{const l=new THREE.PointLight(C('#ffb766'),0,9,1.7);l.position.set(x,Yp+3,z);scene.add(l);return l;});
const mk=(o)=>({sunC:C(o.sunC),sunI:o.sunI,sunP:new THREE.Vector3(...o.sunP),hemiS:C(o.hs),hemiG:C(o.hg),hemiI:o.hi,top:C(o.top),mid:C(o.mid),bot:C(o.bot),fog:C(o.fog),deep:C(o.deep),shallow:C(o.shallow),skyW:C(o.skyW),exp:o.exp,glowW:o.gw,lampI:o.li,night:o.n,sat:o.sat,bloom:o.bl,fillI:o.fi});
const PRE={
  day:mk({sunC:'#fff0d6',sunI:2.1,sunP:[-20,30,18],hs:'#cfe8ff',hg:'#b79a7c',hi:0.6,top:'#4f9fd8',mid:'#a9dcec',bot:'#f4efe0',fog:'#cfe6ea',deep:'#0a74b4',shallow:'#38d4d0',skyW:'#bfe4f2',exp:0.64,gw:0,li:0,n:0,sat:1.14,bl:0.3,fi:0.35}),
  gold:mk({sunC:'#ffb36b',sunI:2.0,sunP:[-30,13,20],hs:'#ffd9b0',hg:'#8a6a55',hi:0.5,top:'#6a8cc6',mid:'#f2b98c',bot:'#f9d9ae',fog:'#f0cba6',deep:'#0d6a9a',shallow:'#46cdb8',skyW:'#f6c99a',exp:0.7,gw:0.7,li:1.2,n:0.15,sat:1.15,bl:0.45,fi:0.2}),
  blue:mk({sunC:'#8ea2e0',sunI:0.4,sunP:[-20,26,18],hs:'#5a6ba6',hg:'#2b2230',hi:0.32,top:'#101a40',mid:'#34407a',bot:'#7a6a92',fog:'#2a3260',deep:'#052a55',shallow:'#1c7a96',skyW:'#3c4a86',exp:0.85,gw:2.4,li:3.0,n:1,sat:1.1,bl:0.7,fi:0.05})
};
const cur=mk({sunC:'#fff0d6',sunI:2.1,sunP:[-20,30,18],hs:'#cfe8ff',hg:'#b79a7c',hi:0.6,top:'#4f9fd8',mid:'#a9dcec',bot:'#f4efe0',fog:'#cfe6ea',deep:'#0a74b4',shallow:'#38d4d0',skyW:'#bfe4f2',exp:0.64,gw:0,li:0,n:0,sat:1.14,bl:0.3,fi:0.35});
let target=PRE.day;
function blend(k){
  for(const key in cur){const a=cur[key],b=target[key]; if(a.isColor)a.lerp(b,k); else if(a.isVector3)a.lerp(b,k); else cur[key]=a+(b-a)*k;}
  sun.color.copy(cur.sunC);sun.intensity=cur.sunI;sun.position.copy(cur.sunP);fill.intensity=cur.fillI;
  hemi.color.copy(cur.hemiS);hemi.groundColor.copy(cur.hemiG);hemi.intensity=cur.hemiI;
  skyU.top.value.copy(cur.top);skyU.mid.value.copy(cur.mid);skyU.bot.value.copy(cur.bot);scene.fog.color.copy(cur.fog);waterU.fogC.value.copy(cur.fog);
  waterU.deep.value.copy(cur.deep);waterU.shallow.value.copy(cur.shallow);waterU.skyC.value.copy(cur.skyW);waterU.sunC.value.copy(cur.sunC);waterU.sunDir.value.copy(cur.sunP).normalize();
  grade.uniforms.exposure.value=cur.exp;grade.uniforms.night.value=cur.night;grade.uniforms.sat.value=cur.sat;bloom.strength=cur.bloom;
  winGlass.emissiveIntensity=cur.glowW;lampMats.forEach(m=>m.emissiveIntensity=0.5+cur.lampI*1.3);lampLights.forEach(l=>l.intensity=cur.lampI*0.9);
}
blend(1);
const bDay=document.getElementById('tDay'),bGold=document.getElementById('tGold'),bBlue=document.getElementById('tBlue'),bDrift=document.getElementById('drift'),blurIn=document.getElementById('blur');
function setPre(k){target=PRE[k];[[bDay,'day'],[bGold,'gold'],[bBlue,'blue']].forEach(([b,n])=>b.setAttribute('aria-pressed',String(n===k)));}
bDay.onclick=()=>setPre('day');bGold.onclick=()=>setPre('gold');bBlue.onclick=()=>setPre('blue');
bDrift.setAttribute('aria-pressed',String(drift));bDrift.onclick=()=>{drift=!drift;bDrift.setAttribute('aria-pressed',String(drift));};
blurIn.oninput=()=>{tsH.uniforms.amount.value=tsV.uniforms.amount.value=+blurIn.value;};

/* ---------- animation loop ---------- */
const tmpV=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();
  blend(Math.min(1,dt*1.6));
  waterU.time.value=t*(reduceMotion?0:1);
  if(!reduceMotion){
    people.forEach(p=>{const b=p.userData.b;if(b.type==='walk')walk(p,t,dt);else setPose(p.userData,t,dt,b);});
    birds.forEach(b=>updBird(b,t,dt));boats.forEach(b=>updBoat(b,t,dt));
    trees.forEach((tr,i)=>{tr.cr.rotation.z=Math.sin(t*0.9+i)*tr.amp;tr.cr.rotation.x=Math.cos(t*0.7+i*1.3)*tr.amp*0.7;});
    cloth.forEach(c=>{c.pv.rotation.z=Math.sin(t*2.1+c.ph)*0.14;c.pv.rotation.x=Math.sin(t*1.5+c.ph)*0.1;});
    smoke.forEach(s=>{const u=s.userData;u.t=(u.t+dt*0.12)%1;const k=u.t;s.position.set(u.o.x+k*1.6+Math.sin(k*5+u.sd)*0.15,u.o.y+k*3.2,u.o.z+Math.sin(k*3+u.sd)*0.12);s.scale.setScalar(0.35+k*1.1);s.material.opacity=Math.sin(k*Math.PI)*0.4;});
    scene.userData.poolTex.offset.set(t*0.02,t*0.013);
    rod.rotation.z=Math.sin(t*0.8)*0.02;rod.updateMatrixWorld(true);tmpV.set(-2.27,1.11,0);rod.localToWorld(tmpV);
    floatM.position.y=0.04+Math.sin(t*1.6)*0.02;const la=lineG.attributes.position;la.setXYZ(0,tmpV.x,tmpV.y,tmpV.z);la.setXYZ(1,floatM.position.x,floatM.position.y,floatM.position.z);la.needsUpdate=true;
    if(drift&&t-lastInteract>4){off.copy(camera.position).sub(controls.target);sph.setFromVector3(off);const want=baseTheta+Math.sin(t*0.1)*0.3;sph.theta+=(want-sph.theta)*dt*0.35;off.setFromSpherical(sph);camera.position.copy(controls.target).add(off);}
  }
  grade.uniforms.time.value=t%10;controls.update();composer.render();requestAnimationFrame(frame);
}
function resize(){
  const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w/h<0.8?42:26;camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);composer.setSize(w,h);const r=new THREE.Vector2(w*DPR,h*DPR);tsH.uniforms.res.value.copy(r);tsV.uniforms.res.value.copy(r);
  const portrait=w/h<0.8;[tsH,tsV].forEach(p=>{p.uniforms.focus.value=0.5;p.uniforms.band.value=portrait?0.09:0.13;});
}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
