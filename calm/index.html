<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calm</title>
<style>
:root{--bg:#0f1720;--card:#18232f;--card2:#1f2d3b;--tx:#e8eef4;--mut:#8ba0b3;--acc:#5fd3b0;--acc2:#3fa88a;--warn:#f2b66d;--line:#2a3a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.mut{color:var(--mut);font-size:14px;line-height:1.45}
.quote{font-size:19px;line-height:1.4;font-weight:600}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;margin:6px 0;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#07241b;font-weight:700;cursor:pointer}
button.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:600}
button.ghost{background:none;color:var(--mut);font-weight:600;padding:8px}
button.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:9px 14px;border-radius:999px;font-size:15px;font-weight:500}
.chip.on{background:var(--acc);color:#07241b;border-color:var(--acc)}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:#07241b}
.task.done .box{background:var(--acc);border-color:var(--acc)}
.task.done span{color:var(--mut);text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1118;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:12px;font-weight:600}
nav button.on{color:var(--acc)}
nav button b{display:block;font-size:20px;margin-bottom:2px}
#sos{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;border-radius:999px;padding:16px 22px;box-shadow:0 6px 24px rgba(95,211,176,.35);font-size:17px}
.score{display:flex;gap:10px}.score div{flex:1;background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.score b{display:block;font-size:26px;color:var(--acc)}.score span{font-size:12px;color:var(--mut)}
#pause{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#pause.on{display:flex}
#pause .inner{max-width:480px;width:100%}
.orb{width:190px;height:190px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 30%,#8ff0d2,#2f9c80);transition:transform 4s ease-in-out;box-shadow:0 0 60px rgba(95,211,176,.4)}
.orb.in{transform:scale(1.35)}.orb.out{transform:scale(.8);transition-duration:6s}
.big{font-size:22px;font-weight:700;margin:6px 0}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.hide{display:none}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}.item:last-child{border:0}
.hist{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0}.hist i{flex:1;background:var(--acc2);border-radius:3px 3px 0 0;min-height:2px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:#07241b;padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>
<button id="sos">⏸ Pause</button>

<div id="pause"><div class="inner" id="pauseBody"></div></div>

<nav>
  <button data-t="today"><b>☀️</b>Today</button>
  <button data-t="log"><b>📝</b>Log</button>
  <button data-t="tools"><b>🛡</b>Tools</button>
  <button data-t="progress"><b>📈</b>Progress</button>
</nav>

<script>
"use strict";
/* ---------- data ---------- */
const KEY="calm_v1";
const IDENT=[
 "I respond. I don't react.",
 "I feel it, I name it, then I choose.",
 "Calm is my default speed.",
 "I speak slowly and say only what's useful.",
 "Other people's chaos is not my assignment.",
 "I keep promises to myself.",
 "I solve what I can and release what I can't.",
 "I'm allowed to feel it and still choose well."
];
const CHALLENGES=[
 "Speak first in one conversation or meeting today.",
 "Ask one question you'd normally stay quiet about.",
 "Make one call or send one message you've been avoiding.",
 "Hold eye contact and speak at half your usual speed in one conversation.",
 "Say 'Let me think about that' once instead of answering instantly.",
 "Compliment someone sincerely.",
 "Do one task for 25 minutes with your phone out of reach.",
 "Disagree with someone calmly, with one reason.",
 "Take a 10-minute walk without your phone.",
 "Introduce yourself to someone new.",
 "Finish the smallest task you've been postponing.",
 "When irritated today, pause 5 seconds before replying. Once is enough.",
 "Share one idea or opinion at work.",
 "Ask someone for feedback on your work."
];
const REPLIES=[
 ["Buy time","Let me think about that and get back to you."],
 ["Buy time","I want to give that a proper answer. Can we come back to it in a bit?"],
 ["Rude tone","I hear you. Let's talk when we can both be clear."],
 ["Rude tone","I'm happy to discuss this. I'd just like to keep it respectful."],
 ["Unfair claim","I see it differently. Here's what I understood: ..."],
 ["Unfair claim","Help me understand what you need from me here."],
 ["Pressure","I can't commit right now. I'll confirm by end of day."],
 ["Pushback","That's not going to work for me. Here's what I can do instead: ..."],
 ["Exit","I'm going to step away for a few minutes and return to this."]
];
const EMOTIONS=["Irritated","Angry","Anxious","Afraid","Overwhelmed","Embarrassed","Disrespected","Sad","Restless","Jealous","Tired","Hurt"];
const TRIGGERS=["Someone's tone","Being ignored","Criticism","Delays / waiting","Money worry","Future worry","Work pressure","Family","Feeling behind","Tiredness / hunger","Social media","Other"];
const REFRAMES=[
 "What's another way to see this that's also true?",
 "Will this matter in 5 days? 5 months?",
 "What would I tell a friend in this exact spot?",
 "What do they need that I'm not seeing? Even a bad tone often comes from stress.",
 "What part of this is in my control right now?"
];

/* ---------- local understanding engine (no network, no API key) ----------
   Lexicon + pattern matching over whatever you type, run entirely on-device.
   This is a self-coaching aid, not therapy or a diagnosis — see the Tools tab. */
const EMO_LEX={
 anger:{words:["angry","furious","pissed","mad","rage","irritated","annoyed","fuming","resentful","snapped"],label:"Angry"},
 anxiety:{words:["anxious","nervous","on edge","panicky","worried sick","can't breathe","tight chest","dread","panicking"],label:"Anxious"},
 fear:{words:["scared","afraid","terrified","frightened"],label:"Afraid"},
 sadness:{words:["sad","down","low","heavy","empty","numb","blue","tearful","crying","cried"],label:"Sad"},
 overwhelm:{words:["overwhelmed","too much","drowning","can't keep up","buried","swamped"],label:"Overwhelmed"},
 shame:{words:["embarrassed","ashamed","humiliated"],label:"Embarrassed"},
 disrespect:{words:["disrespected","dismissed","talked down","ignored me","not heard","unheard","disregarded"],label:"Disrespected"},
 restless:{words:["restless","can't sit still","antsy","wired","jittery"],label:"Restless"},
 jealousy:{words:["jealous","envious","envy"],label:"Jealous"},
 tired:{words:["exhausted","drained","tired","burnt out","burned out","no energy"],label:"Tired"},
 hurt:{words:["hurt","wounded","betrayed","let down","stung"],label:"Hurt"},
 loneliness:{words:["lonely","isolated","nobody gets","no one understands"],label:"Lonely"}
};
const INTENSIFIERS=["very","really","so","extremely","totally","completely","absolutely","incredibly"];
const NEGATORS=["not","n't","no longer","never felt","stopped feeling"];
const DISTORTIONS=[
 {type:"all-or-nothing",re:/\b(always|never|every (single )?time|everyone|no one ever|nothing ever|everything('s| is) (ruined|wrong))\b/i,
  label:"All-or-nothing thinking",explain:"One moment got sized up to ‘always’ or ‘everyone.’ That's a common stress reflex, and it's rarely literally true.",
  question:"Is this really every time — or just this time?"},
 {type:"catastrophizing",re:/\b(disaster|ruined|the end|can'?t handle this|this is (awful|terrible)|worst (day|thing))\b/i,
  label:"Catastrophizing",explain:"The mind jumped straight to the worst possible ending.",
  question:"What's the most likely outcome here — not the worst one?"},
 {type:"mind-reading",re:/\b(they must think|they think i'?m|they hate me|everyone thinks|he thinks i'?m|she thinks i'?m|they'?re judging)\b/i,
  label:"Mind-reading",explain:"This guesses at what's in someone else's head without them actually saying it.",
  question:"What did they actually say, versus what you're assuming they meant?"},
 {type:"fortune-telling",re:/\b(going to fail|will never|it'?s never going to|no point( in)? trying|always (going to )?be like this)\b/i,
  label:"Fortune-telling",explain:"This treats a predicted bad outcome as if it's already decided.",
  question:"What's one version of this that could still go okay?"},
 {type:"should",re:/\b(should(n't)? have|supposed to|should be able to)\b/i,
  label:"Should-statement",explain:"Rules like ‘should’ tend to produce guilt more than change.",
  question:"What would you say to a friend who did the exact same thing?"},
 {type:"personalization",re:/\b(my fault|because of me|i ruined|i always mess|i always screw)\b/i,
  label:"Personalization",explain:"This takes full ownership of something that likely had more than one cause.",
  question:"What part of this was actually yours, and what wasn't?"},
 {type:"labeling",re:/\bi'?m (so )?(stupid|an idiot|worthless|pathetic|a failure|useless)\b/i,
  label:"Labeling",explain:"One action just got turned into a verdict on your whole identity.",
  question:"Is this what you did, or who you are?"}
];
const TRIGGER_LEX={
 "Someone's tone":["tone","snapped at","yelled","raised his voice","raised her voice","talked to me like"],
 "Being ignored":["ignored","ignores me","ignoring me","left on read","no reply","didn't respond","left out"],
 "Criticism":["criticiz","judged","called out","pointed out my","feedback on"],
 "Delays / waiting":["waiting","running late","delayed","stuck in traffic","taking forever"],
 "Money worry":["money","bill","rent","paycheck","afford","debt"],
 "Future worry":["future","what if i","career","don't know what i'm doing","no direction"],
 "Work pressure":["deadline","my boss","at work","the meeting","the project","the client"],
 "Family":["my mom","my dad","my family","my brother","my sister","my parents"],
 "Feeling behind":["behind everyone","everyone else is","should be further","not where i"],
 "Tiredness / hunger":["exhausted","hadn't eaten","no sleep","didn't sleep"],
 "Social media":["instagram","twitter","tiktok","scrolling","social media"]
};
const TRIG2GROUP={"Someone's tone":"Rude tone","Criticism":"Unfair claim","Work pressure":"Pressure","Delays / waiting":"Buy time"};
const CRISIS_RE=/\b(kill myself|killing myself|end my life|ending my life|want to die|wish i (was|were) dead|better off dead|no reason to live|can'?t go on|suicide|hurt myself|self[- ]harm)\b/i;
function analyzeText(raw){
  if(CRISIS_RE.test(raw))return{crisis:true};
  const t=" "+raw.toLowerCase()+" ";
  const emo={};
  Object.entries(EMO_LEX).forEach(([k,v])=>{
    v.words.forEach(w=>{
      const i=t.indexOf(w);
      if(i>-1){
        const before=t.slice(Math.max(0,i-16),i);
        const neg=NEGATORS.some(n=>before.includes(n));
        const boost=INTENSIFIERS.some(n=>before.includes(n));
        emo[k]=(emo[k]||0)+(neg?-1:1)+(boost&&!neg?0.5:0);
      }
    });
  });
  const ranked=Object.entries(emo).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const top=ranked[0];
  const intensity=top?(top[1]>=2?"strong":top[1]>=1.5?"moderate":"mild"):null;
  let trig=null,trigScore=0;
  Object.entries(TRIGGER_LEX).forEach(([k,ws])=>{
    const s=ws.filter(w=>t.includes(w)).length;
    if(s>trigScore){trigScore=s;trig=k}
  });
  const found=DISTORTIONS.filter(d=>d.re.test(raw)).slice(0,2);
  return{crisis:false,emotions:ranked.map(([k])=>EMO_LEX[k].label),topEmotion:top?EMO_LEX[top[0]].label:null,intensity,trigger:trig,distortions:found};
}
function flagged(s){return CRISIS_RE.test(s||"")}
function crisisHTML(){
  return `<div class="card" style="text-align:left;border-color:var(--warn)">
   <div class="mut" style="color:var(--warn)">Pause here with me</div>
   <div class="big" style="margin:8px 0">What you just wrote matters — you don't have to carry it alone right now.</div>
   <div class="mut" style="margin-bottom:10px">In Canada you can call or text <b>988</b> any time, free and confidential (Talk Suicide Canada). If you're in immediate danger, call <b>911</b>.</div>
   <div class="row"><a href="tel:988" style="flex:1"><button style="width:100%">Call 988</button></a><a href="sms:988" style="flex:1"><button class="sec" style="width:100%">Text 988</button></a></div>
   <div class="mut" style="margin-top:10px">Is there one person you trust who you could message right now, even just to say you're struggling?</div>
  </div>`;
}
function showCrisis(){
  clearInterval(pTimer);
  $("#pause").classList.add("on");
  $("#pauseBody").innerHTML=crisisHTML()+`<button class="sec" id="crClose" style="width:100%;margin-top:14px">Close</button>`;
  $("#crClose").onclick=closePause;
}

/* ---------- optional AI companion (bring-your-own key) ----------
   Separate storage key on purpose: never touches S, so it's never in
   "Export my data" or wiped by "Reset all". Crisis text never reaches
   this — callers always run flagged()/showCrisis() first. */
const AIKEY="calm_ai_v1";
function loadAI(){try{return JSON.parse(localStorage.getItem(AIKEY))||{}}catch(e){return{}}}
function saveAI(cfg){try{localStorage.setItem(AIKEY,JSON.stringify(cfg))}catch(e){}}
const DEFAULT_SYS="You are a sharp, emotionally intelligent self-coaching companion inside a personal app called Calm, used by one person who wants real, specific help — not an intake form. Voice: warm but direct, like a perceptive friend who already gets it — 4 to 7 short sentences, no bullet lists, no clinical jargon, no generic advice ('try to relax', 'take a few deep breaths') unless tied to the exact specifics they described. Hard rule: do NOT ask a clarifying question before helping. Work with whatever they gave you, even if it's thin — make your best accurate read of what's really going on (often what's underneath the surface complaint, not just the literal words — e.g. this usually isn't really about the dishes, it's about feeling disrespected) and act on that read. Structure: (1) one sharp sentence naming what's actually going on, in plain specific terms, not a generic emotion label; (2) one or two concrete, specific suggestions for what to do or say next — an actual line they could say, a specific next move — grounded in their exact situation; (3) only if something is genuinely unclear and you truly cannot give useful help without it, you may end on one short question — otherwise always end on the suggestion, never on a question, and never stack more than one question in a reply. Never diagnose, never suggest medication, never claim to be a licensed therapist or psychologist. If it sounds like a longstanding pattern rather than one moment, add one short, non-preachy line that a real therapist or doctor would be a strong move.";
function aiTurnContext(an){
  const base=aiContext();
  if(!an||an.crisis)return base;
  const bits=[base];
  if(an.topEmotion)bits.push("local analysis already flagged this specific message as feeling "+an.topEmotion.toLowerCase()+(an.intensity?" ("+an.intensity+" intensity)":""));
  if(an.trigger)bits.push("likely trigger category: "+an.trigger);
  if(an.distortions&&an.distortions.length)bits.push("possible thinking pattern: "+an.distortions[0].label+" — "+an.distortions[0].explain);
  bits.push("use these as a head start, not gospel — trust what they actually wrote over the label if they conflict");
  return bits.filter(Boolean).join("; ");
}
/* ---------- voice: mic input (browser speech-to-text) + spoken replies (browser text-to-speech) ----------
   Both are built into the browser, no API key. The mic sends audio to your browser vendor's own
   speech service to transcribe (not to the AI provider above); text-to-speech runs fully offline. */
function supportsSTT(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function wireMic(btnSel,taSel){
  const btn=$(btnSel);if(!btn)return;
  if(!supportsSTT()){btn.style.display="none";return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null,on=false;
  btn.onclick=()=>{
    if(on){rec&&rec.stop();return}
    rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=1;
    rec.onstart=()=>{on=true;btn.textContent="⏹";btn.classList.add("on")};
    rec.onend=()=>{on=false;btn.textContent="🎙";btn.classList.remove("on")};
    rec.onerror=()=>{on=false;btn.textContent="🎙";btn.classList.remove("on");toast("Mic error — check mic permission")};
    rec.onresult=(e)=>{
      const txt=e.results[0][0].transcript;
      const ta=$(taSel);if(!ta)return;
      ta.value=(ta.value.trim()?ta.value.trim()+" ":"")+txt;
    };
    try{rec.start()}catch(e){toast("Couldn't start mic")}
  };
}
function speak(text,ov){
  if(!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const cfg=Object.assign({},loadAI(),ov||{});
    const voices=speechSynthesis.getVoices();
    const v=cfg.voiceName&&voices.find(x=>x.name===cfg.voiceName);
    if(v)u.voice=v;
    u.rate=+cfg.rate||0.92;
    u.pitch=+cfg.pitch||0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
function populateVoices(sel,current){
  if(!sel||!("speechSynthesis" in window))return;
  const fill=()=>{
    const voices=speechSynthesis.getVoices();
    if(!voices.length)return;
    sel.innerHTML='<option value="">Default calming voice</option>'+voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");
    sel.value=current||"";
  };
  fill();
  speechSynthesis.onvoiceschanged=fill;
}
function aiContext(){
  const bits=[];
  const topT=cnt(S.triggers,t=>t.trigger)[0],topE=cnt(S.triggers,t=>t.emotion)[0];
  if(topT)bits.push("their most common recent trigger is '"+topT[0]+"'");
  if(topE)bits.push("the feeling that comes up most for them lately is "+topE[0].toLowerCase());
  return bits.join("; ");
}
async function callAI(userText,extra){
  const cfg=loadAI();
  if(!cfg.key)throw new Error("no key saved");
  const sys=(cfg.sys&&cfg.sys.trim())||DEFAULT_SYS;
  const sysFull=sys+(extra?("\n\nQuiet context on this person, for your awareness only — don't recite it back: "+extra):"");
  if(cfg.provider==="openai"){
    const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model||"gpt-5-nano",max_tokens:220,messages:[{role:"system",content:sysFull},{role:"user",content:userText}]})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const d=await res.json();
    return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:cfg.model||"claude-haiku-5-5",max_tokens:220,system:sysFull,messages:[{role:"user",content:userText}]})});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const d=await res.json();
  return (d.content&&d.content[0]&&d.content[0].text||"").trim();
}

let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){d.distortionLog=d.distortionLog||[];return d}}catch(e){}return{promises:{},challenge:{},triggers:[],worries:[],wins:[],pauses:[],identity:{},custom:{},distortionLog:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
const dk=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dk();
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
const cnt=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,3)};
function hashDay(){let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))>>>0;return h}

/* ---------- tabs ---------- */
let tab="today";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$("#sos").onclick=()=>startPause();

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const a=$("#app");
  a.innerHTML="";
  ({today:rToday,log:rLog,tools:rTools,progress:rProgress})[tab](a);
  window.scrollTo(0,0);
}

/* ---------- Today ---------- */
function rToday(a){
  const t=today(), h=new Date().getHours();
  const hello=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const ident=S.identity[t]||IDENT[hashDay()%IDENT.length];
  a.innerHTML=`<h1>${hello}, Rohit</h1><div class="mut">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div>
  <div class="card"><div class="mut">Today's identity</div><div class="quote" style="margin:8px 0">${esc(ident)}</div>
  <div class="row"><button class="ghost sm" id="newId">Another</button><button class="ghost sm" id="ownId">Write my own</button></div></div>
  <div class="card" id="promCard"></div>
  <div class="card" id="chCard"></div>

/* ---------- Pause flow ---------- */
let pTimer=null;
function startPause(){
  const el=$("#pause");el.classList.add("on");
  S.pauses.push(Date.now());save();
  stepBreath(60);
}
function closePause(){clearInterval(pTimer);if("speechSynthesis" in window)speechSynthesis.cancel();$("#pause").classList.remove("on");render()}
function stepBreath(total){
  const b=$("#pauseBody");
  b.innerHTML=`<div class="mut">Step 1 of 3 · Slow the body first</div><div class="orb" id="orb"></div><div class="big" id="bt">Breathe in…</div><div class="mut" id="bc"></div>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="sec" id="skip">Skip</button></div>`;
  let left=total,phase=0;
  const orb=$("#orb");
  function cycle(){
    if(phase===0){orb.className="orb in";$("#bt").textContent="Breathe in… 4";}
    else{orb.className="orb out";$("#bt").textContent="Out slowly… 6";}
    phase=1-phase;
  }
  cycle();let tick=0;
  clearInterval(pTimer);
  pTimer=setInterval(()=>{
    left--;tick++;
    $("#bc").textContent=left+"s";
    if((phase===1&&tick%10===4)||(phase===0&&tick%10===0))cycle();
    if(left<=0){clearInterval(pTimer);stepName()}
  },1000);
  $("#skip").onclick=()=>{clearInterval(pTimer);stepName()};
}
function stepName(){
  const b=$("#pauseBody");let sel=null,trig=null;
  b.innerHTML=`<div class="mut">Step 2 of 3 · Name it</div><div class="big">What am I feeling right now?</div>
  <div class="mut">Feeling it is fine. Naming it calms the alarm part of the brain.</div>
  <div class="chips" id="ch" style="justify-content:center">${EMOTIONS.map(e=>`<button class="chip">${e}</button>`).join("")}</div>
  <div class="mut" style="margin-top:10px">About (tap, optional)</div>
  <div class="chips" id="chT" style="justify-content:center">${TRIGGERS.map(t=>`<button class="chip">${t}</button>`).join("")}</div>
  <textarea id="nameFree" placeholder="Or type/speak a few words — optional, sharpens what comes next"></textarea>
  <div class="row"><button id="nx" style="flex:1;margin-top:10px">Next</button><button class="sec" id="mic2" type="button" style="flex:0 0 52px;margin-top:10px">🎙</button></div>`;
  b.querySelectorAll("#ch .chip").forEach(c=>c.onclick=()=>{b.querySelectorAll("#ch .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");sel=c.textContent});
  b.querySelectorAll("#chT .chip").forEach(c=>c.onclick=()=>{const was=c.classList.contains("on");b.querySelectorAll("#chT .chip").forEach(x=>x.classList.remove("on"));if(!was){c.classList.add("on");trig=c.textContent}else trig=null});
  wireMic("#mic2","#nameFree");
  $("#nx").onclick=async ()=>{
    const free=$("#nameFree").value.trim();
    if(flagged(free))return showCrisis();
    let an=free?analyzeText(free):null;
    if(!an&&(sel||trig))an={crisis:false,emotions:sel?[sel]:[],topEmotion:sel,intensity:null,trigger:trig,distortions:[]};
    const msg=free||(sel?`I'm feeling ${sel.toLowerCase()}${trig?" about "+trig.toLowerCase():""}.`:null);
    const cfg=loadAI();
    if(msg&&cfg.useAI&&cfg.key){
      b.innerHTML=`<div class="mut">Step 3 of 3 · Choose</div><div class="mut" style="margin-top:24px">Thinking…</div>`;
      try{const reply=await callAI(msg,aiTurnContext(an));stepChoose(sel,an,reply)}
      catch(e){toast("AI unavailable, using local reflection");stepChoose(sel,an)}
    }else stepChoose(sel,an);
  };
}
function stepChoose(emo,an,aiReply){
  const b=$("#pauseBody");
  let q,distNote="";
  if(aiReply){
    q=aiReply;
  }else if(an&&an.distortions&&an.distortions.length){
    q=an.distortions[0].question;
    distNote=`<div class="mut" style="margin-top:8px">${esc(an.distortions[0].label)}: ${esc(an.distortions[0].explain)}</div>`;
    S.distortionLog.push({ts:Date.now(),type:an.distortions[0].type});save();
  }else q=REFRAMES[Math.floor(Math.random()*REFRAMES.length)];
  const group=an&&an.trigger&&TRIG2GROUP[an.trigger];
  const pool=group?REPLIES.filter(x=>x[0]===group):REPLIES;
  const r=pool[Math.floor(Math.random()*pool.length)];
  const label=emo||(an&&an.topEmotion)||null;
  b.innerHTML=`<div class="mut">Step 3 of 3 · Choose</div>
  <div class="big">${label?`I'm feeling ${esc(label.toLowerCase())}${an&&an.intensity?" ("+an.intensity+")":""}. That's okay.`:"That's okay."}</div>
  <div class="card" style="text-align:left"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="mut">${aiReply?"Your companion":"Look at it differently"}</div>${aiReply?'<button class="ghost sm" id="replay2">🔊</button>':""}</div><div class="quote" style="font-size:17px">${esc(q)}</div>${distNote}</div>
  <div class="card" style="text-align:left"><div class="mut">A calm line you can use</div><div class="quote" style="font-size:17px">"${esc(r[1])}"</div></div>
  <div class="mut">What would the strong version of me do next?</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button id="done">I'm ready</button><button class="sec" id="lg">Log trigger</button></div>`;
  $("#done").onclick=()=>{toast("That pause is a win.");closePause()};
  $("#lg").onclick=()=>{closePause();tab="log";render();setTimeout(()=>{const e=$("#tEmo");if(e&&label&&EMOTIONS.includes(label))e.value=label},0)};
  if(aiReply){
    const rp=$("#replay2");if(rp)rp.onclick=()=>speak(aiReply);
    if(loadAI().voice)speak(aiReply);
  }
}

  $("#aiPitch").value=aiCfg.pitch||0.92;
  populateVoices($("#aiVoiceName"),aiCfg.voiceName);
  $("#aiVoiceTest").onclick=()=>speak("This is how I'll sound when I talk you down.",{voiceName:$("#aiVoiceName").value,rate:parseFloat($("#aiRate").value),pitch:parseFloat($("#aiPitch").value)});
  $("#aiSave").onclick=()=>{
    const cur=loadAI();
    const key=$("#aiKey").value.trim()||cur.key||"";
    saveAI({provider:$("#aiProv").value,model:$("#aiModel").value.trim(),key,sys:$("#aiSys").value.trim(),useAI:$("#aiOn").checked,voice:$("#aiVoice").checked,voiceName:$("#aiVoiceName").value,rate:parseFloat($("#aiRate").value)||0.92,pitch:parseFloat($("#aiPitch").value)||0.92});
    $("#aiKey").value="";
    toast("Saved");render();
  };
  $("#aiOn").onchange=()=>{const c=loadAI();c.useAI=$("#aiOn").checked;saveAI(c)};
  $("#aiVoice").onchange=()=>{const c=loadAI();c.voice=$("#aiVoice").checked;saveAI(c)};
  $("#aiClear").onclick=()=>{const c=loadAI();c.key="";c.useAI=false;saveAI(c);toast("Key cleared");render()};
}

/* ---------- Progress ---------- */
function buildInsight(hours,mx){
  const lines=[];
  const topHour=hours.indexOf(mx>1?mx:-1);
  if(mx>=3&&topHour>-1){
    const band=topHour<11?"morning":topHour<17?"afternoon":topHour<21?"evening":"late night";
    lines.push(`Most of your logged triggers land in the ${band}, around ${topHour}:00. If tiredness or hunger shows up often too, part of the trigger may be low fuel, not just the situation.`);
  }
  const pair={};S.triggers.forEach(t=>{if(t.trigger&&t.emotion){const k=t.trigger+"|"+t.emotion;pair[k]=(pair[k]||0)+1}});
  const topPair=Object.entries(pair).sort((a,b)=>b[1]-a[1])[0];
  if(topPair&&topPair[1]>=2){const[tg,em]=topPair[0].split("|");lines.push(`"${tg}" has shown up with feeling ${em.toLowerCase()} ${topPair[1]}× now. That's a pattern — worth having one go-to calm line ready specifically for that situation.`);}
  if(S.distortionLog&&S.distortionLog.length){
    const dcnt={};S.distortionLog.forEach(d=>dcnt[d.type]=(dcnt[d.type]||0)+1);
    const topD=Object.entries(dcnt).sort((a,b)=>b[1]-a[1])[0];
    const meta=DISTORTIONS.find(d=>d.type===topD[0]);
    if(meta&&topD[1]>=2)lines.push(`Your most common thinking pattern lately is ${meta.label.toLowerCase()} (${topD[1]}×). ${meta.explain}`);
  }
  const week=Date.now()-7*864e5;
  const pausesWk=S.pauses.filter(t=>t>week).length,winsWk=S.wins.filter(w=>Date.now()-w.ts<7*864e5).length;
  if(pausesWk>=3&&winsWk<2)lines.push(`You're pausing often (${pausesWk}× this week) but logging few wins. Pausing is the hard part, and you're doing it — go credit yourself for a couple of those in the evening review.`);
  if(!lines.length)lines.push("Log a few more triggers and check-ins this week — patterns usually become visible after 5-7 entries.");
  return lines.slice(0,3);
}
function rProgress(a){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dk(d)});
  let kept=0,total=0;days.forEach(d=>(S.promises[d]||[]).forEach(p=>{total++;if(p.d)kept++}));
  const pct=total?Math.round(kept/total*100):0;
  const week=Date.now()-7*864e5;
  const pauses=S.pauses.filter(t=>t>week).length;
  const reps=days.filter(d=>S.challenge[d]&&S.challenge[d].done).length;
  // streak: consecutive days (back from today/yesterday) with >=1 promise kept or win
  let streak=0;
  for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d);
    const ok=(S.promises[k]||[]).some(p=>p.d)||S.wins.some(w=>w.day===k);
    if(ok)streak++;else if(i>0)break;}
  const hours=Array(24).fill(0);S.triggers.forEach(t=>hours[new Date(t.ts).getHours()]++);
  const mx=Math.max(1,...hours);
  const topT=cnt(S.triggers,t=>t.trigger),topE=cnt(S.triggers,t=>t.emotion);
  const topD=cnt(S.distortionLog||[],d=>d.type).map(x=>{const m=DISTORTIONS.find(d=>d.type===x[0]);return[m?m.label:x[0],x[1]]});
  const insight=buildInsight(hours,mx);
  a.innerHTML=`<h1>Progress</h1><div class="mut">The line that matters: promises kept.</div>
  <div class="card"><div class="score"><div><b>${pct}%</b><span>promises kept (7d)</span></div><div><b>${streak}</b><span>day streak</span></div></div>
  <div class="score" style="margin-top:10px"><div><b>${pauses}</b><span>pauses this week</span></div><div><b>${reps}/7</b><span>challenge reps</span></div></div></div>
  <div class="card"><h2>Your patterns, read back to you</h2>${insight.map(l=>`<div class="item">${esc(l)}</div>`).join("")}</div>
  <div class="card"><h2>When triggers happen</h2>
  ${S.triggers.length?`<div class="hist">${hours.map(v=>`<i style="height:${v/mx*100}%"></i>`).join("")}</div><div class="row" style="justify-content:space-between" ><span class="mut">12am</span><span class="mut">12pm</span><span class="mut">11pm</span></div>`:`<div class="mut">Log a few triggers to see your pattern.</div>`}</div>
  <div class="card"><h2>Top patterns</h2>
  ${topT.length?`<h3>Triggers</h3>${topT.map(x=>`<div class="item">${esc(x[0])} <span class="mut">×${x[1]}</span></div>`).join("")}`:`<div class="mut">No data yet.</div>`}
  ${topE.length?`<h3>Feelings</h3>${topE.map(x=>`<div class="item">${esc(x[0])} <span class="mut">×${x[1]}</span></div>`).join("")}`:""}
  ${topD.length?`<h3>Thinking patterns</h3>${topD.map(x=>`<div class="item">${esc(x[0])} <span class="mut">×${x[1]}</span></div>`).join("")}`:""}</div>
  <div class="card"><h2>Recent wins</h2>${S.wins.length?S.wins.slice(-5).reverse().map(w=>`<div class="item">${esc(w.text)}</div>`).join(""):`<div class="mut">Wins you log show up here.</div>`}</div>
  <div class="card"><button class="sec sm" id="exp">Export my data</button> <button class="ghost sm" id="rst">Reset all</button></div>`;
  $("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="calm-data.json";l.click()};
  $("#rst").onclick=()=>{if(confirm("Delete all data?")){localStorage.removeItem(KEY);S=load();render()}};
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
