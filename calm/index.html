<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calm</title>
<style>
:root{--bg:#0f1720;--card:#18232f;--card2:#1f2d3b;--tx:#e8eef4;--mut:#8ba0b3;--acc:#5fd3b0;--acc2:#3fa88a;--warn:#f2b66d;--line:#2a3a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.mut{color:var(--mut);font-size:14px;line-height:1.45}
.quote{font-size:19px;line-height:1.4;font-weight:600}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;margin:6px 0;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#07241b;font-weight:700;cursor:pointer}
button.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:600}
button.ghost{background:none;color:var(--mut);font-weight:600;padding:8px}
button.sm{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:9px 14px;border-radius:999px;font-size:15px;font-weight:500}
.chip.on{background:var(--acc);color:#07241b;border-color:var(--acc)}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:#07241b}
.task.done .box{background:var(--acc);border-color:var(--acc)}
.task.done span{color:var(--mut);text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1118;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:12px;font-weight:600}
nav button.on{color:var(--acc)}
nav button b{display:block;font-size:20px;margin-bottom:2px}
#sos{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;border-radius:999px;padding:16px 22px;box-shadow:0 6px 24px rgba(95,211,176,.35);font-size:17px}
.score{display:flex;gap:10px}.score div{flex:1;background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.score b{display:block;font-size:26px;color:var(--acc)}.score span{font-size:12px;color:var(--mut)}
#pause{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#pause.on{display:flex}
#pause .inner{max-width:480px;width:100%}
.orb{width:190px;height:190px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 30%,#8ff0d2,#2f9c80);transition:transform 4s ease-in-out;box-shadow:0 0 60px rgba(95,211,176,.4)}
.orb.in{transform:scale(1.35)}.orb.out{transform:scale(.8);transition-duration:6s}
.big{font-size:22px;font-weight:700;margin:6px 0}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
.hide{display:none}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}.item:last-child{border:0}
.hist{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0}.hist i{flex:1;background:var(--acc2);border-radius:3px 3px 0 0;min-height:2px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:#07241b;padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>
<button id="sos">⏸ Pause</button>

<div id="pause"><div class="inner" id="pauseBody"></div></div>

<nav>
  <button data-t="today"><b>☀️</b>Today</button>
  <button data-t="log"><b>📝</b>Log</button>
  <button data-t="tools"><b>🛡</b>Tools</button>
  <button data-t="progress"><b>📈</b>Progress</button>
</nav>

<script>
"use strict";
/* ---------- data ---------- */
const KEY="calm_v1";
const IDENT=[
 "I respond. I don't react.",
 "I feel it, I name it, then I choose.",
 "Calm is my default speed.",
 "I speak slowly and say only what's useful.",
 "Other people's chaos is not my assignment.",
 "I keep promises to myself.",
 "I solve what I can and release what I can't.",
 "I'm allowed to feel it and still choose well."
];
const CHALLENGES=[
 "Speak first in one conversation or meeting today.",
 "Ask one question you'd normally stay quiet about.",
 "Make one call or send one message you've been avoiding.",
 "Hold eye contact and speak at half your usual speed in one conversation.",
 "Say 'Let me think about that' once instead of answering instantly.",
 "Compliment someone sincerely.",
 "Do one task for 25 minutes with your phone out of reach.",
 "Disagree with someone calmly, with one reason.",
 "Take a 10-minute walk without your phone.",
 "Introduce yourself to someone new.",
 "Finish the smallest task you've been postponing.",
 "When irritated today, pause 5 seconds before replying. Once is enough.",
 "Share one idea or opinion at work.",
 "Ask someone for feedback on your work."
];
const REPLIES=[
 ["Buy time","Let me think about that and get back to you."],
 ["Buy time","I want to give that a proper answer. Can we come back to it in a bit?"],
 ["Rude tone","I hear you. Let's talk when we can both be clear."],
 ["Rude tone","I'm happy to discuss this. I'd just like to keep it respectful."],
 ["Unfair claim","I see it differently. Here's what I understood: ..."],
 ["Unfair claim","Help me understand what you need from me here."],
 ["Pressure","I can't commit right now. I'll confirm by end of day."],
 ["Pushback","That's not going to work for me. Here's what I can do instead: ..."],
 ["Exit","I'm going to step away for a few minutes and return to this."]
];
const EMOTIONS=["Irritated","Angry","Anxious","Afraid","Overwhelmed","Embarrassed","Disrespected","Sad","Restless","Jealous","Tired","Hurt"];
const TRIGGERS=["Someone's tone","Being ignored","Criticism","Delays / waiting","Money worry","Future worry","Work pressure","Family","Feeling behind","Tiredness / hunger","Social media","Other"];
const REFRAMES=[
 "What's another way to see this that's also true?",
 "Will this matter in 5 days? 5 months?",
 "What would I tell a friend in this exact spot?",
 "What do they need that I'm not seeing? Even a bad tone often comes from stress.",
 "What part of this is in my control right now?"
];

let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return{promises:{},challenge:{},triggers:[],worries:[],wins:[],pauses:[],identity:{},custom:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
const dk=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dk();
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
function hashDay(){let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))>>>0;return h}

/* ---------- tabs ---------- */
let tab="today";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$("#sos").onclick=()=>startPause();

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const a=$("#app");
  a.innerHTML="";
  ({today:rToday,log:rLog,tools:rTools,progress:rProgress})[tab](a);
  window.scrollTo(0,0);
}

/* ---------- Today ---------- */
function rToday(a){
  const t=today(), h=new Date().getHours();
  const hello=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const ident=S.identity[t]||IDENT[hashDay()%IDENT.length];
  a.innerHTML=`<h1>${hello}, Rohit</h1><div class="mut">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div>
  <div class="card"><div class="mut">Today's identity</div><div class="quote" style="margin:8px 0">${esc(ident)}</div>
  <div class="row"><button class="ghost sm" id="newId">Another</button><button class="ghost sm" id="ownId">Write my own</button></div></div>
  <div class="card" id="promCard"></div>
  <div class="card" id="chCard"></div>
  <div class="card" id="eveCard"></div>`;
  $("#newId").onclick=()=>{S.identity[t]=IDENT[Math.floor(Math.random()*IDENT.length)];save();render()};
  $("#ownId").onclick=()=>{const v=prompt("Your identity line (start with 'I'):");if(v){S.identity[t]=v.slice(0,120);save();render()}};
  promCard($("#promCard"));chCard($("#chCard"));eveCard($("#eveCard"));
}
function promCard(c){
  const t=today(), p=S.promises[t];
  if(!p){
    c.innerHTML=`<h2>Today's 3 promises</h2><div class="mut">Small and specific. Keeping them is how confidence is built.</div>
    <input placeholder="e.g. 20-minute workout" id="p0"><input placeholder="e.g. 1 hour of focused work, phone away" id="p1"><input placeholder="e.g. Pause 5 seconds before replying when irritated" id="p2">
    <button id="setP" style="width:100%;margin-top:8px">Lock in promises</button>`;
    $("#setP").onclick=()=>{const v=[0,1,2].map(i=>$("#p"+i).value.trim()).filter(Boolean);if(!v.length)return toast("Add at least one");S.promises[t]=v.map(x=>({t:x.slice(0,100),d:false}));save();render()};
    return;
  }
  const done=p.filter(x=>x.d).length;
  c.innerHTML=`<h2>Promises <span class="mut">${done}/${p.length}</span></h2><div class="bar"><i style="width:${done/p.length*100}%"></i></div>`+
   p.map((x,i)=>`<div class="task ${x.d?"done":""}" data-i="${i}"><div class="box">${x.d?"✓":""}</div><span>${esc(x.t)}</span></div>`).join("");
  c.querySelectorAll(".task").forEach(el=>el.onclick=()=>{const i=+el.dataset.i;p[i].d=!p[i].d;save();render();if(p.every(x=>x.d)&&p[i].d)toast("All promises kept 🔥")});
}
function chCard(c){
  const t=today();
  let ch=S.challenge[t];
  if(!ch){ch=S.challenge[t]={t:CHALLENGES[hashDay()%CHALLENGES.length],d:false};save()}
  c.innerHTML=`<h2>One uncomfortable rep</h2><div class="task ${ch.d?"done":""}" id="chT" style="border:0"><div class="box">${ch.d?"✓":""}</div><span>${esc(ch.t)}</span></div>
  ${ch.d?"":`<button class="ghost sm" id="swap">Swap challenge</button>`}`;
  $("#chT").onclick=()=>{ch.d=!ch.d;save();render();if(ch.d)toast("Rep done. That's confidence.")};
  const s=$("#swap");if(s)s.onclick=()=>{ch.t=CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];save();render()};
}
function eveCard(c){
  const wins=S.wins.filter(w=>w.day===today());
  c.innerHTML=`<h2>Evening review</h2><div class="mut">Where did I respond well today, even a little?</div>
  <textarea id="winT" placeholder="e.g. I stayed quiet when Dad raised his voice, then talked it through later"></textarea>
  <button id="winB" style="width:100%">Save to win vault</button>
  ${wins.length?`<h3>Saved today</h3>`+wins.map(w=>`<div class="item">${esc(w.text)}</div>`).join(""):""}`;
  $("#winB").onclick=()=>{const v=$("#winT").value.trim();if(!v)return;S.wins.push({ts:Date.now(),day:today(),text:v.slice(0,300)});save();toast("Saved. That counts.");render()};
}

/* ---------- Pause flow ---------- */
let pTimer=null;
function startPause(){
  const el=$("#pause");el.classList.add("on");
  S.pauses.push(Date.now());save();
  stepBreath(60);
}
function closePause(){clearInterval(pTimer);$("#pause").classList.remove("on");render()}
function stepBreath(total){
  const b=$("#pauseBody");
  b.innerHTML=`<div class="mut">Step 1 of 3 · Slow the body first</div><div class="orb" id="orb"></div><div class="big" id="bt">Breathe in…</div><div class="mut" id="bc"></div>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="sec" id="skip">Skip</button></div>`;
  let left=total,phase=0;
  const orb=$("#orb");
  function cycle(){
    if(phase===0){orb.className="orb in";$("#bt").textContent="Breathe in… 4";}
    else{orb.className="orb out";$("#bt").textContent="Out slowly… 6";}
    phase=1-phase;
  }
  cycle();let tick=0;
  clearInterval(pTimer);
  pTimer=setInterval(()=>{
    left--;tick++;
    $("#bc").textContent=left+"s";
    if((phase===1&&tick%10===4)||(phase===0&&tick%10===0))cycle();
    if(left<=0){clearInterval(pTimer);stepName()}
  },1000);
  $("#skip").onclick=()=>{clearInterval(pTimer);stepName()};
}
function stepName(){
  const b=$("#pauseBody");let sel=null;
  b.innerHTML=`<div class="mut">Step 2 of 3 · Name it</div><div class="big">What am I feeling right now?</div>
  <div class="mut">Feeling it is fine. Naming it calms the alarm part of the brain.</div>
  <div class="chips" id="ch" style="justify-content:center">${EMOTIONS.map(e=>`<button class="chip">${e}</button>`).join("")}</div>
  <button id="nx" style="width:100%;margin-top:10px">Next</button>`;
  b.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{b.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");sel=c.textContent});
  $("#nx").onclick=()=>stepChoose(sel);
}
function stepChoose(emo){
  const b=$("#pauseBody");
  const q=REFRAMES[Math.floor(Math.random()*REFRAMES.length)];
  const r=REPLIES[Math.floor(Math.random()*REPLIES.length)];
  b.innerHTML=`<div class="mut">Step 3 of 3 · Choose</div>
  <div class="big">${emo?`I'm feeling ${esc(emo.toLowerCase())}. That's okay.`:"That's okay."}</div>
  <div class="card" style="text-align:left"><div class="mut">Look at it differently</div><div class="quote" style="font-size:17px">${esc(q)}</div></div>
  <div class="card" style="text-align:left"><div class="mut">A calm line you can use</div><div class="quote" style="font-size:17px">"${esc(r[1])}"</div></div>
  <div class="mut">What would the strong version of me do next?</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button id="done">I'm ready</button><button class="sec" id="lg">Log trigger</button></div>`;
  $("#done").onclick=()=>{toast("That pause is a win.");closePause()};
  $("#lg").onclick=()=>{closePause();tab="log";render();setTimeout(()=>{const e=$("#tEmo");if(e&&emo)e.value=emo},0)};
}

/* ---------- Log ---------- */
function rLog(a){
  a.innerHTML=`<h1>Log</h1><div class="mut">Patterns you can see are patterns you can change.</div>
  <div class="card"><h2>Trigger log</h2>
  <div class="mut">What set it off?</div><div class="chips" id="tTr">${TRIGGERS.map(x=>`<button class="chip">${x}</button>`).join("")}</div>
  <select id="tEmo"><option value="">How did it feel?</option>${EMOTIONS.map(e=>`<option>${e}</option>`).join("")}</select>
  <textarea id="tReact" placeholder="What did I do or say?"></textarea>
  <textarea id="tBetter" placeholder="What would the strong version of me have done?"></textarea>
  <button id="tSave" style="width:100%">Save</button></div>
  <div class="card"><h2>Worry parking</h2><div class="mut">Write the worry. Then answer one question.</div>
  <textarea id="wT" placeholder="What am I worried about?"></textarea>
  <div class="mut">Can I do something about this today?</div>
  <div class="row"><button class="sec" id="wY">Yes</button><button class="sec" id="wN">No, park it</button></div>
  <div id="wExtra"></div></div>
  <div class="card"><h2>Worry window</h2><div class="mut">15 minutes in the evening. Everything else waits.</div><div id="wList"></div></div>`;
  let tr=null;
  a.querySelectorAll("#tTr .chip").forEach(c=>c.onclick=()=>{a.querySelectorAll("#tTr .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");tr=c.textContent});
  $("#tSave").onclick=()=>{
    if(!tr&&!$("#tReact").value.trim())return toast("Add a trigger or note");
    S.triggers.push({ts:Date.now(),trigger:tr||"Other",emotion:$("#tEmo").value,react:$("#tReact").value.trim().slice(0,300),better:$("#tBetter").value.trim().slice(0,300)});
    save();toast("Logged");render();
  };
  $("#wY").onclick=()=>{
    if(!$("#wT").value.trim())return toast("Write the worry first");
    $("#wExtra").innerHTML=`<input id="wStep" placeholder="What's one tiny step? (5 minutes or less)"><button id="wS" style="width:100%">Save step</button>`;
    $("#wS").onclick=()=>{const st=$("#wStep").value.trim();if(!st)return;S.worries.push({ts:Date.now(),text:$("#wT").value.trim().slice(0,300),act:true,step:st.slice(0,200),done:false});save();toast("One step is enough for now");render()};
  };
  $("#wN").onclick=()=>{
    const v=$("#wT").value.trim();if(!v)return toast("Write the worry first");
    S.worries.push({ts:Date.now(),text:v.slice(0,300),act:false,done:false});save();toast("Parked. Not today's job.");render();
  };
  const wl=$("#wList"),open=S.worries.filter(w=>!w.done);
  wl.innerHTML=open.length?open.map((w,i)=>`<div class="item"><div>${esc(w.text)}</div>${w.act?`<div class="mut">Step: ${esc(w.step)}</div>`:`<div class="mut">Parked</div>`}<div class="row" style="margin-top:6px"><button class="sm sec" data-r="${S.worries.indexOf(w)}">Release / done</button></div></div>`).join(""):`<div class="mut" style="margin-top:8px">Nothing parked.</div>`;
  wl.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.worries[+b.dataset.r].done=true;save();toast("Released");render()});
}

/* ---------- Tools ---------- */
function rTools(a){
  const groups={};REPLIES.forEach(r=>(groups[r[0]]=groups[r[0]]||[]).push(r[1]));
  a.innerHTML=`<h1>Tools</h1>
  <div class="card"><h2>Calm lines</h2><div class="mut">Tap to copy. Use one instead of improvising while upset.</div>
  ${Object.entries(groups).map(([g,ls])=>`<h3>${g}</h3>${ls.map(l=>`<div class="item" data-c="${esc(l)}">“${esc(l)}”</div>`).join("")}`).join("")}</div>
  <div class="card"><h2>Win vault</h2><div class="mut">Your proof that you're changing.</div><div id="wv" class="quote" style="font-size:17px;margin:10px 0"></div><button id="wvB" class="sec">Show a random win</button></div>
  <div class="card"><h2>Reality check</h2><div class="mut" style="font-size:15px;line-height:1.5">The goal isn't to feel nothing. Suppressing emotion makes it come back louder. The goal is to feel it, name it, and choose your response. That's what strong, intelligent people actually do, and it's trainable.<br><br>If anger or low mood feels constant or out of your control, talking to a doctor or therapist is a strong move, not a weak one.</div></div>`;
  a.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(e.dataset.c);toast("Copied")});
  $("#wvB").onclick=()=>{
    if(!S.wins.length){$("#wv").textContent="No wins yet. Add one in the evening review.";return}
    $("#wv").textContent="“"+S.wins[Math.floor(Math.random()*S.wins.length)].text+"”";
  };
}

/* ---------- Progress ---------- */
function rProgress(a){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dk(d)});
  let kept=0,total=0;days.forEach(d=>(S.promises[d]||[]).forEach(p=>{total++;if(p.d)kept++}));
  const pct=total?Math.round(kept/total*100):0;
  const week=Date.now()-7*864e5;
  const pauses=S.pauses.filter(t=>t>week).length;
  const reps=days.filter(d=>S.challenge[d]&&S.challenge[d].done).length;
  // streak: consecutive days (back from today/yesterday) with >=1 promise kept or win
  let streak=0;
  for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d);
    const ok=(S.promises[k]||[]).some(p=>p.d)||S.wins.some(w=>w.day===k);
    if(ok)streak++;else if(i>0)break;}
  const hours=Array(24).fill(0);S.triggers.forEach(t=>hours[new Date(t.ts).getHours()]++);
  const mx=Math.max(1,...hours);
  const cnt=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,3)};
  const topT=cnt(S.triggers,t=>t.trigger),topE=cnt(S.triggers,t=>t.emotion);
  a.innerHTML=`<h1>Progress</h1><div class="mut">The line that matters: promises kept.</div>
  <div class="card"><div class="score"><div><b>${pct}%</b><span>promises kept (7d)</span></div><div><b>${streak}</b><span>day streak</span></div></div>
  <div class="score" style="margin-top:10px"><div><b>${pauses}</b><span>pauses this week</span></div><div><b>${reps}/7</b><span>challenge reps</span></div></div></div>
  <div class="card"><h2>When triggers happen</h2>
  ${S.triggers.length?`<div class="hist">${hours.map(v=>`<i style="height:${v/mx*100}%"></i>`).join("")}</div><div class="row" style="justify-content:space-between" ><span class="mut">12am</span><span class="mut">12pm</span><span class="mut">11pm</span></div>`:`<div class="mut">Log a few triggers to see your pattern.</div>`}</div>
  <div class="card"><h2>Top patterns</h2>
  ${topT.length?`<h3>Triggers</h3>${topT.map(x=>`<div class="item">${esc(x[0])} <span class="mut">×${x[1]}</span></div>`).join("")}`:`<div class="mut">No data yet.</div>`}
  ${topE.length?`<h3>Feelings</h3>${topE.map(x=>`<div class="item">${esc(x[0])} <span class="mut">×${x[1]}</span></div>`).join("")}`:""}</div>
  <div class="card"><h2>Recent wins</h2>${S.wins.length?S.wins.slice(-5).reverse().map(w=>`<div class="item">${esc(w.text)}</div>`).join(""):`<div class="mut">Wins you log show up here.</div>`}</div>
  <div class="card"><button class="sec sm" id="exp">Export my data</button> <button class="ghost sm" id="rst">Reset all</button></div>`;
  $("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="calm-data.json";l.click()};
  $("#rst").onclick=()=>{if(confirm("Delete all data?")){localStorage.removeItem(KEY);S=load();render()}};
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
