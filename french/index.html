 O("C'est beaucoup trop cher pour mon budget.","It's much too expensive for my budget.","Certes, c'est un investissement au début, mais sache que cela te permettra d'économiser à long terme. Je sais que le budget est serré en ce moment, mais sache qu'on peut payer en plusieurs fois."),
 O("C'est vraiment fatigant pour moi.","It's really tiring for me.","Sache qu'une activité physique permet en réalité de libérer des endorphines et de recharger tes batteries."),
 O("Ce n'est pas pour moi ! Je n'ai pas d'expérience.","It's not for me! I have no experience.","Ne t'inquiète pas, c'est justement une activité parfaite pour les débutants ! Tu n'as besoin d'aucune expérience préalable. De plus, il y aura un entraîneur sur place pour tout nous expliquer pas à pas."),
 O("Je ne suis pas disponible, mon travail m'occupe beaucoup.","I'm not available, work keeps me busy.","Je comprends tout à fait ton point de vue. Cependant, ne t'inquiète pas. Ce programme est conçu pour les personnes comme toi qui ont du pain sur la planche. En fait, c'est complètement en ligne et les horaires sont flexibles. Tu n'auras même pas besoin de te déplacer. Tu peux donc choisir les horaires qui te conviennent. Comme ça, tu auras l'occasion de travailler et de rencontrer des célibataires en ligne à tout moment.",{note:"Written in the notes for an online dating service. Swap the last sentence for your own ad."})
]};

var SC={
 velo:{id:'velo',title:"Tour en vélo",en:"Bike tour",ctx:"The Section B notes stop after these three arguments. A separate tab in the doc, « Tour en Velo », continues the topic.",
  pitch:[
   "Ce programme est utile pour rester en forme. Faire du vélo aide à rester actif. Cela contribue à réduire le stress, la dépression et l'anxiété. C'est la raison pour laquelle tu dois essayer cette activité, pour voyager et prendre soin de ta santé.",
   "Les vélos ne polluent pas comme les voitures. Ils n'utilisent pas d'essence (petrol) et ils sont bons pour l'atmosphère. Grâce à cette activité, tu n'auras pas à rester coincé dans les embouteillages.",
   "Économique : en ce moment, le gouvernement offre des réductions aux habitants. Voilà pourquoi c'est le moment idéal pour y participer et profiter de ce prix réduit."
  ],items:[]},
 cheval:{id:'cheval',title:"Horse riding",en:"Horse riding (the notes mention horses but never name the activity)",
  pitch:["La santé : c'est une activité en plein air qui va t'aider à te détendre après de longues journées de travail. C'est mieux pour recharger les batteries, récupérer de l'énergie et réduire le stress."],
  items:[
   O("C'est cher.","It's expensive.","Ne t'inquiète pas. Ils offrent de très bons services et fournissent tous les équipements de sécurité. Prendre soin des chevaux coûte cher, c'est pourquoi les tarifs sont élevés."),
   O("Il fait chaud ces jours-ci.","It's hot these days.","Ce n'est pas un grand problème. J'ai vérifié la météo : il fera beau et frais le mois prochain. Le mois prochain sera le meilleur moment pour y aller et faire cette activité. Ils offrent des boissons énergisantes gratuites pendant les pauses."),
   O("Je n'ai pas d'expérience, il y a beaucoup de risques.","I have no experience, there are lots of risks.","Je comprends ton point de vue. C'est pour les personnes comme toi, qui sont débutantes. La première semaine, il y aura une formation pour se sentir à l'aise avec le cheval. Mon ami Paul a essayé cette activité pour la première fois l'année dernière. Il a apprécié son guide, qui était calme, drôle et expérimenté. Il a aidé les touristes."),
   O("Je travaille, je n'ai pas le temps.","I'm working, I have no time.","Je comprends que ce soit difficile maintenant. Le mois prochain, les vacances d'été vont commencer. Nous pouvons prévoir de participer à cette activité. Ce serait une expérience hors du commun."),
   O("C'est trop loin de chez moi.","It's too far from my home.","Ça vaut le coup (it's worth it). Il faut quand même essayer. La vue est incroyable et je peux t'accompagner. Tu peux te faire des amis et faire du covoiturage (carpooling)."),
   O("En cas d'accident, il est difficile de trouver l'hôpital.","If there's an accident, the hospital is hard to find.","Ils ont leurs équipes médicales sur place. Il y aura des guides pour t'enseigner sur place.")
  ]},
 plongee:{id:'plongee',title:"Scuba diving",en:"Scuba diving course",
  pitch:[
   "Tu vas pouvoir apprendre la plongée en seulement un week-end, ce qui va ensuite te permettre de faire une nouvelle activité pendant tes vacances.",
   "Tu vas pouvoir découvrir un nouvel univers, les fonds marins. C'est vraiment magique, avec les poissons, mais aussi les plantes et même les épaves de bateaux.",
   "Tu vas peut-être te découvrir une nouvelle passion et, pourquoi pas, en faire plus tard ton métier : enseigner la plongée aux débutants et gagner de l'argent."
  ],items:[
   O("Je ne pense pas que ce genre de piscine existe dans ma ville.","I don't think that kind of pool exists in my city.","J'ai une bonne nouvelle pour toi. Il y a une piscine ouverte au centre-ville. Elle s'appelle Deep Spot. Elle est à seulement 20 minutes de chez toi."),
   O("Faire de la plongée dans une piscine, je pense que c'est trop ennuyeux.","Diving in a pool is too boring.","Je comprends ton point de vue. C'est ennuyeux dans la piscine, cependant, une fois que tu auras appris cette compétence, tu pourras plonger dans les mers ou les océans en autonomie, et c'est magique. Tu auras l'occasion de découvrir un nouvel univers, la vie aquatique."),
   O("Je ne vois pas l'utilité d'avoir un certificat de plongée.","I don't see the point of a diving certificate.","Ce n'est pas juste pour obtenir un certificat, c'est une compétence pour la vie que tu peux utiliser pour sauver la vie des autres.")
  ]},
 nature:{id:'nature',title:"Cabin stay in the wild",en:"Cabin stay in the wild",
  pitch:[
   {h:"Advantage",t:"On sera près de la nature."},
   {h:"Advantage",t:"C'est calme et sympa parce que nous serons très loin de la ville."},
   {h:"Advantage",t:"Il y aura de la sécurité : le personnel est très expérimenté et connaît toutes les techniques pour éloigner les animaux."}
  ],items:[
   O("Il n'y a pas d'eau ni d'électricité.","No water and no electricity.","Ce n'est pas un grand problème. Il y a beaucoup de chutes d'eau et on peut y boire de l'eau. Il y a des lampes dans la cabane. Ils vont même nous apprendre à produire de la lumière avec du bois."),
   O("Où aller aux toilettes et se doucher ?","Where do I use the toilet and shower?","On peut se doucher sous une chute d'eau. C'est vraiment amusant et rafraîchissant. Ne t'inquiète pas pour l'intimité : les toilettes sont tout près. Franchement, tu n'auras pas beaucoup à marcher pour ça. Toutes les directions sont indiquées. De plus, ils vont fournir une carte pour trouver les toilettes."),
   O("Il y a des moustiques.","There are mosquitoes.","Je comprends ton point de vue. Cependant, ne t'en fais pas pour ça. La cabane est équipée de moustiquaires. Sois rassuré(e) : ils nettoient la cabane régulièrement pour qu'il n'y ait aucun risque d'insectes. Mon ami a récemment participé à ce programme. Il l'a vraiment adoré et il a été impressionné par leurs services exceptionnels."),
   O("Il y a des animaux.","There are wild animals.","Il n'y a pas de risque, parce que la cabane est conçue de manière que la plupart des animaux ne puissent pas y monter. En plus, le personnel est expérimenté et connaît toutes les techniques pour éloigner les animaux. Ces animaux sont habitués aux gens, donc ils n'entrent pas sur ce territoire. Il y a des feux d'artifice dans toutes les cabanes. Il y a une porte qui sécurise les personnes dans la cabane."),
   O("J'ai peur de dormir en pleine nature.","I'm afraid to sleep out in the wild.","Pas du tout. Au contraire, on aura la possibilité de regarder les étoiles pendant la nuit. C'est très calme et tranquille. La vue du ciel est magnifique, c'est magique. Je suis sûr(e) que tu n'as jamais vu cette vue en ville, à cause de la pollution."),
   O("Comment trouver à manger ?","How will we find food?","Le petit-déjeuner est fourni par l'association. Ensuite, pour le déjeuner et le dîner, le guide nous aidera à identifier les fruits et les légumes comestibles. Il y a des poissons dans les rivières, donc nous pouvons organiser un barbecue le soir. C'est l'occasion de manger la cuisine locale et naturelle de la région, sans pesticides ni engrais chimiques."),
   O("C'est ennuyeux, il n'y a pas d'activités.","It's boring, there's nothing to do.","Il y a beaucoup d'endroits naturels à explorer, comme les montagnes, la chute d'eau, de grands arbres et différentes variétés d'oiseaux. Il y a des activités engageantes comme la chasse au trésor et, à la fin, nous recevons des cadeaux et des surprises (le prix). Ils vont nous diviser en trois équipes et il y aura des concours. Mon voisin a participé aux concours : son équipe a gagné et il a reçu des cadeaux et le prix. Il était vraiment content et satisfait de leurs services."),
   O("Et en cas d'accident ? Il n'y a pas d'hôpital.","What if there's an accident? There's no hospital.","Je comprends, il est possible d'avoir des blessures légères. En fait, ces dix dernières années, il n'y a jamais eu d'accident grave. Leur équipe médicale est tout près. En plus, il y a un service d'assistance d'urgence qui intervient en quelques minutes si jamais tu rencontres un problème sur la route."),
   O("Et s'il pleut toute la semaine ?","What if it rains all week?","Ne t'inquiète pas, j'ai déjà vérifié la météo : le mois prochain est parfait pour participer à ce programme, car il fera beau et il n'y a que 5 % de risque de pluie. Les oiseaux migrateurs vont revenir dans la région et, franchement, ça vaut vraiment le coup. On ne vit ça qu'une fois dans la vie."),
   O("On peut se perdre, il n'y a pas de GPS.","We could get lost, there's no GPS.","Je ne pense pas que tout soit vrai. En fait, ils nous surveillent régulièrement. Il y a des panneaux de danger partout où il y a des animaux.")
  ]},
 suisse:{id:'suisse',title:"Trip to Switzerland",en:"Group trip to Switzerland",
  pitch:[],items:[
   O("Je n'ai pas le temps, je travaille sur un projet.","I have no time, I'm working on a project.","T'inquiète pas, c'est juste pour une semaine (ce n'est que pour une semaine). Tu travailles dur depuis plus de deux mois, tu mérites des vacances. C'est vraiment important pour te déstresser et profiter de la vie. C'est essentiel pour ta santé mentale et pour ton corps."),
   O("Ça coûte cher.","It costs a lot.","Non, pas du tout. J'ai appelé l'agence et j'ai demandé s'il y avait des réductions pour un groupe. Heureusement, on m'a dit qu'il y a une réduction de 20 %. C'est très avantageux par rapport aux autres entreprises. Ça coûte … dollars par personne. Tu sais, ils offrent beaucoup plus de services que les autres. En fait, l'hôtel est très bien situé et le repas est inclus. Tu n'auras même pas à payer les transports.",{note:"The notes leave the price blank. Use the price from your ad."}),
   O("Il n'y a pas beaucoup d'activités à faire.","There isn't much to do.","Je ne pense pas que tout soit vrai. J'ai regardé une vidéo sur YouTube : il y a beaucoup d'activités sportives à faire. Mon ami y est allé l'année dernière et il a fait du cyclisme, de la randonnée, et il est même possible de faire du parachutisme. De plus, toutes ces activités se déroulent dans un environnement naturel. Tu es une personne qui adore ce type d'activités. Grâce à ce voyage, tu auras l'occasion d'y participer et je suis certain(e) que tu vas l'apprécier. Il y a aussi un festival d'été au centre-ville."),
   O("Les hôtels ne sont pas bons.","The hotels aren't good.","Sois rassuré(e) : je comprends que l'hôtel soit un trois étoiles, cependant c'est vraiment génial. Il y a une piscine et une grande chambre avec deux lits. Il y a des restaurants à proximité. Franchement, j'ai entendu dire que c'est un très bon hôtel, très bien situé au bord d'un lac. J'ai lu des commentaires de touristes sur Google et ils étaient satisfaits de la qualité du service. Ça vaut le coup."),
   O("Je ne veux pas voyager en groupe.","I don't want to travel in a group.","Les groupes sont petits : il n'y a que cinq personnes par groupe. C'est la meilleure occasion de rencontrer de nouvelles personnes. C'est idéal pour faire des activités en groupe."),
   O("Je n'aime pas les voyages guidés.","I don't like guided trips.","Je pense que voyager dans un nouveau pays est mieux avec un guide. J'ai vu des profils de guides : ils sont très expérimentés. Nous avons la possibilité de choisir notre guide. Le guide de mon ami était une femme amusante et gentille. Le guide nous aidera à découvrir ce pays tout en nous racontant son histoire unique et exceptionnelle. Il y a un autre avantage : il peut nous aider à prendre des photos."),
   O("En été, il fait trop chaud.","It's too hot in summer.","J'ai vérifié la météo : le mois prochain, il fera beau.")
  ]},
 amazonie:{id:'amazonie',title:"Amazon jungle experience",en:"Amazon jungle experience",
  pitch:[
   "Nous allons apprendre à cuisiner dans la jungle en autonomie. C'est le meilleur moment pour goûter la cuisine locale des habitants. On aura l'occasion d'apprendre des compétences comme le travail d'équipe, la solidarité et l'entraide avec les autres participants. Ce sera vraiment une expérience qui nous aidera à comprendre la vie des personnes qui vivent sans technologie."
  ],items:[
   O("Il y a des animaux dangereux.","There are dangerous animals.","Je suis certain(e) que nous resterons loin des zones animalières. On sera en sécurité.",{inferred:true}),
   O("Il y a un risque de maladies et d'insectes.","There's a risk of disease and insects.","Ne t'en fais pas pour ça : avec les précautions nécessaires, comme des crèmes et des tenues spéciales, nous pouvons diminuer le risque de maladies graves. De plus, pendant la nuit, le personnel allume un feu, ce qui est vraiment utile contre les insectes et les animaux.",{inferred:true})
  ],notes:"Two unfinished notes in the doc, kept here as written: « il devrait être une solution » and « les personnes expérimentées »."},
 domicile:{id:'domicile',title:"Teaching at people's homes",en:"Home tutoring through an agency",
  pitch:[],items:[
   O("Je n'ai jamais enseigné, je ne sais pas faire ça.","I've never taught, I don't know how.","Il y aura une formation avant le début du travail. T'inquiète pas. Au début, c'est toujours difficile, mais au fur et à mesure tu vas apprendre comment ça fonctionne. Je sais que ça peut être compliqué. Tu n'auras qu'un seul étudiant. En fait, tu peux commencer avec des enfants et, après quelques mois, tu peux même enseigner à des adultes."),
   O("Je pense que ça peut être dangereux d'aller chez des inconnus.","Going to strangers' homes could be dangerous.","Je comprends ton point de vue, mais sois rassuré(e). Grâce à cette agence, tu auras l'opportunité de faire trois cours d'essai. Pendant ce temps, tu pourras choisir tes étudiants et, si tu penses que c'est dangereux, tu peux résilier le contrat à tout moment."),
   O("Je ne suis pas à l'aise pour travailler chez les gens.","I'm not comfortable working in people's homes.","Tous les étudiants, y compris leur famille, qui s'inscrivent à cette agence doivent présenter leur casier judiciaire. Au fait, jusqu'à aujourd'hui, il n'y a jamais eu d'accident avec des profs. L'agence permet également d'enseigner à l'étudiant dans des lieux publics."),
   O("Je n'aime pas trop les enfants, ils sont bruyants et indisciplinés.","I don't like children much, they're noisy and undisciplined.",null),
   O("Je suis trop timide, c'est très difficile d'enseigner dans ce cas.","I'm too shy, so teaching would be very hard.",null),
   O("Je pense que le salaire ne sera pas très intéressant.","I think the pay won't be very good.",null),
   O("Je n'ai pas de voiture, ce sera compliqué d'aller dans plusieurs endroits différents.","I have no car, getting to several places will be hard.",null)
  ],notes:"The last four objections are in the notes without replies. Practise writing your own with the pattern on the Start page."},
 revente:{id:'revente',title:"Reselling your belongings",en:"Reselling your belongings through an association",
  pitch:[
   "Tout d'abord, tu peux vendre tes affaires personnelles et gagner de l'argent en retour. C'est une excellente occasion de faire des économies.",
   "Ensuite, cette activité t'aidera à te débarrasser des objets superflus et à créer de l'espace chez toi.",
   "Cette association est très connue dans la ville. Elle travaille dans ce domaine depuis dix ans. Elle est fiable."
  ],items:[
   O("Je n'ai pas le temps, c'est une activité chronophage.","I have no time, it's time-consuming.","Pas du tout. Cette association se charge de collecter tes affaires chez toi. Ils sont rapides et ça ne prendra que 20 minutes. Le personnel est formé et professionnel."),
   O("Ça ne m'intéresse pas.","I'm not interested.","Tu as ton ordinateur que tu n'utilises plus depuis un an. Tu peux le vendre et gagner de l'argent, que tu peux utiliser pour acheter une montre moderne."),
   O("C'est très loin de chez moi.","It's very far from my home.","Ne t'inquiète pas. L'organisation est ouverte pendant le week-end. Ils peuvent venir récupérer les objets chez toi. Ce n'est pas un grand problème. Tu dois quand même essayer."),
   O("Ce genre d'association, ce sont des arnaques.","These associations are scams.","Ce n'est pas vrai. Mon ami a vendu son ordinateur portable le mois dernier. Il était très content. Il a gagné beaucoup d'argent, avec lequel il a acheté un nouveau vélo.")
  ]},
 chambre:{id:'chambre',title:"Renting out your room (Alyx Voyage)",en:"Renting out a room to tourists on a website",
  ctx:"Introduction",pitch:[
   "C'est lié à la location d'une belle chambre disponible dans ton appartement. C'est un site internet qui s'appelle Alyx Voyage : tu peux envoyer les photos de ta chambre aux touristes. Tu as de grandes fenêtres dans ta chambre, elle est très confortable. Les touristes vont sûrement aimer ta chambre. Qu'est-ce que tu en penses ?"
  ],items:[
   O("Ça ne m'intéresse pas, je suis trop timide pour faire cette activité.","I'm not interested, I'm too shy for this.","Ne t'inquiète pas, c'est pour les personnes comme toi. Tu auras l'occasion de parler et de socialiser avec des personnes du monde entier. Grâce à ce site, tu rencontreras des personnes intéressantes. Tu peux vaincre (overcome) ta timidité."),
   O("C'est risqué, je travaille pendant la journée.","It's risky, I work during the day.","Ne t'inquiète pas, tu as déjà des caméras de sécurité dans ton appartement. Tu peux surveiller les touristes. Ce n'est pas un grand problème."),
   O("Les touristes sont négligents.","Tourists are careless.","Tout n'est pas vrai. Tu peux mentionner à l'avance, dans l'annonce, les règles à suivre pour rester dans ta chambre. En cas de problème, tu peux demander des frais supplémentaires. Récemment, mon ami a loué son appartement à une famille de quatre personnes. Malheureusement, leur enfant a cassé la fenêtre. Les touristes ont payé des frais supplémentaires pour ça."),
   O("Ils ne nettoient pas la chambre, ils sont sales.","They don't clean the room, they're dirty.","Je comprends ton point de vue. Tous les touristes ne se ressemblent pas. Il faut leur expliquer à l'avance les règles à respecter dans ta chambre."),
   O("Ils vont arriver tard la nuit.","They'll arrive late at night.","Ne t'inquiète pas, tu as une porte automatique chez toi. Donc ils ne vont pas te déranger pendant la nuit."),
   O("Je n'ai pas le temps de chercher des touristes.","I have no time to look for tourists.","Ce n'est pas grave. Tu n'as pas à chercher les touristes : tu peux poster des photos de ta chambre sur internet. L'agence va tout faire pour toi.")
  ]},
 langue:{id:'langue',title:"Language courses",en:"Language courses at an institute",
  pitch:[
   "Les cours de langue sont importants pour voyager dans d'autres pays et rencontrer des personnes de cultures différentes.",
   "Cela aide à se faire de nouveaux amis.",
   "Cela va augmenter tes chances d'être sélectionné(e) lors d'un entretien d'embauche (hiring interview)."
  ],items:[
   O("Je n'ai pas le temps.","I have no time.","Ne t'inquiète pas. Les horaires des cours sont flexibles. Il est possible d'assister au cours pendant le week-end. Les cours ne durent qu'une heure et il est possible de maîtriser les bases en deux semaines de cours."),
   O("Ça coûte cher.","It costs a lot.","Je comprends ton point de vue. Je pense que l'apprentissage d'une langue étrangère est essentiel. Franchement, cet institut est connu dans ce domaine. La qualité des cours qu'ils proposent est exceptionnelle. Les profs sont très expérimentés. Ils organisent des événements culturels de temps en temps."),
   O("Je ne veux pas participer à un groupe.","I don't want to be in a group.","Ce n'est pas un grand problème. Les groupes sont petits : il n'y a que quatre étudiants par groupe, ce qui rend l'apprentissage de la langue plus facile. Ils proposent aussi des cours privés pendant le week-end."),
   O("C'est trop difficile à mon âge.","It's too hard at my age.","Ce n'est pas vrai. Cet âge est parfait pour apprendre quelque chose de nouveau. Mon voisin a 50 ans. Malgré son âge, il a maîtrisé l'espagnol en six mois. Maintenant, il travaille dans une grande entreprise."),
   O("Ça ne m'intéresse pas.","I'm not interested.","Tu sais, j'apprends l'espagnol depuis l'année dernière et je suis très contente. Grâce à cette langue, je gagne un très bon salaire.")
  ]},
 agee:{id:'agee',title:"Living with an elderly lady",en:"Sharing a home with an elderly lady",
  ctx:"Context in the notes: her husband died recently, so she needs company. She has no mobility problems; you only help with household tasks.",

/* the teacher's formula, as patterns to underline */
var PATTERNS=[
 {cat:'deny',re:/ce n['’]est pas vrai|je ne pense pas que tout soit vrai|tout n['’]est pas vrai|tu t['’]inquiètes pour rien/i},
 {cat:'understand',re:/je comprends(?: tout à fait)?(?: ton (?:point de vue|problème)| que [^.,;:]*)?|certes|tu pourrais penser que/i},
 {cat:'reassure',re:/ne t['’](?:inquiète|en fais) pas(?: pour [^.,;:]*)?|t['’]inquiète pas|sois rassuré(?:\(e\))?|ce n['’]est pas (?:un )?grand(?:e)? (?:problème|chose)|ce n['’]est pas grave|pas du tout|aucun risque/i},
 {cat:'proof',re:/mon (?:ami|voisin)(?: paul)?|un de mes cousins|j['’]ai (?:déjà )?(?:vérifié|regardé|lu|appelé|vu)(?: la météo| une vidéo| des commentaires| des profils)?|en fait|par exemple/i},
 {cat:'close',re:/ça vaut (?:vraiment )?(?:le coup|la peine)|on ne vit ça qu['’]une fois(?: dans la vie)?|franchement|je suis (?:sûr|certain)(?:\(e\))? que|tu auras l['’]occasion de|il faut quand même essayer/i}
];
var CATNAMES={understand:'Show you understand',reassure:'Reassure',deny:'Say it isn\'t so',proof:'Prove it',close:'Close with energy'};
function mark(text){
  var frag=document.createDocumentFragment(),rest=text;
  while(rest){
    var best=null;
    for(var i=0;i<PATTERNS.length;i++){ var m=PATTERNS[i].re.exec(rest); if(m&&m[0]&&(best===null||m.index<best.m.index)) best={m:m,p:PATTERNS[i]}; }
    if(!best){ frag.append(rest); break; }
    if(best.m.index>0) frag.append(rest.slice(0,best.m.index));
    var s=document.createElement('mark'); s.className='k-'+best.p.cat; s.textContent=best.m[0]; frag.append(s);
    rest=rest.slice(best.m.index+best.m[0].length);
  }
  return frag;
}

var saveTimer=null,saving=false,dirty=false;
function save(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,600); }
async function flush(){
  if(saving){ saveTimer=setTimeout(flush,500); return; }
  if(!dirty) return;
  dirty=false; saving=true;
  var payload={known:S.known,slow:S.slow};
  try{ localStorage.setItem(LS_KEY,JSON.stringify(payload)); }catch(e){}
  if(S.db&&S.uid){ try{ await S.db.doc('data/users/'+S.uid+'/cahier-b').set(payload); }catch(e){} }
  saving=false;
}

/* ---------- speech ---------- */
var TTS={ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),voice:null};
function pickVoice(){
  if(!TTS.ok) return;
  try{
    var vs=speechSynthesis.getVoices()||[];
    TTS.voice=vs.find(function(v){return /^fr[-_]CA/i.test(v.lang);})||vs.find(function(v){return /^fr[-_]FR/i.test(v.lang);})||vs.find(function(v){return /^fr/i.test(v.lang);})||null;
  }catch(e){}
}
if(TTS.ok){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function speak(text){
  if(!TTS.ok||!text) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.replace(/\(e\)/g,'').replace(/…/g,'.'));
    u.lang=TTS.voice?TTS.voice.lang:'fr-CA';
    if(TTS.voice) u.voice=TTS.voice;
    u.rate=S.slow?0.75:0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hear(text,label){
  if(!TTS.ok) return null;
  return h('button',{class:'btn sm ghost',type:'button','aria-label':'Listen in French',on:{click:function(){speak(text);}}},speakIcon(),label||'Listen');
}

function pt(p){ return typeof p==='string'?{t:p}:p; }

  add(UNIV,'univ',false,'univ');

  });

}

/* arguments tab */
function topicCard(n,clickable){
  var tp=TOPICS[n],c=COV[n];
  var inner=[h('div',{class:'row',style:'justify-content:space-between'},h('span',{class:'n'},String(n)),h('span',{class:'badge b-'+(c==='notes'?'notes':c==='part'?'part':'draft')},COVLABEL[c])),h('div',{class:'fr',lang:'fr'},tp.fr),h('div',{class:'small muted'},tp.en)];
  if(!clickable) return h('div',{class:'topic'},inner);
  return h('button',{class:'topic',type:'button',on:{click:function(){ var cat=CATS.find(function(x){return x.topics.indexOf(n)>=0;}); S.cat=cat.id; S.q=''; render(); window.scrollTo(0,0); }}},inner);
}
function filterBlock(){
  return null;
}
function renderArgs(main){
  var search=h('input',{class:'input',id:'search',type:'search',placeholder:'Search the objections, replies and arguments (French or English)',value:S.q,'aria-label':'Search',autocomplete:'off'});
  var results=h('div');
  var pills=h('div',{class:'pills',role:'tablist'});
  var draw=function(){
    results.replaceChildren();
    var q=stripAcc(S.q);
    if(q){ drawSearch(results,q); return; }
    if(S.cat==='overview') drawOverview(results);
    else if(S.cat==='univ') results.append(catHeader({title:'Universal replies',fr:'Réponses pour tous les cas'},null),scenarioEl(UNIV,true));
    else if(S.cat==='all') CATS.forEach(function(c){ results.append(drawCat(c)); });
    else results.append(drawCat(CATS.find(function(c){return c.id===S.cat;})));
  };
  var drawPills=function(){
    var list=[['overview','Overview'],['univ','Universal replies']].concat(CATS.map(function(c){return [c.id,c.title];})).concat([['all','Everything']]);
    pills.replaceChildren.apply(pills,list.map(function(p){
      return h('button',{class:'chip',type:'button','aria-pressed':String(!S.q&&S.cat===p[0]),on:{click:function(){ S.cat=p[0]; S.q=''; search.value=''; drawPills(); draw(); }}},p[1]);
    }));
  };
  search.addEventListener('input',function(){ S.q=search.value; drawPills(); draw(); });
  put(main,h('h2',{class:'h2'},'Arguments by topic'),
    h('p',{class:'lede',style:'margin-bottom:18px'},'The 21 topics from the notes, grouped into eight categories. Your teacher\'s arguments, objections and replies sit under each one. Topics the notes do not cover have a violet draft.'),
    h('div',{class:'tools'},
      h('div',{class:'grow'},h('div',{class:'seg-wrap'},h('label',{class:'lbl',for:'search'},'Search'),search)),
      seg('Teacher\'s formula',[[true,'Underlined'],[false,'Plain']],S.hl,function(v){ S.hl=v; draw(); drawHL(); }),
      h('div',{class:'seg-wrap'},h('div',{class:'lbl'},'Scenarios'),h('button',{class:'btn',type:'button',on:{click:function(){ S.openAll=!S.openAll; render(); }}},S.openAll?'Collapse all':'Expand all'))),
    pills,results);
  function drawHL(){ render(); }
  drawPills(); draw();
}
function catHeader(c,topics){
  return h('h2',{class:'h2'},c.title,h('small',{lang:'fr'},c.fr));
}
function drawOverview(out){
  out.append(h('p',{class:'muted',style:'margin-bottom:14px'},'Tap a topic to open its category. The label shows where its arguments come from.'));
  CATS.forEach(function(c){
    out.append(h('section',{class:'catblock'},h('h3',{class:'h3'},c.title,h('span',{class:'small muted',lang:'fr',style:'font-family:var(--font-body);margin-left:10px'},c.fr)),
      h('div',{class:'tgrid'},c.topics.map(function(n){ return topicCard(n,true); }))));
  });
}
function drawCat(c){
  var sec=h('section',{class:'catblock'},catHeader(c));
  sec.append(h('div',{class:'tgrid'},c.topics.map(function(n){ return topicCard(n,false); })));
  if(c.see) sec.append(h('p',{class:'ctx'},c.see));
  if(c.args.length){
    sec.append(h('div',{class:'sub'},"Arguments from your teacher's notes"));
    var box=h('div',{class:'sheet'});
    c.args.forEach(function(a){
      if(a.list){ box.append(h('div',{class:'hd mono tiny muted',style:'margin:4px 0'},a.h)); a.list.forEach(function(t){ box.append(h('div',{class:'arg'},h('div',{class:'tx'},h('p',{lang:'fr'},t)),hear(t))); }); }
      else box.append(h('div',{class:'arg'},h('div',{class:'tx'},h('div',{class:'hd mono tiny muted'},a.h),h('p',{lang:'fr'},a.t)),hear(a.t)));
    });
    sec.append(box);
  }
  if(c.sc.length){
    sec.append(h('div',{class:'sub'},'Scenarios from your teacher\'s notes'));
    c.sc.forEach(function(sid){ sec.append(scenarioEl(SC[sid],S.openAll)); });
  }
  if(c.drafts.length){
    sec.append(h('div',{class:'sub'},h('span',{class:'badge b-draft'},'Draft'),'Not from your teacher. Written to follow her formulas.'));
    c.drafts.forEach(function(n){ sec.append(draftEl(n,DRAFTS[n])); });
  }
  return sec;
}
function drawSearch(out,q){
  var found=0;
  var addUniv=UNIV.items.map(function(it,i){ return Object.assign({__i:i},it); }).filter(function(it){ return matches(q,it.o,it.en,it.r); });
  if(addUniv.length){ found+=addUniv.length; out.append(h('section',{class:'catblock'},h('h3',{class:'h3'},'Universal replies'),scenarioEl({id:'univ',title:'Universal replies',items:addUniv,pitch:[]},true))); }
  CATS.forEach(function(c){
    var sec=h('section',{class:'catblock'},h('h3',{class:'h3'},c.title)),n=0;
    c.args.forEach(function(a){
      var ts=a.list?a.list:[a.t];
      var hit=ts.filter(function(t){ return matches(q,t,a.h); });
      if(hit.length){ n+=hit.length; var box=h('div',{class:'sheet',style:'margin-bottom:12px'},h('div',{class:'hd mono tiny muted'},a.h)); hit.forEach(function(t){ box.append(h('div',{class:'arg'},h('div',{class:'tx'},h('p',{lang:'fr'},t)),hear(t))); }); sec.append(box); }
    });
    c.sc.forEach(function(sid){
      var s=SC[sid],titleHit=matches(q,s.title,s.en,s.ctx);
      var items=s.items.map(function(it,i){ return Object.assign({__i:i},it); }).filter(function(it){ return titleHit||matches(q,it.o,it.en,it.r); });
      var pitch=(s.pitch||[]).filter(function(p){ p=pt(p); return titleHit||matches(q,p.t,p.h); });
      if(items.length||pitch.length){ n+=items.length+pitch.length; sec.append(scenarioEl(Object.assign({},s,{items:items,pitch:pitch}),true)); }
    });
    c.drafts.forEach(function(k){
      var d=DRAFTS[k],tp=TOPICS[k],hit=matches(q,tp.fr,tp.en);
      var items=d.items.map(function(it,i){ return Object.assign({__i:i},it); }).filter(function(it){ return hit||matches(q,it.o,it.en,it.r); });
      var args=d.args.filter(function(a){ return hit||matches(q,a); });
      if(items.length||args.length){ n+=items.length+args.length; sec.append(draftEl(k,{args:args,items:items})); }
    });
    if(n){ found+=n; out.append(sec); }
  });
  if(!found) out.append(h('div',{class:'empty'},'Nothing matches that search. Try a shorter word, or an English one.'));
}

/* practice */
function buildQueue(){
  var P=S.P,pool=allPool().filter(function(x){
    if(x.draft&&!P.drafts) return false;
    if(!x.r) return false;
    if(P.cat!=='all'&&x.cat!==P.cat) return false;
    if(P.show==='todo'&&S.known[x.id]) return false;
    return true;
  });
  P.queue=shuffled(pool); P.idx=0; P.reveal=false;
}
function renderPractice(main){
  var P=S.P;
  if(!P.queue.length&&P.idx===0&&!P._built){ P._built=true; buildQueue(); }
  var cardHost=h('div');
  var catOpts=[['all','All categories'],['univ','Universal replies']].concat(CATS.map(function(c){return [c.id,c.title];}));
  var sel=h('select',{class:'input',id:'pcat','aria-label':'Category',on:{change:function(e){ P.cat=e.target.value; buildQueue(); drawCard(); }}},
    catOpts.map(function(o){ var op=h('option',{value:o[0]},o[1]); if(o[0]===P.cat) op.selected=true; return op; }));
  var all=allPool().filter(function(x){ return x.r&&!x.draft; });
  var drawCard=function(){
    cardHost.replaceChildren();
    var total=P.queue.length;
    if(!total){ cardHost.append(h('div',{class:'empty'},P.show==='todo'?'Nothing left to practise here. You have marked every card as known.':'No cards for this choice.')); return; }
    if(P.idx>=total){
      cardHost.append(h('section',{class:'sheet pcard stack'},h('h3',{class:'h3'},'Round finished'),h('p',{class:'muted'},'You went through '+total+' cards.'),
        h('div',{class:'row'},h('button',{class:'btn primary',type:'button',on:{click:function(){ buildQueue(); drawCard(); }}},'Shuffle and go again'))));
      return;
    }
    var it=P.queue[P.idx];
    var meta=h('div',{class:'row',style:'justify-content:space-between'},
      h('div',{class:'mono tiny muted'},'Card '+(P.idx+1)+' of '+total+' · '+it.sc),
      it.draft?h('span',{class:'badge b-draft'},'Draft'):null);
    var rep=h('div',{class:'stack-s'});
    var drawReply=function(){
      rep.replaceChildren();
      if(!P.reveal){
        rep.append(h('p',{class:'muted small'},'Answer out loud for about 30 seconds first. Use the five steps. Then check against your teacher.'),
          h('button',{class:'btn primary',type:'button',on:{click:function(){ P.reveal=true; drawReply(); }}},'Show the reply'));
      } else {
        rep.append(h('div',{class:'mono tiny muted'},it.draft?'Draft reply':"Your teacher's reply"),frText(it.r),
          h('div',{class:'acts'},hear(it.r,'Listen to reply')),
          h('div',{class:'row',style:'margin-top:6px'},
            h('button',{class:'btn primary',type:'button',on:{click:function(){ S.known[it.id]=1; save(); P.idx++; P.reveal=false; drawCard(); drawProg(); }}},'Got it'),
            h('button',{class:'btn',type:'button',on:{click:function(){ delete S.known[it.id]; save(); P.queue.push(it); P.idx++; P.reveal=false; drawCard(); drawProg(); }}},'Again later'),
            h('button',{class:'btn ghost',type:'button',on:{click:function(){ P.idx++; P.reveal=false; drawCard(); }}},'Skip')));
      }
    };
    drawReply();
    cardHost.append(h('section',{class:'sheet pcard stack'},meta,
      h('div',null,h('div',{class:'mono tiny red'},'Your friend says'),h('p',{class:'pq',lang:'fr'},it.o),h('p',{class:'muted'},it.en)),
      h('div',{class:'acts'},hear(it.o,'Listen to objection')),rep));
  };
  var prog=h('div');
  var drawProg=function(){
    var ids=all.map(function(x){return x.id;}),k=knownCount(ids);
    prog.replaceChildren(h('div',{class:'row',style:'justify-content:space-between;margin-bottom:6px'},h('span',{class:'mono tiny muted'},'Known from your teacher\'s notes'),h('span',{class:'mono tiny'},k+' / '+ids.length)),
      h('div',{class:'pbar'},h('i',{style:'width:'+(ids.length?k/ids.length*100:0)+'%'})));
  };
  put(main,h('h2',{class:'h2'},'Practice'),
    h('p',{class:'lede',style:'margin-bottom:18px'},'A friend gives an objection. You answer out loud, then check the reply from the notes. Cards you know stay marked.'),
    h('div',{class:'tools'},
      h('div',{class:'seg-wrap grow'},h('label',{class:'lbl',for:'pcat'},'Category'),sel),
      seg('Show',[['all','All cards'],['todo','Not yet known']],P.show,function(v){ P.show=v; buildQueue(); render(); }),
      seg('Drafts',[[false,'Notes only'],[true,'Include drafts']],P.drafts,function(v){ P.drafts=v; buildQueue(); render(); })),
    prog,h('div',{style:'height:16px'}),cardHost);
  drawProg(); drawCard();
}
