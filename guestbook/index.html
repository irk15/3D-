<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0d">
<title>Guest Book Booth</title>
<style>
:root{--bg:#0b0b0d;--ink:#f4f1ea;--dim:#8d8a84;--paper:#fbfaf7;--hand:"Bradley Hand","Segoe Print","Noteworthy","Comic Sans MS",cursive;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 20px 6px;gap:12px}
.title h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.title .sub{color:var(--dim);font-size:13px;margin-top:2px}
.stat{display:flex;gap:22px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;justify-content:center;gap:6px;padding:6px 0 8px}
.tabs button{padding:7px 16px;border-radius:99px;font-size:13px;color:var(--dim)}
.tabs button.on{background:#1c1c20;color:var(--ink)}
main{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* Board */
#board{position:absolute;inset:0;overflow:hidden;background-image:radial-gradient(#26262b 1px,transparent 1.2px);background-size:22px 22px}
#booth{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:min(34vw,210px,26vh);min-width:130px;z-index:5;user-select:none}
#viewfinder{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#17171a;border:3px solid #2a2a30;box-shadow:0 10px 40px #000a}
#viewfinder video,#viewfinder .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#viewfinder video.mirror{transform:scaleX(-1)}
.fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:12px;text-align:center;padding:10px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#shutter{position:absolute;inset:0;z-index:2}
.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#fffc;text-shadow:0 1px 4px #000;pointer-events:none}
#slot{height:11px;margin:8px 8% 0;border-radius:8px;background:linear-gradient(#3a3a40,#1b1b1e);box-shadow:inset 0 2px 3px #000}
#printer{position:absolute;left:8%;right:8%;top:100%;height:0}

/* Polaroid */
.pol{position:absolute;width:var(--w,120px);background:var(--paper);padding:6% 6% 0;border-radius:3px;box-shadow:0 6px 18px #0009,0 1px 2px #0006;color:#222;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ddd;pointer-events:none;-webkit-user-drag:none}
.pol .cap{font-family:var(--hand);font-size:calc(var(--w,120px)*.092);line-height:1.15;padding:7% 2% 9%;height:calc(var(--w,120px)*.34);overflow:hidden;color:#2b2b2b}
.pol .cap b{font-weight:700}
.pol.drag{box-shadow:0 18px 40px #000c;z-index:999!important}
.printing{animation:print 1.6s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes print{0%{transform:translateY(-130%) rotate(0)}70%{transform:translateY(8%) rotate(-1deg)}100%{transform:translateY(0) rotate(0)}}
#empty{position:absolute;left:0;right:0;bottom:20%;text-align:center;color:var(--dim);font-size:14px;pointer-events:none}

/* Album */
#album{overflow:auto;padding:12px 16px 90px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid .tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#17171a}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .who{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;background:linear-gradient(transparent,#000b)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;background:linear-gradient(transparent,#0b0b0dee 40%);z-index:6}
.btn{padding:11px 20px;border-radius:99px;background:#1f1f24;font-size:14px}
.btn.pri{background:var(--ink);color:#111;font-weight:600}
.btn.dng{color:#ff7a7a}

/* Overlays */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000c;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ov.on{display:flex}
.sheet{width:min(92vw,520px);max-height:92vh;overflow:auto;background:#141417;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:17px}
.sheet .row{display:flex;gap:14px;align-items:flex-start}
.sheet .thumb{width:110px;flex:none}
.sheet .thumb .pol{position:relative;--w:110px;transform:rotate(-3deg)}
input[type=text],textarea{width:100%;background:#1f1f24;border:1px solid #2c2c33;color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;outline:none}
textarea{resize:none;height:84px;font-family:var(--hand);font-size:18px}
input:focus,textarea:focus{border-color:#555}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{font-size:24px;padding:4px 6px;border-radius:8px}
.emojis button:active{background:#2a2a30}
.cnt{font-size:11px;color:var(--dim);text-align:right}
.acts{display:flex;gap:10px;justify-content:flex-end}
#big{flex-direction:column;gap:18px}
#big .pol{position:relative;--w:min(78vw,52vh,420px);transform:rotate(-1.5deg)}
#big .pol .cap{height:auto;min-height:calc(var(--w)*.3);font-size:calc(var(--w)*.065);overflow:visible}
.bigacts{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><h1 id="evTitle">Emma &amp; Daniel's Wedding Day</h1><div class="sub" id="evDate">Tap the title to edit</div></div>
    <div class="stat"><div><b id="nPhotos">0</b><span>Photos</span></div><div><b id="nGuests">0</b><span>People</span></div></div>
  </header>
  <div class="tabs"><button data-t="album">Album</button><button data-t="book" class="on">Guest Book</button></div>
  <main>
    <section class="view on" id="v-book">
      <div id="board">
        <div id="booth">
          <div id="viewfinder">
            <video id="vid" playsinline muted autoplay></video>
            <div class="fallback" id="fb" style="display:none"><span>📷</span><span id="fbMsg">Camera unavailable</span></div>
            <div id="flash"></div>
            <button id="shutter" aria-label="Take photo"></button>
            <div class="hint">Tap to take a picture</div>
          </div>
          <div id="slot"></div>
          <div id="printer"></div>
        </div>
        <div id="empty">Your guests' memories will land here ✨</div>
      </div>
      <div class="bar"><button class="btn" id="flip">Flip camera</button><button class="btn pri" id="snapBtn">Add yours</button></div>
    </section>
    <section class="view" id="v-album">
      <div id="album"><div class="grid" id="grid"></div></div>
      <div class="bar"><button class="btn" id="dlAll">Download all photo cards</button></div>
    </section>
  </main>
</div>

<!-- note sheet -->
<div class="ov" id="noteOv"><div class="sheet">
  <h2>Leave a note 💌</h2>
  <div class="row">
    <div class="thumb" id="noteThumb"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <input type="text" id="nm" placeholder="Your name" maxlength="24" autocomplete="off">
      <textarea id="msg" placeholder="Write something for the couple…" maxlength="140"></textarea>
      <div class="cnt"><span id="cc">0</span>/140</div>
    </div>
  </div>
  <div class="emojis" id="emo"></div>
  <div class="acts"><button class="btn" id="retake">Retake</button><button class="btn pri" id="post">Post to board</button></div>
</div></div>

<!-- enlarged -->
<div class="ov" id="big"><div id="bigHold"></div>
  <div class="bigacts"><button class="btn pri" id="saveCard">Save photo card</button><button class="btn dng" id="del">Delete</button><button class="btn" id="closeBig">Close</button></div>
</div>

<!-- settings -->
<div class="ov" id="setOv"><div class="sheet">
  <h2>Event details</h2>
  <input type="text" id="sTitle" placeholder="Event title" maxlength="50">
  <input type="text" id="sDate" placeholder="Date (e.g. Aug 25th)" maxlength="30">
  <div class="acts"><button class="btn" id="sCancel">Cancel</button><button class="btn pri" id="sSave">Save</button></div>
</div></div>

<div id="toast"></div>
<input type="file" id="file" accept="image/*" capture="user" hidden>

<script>
(()=>{
const $=s=>document.querySelector(s);
const EMOJI=["😍","🥹","🥂","💍","💕","🎉","🤍","✨","🔥","😘","👰","🤵","🍾","💃","🕺","🥳"];
const SIZE=800;           // saved photo resolution
let facing="user",stream=null,photos=[],pendingImg=null,openId=null,z=1;
const settings=JSON.parse(localStorage.getItem("gb-settings")||'{"title":"Emma & Daniel\'s Wedding Day","date":"Aug 25th"}');

/* ---------- IndexedDB ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open("guestbook",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction("p",m),s=t.objectStore("p"),q=f(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const dbAll=()=>tx("readonly",s=>s.getAll());
const dbPut=o=>tx("readwrite",s=>s.put(o));
const dbDel=id=>tx("readwrite",s=>s.delete(id));

/* ---------- helpers ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)};
const capHTML=p=>`<b>@${esc(p.name||"Guest")}</b>${p.msg?" – "+esc(p.msg):""}`;
function polEl(p,w){
  const d=document.createElement("div");d.className="pol";d.dataset.id=p.id;
  if(w)d.style.setProperty("--w",w+"px");
  d.innerHTML=`<img src="${p.img}" alt=""><div class="cap">${capHTML(p)}</div>`;
  return d;
}
function renderHeader(){
  $("#evTitle").textContent=settings.title;$("#evDate").textContent=settings.date||"Tap the title to edit";
  $("#nPhotos").textContent=photos.length;
  $("#nGuests").textContent=new Set(photos.map(p=>(p.name||"").trim().toLowerCase())).size;
  $("#empty").style.display=photos.length?"none":"block";
}

/* ---------- camera ---------- */
async function startCam(){
  stopCam();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1280}},audio:false});
    const v=$("#vid");v.srcObject=stream;v.classList.toggle("mirror",facing==="user");v.style.display="block";$("#fb").style.display="none";
    await v.play().catch(()=>{});
  }catch(e){
    $("#vid").style.display="none";$("#fb").style.display="flex";
    $("#fbMsg").textContent="Camera blocked — tap to pick a photo";
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function grab(){
  const v=$("#vid");
  if(!stream||!v.videoWidth)return null;
  const s=Math.min(v.videoWidth,v.videoHeight),c=document.createElement("canvas");c.width=c.height=SIZE;
  const x=c.getContext("2d");
  if(facing==="user"){x.translate(SIZE,0);x.scale(-1,1)}
  x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,SIZE,SIZE);
  return c.toDataURL("image/jpeg",.85);
}
function fromFile(f){
  return new Promise(res=>{
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=SIZE;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,SIZE,SIZE);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.85))};
    img.src=u;
  });
}
async function shoot(){
  let data=null;
  if(stream){data=grab();$("#flash").classList.remove("go");void $("#flash").offsetWidth;$("#flash").classList.add("go");
    try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
    await new Promise(r=>setTimeout(r,180));}
  else{$("#file").click();return}
  if(!data)return;
  openNote(data);
}
$("#file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f)openNote(await fromFile(f))};
$("#shutter").onclick=shoot;$("#snapBtn").onclick=shoot;
$("#flip").onclick=()=>{facing=facing==="user"?"environment":"user";startCam()};

/* ---------- note sheet ---------- */
function openNote(img){
  pendingImg=img;
  $("#noteThumb").innerHTML="";
  $("#noteThumb").appendChild(polEl({id:"tmp",img,name:"",msg:""},110));
  $("#nm").value=localStorage.getItem("gb-lastname")||"";$("#msg").value="";$("#cc").textContent=0;
  $("#noteOv").classList.add("on");
}
$("#emo").innerHTML=EMOJI.map(e=>`<button type="button">${e}</button>`).join("");
$("#emo").onclick=e=>{if(e.target.tagName!=="BUTTON")return;const m=$("#msg");if(m.value.length<138)m.value+=e.target.textContent;$("#cc").textContent=m.value.length;m.focus()};
$("#msg").oninput=e=>$("#cc").textContent=e.target.value.length;
$("#retake").onclick=()=>{$("#noteOv").classList.remove("on");pendingImg=null};
$("#post").onclick=async()=>{
  const name=$("#nm").value.trim()||"Guest",msg=$("#msg").value.trim();
  localStorage.setItem("gb-lastname",name);
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),img:pendingImg,name,msg,t:Date.now(),
    x:.12+Math.random()*.76,y:.30+Math.random()*.55,r:(Math.random()*20-10)};
  $("#noteOv").classList.remove("on");pendingImg=null;
  photos.push(p);await dbPut(p);renderHeader();printOut(p);renderGrid();
};

/* ---------- board ---------- */
function polW(){return Math.max(96,Math.min(150,$("#board").clientWidth/6.2))}
function place(el,p){
  const b=$("#board"),w=polW(),h=w*1.36;
  const x=Math.min(Math.max(p.x*b.clientWidth-w/2,4),b.clientWidth-w-4);
  const y=Math.min(Math.max(p.y*b.clientHeight-h/2,4),b.clientHeight-h-70);
  el.style.left=x+"px";el.style.top=y+"px";el.style.transform=`rotate(${p.r}deg)`;
}
function addToBoard(p,animate){
  const el=polEl(p,polW());el.style.zIndex=z++;place(el,p);
  $("#board").appendChild(el);bindDrag(el,p);return el;
}
function printOut(p){
  // animate: polaroid emerges from slot then settles to its spot
  const booth=$("#booth").getBoundingClientRect(),b=$("#board").getBoundingClientRect(),w=polW();
  const el=addToBoard(p);
  const tx=(booth.left+booth.width/2-w/2)-b.left,ty=booth.bottom-b.top-w*1.36+6;
  const fx=parseFloat(el.style.left),fy=parseFloat(el.style.top);
  el.style.zIndex=4;el.style.transition="none";
  el.style.left=tx+"px";el.style.top=(ty-w*1.3)+"px";el.style.transform="rotate(0)";el.style.clipPath="inset(0 0 0 0)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transition="top 1.1s cubic-bezier(.3,.7,.3,1)";el.style.top=ty+"px";
    setTimeout(()=>{el.style.transition="left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1),transform .8s";
      el.style.zIndex=z++;el.style.left=fx+"px";el.style.top=fy+"px";el.style.transform=`rotate(${p.r}deg)`;
      setTimeout(()=>el.style.transition="",900)},1300);
  }));
}
function renderBoard(){
  document.querySelectorAll("#board .pol").forEach(e=>e.remove());
  photos.slice().sort((a,b)=>a.t-b.t).forEach(p=>addToBoard(p));
}
function bindDrag(el,p){
  let sx,sy,ox,oy,moved=false,id=null;
  el.addEventListener("pointerdown",e=>{id=e.pointerId;el.setPointerCapture(id);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;moved=false;el.style.zIndex=z++;el.classList.add("drag");el.style.transition=""});
  el.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){el.style.left=ox+dx+"px";el.style.top=oy+dy+"px"}});
  const end=async e=>{if(e.pointerId!==id)return;id=null;el.classList.remove("drag");
    if(!moved){openBig(p.id)}else{const b=$("#board"),w=el.offsetWidth,h=el.offsetHeight;
      p.x=(el.offsetLeft+w/2)/b.clientWidth;p.y=(el.offsetTop+h/2)/b.clientHeight;dbPut(p)}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",e=>{id=null;el.classList.remove("drag")});
}

/* ---------- enlarged ---------- */
function openBig(id){
  const p=photos.find(x=>x.id===id);if(!p)return;openId=id;
  const h=$("#bigHold");h.innerHTML="";h.appendChild(polEl(p));$("#big").classList.add("on");
}
$("#closeBig").onclick=()=>$("#big").classList.remove("on");
$("#big").onclick=e=>{if(e.target.id==="big")$("#big").classList.remove("on")};
$("#del").onclick=async()=>{
  if(!confirm("Delete this photo from the guest book?"))return;
  await dbDel(openId);photos=photos.filter(p=>p.id!==openId);
  document.querySelector(`#board .pol[data-id="${openId}"]`)?.remove();
  $("#big").classList.remove("on");renderHeader();renderGrid();toast("Deleted");
};
$("#saveCard").onclick=()=>{const p=photos.find(x=>x.id===openId);if(p)saveCard(p)};

/* ---------- photo card (canvas PNG) ---------- */
function wrap(x,t,maxW){const words=t.split(/\s+/),lines=[];let cur="";
  for(const w of words){const test=cur?cur+" "+w:w;if(x.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}
  if(cur)lines.push(cur);return lines}
function cardCanvas(p){
  return new Promise(res=>{
    const img=new Image();img.onload=()=>{
      const W=1000,pad=60,ph=W-pad*2,capH=330,H=pad+ph+capH;
      const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
      x.fillStyle="#fbfaf7";x.fillRect(0,0,W,H);
      x.drawImage(img,pad,pad,ph,ph);
      x.fillStyle="#2b2b2b";x.textBaseline="top";
      const fam='"Bradley Hand","Segoe Print","Noteworthy","Comic Sans MS",cursive';
      x.font=`bold 54px ${fam}`;
      const n="@"+p.name;let lines=[];
      x.font=`54px ${fam}`;
      const full=n+(p.msg?" – "+p.msg:"");
      lines=wrap(x,full,ph);
      let fs=54;while(lines.length>4&&fs>34){fs-=4;x.font=`${fs}px ${fam}`;lines=wrap(x,full,ph)}
      lines.slice(0,5).forEach((l,i)=>x.fillText(l,pad,pad+ph+36+i*(fs*1.2)));
      x.font=`26px ${fam}`;x.fillStyle="#9a9690";x.textAlign="right";
      x.fillText(settings.title,W-pad,H-52);
      res(c)};img.src=p.img;
  });
}
async function saveCard(p){
  const c=await cardCanvas(p);
  c.toBlob(async b=>{
    const file=new File([b],`guestbook-${p.name.replace(/\W+/g,"_")}.png`,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast("Photo card saved");
  },"image/png");
}

/* ---------- album ---------- */
function renderGrid(){
  const g=$("#grid");g.innerHTML="";
  photos.slice().sort((a,b)=>b.t-a.t).forEach(p=>{
    const t=document.createElement("div");t.className="tile";
    t.innerHTML=`<img src="${p.img}" alt=""><div class="who">@${esc(p.name)}</div>`;
    t.onclick=()=>openBig(p.id);g.appendChild(t);
  });
}
$("#dlAll").onclick=async()=>{
  if(!photos.length)return toast("No photos yet");
  toast("Preparing cards…");
  for(const p of photos){const c=await cardCanvas(p);const b=await new Promise(r=>c.toBlob(r,"image/png"));
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`guestbook-${p.name.replace(/\W+/g,"_")}-${p.id}.png`;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,250))}
};

/* ---------- tabs & settings ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.t));
  if(b.dataset.t==="book"){startCam();setTimeout(renderBoard,0)}else stopCam();
});
$("#evTitle").onclick=()=>{$("#sTitle").value=settings.title;$("#sDate").value=settings.date;$("#setOv").classList.add("on")};
$("#sCancel").onclick=()=>$("#setOv").classList.remove("on");
$("#sSave").onclick=()=>{settings.title=$("#sTitle").value.trim()||settings.title;settings.date=$("#sDate").value.trim();
  localStorage.setItem("gb-settings",JSON.stringify(settings));renderHeader();$("#setOv").classList.remove("on")};
$("#fb").onclick=()=>$("#file").click();
addEventListener("resize",()=>{if($("#v-book").classList.contains("on"))renderBoard()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopCam();else if($("#v-book").classList.contains("on"))startCam()});

/* ---------- init ---------- */
(async()=>{photos=await dbAll();renderHeader();renderBoard();renderGrid();startCam()})();
})();
</script>
</body>
</html>
