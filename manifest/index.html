<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Manifest</title>
<style>
:root{
  --bg:#0c0a1a;--card:#15122b;--card2:#1c1840;--line:#2a2550;--text:#eeeafc;--muted:#9a94c4;
  --gold:#f5c76b;--violet:#a78bfa;--teal:#5eead4;--rose:#fb7185;--r:20px;--nav:68px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);
  background:radial-gradient(90% 50% at 50% -10%,#2a1f5c 0%,transparent 70%),var(--bg);background-attachment:fixed}
#view{max-width:600px;margin:0 auto;padding:14px 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:var(--text)}
button{border:0;cursor:pointer}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
.top{margin:6px 2px 16px}
.top .date{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.top h1{margin:4px 0 0;font-size:30px;line-height:1.15}
.top h1 em{color:var(--gold);font-style:italic}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:22px}
.card h3{margin:0 0 8px;font-size:17px}
.lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.btn{display:block;width:100%;padding:15px 16px;border-radius:14px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--gold),#f0a95a);color:#2a1a00}
.btn.violet{background:linear-gradient(135deg,var(--violet),#7c62dc);color:#120a33}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:14px;border-radius:11px}
.btn.red{background:transparent;border:1px solid #5b2a3a;color:var(--rose);font-weight:600}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
.dots{display:flex;gap:6px;margin:0 2px 14px}
.dots b{flex:1;height:5px;border-radius:99px;background:var(--line)}
.dots b.on{background:var(--gold)}
.dots b.cur{background:var(--violet)}
input[type=text],textarea,select{width:100%;background:#0f0c24;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:6px}
textarea{resize:vertical;min-height:76px;line-height:1.45}
label{font-size:13px;color:var(--muted);display:block;margin-top:12px}
label:first-child{margin-top:0}
.mood{display:flex;gap:8px;margin:12px 0}
.mood button{flex:1;font-size:28px;padding:12px 0;border-radius:14px;background:#0f0c24;border:1px solid var(--line);filter:grayscale(.7);opacity:.7}
.mood button.on{filter:none;opacity:1;border-color:var(--gold);background:#2a2150}
.orbwrap{display:grid;place-items:center;height:250px;position:relative}
.orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9ccff,var(--violet) 45%,#5b3fc4);box-shadow:0 0 60px rgba(167,139,250,.55);transform:scale(.55);transition:transform .12s linear}
.orbwrap .lbl{position:absolute;font-size:20px;font-weight:600;font-family:Georgia,serif;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.bigtime{font-family:Georgia,serif;font-size:50px;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.say{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:15px;background:#0f0c24;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;user-select:none}
.say .ck{width:26px;height:26px;border-radius:50%;border:2px solid #4a4380;flex:none;display:grid;place-items:center;color:#2a1a00;font-size:14px;margin-top:1px}
.say.on{border-color:var(--gold)}
.say.on .ck{background:var(--gold);border-color:var(--gold)}
.say .tx{font-family:Georgia,serif;font-size:18px;line-height:1.35}
.vis{padding:14px;border-radius:15px;background:#0f0c24;border:1px solid var(--line);font-family:Georgia,serif;font-size:18px;line-height:1.5;font-style:italic;margin:10px 0}
.steps{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.steps li{margin-bottom:5px}
.goal{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#0f0c24}
.goal h3{margin:0 0 4px}
.goal .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:700;margin-top:8px}
.goal p{margin:2px 0 0;font-size:15px}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/5;background:#0f0c24}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;background:linear-gradient(transparent,rgba(5,3,15,.85));font-size:13px;font-family:Georgia,serif}
.tile .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(5,3,15,.7);color:#fff;font-size:15px}
.add{display:grid;place-items:center;aspect-ratio:4/5;border-radius:16px;border:2px dashed var(--line);color:var(--muted);font-size:14px;text-align:center;cursor:pointer}
.ev{padding:12px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .d{font-size:12px;color:var(--muted)}
.ev .t{font-family:Georgia,serif;font-size:17px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#0f0c24;border:1px solid var(--line);border-radius:15px;padding:13px}
.stat .n{font-family:Georgia,serif;font-size:28px}
.stat .l{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,10,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav .in{display:flex;max-width:600px;width:100%}
#nav button{flex:1;background:none;height:var(--nav);color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;letter-spacing:.03em}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--text)}
#nav button.on svg{color:var(--gold)}
#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 12px);max-width:568px;margin:0 auto;background:#fff;color:#14102e;border-radius:14px;padding:13px 16px;font-weight:700;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateY(-140%);transition:transform .3s;z-index:9}
#toast.show{transform:none}
#lightbox{position:fixed;inset:0;background:rgba(5,3,15,.95);display:none;place-items:center;z-index:8;padding:20px}
#lightbox.show{display:grid}
#lightbox img{max-width:100%;max-height:78vh;border-radius:14px}
#lightbox p{font-family:Georgia,serif;font-size:20px;text-align:center;margin:14px 0 0}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"><div class="in">
  <button data-act="tab" data-tab="ritual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Ritual</button>
  <button data-act="tab" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  <button data-act="tab" data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Board</button>
  <button data-act="tab" data-tab="proof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Proof</button>
</div></nav>
<div id="toast"></div>
<div id="lightbox" data-act="closebox"><div class="center"><img id="lbImg" alt=""><p id="lbCap"></p></div></div>
<input type="file" id="imgIn" accept="image/*" hidden>
<input type="file" id="file" accept="application/json" hidden>

<script>
'use strict';
const KEY='manifest-v1';
const uid=()=>Math.random().toString(36).slice(2,8);
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
const MOODS=['😞','😕','😐','🙂','😄'];

function defState(){return{v:1,
  goals:[
    {id:uid(),title:'Speak French with confidence',why:'It opens doors to the life I want.',vision:'I am in a real conversation, understanding everything, answering naturally and smiling.',obstacle:'Feeling tired or distracted',plan:'If I feel like skipping, then I will do just 10 minutes first.',action:'One focused 25-minute study session'},
    {id:uid(),title:'Build a strong, healthy body',why:'Energy and strength make everything else easier.',vision:'I feel strong and full of energy, and I see the change in the mirror.',obstacle:'Forgetting to eat on time',plan:'If an alarm goes off, then I eat something right away.',action:'Eat every meal on time today'},
    {id:uid(),title:'Grow my creative career',why:'I want to make work I am proud of and get paid for it.',vision:'I open my inbox to a project I love, from people who value my work.',obstacle:'Doubting my work',plan:'If I doubt myself, then I will look at my best project and ship one small thing.',action:'Make or publish one piece of work'}
  ],
  affs:['I show up for myself every single day.','Small steps, repeated, change my life.','I am building the body, skills and career I want.','I can have a hard day and still keep my promise to myself.','I am worthy of good things, and I work for them.'],
  days:{},board:[],evidence:[]}}
let M,tab='ritual',stepI=0,editing=null,visGoal=null,tmr=null,toastT,AC=null;
function load(){try{const r=localStorage.getItem(KEY);M=r?JSON.parse(r):null}catch(e){M=null}
  if(!M)M=defState();const d=defState();for(const k in d)if(M[k]==null)M[k]=d[k]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(M));return true}catch(e){toast('Storage is full. Remove an image to free space.');return false}}
function D(k=key()){return M.days[k]||(M.days[k]={mood0:null,mood1:null,grat:['','',''],aff:{},acts:{},done:false})}
function streak(){let n=0,d=new Date();if(!(M.days[key(d)]||{}).done)d=addDays(d,-1);while((M.days[key(d)]||{}).done){n++;d=addDays(d,-1)}return n}
function toast(m,t=3200){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),t)}
function chime(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  [523,659,784].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.28;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.3)})}catch(e){}}
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null}}

/* ---------- ritual ---------- */
const STEPS=['checkin','breathe','gratitude','visualize','affirm','act','finish'];
const NAMES={checkin:'Check in',breathe:'Breathe',gratitude:'Gratitude',visualize:'Visualize',affirm:'Affirm',act:'Act',finish:'Close'};
function greeting(){const h=new Date().getHours();return h<5?'Still up?':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night'}

function stepHTML(s){
  const d=D();
  if(s==='checkin')return `<div class="lab">Step 1 · Check in</div><h2>How are you feeling right now?</h2><div class="muted">No right answer. Naming a feeling takes a little of its power.</div>
    <div class="mood">${MOODS.map((m,i)=>`<button class="${d.mood0===i+1?'on':''}" data-act="mood0" data-v="${i+1}">${m}</button>`).join('')}</div>`;
  if(s==='breathe')return `<div class="lab">Step 2 · Breathe</div><h2>One minute of calm</h2><div class="muted">Box breathing: in 4, hold 4, out 4, hold 4. It settles your nervous system before you set intentions.</div>
    <div class="orbwrap"><div class="orb" id="orb"></div><div class="lbl" id="bLbl">Ready</div></div>
    <button class="btn violet" id="bBtn" data-act="breath">Begin</button>`;
  if(s==='gratitude')return `<div class="lab">Step 3 · Gratitude</div><h2>Three things you're grateful for</h2><div class="muted">Small and specific works best: a person, a moment, something your body did today.</div>
    ${[0,1,2].map(i=>`<label>${i+1}.</label><input type="text" data-g="${i}" value="${esc(d.grat[i]||'')}" placeholder="${['A person…','A moment…','Something about me…'][i]}">`).join('')}`;
  if(s==='visualize'){
    const g=M.goals.find(x=>x.id===visGoal)||M.goals[0];if(g)visGoal=g.id;
    return `<div class="lab">Step 4 · Visualize</div><h2>See it, then see the steps</h2><div class="muted">Picture the result, and also the work that gets you there. Seeing the process makes you more likely to act.</div>
    ${M.goals.length?`<label>Focus on</label><select data-vg>${M.goals.map(x=>`<option value="${x.id}"${x.id===g.id?' selected':''}>${esc(x.title)}</option>`).join('')}</select>
    <div class="vis">${esc(g.vision||'Add a vision for this goal in the Goals tab.')}</div>
    <ol class="steps"><li>Where are you? What do you see and hear?</li><li>How does your body feel? Let the feeling in.</li><li>Now picture today's action that moves you closer.</li><li>Let yourself feel proud of that person.</li></ol>`:'<div class="vis">Add a goal first in the Goals tab.</div>'}
    <div class="bigtime" id="vTime">02:00</div><button class="btn violet" id="vBtn" data-act="visgo">Start 2 minutes</button>`}
  if(s==='affirm')return `<div class="lab">Step 5 · Affirm</div><h2>Say it out loud</h2><div class="muted">Tap each one after you've said it, and mean it as a direction, not a fact. Edit these in the Goals tab.</div>
    <div style="margin-top:12px">${M.affs.map((a,i)=>`<div class="say ${d.aff[i]?'on':''}" data-act="aff" data-i="${i}"><div class="ck">${d.aff[i]?'✓':''}</div><div class="tx">${esc(a)}</div></div>`).join('')||'<div class="muted">No affirmations yet.</div>'}</div>`;
  if(s==='act')return `<div class="lab">Step 6 · Act</div><h2>Today's one next action</h2><div class="muted">Manifesting works through action. Make each action so small you can't say no.</div>
    <div style="margin-top:12px">${M.goals.map(g=>`<div class="goal"><div class="row between"><h3>${esc(g.title)}</h3></div>
      <label>Today's action</label><input type="text" data-ga="${g.id}" value="${esc(g.action||'')}" placeholder="One tiny, doable step">
      ${g.plan?`<div class="k">If-then plan</div><p>${esc(g.plan)}</p>`:''}
      <div class="say ${d.acts[g.id]?'on':''}" data-act="act" data-id="${g.id}" style="margin:12px 0 0"><div class="ck">${d.acts[g.id]?'✓':''}</div><div class="tx" style="font-size:16px">${d.acts[g.id]?'Done today':'I committed to this today'}</div></div></div>`).join('')||'<div class="muted">Add a goal in the Goals tab.</div>'}</div>`;
  if(s==='finish'){
    return `<div class="lab">Step 7 · Close</div><h2>${d.done?'Ritual complete':'How do you feel now?'}</h2>
    <div class="muted">${d.done?'You did the work today. Now go and do the actions you committed to.':'Notice any shift, even a small one.'}</div>
    <div class="mood">${MOODS.map((m,i)=>`<button class="${d.mood1===i+1?'on':''}" data-act="mood1" data-v="${i+1}">${m}</button>`).join('')}</div>
    ${d.done?'':'<button class="btn" data-act="finish">Complete today\'s ritual</button>'}`;
  }
  return '';
}
function ritualHTML(){
  const s=STEPS[stepI],d=D();
  return `<div class="top"><div class="row between"><div><div class="date">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${greeting()}${greeting().endsWith('?')?' ':', '}<em>let's set the day.</em></h1></div></div></div>
  <div class="row between" style="margin:0 2px 10px"><span class="chip">✦ ${streak()} day streak</span><span class="muted">${d.done?'Done today ✓':'About 10 minutes'}</span></div>
  <div class="dots">${STEPS.map((x,i)=>`<b class="${i<stepI?'on':i===stepI?'cur':''}"></b>`).join('')}</div>
  <div class="card">${stepHTML(s)}
    <div class="btns">${stepI>0?'<button class="btn ghost" data-act="back">Back</button>':''}${stepI<STEPS.length-1?`<button class="btn ${s==='breathe'||s==='visualize'?'ghost':''}" data-act="next">${s==='breathe'||s==='visualize'?'Skip / Next':'Next'}</button>`:''}</div></div>
  <div class="note center">${STEPS.map((x,i)=>i===stepI?`<b style="color:var(--text)">${NAMES[x]}</b>`:NAMES[x]).join(' · ')}</div>`;
}

/* timers */
function runTimer(total,onFrame,onEnd){
  stopTimer();const t0=Date.now();
  tmr=setInterval(()=>{const e=(Date.now()-t0)/1000;if(e>=total){stopTimer();onFrame(total);onEnd();return}onFrame(e)},100);
}
function breath(){
  const btn=$('bBtn');if(tmr){stopTimer();btn.textContent='Begin';$('bLbl').textContent='Ready';$('orb').style.transform='scale(.55)';return}
  btn.textContent='Stop';
  runTimer(64,e=>{const t=e%16,ph=Math.floor(t/4),p=(t%4)/4;
    const sc=ph===0?.55+.45*p:ph===1?1:ph===2?1-.45*p:.55;
    $('orb').style.transform='scale('+sc.toFixed(3)+')';
    $('bLbl').textContent=['Breathe in','Hold','Breathe out','Hold'][ph]+' · '+(4-Math.floor(t%4))},
    ()=>{chime();$('bLbl').textContent='Well done';btn.textContent='Begin again'});
}
function visgo(){
  const btn=$('vBtn');if(tmr){stopTimer();btn.textContent='Start 2 minutes';$('vTime').textContent='02:00';return}
  btn.textContent='Stop';
  runTimer(120,e=>{$('vTime').textContent=mmss(Math.max(0,120-Math.floor(e)))},()=>{chime();$('vTime').textContent='00:00';btn.textContent='Again';toast('Beautiful. Carry that feeling into the next step.')});
}

/* ---------- goals ---------- */
function goalFormHTML(g){
  return `<div class="card"><h2>${g.isNew?'New goal':'Edit goal'}</h2><div class="muted">A quick WOOP: Wish, Outcome, Obstacle, Plan. Naming the obstacle makes you much more likely to follow through.</div>
  <label>Wish · what do you want?</label><input type="text" id="f_title" value="${esc(g.title)}" placeholder="e.g. Pass my French exam">
  <label>Outcome · why does it matter?</label><input type="text" id="f_why" value="${esc(g.why)}" placeholder="How will your life be better?">
  <label>Vision · describe the moment it's real</label><textarea id="f_vision" placeholder="Present tense, with senses and feelings">${esc(g.vision)}</textarea>
  <label>Obstacle · what inside you could get in the way?</label><input type="text" id="f_obstacle" value="${esc(g.obstacle)}" placeholder="e.g. Tiredness, procrastination, doubt">
  <label>Plan · If (obstacle), then I will…</label><input type="text" id="f_plan" value="${esc(g.plan)}" placeholder="If I feel like skipping, then I will…">
  <label>Today's next action</label><input type="text" id="f_action" value="${esc(g.action)}" placeholder="One tiny step">
  <div class="btns"><button class="btn ghost" data-act="cancelgoal">Cancel</button><button class="btn" data-act="savegoal">Save</button></div>
  ${g.isNew?'':'<div style="margin-top:12px"><button class="btn red" data-act="delgoal">Delete goal</button></div>'}</div>`;
}
function goalsHTML(){
  if(editing){const g=editing==='new'?{isNew:1,title:'',why:'',vision:'',obstacle:'',plan:'',action:''}:M.goals.find(x=>x.id===editing);return `<div class="top"><div class="date">Intentions</div><h1>Your goals</h1></div>${goalFormHTML(g)}`}
  return `<div class="top"><div class="date">Intentions</div><h1>Your goals</h1></div>
  ${M.goals.map(g=>`<div class="goal"><div class="row between"><h3>${esc(g.title)}</h3><button class="btn ghost sm" data-act="editgoal" data-id="${g.id}">Edit</button></div>
    ${g.why?`<div class="k">Why</div><p>${esc(g.why)}</p>`:''}${g.vision?`<div class="k">Vision</div><p style="font-family:Georgia,serif;font-style:italic">${esc(g.vision)}</p>`:''}
    ${g.obstacle?`<div class="k">Obstacle → plan</div><p>${esc(g.obstacle)}. ${esc(g.plan)}</p>`:''}</div>`).join('')}
  <button class="btn" data-act="newgoal" style="margin-bottom:14px">+ New goal</button>
  <div class="card"><h3>Affirmations</h3><div class="muted">One per line. Phrase them as things you're working toward, in your own voice.</div>
    <textarea id="affs" style="min-height:140px">${esc(M.affs.join('\n'))}</textarea></div>`;
}

/* ---------- board ---------- */
function boardHTML(){
  return `<div class="top"><div class="date">Vision</div><h1>Vision board</h1></div>
  <div class="muted" style="margin:-6px 2px 14px">Add images of the life you're building. Look at them every day. Tap one to enlarge.</div>
  <div class="board">${M.board.map(b=>`<div class="tile" data-act="openbox" data-id="${b.id}"><img src="${b.img}" alt=""><div class="cap">${esc(b.cap)}</div><button class="x" data-act="delimg" data-id="${b.id}" aria-label="Remove">✕</button></div>`).join('')}
  ${M.board.length<12?`<div class="add" data-act="addimg">+ Add image<br><span style="font-size:12px">${M.board.length}/12</span></div>`:''}</div>
  <div class="note" style="margin-top:14px">Images are saved on this device only and resized to stay small.</div>`;
}
function resize(file,max=640){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- proof ---------- */
function proofHTML(){
  const days=Object.keys(M.days).filter(k=>M.days[k].done),n14=[];
  for(let i=0;i<14;i++)n14.push(key(addDays(new Date(),-i)));
  const prac=n14.filter(k=>(M.days[k]||{}).done).length;
  const pairs=n14.map(k=>M.days[k]).filter(d=>d&&d.mood0&&d.mood1);
  const lift=pairs.length?(pairs.reduce((a,d)=>a+d.mood1-d.mood0,0)/pairs.length):null;
  const acts=n14.reduce((a,k)=>a+Object.values((M.days[k]||{}).acts||{}).filter(Boolean).length,0);
  const ev=M.evidence.slice().sort((a,b)=>b.ts-a.ts);
  return `<div class="top"><div class="date">Evidence</div><h1>Proof it's working</h1></div>
  <div class="card"><div class="grid">
    <div class="stat"><div class="n">${streak()}</div><div class="l">Day streak</div></div>
    <div class="stat"><div class="n">${prac}/14</div><div class="l">Rituals, last 14 days</div></div>
    <div class="stat"><div class="n">${acts}</div><div class="l">Actions done, 14 days</div></div>
    <div class="stat"><div class="n">${lift===null?'–':(lift>0?'+':'')+lift.toFixed(1)}</div><div class="l">Avg mood change after ritual</div></div></div></div>
  <div class="card"><h3>Log a win</h3><div class="muted">Anything that shows you're moving: a task done, a compliment, a sign, a small improvement. Your brain forgets wins fast, so write them down.</div>
    <textarea id="evIn" placeholder="Today I noticed…" style="margin-top:10px"></textarea><div class="btns"><button class="btn" data-act="addev">Save win</button></div></div>
  <div class="card"><h3>Your evidence wall</h3>${ev.length?ev.slice(0,40).map(e=>`<div class="ev"><div class="row between"><div class="d">${new Date(e.ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</div><button class="btn red sm" style="padding:4px 10px;font-size:12px" data-act="delev" data-id="${e.id}">remove</button></div><div class="t">${esc(e.text)}</div></div>`).join(''):'<div class="muted">Nothing here yet. Your first win goes here.</div>'}</div>
  <div class="card"><h3>Backup</h3><div class="row"><button class="btn ghost" data-act="export">Export</button><button class="btn ghost" data-act="import">Import</button></div><div class="note" style="margin-top:8px">Everything is stored on this device only. Export now and then.</div></div>
  <div class="card"><h3>A note on this tool</h3><div class="note">This is a focus and motivation practice. It works by clarifying what you want and getting you to act, not by guaranteeing outcomes. It is not a substitute for professional support. If things feel heavy, talk to someone you trust or a professional. In Canada you can call or text 9-8-8 any time.</div></div>`;
}

/* ---------- render & events ---------- */
function render(){
  stopTimer();const y=window.scrollY;
  $('view').innerHTML=tab==='ritual'?ritualHTML():tab==='goals'?goalsHTML():tab==='board'?boardHTML():proofHTML();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  window.scrollTo(0,y);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='closebox'){$('lightbox').classList.remove('show');return}
  if(a==='delimg'){e.stopPropagation();M.board=M.board.filter(x=>x.id!==id);save();render();return}
  if(a==='tab'){tab=t.dataset.tab;editing=null;render();window.scrollTo(0,0)}
  else if(a==='next'){stepI=Math.min(STEPS.length-1,stepI+1);render();window.scrollTo(0,0)}
  else if(a==='back'){stepI=Math.max(0,stepI-1);render();window.scrollTo(0,0)}
  else if(a==='mood0'){D().mood0=+t.dataset.v;save();render()}
  else if(a==='mood1'){D().mood1=+t.dataset.v;save();render()}
  else if(a==='breath')breath();
  else if(a==='visgo')visgo();
  else if(a==='aff'){const d=D(),i=t.dataset.i;d.aff[i]=!d.aff[i];save();render()}
  else if(a==='act'){const d=D();d.acts[id]=!d.acts[id];save();render()}
  else if(a==='finish'){const d=D();d.done=true;save();render();chime();toast('Ritual complete. Now go make it real.')}
  else if(a==='newgoal'){editing='new';render()}
  else if(a==='editgoal'){editing=id;render();window.scrollTo(0,0)}
  else if(a==='cancelgoal'){editing=null;render()}
  else if(a==='delgoal'){if(confirm('Delete this goal?')){M.goals=M.goals.filter(x=>x.id!==editing);editing=null;save();render()}}
  else if(a==='savegoal'){
    const v=k=>$('f_'+k).value.trim(),title=v('title');if(!title){toast('Give your goal a name');return}
    const o={title,why:v('why'),vision:v('vision'),obstacle:v('obstacle'),plan:v('plan'),action:v('action')};
    if(editing==='new')M.goals.push(Object.assign({id:uid()},o));else Object.assign(M.goals.find(x=>x.id===editing),o);
    editing=null;save();render();toast('Goal saved')}
  else if(a==='addimg')$('imgIn').click();
  else if(a==='openbox'){const b=M.board.find(x=>x.id===id);if(b){$('lbImg').src=b.img;$('lbCap').textContent=b.cap||'';$('lightbox').classList.add('show')}}
  else if(a==='addev'){const v=$('evIn').value.trim();if(!v){toast('Write something first');return}M.evidence.push({id:uid(),ts:Date.now(),text:v});save();render();toast('Win saved ✦')}
  else if(a==='delev'){M.evidence=M.evidence.filter(x=>x.id!==id);save();render()}
  else if(a==='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(M)],{type:'application/json'}));l.download='manifest-backup-'+key()+'.json';l.click()}
  else if(a==='import')$('file').click();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.g!=null){D().grat[+t.dataset.g]=t.value;save()}
  else if(t.dataset.ga){const g=M.goals.find(x=>x.id===t.dataset.ga);if(g){g.action=t.value;save()}}
  else if(t.dataset.vg!=null){visGoal=t.value;render()}
  else if(t.id==='affs'){M.affs=t.value.split('\n').map(s=>s.trim()).filter(Boolean);save();toast('Affirmations saved')}
});
$('imgIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const img=await resize(f);const cap=(prompt('Caption (optional)')||'').slice(0,60);M.board.push({id:uid(),img,cap});if(!save())M.board.pop();render()}catch(x){toast('Could not read that image')}
});
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&Array.isArray(d.goals)&&d.days){M=d;load_fix();save();render();toast('Backup imported')}else toast('Not a valid backup file')}catch(x){toast('Could not read that file')}};
  r.readAsText(f);e.target.value='';
});
function load_fix(){const d=defState();for(const k in d)if(M[k]==null)M[k]=d[k]}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.remove('show')});

load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
