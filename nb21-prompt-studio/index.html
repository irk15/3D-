<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NB 2.1 Prompt Studio</title>
<style>
:root{
  --bg:#0a0a0c;--pane:#121214;--card:#17171a;--card2:#1e1e22;--line:#26262b;
  --ac:#ffd84d;--ac-dim:#8a7530;--acs:rgba(255,216,77,.12);
  --tx:#f2f2f4;--dim:#8e8e96;--faint:#5a5a62;--ok:#7ed492;--red:#e0716b;
}
body.studio{--ac:#c9a2ff;--ac-dim:#6d5a91;--acs:rgba(201,162,255,.13);}
body.cctv{--ac:#7ee8a0;--ac-dim:#4a8a5e;--acs:rgba(126,232,160,.12);}
body.cinema{--ac:#ff9e6b;--ac-dim:#9a5f3f;--acs:rgba(255,158,107,.13);}
body.doc{--ac:#e8dcc0;--ac-dim:#8a8270;--acs:rgba(232,220,192,.12);}
body.product{--ac:#7fd8ff;--ac-dim:#4a7f96;--acs:rgba(127,216,255,.12);}
body.interior{--ac:#e0b98a;--ac-dim:#8a7055;--acs:rgba(224,185,138,.13);}
body.editorial{--ac:#f472b6;--ac-dim:#9a4f75;--acs:rgba(244,114,182,.13);}
body.portrait{--ac:#a78bfa;--ac-dim:#675596;--acs:rgba(167,139,250,.13);}
body.fantasy{--ac:#818cf8;--ac-dim:#4f5599;--acs:rgba(129,140,248,.13);}
body.farsnap{--ac:#ff8a5c;--ac-dim:#96553a;--acs:rgba(255,138,92,.13);}
body.spicy{--ac:#ff4d4d;--ac-dim:#992e2e;--acs:rgba(255,77,77,.14);}
body.webcam{--ac:#ff9ec4;--ac-dim:#965e75;--acs:rgba(255,158,196,.13);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);transition:.25s;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:#2e2e34;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;}

.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}
.modeRow{border-bottom:1px solid var(--line);background:var(--pane);padding:7px 16px;overflow:hidden;}
.msw{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;}
.msw::-webkit-scrollbar{height:4px;}
.ms{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;
  color:var(--dim);font-size:11.5px;font-weight:700;transition:.14s;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:6px;}
.ms:hover{color:var(--tx);border-color:#3a3a42;}
.ms.on{background:var(--acs);color:var(--ac);border-color:var(--ac);}

/* ===== TOP BAR ===== */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--pane);}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.brand .ic{width:30px;height:30px;border-radius:9px;background:var(--ac);display:flex;align-items:center;
  justify-content:center;font-size:15px;transition:.25s;}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.3px;}
.brand .sb{font-size:9.5px;color:var(--faint);}
.topR{margin-left:auto;display:flex;gap:6px;align-items:center;}
.fs{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 11px;
  font-size:11px;cursor:pointer;font-weight:600;transition:.13s;}
.fs.on{background:var(--acs);border-color:var(--ac);color:var(--ac);}

/* ===== 3 COLUMNS ===== */
.main{display:grid;grid-template-columns:236px 1fr 430px;overflow:hidden;}
.col{overflow-y:auto;overflow-x:hidden;padding:14px;}
.colL{border-right:1px solid var(--line);background:var(--pane);}
.colR{border-left:1px solid var(--line);background:var(--pane);display:flex;flex-direction:column;padding:0;overflow:hidden;}

.hd{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);font-weight:800;margin-bottom:9px;}

/* ===== LEFT: LIBRARY ===== */
.tabs{display:flex;gap:5px;margin-bottom:10px;}
.tab{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px;
  font-size:11px;cursor:pointer;font-weight:700;}
.tab.on{background:var(--acs);border-color:var(--ac);color:var(--ac);}
.item{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:6px;}
.itemT{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.bdg{font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px;background:rgba(255,216,77,.15);color:#ffd84d;}
.bdg.st{background:rgba(201,162,255,.15);color:#c9a2ff;}
.nm{font-size:11px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dt{font-size:9px;color:var(--faint);}
.itemP{font-size:9.5px;color:var(--faint);line-height:1.45;max-height:27px;overflow:hidden;margin-bottom:7px;}
.itemA{display:flex;gap:4px;}
.ib{flex:1;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:5px 2px;
  font-size:9.5px;cursor:pointer;}
.ib:hover{color:var(--ac);border-color:var(--ac-dim);}
.ib.del:hover{color:var(--red);border-color:var(--red);}
.ib.ok{background:var(--ok);color:#08190d;border-color:var(--ok);}
.emptyL{font-size:10.5px;color:var(--faint);font-style:italic;line-height:1.5;}

/* ===== CENTER ===== */
.f4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.fld.wide{grid-column:1/-1;}
.fld label{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);font-weight:800;
  display:block;margin-bottom:5px;}
.fld input,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;color:var(--tx);font-size:12.5px;font-family:inherit;resize:none;line-height:1.45;}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--ac-dim);background:var(--card2);}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint);}

.pTabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.pt{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 12px;
  font-size:11.5px;cursor:pointer;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.pt.on{background:var(--acs);border-color:var(--ac);color:var(--ac);}
.pt .dot{width:5px;height:5px;border-radius:50%;background:var(--ac);opacity:0;}
.pt .dot.f{opacity:1;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px;}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px;cursor:pointer;
  transition:.12s;text-align:left;color:inherit;}
.opt .em{font-size:15px;display:block;margin-bottom:4px;line-height:1;}
.opt .t{font-size:11.5px;font-weight:600;display:block;}
.opt .d{font-size:9.5px;color:var(--faint);margin-top:2px;display:block;line-height:1.35;}
.opt:hover{border-color:var(--ac-dim);background:var(--card2);}
.opt.on{border-color:var(--ac);background:var(--acs);}
.opt.on .t{color:var(--ac);}
.opt.own{border-style:dashed;}
.opt.own.on{border-style:solid;}
.ownBox{display:none;margin-top:7px;}
.ownBox.show{display:block;}
.ownBox input{width:100%;background:var(--card2);border:1px solid var(--ac-dim);border-radius:9px;padding:10px 12px;
  color:var(--ac);font-size:12px;font-family:inherit;}
.ownBox input:focus{outline:none;border-color:var(--ac);}
.ownBox input::placeholder{color:var(--faint);font-style:italic;}

.gritBar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  display:flex;align-items:center;gap:10px;}
.rowBlk{margin-bottom:15px;}
.rowT{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:800;margin-bottom:7px;}
.rowT span{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400;font-size:9.5px;margin-left:7px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;}
.pill{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:7px 10px;
  font-size:11px;cursor:pointer;transition:.12s;white-space:nowrap;}
.pill:hover{border-color:var(--ac-dim);color:var(--tx);}
.pill.on{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:700;}
.pill.own{border-style:dashed;}
.pill.own.on{border-style:solid;}
.gritBar .txt{flex:1;font-size:11px;color:var(--dim);line-height:1.5;}
.gritBar .txt b{color:var(--tx);}
.reroll{background:var(--card2);border:1px solid var(--line);color:var(--ac);border-radius:8px;padding:8px 11px;
  font-size:11px;cursor:pointer;font-weight:700;white-space:nowrap;}

/* ===== RIGHT: OUTPUT ===== */
.outHd{padding:12px 14px;border-bottom:1px solid var(--line);}
.oSeg{display:flex;gap:5px;}
.os{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:9px 5px;
  font-size:11px;cursor:pointer;font-weight:700;transition:.13s;text-align:center;}
.os small{display:block;font-size:8.5px;color:var(--faint);font-weight:400;margin-top:2px;}
.os.on{background:var(--acs);border-color:var(--ac);color:var(--ac);}
.os.on small{color:var(--ac-dim);}
.outBody{flex:1;overflow-y:auto;padding:12px 14px;}
.outFoot{padding:11px 14px;border-top:1px solid var(--line);background:var(--pane);}
.fRow{display:flex;gap:7px;}
.btn{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.14s;}
.btn.go{flex:1;background:var(--ac);color:#1a1500;border:none;}
.btn.go:hover{filter:brightness(1.07);}
.btn.sm{flex:0 0 auto;padding:11px 13px;color:var(--dim);}
.btn.sm:hover{color:var(--ac);border-color:var(--ac-dim);}
.btn.done{background:var(--ok);color:#08190d;border:none;}
.cnt{font-size:9.5px;color:var(--faint);text-align:center;margin-top:7px;}

.pc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:12px;
  line-height:1.62;color:#efe9d8;white-space:pre-wrap;word-break:break-word;}
.pc.json{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;color:#cfe9d4;}
.pc.empty{color:var(--faint);font-style:italic;}
.pc .lb{color:var(--ac);font-weight:700;}

.sc{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;}
.scT{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:var(--card2);cursor:pointer;}
.scT .l{font-size:10.5px;font-weight:800;color:var(--ac);display:flex;align-items:center;gap:6px;}
.scT .l small{color:var(--faint);font-weight:500;}
.scT .r{display:flex;gap:5px;align-items:center;}
.cp{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:4px 9px;
  font-size:9.5px;cursor:pointer;}
.cp:hover{color:var(--ac);border-color:var(--ac-dim);}
.cp.ok{background:var(--ok);color:#08190d;border-color:var(--ok);}
.chev{color:var(--faint);font-size:9px;transition:.2s;}
.sc.open .chev{transform:rotate(90deg);}
.scB{display:none;padding:11px;font-size:11px;line-height:1.58;color:#efe9d8;white-space:pre-wrap;word-break:break-word;}
.sc.open .scB{display:block;}
.scB.json{font-family:'SF Mono',Consolas,monospace;font-size:10px;color:#cfe9d4;}
.scB .lb{color:var(--ac);font-weight:700;}
.peek{font-size:9.5px;color:var(--faint);padding:0 11px 9px;line-height:1.4;max-height:26px;overflow:hidden;}
.sc.open .peek{display:none;}

/* ===== GENERATION ===== */
.genRow{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.mSeg{display:flex;gap:4px;flex:1;}
.mb{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 6px;
  font-size:11px;font-weight:700;cursor:pointer;transition:.13s;}
.mb.on{background:var(--acs);border-color:var(--ac);color:var(--ac);}
.refAdd{background:var(--card);border:1px dashed var(--line);color:var(--dim);border-radius:8px;padding:7px 10px;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.refAdd:hover{color:var(--ac);border-color:var(--ac-dim);}
.modelNote{font-size:9px;color:var(--faint);margin:-3px 0 8px;font-family:'SF Mono',Consolas,monospace;}
.refStrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.refStrip:empty{display:none;}
.rfw{display:flex;flex-direction:column;align-items:center;gap:3px;}
.rfn{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.75);color:#fff;font-size:9px;line-height:1;padding:2px 4px;border-top-right-radius:5px;}
.rfRole{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:9px;padding:2px 1px;max-width:66px;}
.rf{position:relative;width:38px;height:38px;border-radius:7px;overflow:hidden;border:1px solid var(--ac-dim);}
.rf img{width:100%;height:100%;object-fit:cover;display:block;}
.rf button{position:absolute;top:0;right:0;background:rgba(0,0,0,.75);color:#fff;border:none;font-size:9px;
  width:14px;height:14px;cursor:pointer;line-height:14px;padding:0;}
.rfT{font-size:9.5px;color:var(--faint);line-height:1.35;flex:1;min-width:110px;}
.btn.cp2{flex:1;}
.btn.go.stop{background:var(--red);color:#fff;}
.slot{margin-bottom:10px;}
.slot:empty{display:none;margin:0;}
.gl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ac);background:var(--acs);
  border:1px solid var(--ac-dim);border-radius:9px;padding:9px 11px;margin-bottom:8px;}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--ac-dim);border-top-color:var(--ac);
  animation:sp .8s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg)}}
.ge{font-size:10.5px;color:var(--red);background:rgba(224,113,107,.1);border:1px solid rgba(224,113,107,.35);
  border-radius:9px;padding:9px 11px;margin-bottom:8px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
.gimg{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.gimg img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;}
.gact{display:flex;gap:5px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.gact button{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;
  padding:5px 8px;font-size:10px;cursor:pointer;}
.gact button:hover{color:var(--ac);border-color:var(--ac-dim);}
.gm{margin-left:auto;font-size:9.5px;color:var(--faint);}
.gth{display:flex;gap:5px;margin-top:6px;overflow-x:auto;}
.gth img{height:42px;border-radius:6px;border:2px solid transparent;cursor:pointer;opacity:.6;}
.gth img.on{border-color:var(--ac);opacity:1;}
.sc .slot{padding:0 11px;}
.sc .slot:not(:empty){padding-top:4px;}
.cp.gn{color:var(--ac);border-color:var(--ac-dim);}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.gi{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:1;}
.gi img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
.gi .gb{position:absolute;left:0;right:0;bottom:0;display:flex;gap:3px;padding:4px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:.12s;}
.gi:hover .gb{opacity:1;}
@media(hover:none){.gi .gb{opacity:1;}}
.gi .gb button{flex:1;background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:5px;
  font-size:10px;padding:4px 0;cursor:pointer;}
.gi .gb button:hover{background:var(--ac);color:#111;}
.gcnt{font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;margin-bottom:8px;}
.gcnt button{background:none;border:none;color:var(--faint);font-size:9.5px;cursor:pointer;text-decoration:underline;}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;
  z-index:50;padding:16px;}
.mdl.show{display:flex;}
.mdlBox{background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:18px;
  width:min(460px,100%);max-height:90vh;overflow:auto;}
.mdlH{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:14px;}
.mx{background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;}
.mdlBox label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);
  font-weight:800;margin:12px 0 5px;}
.mdlBox input,.mdlBox select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;color:var(--tx);font-size:12px;font-family:inherit;}
.mdlBox input:focus,.mdlBox select:focus{outline:none;border-color:var(--ac-dim);}
.kRow{display:flex;gap:6px;}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 11px;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.mini:hover{color:var(--ac);border-color:var(--ac-dim);}
.hint{font-size:10px;color:var(--faint);line-height:1.5;margin-top:5px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mdlF{display:flex;align-items:center;gap:10px;margin-top:16px;}
.mdlF .btn{flex:0 0 auto;padding:10px 20px;margin-left:auto;}
#setMsg{font-size:10.5px;line-height:1.4;flex:1;}
#setMsg.ok{color:var(--ok);} #setMsg.bad{color:var(--red);}
.lbBox{max-width:min(94vw,900px);display:flex;flex-direction:column;align-items:center;gap:10px;}
.lbBox img{max-width:100%;max-height:70vh;border-radius:10px;border:1px solid var(--line);background:#000;}
.lbCap{font-size:10.5px;color:var(--dim);}
.lbP{font-size:10.5px;color:var(--faint);max-height:64px;overflow:auto;line-height:1.5;max-width:100%;}
.lbAct{display:flex;gap:7px;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);color:var(--tx);
  border:1px solid var(--ac-dim);border-radius:9px;padding:9px 14px;font-size:11.5px;z-index:80;
  opacity:0;pointer-events:none;transition:.2s;}
.toast.show{opacity:1;}

@media(max-width:1180px){
  html,body{overflow:auto;}
  .app{height:auto;}
  .main{grid-template-columns:1fr;}
  .colL,.colR{border:none;border-top:1px solid var(--line);}
  .colR{height:auto;}
}

.fl{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 11px;
  font-size:11px;cursor:pointer;font-weight:600;transition:.13s;}
.fl.on{background:var(--acs);border-color:var(--ac);color:var(--ac);}
.rl{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);font-weight:800;}
.rsel{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 8px;
  font-size:11px;font-family:inherit;}
.rsel:focus{outline:none;border-color:var(--ac-dim);}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);color:var(--tx);
  border:1px solid var(--ac-dim);border-radius:9px;padding:9px 14px;font-size:11.5px;z-index:80;
  opacity:0;pointer-events:none;transition:.2s;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">

<div class="top">
  <div class="brand"><div class="ic" id="bIc">📱</div><div><h1 id="bT">NB 2.1 Prompt Studio</h1><div class="sb" id="bS"></div></div></div>
  <div class="topR">
    <button class="fs on" data-f="labeled" title="Nano Banana 2.1 art-direction brief">Brief 2.1</button>
    <button class="fs" data-f="narrative">Narrative</button>
    <button class="fs" data-f="json">JSON</button>
    <button class="fl" id="btnFlow" title="Flow Bridge extension status">⚡ Flow ○</button>
  </div>
</div>

<div class="modeRow"><div class="msw" id="msw"></div></div>

<div class="main">

  <!-- LEFT -->
  <div class="col colL">
    <div class="hd">⭐ Library</div>

const curSize=()=>sizeOk(GS[GS.tier])?GS.size:'1K';
const roleOf=r=>ROLES[r.role]?r.role:(M==='product'?'product':M==='interior'?'location':'identity');
const lowA=s=>s.replace(/^(A|An) /,m=>m.toLowerCase());
const isPeople=()=>M!=='product'&&M!=='interior';
function refSpec(){
  if(!REFS.length)return null;
  const rules=[],keep=[];let identity=false;
  REFS.forEach((r,i)=>{const k=roleOf(r),ro=ROLES[k];
    rules.push(`Reference image ${i+1} ${ro.rule}.`);
    if(ro.keep)keep.push(`Keep ${ro.keep} exactly as in reference image ${i+1}.`);
    if(k==='identity')identity=true;});
  const tail=['Use the written brief for everything else.'];
  if(REFS.length>1)tail.push('Do not mix visual attributes between references.');
  return {rules,keep,tail,identity};
}

/* ================= PROMPT ================= */
function makePrompt(shotId,angTxt,beat){
  const c=C(),v={subject:$('fSubject').value.trim(),outfit:$('fOutfit').value.trim(),
    scene:$('fScene').value.trim(),expr:$('fExpr').value.trim()};
  const story=$('fStory').value.trim().replace(/[.\s]+$/,'');
  const cont=beat?`Frame ${beat.i} of 6 in one continuous story told through a single campaign: the same subject, the same wardrobe, the same location and the same lighting design carry through every frame.`:'';
  const who=v.subject||'the subject';
  const wear=v.outfit?` wearing ${v.outfit}`:'';
  const expr=v.expr||pick(c.VIBE,'vibe');
  const w=pick(c.WHERE,'where'), l=pick(c.LIGHT,'light'), sh=pick(c.SHOT,'shot',shotId);
  const grit=(S.own.grit||'').trim()||S.grit[0]+', and '+S.grit[1];
  const setting=[w,v.scene].filter(Boolean).join(', ');
  const X=k=>{if(!allowedX(k))return'';const s=S[k];if(!s)return'';if(s==='__own')return (S.own[k]||'').trim();
    const o=find(EXTRA[k].o,s);return o?o.txt:'';};
  const air=X('air'),motion=X('motion'),flaws=X('flaws'),era=X('era'),cond=X('cond');
  const dist=X('dist'),obst=X('obst'),lens=X('lens'),grade=X('grade'),scale=X('scale');
  const R=curRatio(),Z=curSize(),RS=refSpec();
  const outLine=`Aspect ratio ${R}.`;
  const notLike=`It must not look like ${c.notLike}.`;

  if(FMT==='narrative'){
    let p=`${c.verb} of ${who}${wear}`;
    if(expr)p+=`, ${expr}`;
    p+='. ';
    if(setting)p+=`${snapish()?'The moment is':'Set'} ${setting}. `;
    if(scale)p+=`Scale: ${scale}. `;
    if(story)p+=`The story behind the frame: ${story}. `;
    if(beat)p+=`This is moment ${beat.i} of 6, ${beat.n}: ${beat.beat} The subject's emotion here: ${beat.mood}. `;
    if(sh)p+=`It is ${sh}. `;
    if(angTxt)p+=`Shot ${angTxt}. `;
    if(dist)p+=`Taken ${dist}. `;
    if(obst)p+=`In the frame: ${obst}. `;
    if(lens)p+=`Cinematography: ${lens}. `;
    if(l)p+=`${snapish()?'Everything is':'The scene is'} ${l}. `;
    if(air)p+=`There is ${air}. `;
    if(motion)p+=`The frame is ${motion}. `;
    if(flaws)p+=`Real detail holds: ${flaws}. `;
    if(era)p+=`It reads as ${era}. `;
    if(cond)p+=`Presented as ${cond}. `;
    if(grade)p+=`Colour: ${grade}. `;
    if(cont)p+=cont+' ';
    if(RS)p+=[...RS.rules,...RS.keep,...RS.tail].join(' ')+' ';
    p+=`${cap(grit)}. `+c.DNA+` ${notLike} ${outLine}`;
    return p;
  }
  if(FMT==='json'){
    const o={deliverable:lowA(c.verb),
      image_type:lowA(c.verb),
      subject:{who,outfit:v.outfit||undefined,expression:expr||undefined,imperfections:flaws||undefined},
      scene:{setting:w||undefined,details:v.scene||undefined,atmosphere:air||undefined,scale:scale||undefined},
      story:(story||beat)?{premise:story||undefined,moment:beat?`${beat.i} of 6 — ${beat.n}`:undefined,direction:beat?beat.beat:undefined,emotion:beat?beat.mood:undefined,continuity:cont||undefined}:undefined,
      framing:sh||undefined,camera_angle:angTxt||undefined,distance:dist||undefined,foreground:obst||undefined,
      lens_and_format:lens||undefined,colour_grade:grade||undefined,lighting:l||undefined,
      shutter_and_motion:motion||undefined,
      era:era||undefined,print_condition:cond||undefined,
      [snapish()?'imperfections':'finish']:((S.own.grit||'').trim()?[S.own.grit]:S.grit),
      capture_characteristics:c.DNAJ,
      reference_rules:RS?[...RS.rules,...RS.tail]:undefined,
      preserve:RS&&RS.keep.length?RS.keep:undefined,
      must_not_look_like:c.notLike,
      output:{aspect_ratio:R}};
    const st=x=>{Object.keys(x).forEach(k=>{if(x[k]===undefined||x[k]==='')delete x[k];
      else if(typeof x[k]==='object'&&!Array.isArray(x[k])){st(x[k]);if(!Object.keys(x[k]).length)delete x[k];}});return x;};
    return JSON.stringify(st(o),null,2);
  }

  // ---- Brief 2.1: labelled art-direction brief (Nano Banana 2.1's native format) ----
  const sec=[];
  const add=(label,lines)=>{const t=lines.filter(Boolean).join('\n');if(t)sec.push(label+'\n'+t);};
  add('DELIVERABLE',[`Create ${lowA(c.verb)}.`]);
  add('SUBJECT',[`${cap(who)}${wear}${expr?', '+expr:''}.`]);
  add('SCENE',[setting?`${cap(setting)}.`:'',scale?`Scale: ${cap(scale)}.`:'']);
  add('STORY',[story?`${cap(story)}.`:'',beat?`Moment ${beat.i} of 6 — ${beat.n}.`:'',beat?beat.beat:'',beat?`Emotion at this moment: ${beat.mood}.`:'',cont]);
  add('COMPOSITION',[sh?`Framing: ${cap(sh)}.`:'',angTxt?`Camera angle: ${cap(angTxt)}.`:'',dist?`Distance: ${cap(dist)}.`:'',obst?`In the frame: ${cap(obst)}.`:'']);
  add('LIGHTING',[l?`${cap(l)}.`:'']);
  add('CAMERA AND CAPTURE',[c.DNA,lens?`Lens and format: ${cap(lens)}.`:'']);
  add('STYLE',[
    air?`Atmosphere: ${cap(air)}.`:'',
    motion?`Motion: ${cap(motion)}.`:'',
    flaws?`Imperfections: ${cap(flaws)}.`:'',
    era?`Era: ${cap(era)}.`:'',
    cond?`Condition: ${cap(cond)}.`:'',
    grade?`Colour grade: ${cap(grade)}.`:'',
    `${c.gritLabel}: ${cap(grit)}.`]);
  if(RS){
    add('REFERENCE RULES',[...RS.rules,...RS.tail]);
    add('PRESERVE',RS.keep);
  }
  add('DO NOT',[
    notLike,
    isPeople()?'Keep anatomy natural, with correct hands and proportions.':'',
    RS&&RS.identity?"Do not blend or alter the subject's identity.":'']);
  add('OUTPUT',[outLine]);
  return sec.join('\n\n');
}
const escH=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtH=t=>t.split('\n').map(x=>escH(x)
  .replace(/^\[([^\]]+)\]/,'<span class="lb">[$1]</span>')
  .replace(/^([A-Z][A-Z ]{2,})$/,'<span class="lb">$1</span>')).join('<br>');

function rowsHTML(keys){

function bindRows(p){

function renderPane(){
  const c=C(),p=$('pane');

     <div class="ownBox ${S[PT]==='__own'?'show':''}"><input id="ownIn" placeholder="✎ describe your own ${PT}…" value="${(S.own[PT]||'').replace(/"/g,'&quot;')}"></div>`;

function items(){
  const c=C();
  if(OUT==='story'&&c.BEATS)return c.BEATS.map((b,i)=>({n:b.n,p:makePrompt(b.shot,null,{...b,i:i+1})}));
  if(OUT==='story')return c.SEQ.map(id=>({n:find(c.SHOT,id).t,p:makePrompt(id,null)}));
  if(OUT==='angles')return c.ANG.map(a=>({n:a.n,p:makePrompt(null,a.txt)}));
  return [{n:'Prompt',p:makePrompt(null,null)}];
}

  const c=C(),body=$('outBody'),J=FMT==='json'?' json':'';

}

const snap=()=>({m:M,f:{subject:$('fSubject').value,outfit:$('fOutfit').value,scene:$('fScene').value,expr:$('fExpr').value,story:$('fStory').value},
  where:S.where,light:S.light,shot:S.shot,vibe:S.vibe,own:{...S.own},grit:[...S.grit],out:OUT,fmt:FMT,
  x:Object.fromEntries(Object.keys(EXTRA).map(k=>[k,S[k]]))});
function load(r){
  M=r.m||'snap';OUT=r.out||'single';FMT=r.fmt||'narrative';
  S.where=r.where;S.light=r.light;S.shot=r.shot;S.vibe=r.vibe;S.own=r.own||{};S.grit=r.grit||[];

const persist=()=>{localStorage.setItem('nb21_fav2',JSON.stringify(FAV));localStorage.setItem('nb21_hist2',JSON.stringify(HIST));};
const ago=ts=>{const d=(Date.now()-ts)/1000;return d<60?'now':d<3600?Math.floor(d/60)+'m':d<86400?Math.floor(d/3600)+'h':Math.floor(d/86400)+'d';};
function renderLibBase(){

  if(!list.length){el.innerHTML=`<div class="emptyL">${libTab==='fav'?'Nothing saved. Hit ⭐ on one you like — it stores the whole recipe.':'Prompts land here when you copy them.'}</div>`;return;}

function sizeOk(){return true;}

/* Flow Bridge extension talks to this page with window.postMessage */
function setBridge(ok){const b=$('btnFlow');b.classList.toggle('on',!!ok);b.textContent=ok?'⚡ Flow ●':'⚡ Flow ○';
  b.title=ok?'Flow Bridge extension detected':'Flow Bridge extension not detected (click to re-check)';}
function pingBridge(){let got=false;
  const h=e=>{if(e.source===window&&e.data&&e.data.nb21==='pong'){got=true;setBridge(true);window.removeEventListener('message',h);}};
  window.addEventListener('message',h);window.postMessage({nb21:'ping'},'*');
  setTimeout(()=>{window.removeEventListener('message',h);if(!got)setBridge(false);},1200);}
function sendFlow(list){
  list=(list||[]).filter(Boolean);
  if(!list.length){toast('Add a subject first');return;}
  let done=false;
  const onAck=e=>{if(e.source!==window||!e.data||e.data.nb21!=='ack')return;
    done=true;window.removeEventListener('message',onAck);
    if(e.data.ok){setBridge(true);toast('⚡ Sent '+(e.data.count||list.length)+' to Flow');}
    else toast(e.data.error||'Flow did not accept the prompt');};
  window.addEventListener('message',onAck);
  window.postMessage({nb21:'send',prompts:list},'*');
  setTimeout(()=>{if(!done){window.removeEventListener('message',onAck);setBridge(false);
    toast('Flow Bridge extension not detected. Enable it, then refresh this page.');}},3000);
}

/* ---- bring over prompts saved in the previous version of this studio ---- */
(function migrate(){
  try{
    if(localStorage.getItem('nb21_migrated'))return;
    const old=JSON.parse(localStorage.getItem('nb21_saved')||'[]');
    if(Array.isArray(old)&&old.length){
      old.slice().reverse().forEach(o=>{if(o&&o.prompt)FAV.unshift({name:String(o.angleLabel||'Saved prompt').slice(0,32),
        p:o.prompt,r:null,ts:Date.parse(o.savedAt)||Date.now()});});
      FAV=FAV.slice(0,50);persist();
    }
    localStorage.setItem('nb21_migrated','1');
  }catch(e){}
})();

pingBridge();
rollGrit();applyMode();renderModes();renderTabs();renderPane();refresh();renderLib();
