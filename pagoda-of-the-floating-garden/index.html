<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// All scenery, particles and light sources are procedural. No asset requests.
const $=id=>document.getElementById(id);
try {
let seed=192804;
function random(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}
const range=(a,b)=>a+(b-a)*random();
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xb5d5d8,.004);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.2,600);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
// Procedural studio illumination gives lacquer, water and gold real reflections.
const environmentScene=new RoomEnvironment(),pmrem=new THREE.PMREMGenerator(renderer);const environmentTarget=pmrem.fromScene(environmentScene,.04);scene.environment=environmentTarget.texture;scene.environmentIntensity=.38;environmentScene.dispose();pmrem.dispose();
document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.045;controls.enablePan=false;controls.minDistance=14;controls.maxDistance=125;controls.minPolarAngle=.28;controls.maxPolarAngle=1.6;controls.autoRotateSpeed=.45;
function resetCamera(){camera.position.set(51,32,58);controls.target.set(0,11,0);controls.update();}
resetCamera();
const hemi=new THREE.HemisphereLight(0xd9efff,0x475043,2.1);scene.add(hemi);
const rim=new THREE.DirectionalLight(0x9ac9d0,.8);rim.position.set(-30,20,-35);scene.add(rim);
const sun=new THREE.DirectionalLight(0xffe4b4,3.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-34,right:34,top:45,bottom:-28,near:1,far:180});sun.shadow.normalBias=.06;sun.shadow.bias=-.00015;sun.target.position.set(0,5,0);scene.add(sun,sun.target);
const moonLight=new THREE.DirectionalLight(0x7daaff,0);scene.add(moonLight);
const renderTarget=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType});renderTarget.samples=4;const composer=new EffectComposer(renderer,renderTarget);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),.28,.45,1.15);composer.addPass(bloom);composer.addPass(new OutputPass());
const finish=new ShaderPass({uniforms:{tDiffuse:{value:null}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float v=dot(vUv-.5,vUv-.5);c*=1.-v*.28;float grain=fract(sin(dot(vUv,vec2(12.9898,78.233)))*43758.5453)-.5;c+=grain*.006;gl_FragColor=vec4(c,1.);}' });composer.addPass(finish);

// Batch thousands of differently colored cubes into a handful of draw calls.
const box=new THREE.BoxGeometry(1,1,1),softBox=new RoundedBoxGeometry(1,1,1,1,.06),matrix=new THREE.Matrix4(),dummy=new THREE.Object3D(),color=new THREE.Color();
const batches={};
function voxel(x,y,z,sx,sy,sz,hex,type='solid',variation=.065,rotation=0){
 if(!batches[type])batches[type]=[];
 color.set(hex).multiplyScalar(1+range(-variation,variation));
 batches[type].push([x,y,z,sx,sy,sz,color.clone(),rotation]);
}
const materials={lacquer:new THREE.MeshPhysicalMaterial({roughness:.36,metalness:.07,clearcoat:.55,clearcoatRoughness:.3}),leaves:new THREE.MeshStandardMaterial({roughness:.93}),stone:new THREE.MeshStandardMaterial({roughness:.95}),solid:new THREE.MeshStandardMaterial({roughness:.91}),roof:new THREE.MeshStandardMaterial({roughness:.47,metalness:.26}),gold:new THREE.MeshStandardMaterial({roughness:.3,metalness:.65}),glow:new THREE.MeshStandardMaterial({color:0xffcd83,emissive:0xff9d35,emissiveIntensity:0,roughness:.8}),water:new THREE.MeshStandardMaterial({color:0x75dadc,roughness:.23,metalness:.28,transparent:true,opacity:.73}),cloud:new THREE.MeshStandardMaterial({roughness:1,transparent:true,opacity:.78})};
const waterTime={value:0};
materials.water.onBeforeCompile=shader=>{
 shader.uniforms.uFlow=waterTime;
 shader.vertexShader='varying vec3 vWater;\n'+shader.vertexShader;
 shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 wp=vec4(position,1.0);\n#ifdef USE_INSTANCING\nwp=instanceMatrix*wp;\n#endif\nvWater=(modelMatrix*wp).xyz;');
 shader.fragmentShader='uniform float uFlow;varying vec3 vWater;\n'+shader.fragmentShader;
 shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\nfloat rip=sin(vWater.x*5.0+uFlow*1.8+sin(vWater.z*4.0-uFlow))*sin(vWater.z*8.0+uFlow*.9);diffuseColor.rgb*=.87+.15*rip;diffuseColor.rgb+=vec3(.12,.18,.16)*pow(max(0.0,rip),12.0);');
};
// Fine procedural grain replaces flat material colors without bitmap textures.
function surfaceGrain(mat,strength,wood=false){
 mat.onBeforeCompile=shader=>{
 shader.vertexShader='varying vec3 vCraft;\n'+shader.vertexShader;
 shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 craft=vec4(position,1.);\n#ifdef USE_INSTANCING\ncraft=instanceMatrix*craft;\n#endif\nvCraft=(modelMatrix*craft).xyz;');
 shader.fragmentShader='varying vec3 vCraft;\n'+shader.fragmentShader;
 const pattern=wood?'sin(vCraft.y*65.+sin(vCraft.x*13.+vCraft.z*11.)*2.)':'sin(vCraft.x*37.+vCraft.z*17.)*sin(vCraft.y*41.-vCraft.z*25.)';
 shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb*=1.+'+strength.toFixed(3)+'*('+pattern+');');
 };
}
surfaceGrain(materials.solid,.025);surfaceGrain(materials.lacquer,.04,true);surfaceGrain(materials.stone,.055);surfaceGrain(materials.roof,.035);
const meshes={};
function flush(){for(const [type,blocks] of Object.entries(batches)){const m=new THREE.InstancedMesh(['roof','gold','stone','lacquer'].includes(type)?softBox:box,materials[type],blocks.length);blocks.forEach((b,i)=>{dummy.position.set(b[0],b[1],b[2]);dummy.scale.set(b[3],b[4],b[5]);dummy.rotation.set(0,b[7]||0,0);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);m.setColorAt(i,b[6]);});m.castShadow=!['water','glow','cloud'].includes(type);m.receiveShadow=type!=='glow';m.computeBoundingSphere();scene.add(m);meshes[type]=m;}}

// Irregular 40 x 40 plateau. Only exposed underground blocks are emitted.
const heights=new Map();
for(let x=-20;x<20;x++)for(let z=-20;z<20;z++){
 const r=Math.hypot(x/20,z/18),edge=1+.045*Math.sin(x*1.8)+.04*Math.cos(z*1.3);
 if(r>edge)continue;
 const depth=Math.max(2,Math.floor(3+16*Math.pow(1-r,.65)+range(-1.2,1.2)));heights.set(x+','+z,depth);
}
const streamZ=x=>9+Math.sin((x+4)*.19)*2;
function isWater(x,z){return Math.abs(z-streamZ(x))<1.5||(Math.hypot((x+9)/1.4,z-9)<3.4);}
for(const [key,depth] of heights){const [x,z]=key.split(',').map(Number);const wet=isWater(x,z);voxel(x,-.5,z,1,1,1,wet?0x636e63:0x6b9658);
 if(wet)voxel(x,.08,z,1,.15,1,0xc9ffff,'water',.03);
 for(let d=1;d<depth;d++){
 const exposed=d===depth-1||[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dz])=>(heights.get((x+dx)+','+(z+dz))||0)<=d);
 if(exposed)voxel(x,-d-.5,z,1,1,1,d<4?0x795644:d<7?0x665c51:0x53616a);
 }
 if(!wet&&random()<.025&&Math.hypot(x,z)>9)voxel(x,.12,z,.9,.24,.9,0x839b65);
}
// Stone approach, broad foundation and patterned courtyard.
for(let z=6;z<18;z++)for(let x=-2;x<=2;x++)if(heights.has(x+','+z))voxel(x,.16,z,.93,.3,.93,0xb1b4a3);
for(let x=-6;x<=6;x++)for(let z=-6;z<=6;z++)voxel(x,.25,z,.98,.5,.98,0x9b9f90);
voxel(0,.7,0,11,.55,11,0x737f78);voxel(0,1.03,0,10.5,.16,10.5,0xc3bfa6);
for(let i=0;i<3;i++)voxel(0,.15+i*.2,6.9-i*.45,4.2,.3,.65,0xb7b6a2);

// Five tapering storeys. Roof skirts follow a quadratic upturned profile.
const red=0xad382f,darkRed=0x702b27,wood=0x533c32,gold=0xdab66b;
for(let tier=0;tier<5;tier++){
 const base=1.15+tier*4.45,half=4.4-tier*.63,wall=half-.65;
 voxel(0,base+1.5,0,wall*2,2.8,wall*2,red,'lacquer');
 voxel(0,base+.1,0,half*2+.6,.25,half*2+.6,wood);
 for(const side of [-1,1])for(let p=-1;p<=1;p++){
  const pos=p*wall*.62;
  // Warm paper panes and dark wooden lattices on all four elevations.
  for(const swap of [false,true]){
   let x=swap?side*(wall+.035):pos,z=swap?pos:side*(wall+.035);
   voxel(x,base+1.55,z,swap?.06:wall*.46,1.48,swap?wall*.46:.06,0xffffff,'glow',0);
   for(let k=-1;k<=1;k++)voxel(x+(swap?0:k*wall*.15),base+1.55,z+(swap?k*wall*.15:0),swap?.1:.065,1.55,swap?.065:.1,wood);
   voxel(x,base+1.53,z,swap?.11:wall*.5,.075,swap?wall*.5:.11,wood);
  }
 }
 for(const x of [-wall,wall])for(const z of [-wall,wall]){voxel(x,base+1.5,z,.35,3.05,.35,darkRed);voxel(x,base+.15,z,.48,.22,.48,gold,'gold');}
 // Cantilevered balcony, balusters and three horizontal rails.
 for(const side of [-1,1])for(const swap of [false,true]){
  voxel(swap?side*half:0,base+.7,swap?0:side*half,swap?.15:2*half,.13,swap?2*half:.15,red);
  voxel(swap?side*half:0,base+.37,swap?0:side*half,swap?.12:2*half,.09,swap?2*half:.12,darkRed);
  for(let p=-half;p<=half+.01;p+=.55)voxel(swap?side*half:p,base+.42,swap?p:side*half,.105,.8,.105,red);
 }
 const extent=half+1.6,step=.26;
 for(let x=-extent;x<=extent;x+=step)for(let z=-extent;z<=extent;z+=step){
  const r=Math.max(Math.abs(x),Math.abs(z))/extent;
  const corner=Math.pow(Math.min(Math.abs(x),Math.abs(z))/extent,5);
  const y=base+3.1+1.35*Math.pow(1-r,1.65)+.86*Math.pow(r,9)+.4*corner;
  voxel(x,y,z,step-.015,.17,step-.015,r>.92?0x455d5d:0x263c40,'roof');
  if(r>.96&&corner>.6)voxel(x,y+.13,z,.28,.1,.28,gold,'gold');
 }
 // Ridge cap and supporting brackets below the eaves.
 voxel(0,base+4.42,0,.27,.2,extent*1.2,0x384a4c,'roof');
 for(const side of [-1,1])for(let p=-wall;p<=wall;p+=.7){voxel(p,base+2.9,side*(wall+.4),.19,.22,.95,red);voxel(side*(wall+.4),base+2.9,p,.95,.22,.19,red);}
}
const top=1.15+4*4.45+4.5;
voxel(0,top+1.55,0,.17,3.2,.17,gold,'gold');
for(let i=0;i<8;i++){const w=.95-i*.085;voxel(0,top+.3+i*.32,0,w,.12,w,gold,'gold');}
voxel(0,top+3.2,0,.28,.5,.28,0xffd78e,'gold');

// Sakura boughs and cubic flower clusters, each seeded identically on load.
function sakura(x,z,white=false,scale=1){
 const h=range(4.5,6.3)*scale;
 for(let y=.25;y<h;y+=.32){const bend=Math.sin(y*.5)*.5;voxel(x+bend,y,z,.48*(1-y/h*.45),.37,.45,0x513c3a);if(y<1.8)voxel(x+bend+.21,y,z,.08,.32,.25,0x79584d);}
 for(let b=0;b<8;b++){
  const a=b*2.399,cx=x+Math.cos(a)*range(1.4,2.8)*scale,cz=z+Math.sin(a)*range(1.4,2.8)*scale,cy=h+range(-1,1.7);
  for(let j=0;j<9;j++){const t=j/9;voxel(x+(cx-x)*t,h-1.5+t*(cy-h+1.5),z+(cz-z)*t,.27,.34,.27,0x64463f);}
  const rad=range(1.3,1.75);
  for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++)for(let dy=-2;dy<=2;dy++){
   const px=dx*.38,pz=dz*.38,py=dy*.35;
   if(px*px+pz*pz+py*py*2>rad*rad||random()<.13)continue;
   const palette=white?[0xf5e8d5,0xe7d5cc,0xffefdd]:[0xe5a2b6,0xf1bdc8,0xd284a2,0xf7d0cf];
   voxel(cx+px,cy+py,cz+pz,.39,.36,.39,palette[Math.floor(random()*palette.length)],'leaves',.035);
  }
 }
 for(let i=0;i<5;i++){const a=i*1.26;for(let j=0;j<4;j++)voxel(x+Math.cos(a)*j*.22,.12,z+Math.sin(a)*j*.22,.35,.21,.35,0x5f493b);}
}
[[-12,-7],[-12,3],[10,4],[13,-7],[-7,-13],[8,14],[-10,13]].forEach(([x,z],i)=>sakura(x,z,i%3===0));
function pine(x,z,h){voxel(x,h/2,z,.5,h,.5,0x614d3a);for(let l=0;l<4;l++){const cy=h*.4+l*h*.16,r=2.2-l*.42;for(let dx=-r;dx<=r;dx+=.65)for(let dz=-r;dz<=r;dz+=.65)if(Math.abs(dx)+Math.abs(dz)<r*1.55)voxel(x+dx,cy,z+dz,.68,.63,.68,l%2?0x38695a:0x214c42,'leaves');}}
[[-15,-3,7],[12,-12,8],[3,-14,7],[-4,-15,8]].forEach(p=>pine(...p));
for(const [gx,gz] of [[15,0],[-14,8],[7,-12]])for(let i=0;i<12;i++){
 const x=gx+range(-1.7,1.7),z=gz+range(-1.5,1.5),h=range(2.5,5.5);
 for(let y=.4;y<h;y+=.75){voxel(x,y,z,.18,.73,.18,0x66804b);voxel(x,y+.34,z,.23,.08,.23,0xa4b86c);if(y>h*.5)voxel(x+range(-.5,.5),y,z,.8,.12,.3,0x4b7945);}
}
// Torii with slightly upturned lintels and hanging paper lanterns.

const cA=new THREE.Color(),cB=new THREE.Color();let time=.64,autoTime=true,autoOrbit=true,showPetals=true,showFlies=true,lastInteraction=-Infinity,dragging=false;

function updateDay(){let k=0;while(k<keys.length-2&&time>keys[k+1].t)k++;const a=keys[k],b=keys[k+1],f=THREE.MathUtils.smoothstep(time,a.t,b.t),light=THREE.MathUtils.lerp(a.light,b.light,f),night=1-THREE.MathUtils.smoothstep(light,.15,.65);
 mixColor(a.top,b.top,f,skyMaterial.uniforms.top.value);mixColor(a.bottom,b.bottom,f,skyMaterial.uniforms.bottom.value);mixColor(a.fog,b.fog,f,scene.fog.color);
 const angle=(time-.25)*Math.PI*2;sun.position.set(Math.cos(angle)*65,Math.sin(angle)*75,25);sun.intensity=Math.max(0,Math.sin(angle))*3.3;sun.color.setHSL(.045+.075*Math.max(0,Math.sin(angle)),.5,.82);sunDisc.position.copy(sun.position).normalize().multiplyScalar(205);sunDisc.lookAt(camera.position);sunDisc.visible=time>.23&&time<.79;
 moonDisc.position.copy(sunDisc.position).negate();moonDisc.lookAt(camera.position);moonDisc.visible=night>.2;moonLight.position.copy(moonDisc.position);moonLight.intensity=night*.65;rim.intensity=.45+night*.3;
 hemi.intensity=.35+light*1.85;hemi.color.set(night>.5?0x849ad3:0xd5eff4);materials.glow.emissiveIntensity=.15+night*3.8;gardenLights.forEach(l=>l.intensity=night*7);bloom.strength=.16+night*.5;

toggle('autoTime',()=>autoTime,v=>autoTime=v);toggle('petals',()=>showPetals,v=>{showPetals=v;petals.mesh.visible=v;});toggle('flies',()=>showFlies,v=>showFlies=v);toggle('orbit',()=>autoOrbit,v=>autoOrbit=v);

function animate(now){requestAnimationFrame(animate);if(document.hidden)return;const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;if(autoTime){time=(time+dt/180)%1;$('time').value=time;}
 if(tourOn&&now>tourNext){const v=views[tourIndex++%views.length];cameraMove={start:now,from:camera.position.clone(),target:controls.target.clone(),to:new THREE.Vector3(...v.p),look:new THREE.Vector3(...v.t),duration:6500};tourNext=now+11000;lastInteraction=now+11000;}

}
