<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Poster Series</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#080a24;color:#f1e6cf;font:14px/1.6 -apple-system,'Helvetica Neue',Arial,sans-serif}
  header{padding:48px 24px 12px;text-align:center}
  h1{font-weight:300;letter-spacing:.34em;text-transform:uppercase;font-size:20px;margin:0 0 8px}
  header p{margin:0;opacity:.6;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;max-width:1100px;margin:28px auto 64px;padding:0 24px}
  a.card{display:block;text-decoration:none;color:inherit;background:#10133a;border:1px solid rgba(241,230,207,.14);transition:transform .25s,border-color .25s}
  a.card:hover{transform:translateY(-4px);border-color:rgba(255,196,112,.6)}
  a.card img{display:block;width:100%;aspect-ratio:473/654;object-fit:cover}
  .meta{padding:12px 14px 14px}
  .meta b{display:block;font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
  .meta span{opacity:.55;font-size:12px}
  .meta em{font-style:normal;font-size:11px;opacity:.7;margin-left:10px}
</style>
</head>
<body>
<header><h1>3D Poster Series</h1><p>Realistic Three.js scenes · drag to look around</p></header>
<main>
  <a class="card" href="dusk-house/"><img src="poster-01.png" alt="Dusk House"><div class="meta"><b>01 · Dusk House</b><span>Glass house, palms, mirror pool</span></div></a>
  <a class="card" href="moonlit-pool/"><img src="poster-02.png" alt="Moonlit Pool"><div class="meta"><b>02 · Moonlit Pool</b><span>Infinity pool, umbrella pine, sea</span></div></a>
</main>
<p style="text-align:center;opacity:.6;font-size:12px;margin:-36px 0 48px"><a href="dusk-house/pixel.html" style="color:#ffc470">01 · pixel-art edition →</a></p>
</body>
</html>
