<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redwood Treehouse — 3D Poster</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#05061a;overflow:hidden;touch-action:none}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{position:fixed;left:18px;bottom:16px;font:11px/1.6 -apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,236,200,.78);text-shadow:0 1px 6px rgba(10,8,50,.7);pointer-events:none}
  #title{position:fixed;left:18px;top:16px;font:12px/1.6 -apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,236,200,.85);text-shadow:0 1px 6px rgba(10,8,50,.7);pointer-events:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<div id="title">Redwood Treehouse</div>
<div id="hud">Drag to look around &nbsp;·&nbsp; Scroll to zoom</div>
<script>
(function(){
"use strict";

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20261123);

/* ---------- renderer ---------- */
const DPR = Math.min(window.devicePixelRatio||1, 2);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05061a, 1);
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);
const IS_GL2 = renderer.capabilities.isWebGL2;
const HALF = IS_GL2 && renderer.extensions.has('EXT_color_buffer_float');
function makeRT(w,h,ms){
  const o={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:HALF?THREE.HalfFloatType:THREE.UnsignedByteType};
  return (IS_GL2&&ms) ? new THREE.WebGLMultisampleRenderTarget(w,h,o) : new THREE.WebGLRenderTarget(w,h,o);
}
let rtR = makeRT(64,64,true);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 6000);
const vcam = new THREE.PerspectiveCamera();

/* ---------- materials ---------- */
const C = function(c){ return new THREE.Color(c).convertSRGBToLinear(); };
const lam = (c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:C(c),roughness:0.85,metalness:0.0},o||{}));
const bas = (c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:C(c)},o||{}));
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w;c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearMipmapLinearFilter; t.anisotropy=8; return t; }
const MAXANI = renderer.capabilities.getMaxAnisotropy();
function tiledMat(color,w,d,tile,line){
  const t=canvasTex(256,256,function(g,W,H){
    g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){ g.fillStyle='rgba('+(200+rng()*55|0)+','+(200+rng()*55|0)+',255,0.18)'; g.fillRect(rng()*W|0,rng()*H|0,8,8); }
    g.fillStyle=line||'rgba(30,20,110,0.55)'; g.fillRect(0,0,W,4); g.fillRect(0,0,4,H);
  });
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(w/tile,d/tile);
  t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; t.anisotropy=MAXANI;
  return lam(color,{map:t});
}

/* ================= POSTER KIT (shared) ================= */
function box(w,h,d,x,y,z,mat,parent){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }
function boxR(x0,x1,y0,y1,z0,z1,mat,parent){ return box(x1-x0,y1-y0,z1-z0,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2,mat,parent); }
function cyl(rt,rb,h,x,y,z,mat,seg,parent){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||12),mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }
function sph(r,x,y,z,mat,sx,sy,sz,parent){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat); m.position.set(x,y,z); m.scale.set(sx||1,sy||1,sz||1); (parent||scene).add(m); return m; }
const tickers=[], palms=[];
const textureMatrix=new THREE.Matrix4();
let CFG=null, water=null, waterMat=null, skyMat=null, sky=null;

const glowTex = canvasTex(64,64,function(g){ const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,255,255,0.45)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); });
glowTex.magFilter=glowTex.minFilter=THREE.LinearFilter;
function glow(x,y,z,sz,color,op){
  const m=new THREE.SpriteMaterial({map:glowTex,color:C(color),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:op==null?1:op,fog:false});
  const sp=new THREE.Sprite(m); sp.position.set(x,y,z); sp.scale.set(sz,sz,1); sp.renderOrder=8; scene.add(sp); return sp;
}
function glowPlane(x,y,z,w,d,color,op){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d), new THREE.MeshBasicMaterial({map:glowTex,color:C(color),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:op,fog:false}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z); m.renderOrder=3; scene.add(m); return m;
}
function glowPts(list,size,op,sizeAtt){ // list of [x,y,z,hex,scale]
  const p=[],c=[],col=new THREE.Color();
  list.forEach(function(a){ p.push(a[0],a[1],a[2]); col.set(a[3]).convertSRGBToLinear(); const k=a[4]==null?1:a[4]; c.push(col.r*k,col.g*k,col.b*k); });
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  const pm=new THREE.Points(g,new THREE.PointsMaterial({map:glowTex,size:size,sizeAttenuation:sizeAtt!==false,vertexColors:true,transparent:true,opacity:op==null?1:op,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  pm.renderOrder=8; pm.frustumCulled=false; scene.add(pm); return pm;
}
function plight(x,y,z,color,int,dist,decay){ const l=new THREE.PointLight(C(color),int,dist,decay==null?1.6:decay); l.position.set(x,y,z); scene.add(l); return l; }

/* ---------- merged geometry batcher (keeps draw calls low) ---------- */
function Merger(){ this.pos=[]; this.nor=[]; this.col=[]; }
Merger.prototype.add=function(geo,mat4,color){
  let g=geo.index?geo.toNonIndexed():geo.clone(); g.applyMatrix4(mat4); if(!g.attributes.normal) g.computeVertexNormals();
  const p=g.attributes.position.array, n=g.attributes.normal.array, c=new THREE.Color(color==null?0xffffff:color).convertSRGBToLinear();
  for(let i=0;i<p.length;i++){ this.pos.push(p[i]); this.nor.push(n[i]); }
  for(let i=0;i<p.length/3;i++) this.col.push(c.r,c.g,c.b);
};
Merger.prototype.mesh=function(mat){
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(this.pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(this.nor,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(this.col,3));
  const m=new THREE.Mesh(g,mat||new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95})); scene.add(m); return m;
};
const _M4=new THREE.Matrix4(), _Q=new THREE.Quaternion(), _E=new THREE.Euler(), _P=new THREE.Vector3(), _S=new THREE.Vector3();
function mtx(x,y,z,rx,ry,rz,sx,sy,sz){ _E.set(rx||0,ry||0,rz||0); _Q.setFromEuler(_E); _P.set(x,y,z); _S.set(sx==null?1:sx,sy==null?1:(sy),sz==null?1:sz); return new THREE.Matrix4().compose(_P,_Q,_S); }

/* ---------- roofs ---------- */
function gableGeo(w,d,h){ // ridge along z, base w wide (x), d long (z), height h, centred on origin base
  const s=new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); g.translate(0,0,-d/2); return g;
}
function pyramidGeo(w,d,h){ const g=new THREE.ConeGeometry(Math.SQRT1_2,1,4,1); g.rotateY(Math.PI/4); g.scale(w,h,d); g.translate(0,h/2,0); return g; }

/* ---------- canvas textures ---------- */
function warmWindowTex(c0,c1,mull,cols,rows){
  return canvasTex(128,128,function(g,w,h){
    const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,c0); gr.addColorStop(1,c1); g.fillStyle=gr; g.fillRect(0,0,w,h);
    const rg=g.createRadialGradient(w*0.5,h*0.55,4,w*0.5,h*0.55,w*0.75); rg.addColorStop(0,'rgba(255,245,200,0.55)'); rg.addColorStop(1,'rgba(255,200,100,0)'); g.fillStyle=rg; g.fillRect(0,0,w,h);
    if(mull){ g.fillStyle=mull; const cw=w/(cols||1), rh=h/(rows||1); for(let i=0;i<=(cols||1);i++) g.fillRect(i*cw-2,0,4,h); for(let j=0;j<=(rows||1);j++) g.fillRect(0,j*rh-2,w,4); }
  });
}
function glowWin(x,y,z,w,h,ry,c0,c1,mull,cols,rows,haze){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:warmWindowTex(c0||'#ffd78a',c1||'#f0a040',mull==null?'rgba(40,20,8,0.9)':mull,cols,rows),fog:false}));
  m.position.set(x,y,z); m.rotation.y=ry||0; scene.add(m);
  if(haze!==0){ const s=Math.max(w,h)*2.6; glow(x+Math.sin(ry||0)*0.15,y,z+Math.cos(ry||0)*0.15,s,0xffb860,haze==null?0.28:haze); }
  return m;
}
const paperTex=canvasTex(64,64,function(g,w,h){ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#ffe3a0'); gr.addColorStop(0.5,'#fff1c4'); gr.addColorStop(1,'#ffd480'); g.fillStyle=gr; g.fillRect(0,0,w,h); g.strokeStyle='rgba(120,50,10,0.35)'; g.lineWidth=1.5; for(let y=6;y<h;y+=8){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); } });
function paperLantern(x,y,z,r,color,hr){ // glowing lantern with additive halo
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),new THREE.MeshBasicMaterial({map:paperTex,color:C(color||0xffffff),fog:false}));
  m.position.set(x,y,z); m.scale.set(1,hr||1.25,1); scene.add(m); glow(x,y,z,r*5,color||0xffb04a,0.5); return m;
}

/* ---------- soft mist sheets ---------- */
const mistTex=canvasTex(256,64,function(g,w,h){ g.clearRect(0,0,w,h); for(let i=0;i<46;i++){ const x=rng()*w,y=h*(0.25+rng()*0.5),r=14+rng()*34; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,0.20)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); } });
function mist(x,y,z,w,h,color,op,ry){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:mistTex,color:C(color),transparent:true,opacity:op,depthWrite:false,fog:false})); m.position.set(x,y,z); m.rotation.y=ry||0; m.renderOrder=4; scene.add(m); return m; }

/* ---------- foliage (leaf cards over dark cores) ---------- */
const leafBlobs=[]; const blobGeo=new THREE.IcosahedronGeometry(1,1);
let foliageMats=[];
function blob(x,y,z,sx,sy,sz,grp,mat){
  const g=blobGeo.clone(); const p=g.attributes.position;
  for(let i=0;i<p.count;i+=3){ const s=0.84+rng()*0.34; for(let k=0;k<3;k++) p.setXYZ(i+k,p.getX(i+k)*s,p.getY(i+k)*s,p.getZ(i+k)*s); }
  g.computeVertexNormals();
  if(!mat) leafBlobs.push({x:x,y:y,z:z,sx:sx,sy:sy,sz:sz,grp:grp||'a'});
  const m=new THREE.Mesh(g,mat||foliageMats[(rng()*foliageMats.length)|0]); m.position.set(x,y,z); m.scale.set(sx,sy,sz); if(!mat) m.scale.multiplyScalar(0.86);
  scene.add(m); return m;
}
const barkTex=canvasTex(16,64,function(g,w,h){ g.fillStyle='#d8d8d8'; g.fillRect(0,0,w,h); for(let i=0;i<44;i++){ const k=130+rng()*100|0; g.fillStyle='rgba('+k+','+k+','+k+',0.5)'; g.fillRect(rng()*w|0,rng()*h|0,1+(rng()*2|0),3+(rng()*9|0)); } });
barkTex.wrapS=barkTex.wrapT=THREE.RepeatWrapping; barkTex.repeat.set(2,6);
function barkMat(hex){ return new THREE.MeshStandardMaterial({color:C(hex),map:barkTex,roughness:1.0}); }
function limb(pts,r0,r1,segs,mat){
  const curve=new THREE.CatmullRomCurve3(pts.map(function(a){return new THREE.Vector3(a[0],a[1],a[2]);}));
  const S=segs||30, g=new THREE.TubeGeometry(curve,S,1,8,false); const pa=g.attributes.position; const N=S+1, R=9;
  for(let i=0;i<N;i++){ const c=curve.getPointAt(i/(N-1)); const r=r0+(r1-r0)*(i/(N-1));
    for(let j=0;j<R;j++){ const idx=i*R+j; _P.set(pa.getX(idx)-c.x,pa.getY(idx)-c.y,pa.getZ(idx)-c.z).multiplyScalar(r); pa.setXYZ(idx,c.x+_P.x,c.y+_P.y,c.z+_P.z); } }
  g.computeVertexNormals(); const m=new THREE.Mesh(g,mat||barkMat(0x3a2c24)); scene.add(m); return m;
}
function buildLeaves(){
  const leafTex=canvasTex(64,64,function(g){ g.clearRect(0,0,64,64); g.fillStyle='#fff'; g.beginPath(); g.moveTo(32,2); g.bezierCurveTo(60,20,56,48,32,62); g.bezierCurveTo(8,48,4,20,32,2); g.fill(); g.strokeStyle='rgba(150,150,150,1)'; g.lineWidth=2; g.beginPath(); g.moveTo(32,6); g.lineTo(32,60); g.stroke(); });
  const groups=CFG.leaf||{a:{h:[0.3,0.4],s:[0.3,0.5],l:[0.03,0.15]}};
  Object.keys(groups).forEach(function(name){
    const L=groups[name], list=leafBlobs.filter(function(b){return b.grp===name;}); if(!list.length) return;
    const mat=new THREE.MeshStandardMaterial({map:leafTex,alphaTest:0.45,side:THREE.DoubleSide,roughness:0.7,metalness:0.0}); mat.userData.noEnv=true;
    const geo=new THREE.PlaneGeometry(L.size||0.2,L.size||0.2), dens=L.dens||170, cap=L.cap||520;
    let total=0; const counts=list.map(function(b){ const n=Math.min(cap,Math.round(dens*(b.sx*b.sy+b.sy*b.sz+b.sx*b.sz))); total+=n; return n; });
    const im=new THREE.InstancedMesh(geo,mat,total);
    const m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), pos=new THREE.Vector3(), sc=new THREE.Vector3(), col=new THREE.Color();
    let i=0;
    list.forEach(function(b,bi){
      for(let k=0;k<counts[bi];k++){
        const u=rng()*2-1, a=rng()*Math.PI*2, r=Math.sqrt(1-u*u), f=0.9+rng()*0.2;
        pos.set(b.x+Math.cos(a)*r*b.sx*f, b.y+u*b.sy*f, b.z+Math.sin(a)*r*b.sz*f);
        e.set(rng()*6.28,rng()*6.28,rng()*6.28); q.setFromEuler(e);
        const s=0.7+rng()*0.9; sc.set(s,s,s); m.compose(pos,q,sc); im.setMatrixAt(i,m);
        col.setHSL(L.h[0]+rng()*(L.h[1]-L.h[0]),L.s[0]+rng()*(L.s[1]-L.s[0]),L.l[0]+rng()*rng()*(L.l[1]-L.l[0])); col.convertSRGBToLinear(); im.setColorAt(i,col); i++;
      }
    });
    im.instanceMatrix.needsUpdate=true; im.instanceColor.needsUpdate=true; im.frustumCulled=false; scene.add(im);
  });
}
function tree(x,z,h,r,grp,trunkHex,y0){ // simple broadleaf tree: trunk + canopy blobs
  y0=y0||0; const lean=(rng()-0.5)*0.6;
  limb([[x,y0-0.3,z],[x+lean*0.3,y0+h*0.35,z],[x+lean,y0+h*0.65,z+lean*0.3],[x+lean*1.4,y0+h*0.9,z]],r*0.14,r*0.05,14,barkMat(trunkHex||0x2a2020));
  const n=Math.round(10+r*5);
  for(let i=0;i<n;i++){ const a=rng()*6.28, rr=Math.sqrt(rng())*r, up=Math.sqrt(Math.max(0,1-(rr/r)*(rr/r)));
    blob(x+lean*1.4+Math.cos(a)*rr, y0+h*0.78+up*r*0.55*rng()+(rng()-0.5)*0.4, z+Math.sin(a)*rr*0.85, r*(0.32+rng()*0.25), r*(0.24+rng()*0.18), r*(0.3+rng()*0.25), grp); }
}
function pineGeo(h,r,tiers){
  const m=new Merger(); tiers=tiers||6;
  for(let i=0;i<tiers;i++){ const t=i/(tiers-1), rr=r*(1-t*0.72)*(0.92+rng()*0.16), hh=h/tiers*1.8, y=h*0.16+t*h*0.78;
    const c=new THREE.ConeGeometry(rr,hh,9,1); m.add(c,mtx(0,y,0,0,rng()*3,0)); }
  m.add(new THREE.CylinderGeometry(r*0.09,r*0.14,h*0.2,6),mtx(0,h*0.08,0)); return m;
}
function forest(list,mat){ // list of [x,z,h,r,colorHex,y0]
  const M=new Merger();
  list.forEach(function(a){
    const h=a[2],r=a[3],tiers=6,col=a[4]==null?0x0c1a22:a[4], y0=a[5]||0;
    for(let i=0;i<tiers;i++){ const t=i/(tiers-1), rr=r*(1-t*0.72)*(0.92+rng()*0.16), hh=h/tiers*1.8, y=y0+h*0.16+t*h*0.78;
      const k=0.75+rng()*0.5; const c=new THREE.Color(col).multiplyScalar(k); if(a[6]&&i>0&&rng()<a[6]) c.set(a[7]||0x8a9cc4).multiplyScalar(0.7+rng()*0.4);
      M.add(new THREE.ConeGeometry(rr,hh,8,1),mtx(a[0],y,a[1],0,rng()*3,0),c.getHex()); }
    M.add(new THREE.CylinderGeometry(r*0.08,r*0.12,h*0.22,5),mtx(a[0],y0+h*0.08,a[1]),0x1a1410);
  });
  return M.mesh(mat);
}
function rockGeo(r){ const g=new THREE.IcosahedronGeometry(r,1); const p=g.attributes.position; for(let i=0;i<p.count;i++){ const s=0.78+((Math.sin(i*12.9898)*43758.5453)%1+1)%1*0.45; p.setXYZ(i,p.getX(i)*s,p.getY(i)*s*0.8,p.getZ(i)*s); } const nn=new THREE.Float32BufferAttribute(p.count*3,3); for(let i=0;i<p.count;i++){ const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i)).normalize(); nn.setXYZ(i,v.x,v.y,v.z); } g.setAttribute('normal',nn); return g; }
function fireflies(n,x0,x1,y0,y1,z0,z1,color,size){
  const base=[],pts=[]; for(let i=0;i<n;i++){ const p=[x0+rng()*(x1-x0),y0+rng()*(y1-y0),z0+rng()*(z1-z0),color||0xd8ff7a,1]; pts.push(p); base.push(p.slice(0,3).concat([rng()*6.28,rng()*6.28])); }
  const pm=glowPts(pts,size||0.5,0.95); const a=pm.geometry.attributes.position;
  tickers.push(function(t){ for(let i=0;i<n;i++){ const b=base[i]; a.setXYZ(i,b[0]+Math.sin(t*0.5+b[3])*1.2,b[1]+Math.sin(t*0.7+b[4])*0.5,b[2]+Math.cos(t*0.4+b[3])*1.2); } a.needsUpdate=true; });
  return pm;
}
/* palms (procedural fronds) */
const palmDark = new THREE.MeshStandardMaterial({color:C(0x0b0e2e), roughness:1.0, side:THREE.DoubleSide}); palmDark.userData.noEnv=true;

function makeCrown(opt,mat){
  const pos=[], v=new THREE.Vector3(), m=new THREE.Matrix4();
  for(let f=0;f<opt.n;f++){
    const yaw=(f/opt.n)*Math.PI*2 + rng()*0.5, len=opt.len*(0.8+rng()*0.4), lift=opt.lift+rng()*0.8, droop=opt.droop+rng()*0.7, N=22; m.makeRotationY(yaw);
    const sp=[]; for(let i=0;i<=N;i++){ const t=i/N; sp.push(new THREE.Vector3(len*t, len*(lift*t*0.55 - droop*t*t*0.75), 0)); }
    const P=function(a){ v.copy(a).applyMatrix4(m); pos.push(v.x,v.y,v.z); };
    for(let i=0;i<N;i++){
      const a=sp[i], b=sp[i+1], tan=b.clone().sub(a).normalize(), t=i/N;
      const w1=a.clone(); w1.z+=0.035; const w2=a.clone(); w2.z-=0.035; P(w1);P(w2);P(b.clone());
      if(i<1) continue;
      const L=opt.leaf*(0.35+0.9*Math.sin(Math.PI*Math.min(1,t*1.08)))*(1-0.3*t);
      [-1,1].forEach(function(s){ const dir=new THREE.Vector3(tan.x*0.55,tan.y*0.55-0.5,s).normalize(); const tip=a.clone().addScaledVector(dir,L); const b2=a.clone().addScaledVector(tan,len/N*0.9); P(a);P(b2);P(tip); });
    }

}
function palm(x,z,H,bx,bz,scale,trunkHex,leafMat,y0){

  box(1.1,2.1,0.1,0,Y0+1.05,-7.55,lam(0x2a1810)); glowWin(0,Y0+1.6,-7.48,0.5,0.5,0,'#ffe9a8','#f4aa44','rgba(40,18,6,0.95)',1,1,0.2);

  paperLantern(-4.2,Y0+3.8,-7.4,0.3,0xffd08a,1.3); paperLantern(4.2,Y0+3.8,-7.4,0.3,0xffd08a,1.3);
  // string lights to the trunks
  (function(){ const L=[]; [[-3.7,Y0+3.2,-7.4,-5.7,Y0+5.6,-7.4],[3.7,Y0+3.2,-7.4,5.8,Y0+6.2,-7.4],[-3.7,Y0+3.2,-7.4,3.7,Y0+3.2,-7.4]].forEach(function(s){ for(let i=0;i<=16;i++){ const t=i/16; L.push([s[0]+(s[3]-s[0])*t,s[1]+(s[4]-s[1])*t-Math.sin(t*Math.PI)*0.8,s[2]+(s[5]-s[2])*t,0xffd890,1.2]); } }); glowPts(L,0.5,0.95); })();
  plight(0,Y0+2.2,-6.0,0xffb458,2.4,16,1.5); plight(-6,Y0+2.4,-6.2,0xffa848,1.0,10,1.6); plight(6,Y0+2.4,-6.2,0xffa848,1.0,10,1.6);
  // spiral stair around the left trunk
  (function(){ const S=new Merger(); const n=44; for(let i=0;i<n;i++){ const t=i/(n-1), a=0.35*Math.PI+t*Math.PI*3.2, rr=3.1, y=0.7+t*(Y0-0.5); S.add(new THREE.BoxGeometry(1.1,0.12,0.5),mtx(-5.7+Math.cos(a)*rr,y,-9.0+Math.sin(a)*rr,0,-a,0),0x4a3020); S.add(new THREE.CylinderGeometry(0.03,0.03,1.0,4),mtx(-5.7+Math.cos(a)*(rr+0.55),y+0.5,-9.0+Math.sin(a)*(rr+0.55)),0x2a1a10); } S.mesh(); })();
  // rope bridge to the pod on the right
  (function(){ const a=new THREE.Vector3(8.0,Y0+0.0,-8.9), b=new THREE.Vector3(12.8,Y0+2.6,-9.4); const P=new Merger(), pts1=[], pts2=[]; const N=16;
    for(let i=0;i<=N;i++){ const t=i/N, x=a.x+(b.x-a.x)*t, y=a.y+(b.y-a.y)*t-Math.sin(t*Math.PI)*0.6, z=a.z+(b.z-a.z)*t; if(i<N) P.add(new THREE.BoxGeometry(0.38,0.07,1.3),mtx(x,y,z,0,0,Math.atan2(b.y-a.y,b.x-a.x)),0x4a3020); pts1.push(new THREE.Vector3(x,y+1.0,z-0.65)); pts2.push(new THREE.Vector3(x,y+1.0,z+0.65)); if(i%2===0){ P.add(new THREE.CylinderGeometry(0.02,0.02,1.0,4),mtx(x,y+0.5,z-0.65),0x2a1a10); P.add(new THREE.CylinderGeometry(0.02,0.02,1.0,4),mtx(x,y+0.5,z+0.65),0x2a1a10); } }
    P.mesh(); const lm=new THREE.LineBasicMaterial({color:C(0x2a1a10)}); scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts1),lm)); scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2),lm));
    boxR(11.8,15.4,b.y-0.3,b.y,-11.0,-7.8,woodD); boxR(12.2,14.8,b.y,b.y+2.1,-10.6,-8.4,wall); const r2=new THREE.Mesh(pyramidGeo(3.5,3.0,1.5),rm); r2.position.set(13.5,b.y+2.1,-9.5); scene.add(r2); glowWin(13.5,b.y+1.1,-8.38,1.0,0.9,0,'#ffe9a8','#f4aa44','rgba(40,18,6,0.95)',2,2,0.3); plight(13.5,b.y+1.2,-7.8,0xffb458,1.2,9,1.6); })();
})();
// light shafts, mist, motes
(function(){ const t=canvasTex(64,256,function(g,w,h){ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(0.25,'rgba(255,255,255,0.8)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); const gh=g.createLinearGradient(0,0,w,0); gh.addColorStop(0,'rgba(0,0,0,1)'); gh.addColorStop(0.5,'rgba(0,0,0,0)'); gh.addColorStop(1,'rgba(0,0,0,1)'); g.globalCompositeOperation='destination-out'; g.fillStyle=gh; g.fillRect(0,0,w,h); });
  [[-14,-22,4],[-7,-26,6],[-1,-30,3],[5,-24,5],[10,-28,4],[16,-22,6]].forEach(function(s,i){ const m=new THREE.Mesh(new THREE.PlaneGeometry(s[2],46),new THREE.MeshBasicMaterial({map:t,color:C(0xffc890),transparent:true,opacity:0.22,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,side:THREE.DoubleSide})); m.position.set(s[0],14,s[1]); m.rotation.z=-0.3; m.renderOrder=3; scene.add(m); tickers.push(function(tm){ m.material.opacity=0.2+0.06*Math.sin(tm*0.3+i*1.7); }); }); })();
mist(0,2.0,-12,160,12,0xd8b0b8,0.22,0); mist(0,3.0,-30,200,16,0xc8a8c0,0.22,0); mist(0,1.0,-6,120,4,0xc8b8c8,0.16,0); mist(0,5.0,-55,260,20,0xd0a8b8,0.2,0);
fireflies(60,-14,14,3,16,-12,-3,0xfff0c0,0.3);

kitFinish();
/* ---------- post-processing ---------- */
const GR=CFG.grade||{};
const finalShader={
  uniforms:{tDiffuse:{value:null},time:{value:0},res:{value:new THREE.Vector2(1,1)},exposure:{value:CFG.exposure||0.9},
    gS:{value:new THREE.Vector3().fromArray(GR.sh||[0.93,0.95,1.10])},gH:{value:new THREE.Vector3().fromArray(GR.hi||[1.05,1.0,0.93])},vig:{value:GR.vig==null?0.38:GR.vig}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:[
    'uniform sampler2D tDiffuse; uniform float time,exposure,vig; uniform vec2 res; uniform vec3 gS,gH; varying vec2 vUv;',
    'float hh(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }',
    'vec3 aces(vec3 x){ const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14; return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0); }',
    'void main(){',
    ' vec2 c=vUv-0.5; float ca=0.0009*dot(c,c)*4.0;',
    ' vec3 col; col.r=texture2D(tDiffuse,vUv+c*ca).r; col.g=texture2D(tDiffuse,vUv).g; col.b=texture2D(tDiffuse,vUv-c*ca).b;',
    ' col*=exposure; col=aces(col);',
    ' float l=dot(col,vec3(0.2126,0.7152,0.0722));',
    ' col=mix(col*gS, col*gH, smoothstep(0.30,0.85,l));',
    ' col=pow(col,vec3(1.0/2.2));',
    ' col*=1.0-vig*smoothstep(0.35,0.95,length(c)*1.25);',
    ' float n=hh(vUv*res+fract(time)*173.0)-0.5;',
    ' col+=n*0.022+(hh(vUv*res*1.37)-0.5)/255.0;',
    ' gl_FragColor=vec4(col,1.0);',
    '}'
  ].join('\n')
};
const composer=new THREE.EffectComposer(renderer, makeRT(64,64,true));
composer.addPass(new THREE.RenderPass(scene,camera));
const B=CFG.bloom||[0.5,0.9,0.75];
const bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(64,64),B[0],B[1],B[2]);
composer.addPass(bloomPass);
const finalPass=new THREE.ShaderPass(finalShader);
composer.addPass(finalPass);
function resize(){
  const w=innerWidth,h=innerHeight, dw=Math.round(w*DPR), dh=Math.round(h*DPR);
  renderer.setSize(w,h); composer.setSize(dw,dh);
  rtR.setSize(Math.round(dw*0.85),Math.round(dh*0.85));
  finalShader.uniforms.res.value.set(dw,dh);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ---------- reflection pass ---------- */
const reflPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0.02);
const NRM=new THREE.Vector3(0,1,0), ORG=new THREE.Vector3();
const _cp=new THREE.Vector3(), _v=new THREE.Vector3(), _l=new THREE.Vector3(), _t=new THREE.Vector3(), _rot=new THREE.Matrix4();
function renderReflection(){
  camera.updateMatrixWorld();
  _cp.setFromMatrixPosition(camera.matrixWorld);
  _rot.extractRotation(camera.matrixWorld);
  _v.copy(ORG).sub(_cp).reflect(NRM).negate().add(ORG);
  vcam.position.copy(_v);
  _l.set(0,0,-1).applyMatrix4(_rot).add(_cp);
  _t.copy(ORG).sub(_l).reflect(NRM).negate().add(ORG);
  vcam.up.set(0,1,0).applyMatrix4(_rot).reflect(NRM);
  vcam.lookAt(_t);
  vcam.near=camera.near; vcam.far=camera.far;
  vcam.updateMatrixWorld();
  vcam.projectionMatrix.copy(camera.projectionMatrix);
  textureMatrix.set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1);
  textureMatrix.multiply(vcam.projectionMatrix);
  textureMatrix.multiply(vcam.matrixWorldInverse);
  water.visible=false;
  renderer.clippingPlanes=[reflPlane];
  renderer.setRenderTarget(rtR); renderer.clear();
  renderer.render(scene,vcam);
  renderer.clippingPlanes=[];
  renderer.setRenderTarget(null);
  water.visible=true;
}

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function frame(){
  const t=clock.getElapsedTime();
  az+=(taz-az)*0.08; el+=(tel-el)*0.08; rad+=(trad-rad)*0.08;
  placeCamera(t);
  waterMat.uniforms.time.value=t; skyMat.uniforms.time.value=t; finalPass.uniforms.time.value=t;
  palms.forEach(function(p){ p.g.rotation.z=Math.sin(t*0.7+p.ph)*0.035; p.g.rotation.x=Math.sin(t*0.5+p.ph*1.7)*0.03; p.g.rotation.y=Math.sin(t*0.3+p.ph)*0.06; });
  sky.position.copy(camera.position);
  tickers.forEach(function(f){ f(t); });
  renderReflection();
  if(location.hash.indexOf('nopost')>=0){ renderer.setRenderTarget(null); renderer.render(scene,camera); } else composer.render();
  requestAnimationFrame(frame);
}
window.__ready = true;
frame();
})();
