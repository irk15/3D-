<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><meta name="description" content="Walk or teleport through a luxury Toronto penthouse in WebXR on Meta Quest, with a living skyline of 1,500 cars, planes, a helicopter, boats and spatial sound."><link rel="icon" href="data:,">
<title>Skyline Penthouse VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL view with a thin HUD ring (brand top-left, actions top-right, time dock bottom). */
:root{
  --ink:#f4efe6; --ink-dim:#b9b2a6; --glass:rgba(14,16,22,.52); --glass-line:rgba(244,239,230,.16);
  --accent:#ffb866; --bg:#05070d;
  --f-display:'Syne','Outfit',system-ui,sans-serif; --f-body:'Outfit',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#c.drag{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.hud>*{pointer-events:auto}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.row>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 14px rgba(0,0,0,.55);min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,2.4vw,24px);letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,.chip{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--glass-line);
  padding:10px 13px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .15s,border-color .15s,color .15s}
button:hover{background:rgba(40,44,56,.7)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{color:#1a1208;background:var(--accent);border-color:var(--accent)}
.dock{align-self:center;display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(640px,100%);padding:12px 14px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dock-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.clock{font:500 22px/1 var(--f-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.phase{font:400 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:22px;background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 11px;font-size:11px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 168px);font:400 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--ink);background:var(--glass);border:1px solid var(--glass-line);padding:9px 14px;border-radius:12px;text-align:center;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .8s}
.hint.off{opacity:0}
.stick{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 190px);width:104px;height:104px;border-radius:50%;background:rgba(14,16,22,.35);border:1px solid var(--glass-line);display:none;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(244,239,230,.5)}
@media (pointer:coarse){.stick{display:block}.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 300px)}}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font:500 13px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);transition:opacity .9s;z-index:5}
.loading.done{opacity:0;pointer-events:none}
.loading div{display:flex;flex-direction:column;gap:12px;align-items:center}
.loading em{display:block;width:180px;height:2px;background:var(--glass-line);overflow:hidden;border-radius:2px}
.loading em::after{content:"";display:block;height:100%;width:40%;background:var(--accent);animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.fail{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font:400 15px/1.5 var(--f-body);color:var(--ink);background:var(--bg);z-index:6}
@media (prefers-reduced-motion:reduce){.loading em::after{animation:none}}
@media (max-width:520px){.actions button{padding:9px 11px;font-size:11px}.clock{font-size:19px}}
.vrbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 66px);z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.vrbtn{background:var(--accent);color:#1a1208;border-color:var(--accent);font-size:13px;padding:12px 22px}
.vrbtn:hover{background:#ffc784}
.vrbtn:disabled{opacity:.6;cursor:not-allowed;background:var(--glass);color:var(--ink-dim);border-color:var(--glass-line)}
.vrq{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line)}
.vrq button{border:0;background:transparent;padding:9px 12px;font-size:11px;-webkit-backdrop-filter:none;backdrop-filter:none}
.vrq button[aria-pressed="true"]{background:var(--accent);color:#1a1208}
.vrnote{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 118px);z-index:3;max-width:min(430px,calc(100% - 32px));text-align:left;font:400 11px/1.5 var(--f-mono);letter-spacing:.05em;color:var(--ink);padding:8px 12px;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:none}
</style>
</head><body>
<canvas id="c" aria-label="First-person view inside a luxury penthouse looking over the Toronto skyline"></canvas>
<div class="hud">
  <div class="row">
    <div class="brand"><b>Skyline Penthouse</b><span>Toronto &middot; floor 54 &middot; 176 m</span></div>
    <div class="actions">
      <button id="bTour" aria-pressed="false">Tour</button>
      <button id="bLights" aria-pressed="true">Lights</button>
      <button id="bWalls" aria-pressed="false">Walls</button>
      <button id="bPlay" aria-pressed="false">Run clock</button>
      <button id="bQ" aria-pressed="false">Performance</button>
    </div>
  </div>
  <div class="dock">
    <div class="dock-top"><span class="clock" id="clock">18:35</span><span class="phase" id="phase">Blue hour</span></div>
    <input id="time" type="range" min="0" max="24" step="0.01" value="18.58" aria-label="Time of day">
    <div class="chips" id="chips">
      <button data-t="7.6">Sunrise</button><button data-t="13">Midday</button><button data-t="17.6">Golden hour</button><button data-t="18.58">Blue hour</button><button data-t="22.3">Night</button><button data-t="3.2">Deep night</button>
    </div>
  </div>
</div>
<div class="hint" id="hint">Drag to look &middot; W A S D to walk &middot; scroll to zoom &middot; walk out through the glass door to the terrace</div>
<div class="stick" id="stick" aria-hidden="true"><i id="knob"></i></div>
<div class="loading" id="loading"><div>Building the city<em></em></div></div>
<div class="fail" id="fail"><div>This view needs WebGL 2, which this browser or device did not provide.<br>Try a recent desktop browser.</div></div>
<div class="vrbar" id="vrbar">
  <button id="bVR" class="vrbtn" disabled>Checking VR&hellip;</button>
  <div class="vrq" id="vrq" role="group" aria-label="VR quality"><button data-q="fast" aria-pressed="false">Fast</button><button data-q="balanced" aria-pressed="true">Balanced</button><button data-q="sharp" aria-pressed="false">Sharp</button></div>
  <button id="bSound" aria-pressed="false">Sound</button>
</div>
<div class="vrnote" id="vrnote"></div>
<div style="position:fixed;left:16px;bottom:8px;z-index:5;font:11px ui-monospace,monospace;color:#ffd27e;opacity:.8">build: vault v7</div>

<script src="vendor/three.bundle.js"></script>
<script>
(function(){ 'use strict';
const VR_BUILD = true, ROOM_BUILD = true;
/* ================= CORE ================= */
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261018);
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise2(x, y) { const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1); return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy; }
function fbm2(x, y, o) { o = o || 4; let s = 0, a = .5; for (let i = 0; i < o; i++) { s += a * vnoise2(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 9.7; a *= .5; } return s; }
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

const GROUND = 176;              // street level sits this far below the penthouse floor (m)
const canvas = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: VR_BUILD, stencil: false, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('webgl2');
} catch (e) { $('fail').style.display = 'grid'; $('loading').style.display = 'none'; throw e; }
let DPR = Math.min(window.devicePixelRatio || 1, 1.25);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const hdrOK = renderer.extensions.has('EXT_color_buffer_float');
if (VR_BUILD) { renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local-floor'); }
if (!hdrOK) { renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; }

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x101420, 0.00036);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 14000);
camera.rotation.order = 'YXZ';
const rig3 = new THREE.Group(); rig3.name = 'rig'; scene.add(rig3); rig3.add(camera);   // dolly: moved by VR locomotion, identity on desktop

/* shared uniforms for every custom shader */
const U = {
  uTime: { value: 0 }, uLDir: { value: new THREE.Vector3(0, 1, 0) }, uLCol: { value: new THREE.Color() },
  uAmbSky: { value: new THREE.Color() }, uAmbGround: { value: new THREE.Color() },
  uSkyH: { value: new THREE.Color() }, uSkyZ: { value: new THREE.Color() },
  uNight: { value: 1 }, uFogCol: { value: new THREE.Color() }, uFogDens: { value: 0.00036 },
  uSunDir: { value: new THREE.Vector3(1, 0, 0) }, uMoonDir: { value: new THREE.Vector3(-1, 1, 0).normalize() },
  uGlow: { value: new THREE.Color() }, uGlowAmt: { value: 1 }, uStars: { value: 0 }, uMoonVis: { value: 0 },
  uCloudCol: { value: new THREE.Color() }, uCloudCover: { value: 0.5 }, uCityGlow: { value: new THREE.Color() }, uLite: { value: 0 }
};

/* ============== SHADER CHUNKS ============== */
const GLSL_COMMON = `
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float h31(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x), mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }
`;
const GLSL_END = `
#include <tonemapping_fragment>
#include <encodings_fragment>
`;

/* ============== SKY ============== */
const skyMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `precision highp float;
uniform vec3 uSunDir,uMoonDir,uSkyZ,uSkyH,uGlow,uCloudCol,uCityGlow; uniform float uGlowAmt,uStars,uTime,uCloudCover,uMoonVis,uNight,uLite;
varying vec3 vDir;` + GLSL_COMMON + `
void main(){
  vec3 d = normalize(vDir);
  float y = d.y, up = max(y,0.);
  vec3 col = mix(uSkyH, uSkyZ, 1.-exp(-up*3.0));
  if (y<0.) col = uSkyH*mix(1.,.75,clamp(-y*8.,0.,1.));
  float sd = max(dot(d,uSunDir),0.);
  float az = max(dot(normalize(d.xz+1e-5), normalize(uSunDir.xz+1e-5)),0.);
  col += uGlow*uGlowAmt*(pow(sd,6.)*.22 + pow(sd,40.)*.8 + pow(az,4.)*exp(-up*6.5)*.6);
  col += uGlow*28.*smoothstep(.99962,.99984,sd)*step(-0.02,uSunDir.y);
  float md = dot(d,uMoonDir);
  vec3 mx = normalize(cross(vec3(0.,1.,0.), uMoonDir)); vec3 my = cross(uMoonDir, mx);
  vec2 mp = vec2(dot(d,mx), dot(d,my))/.0205; float mr = length(mp);
  float moonDisc = 0.;
  if (mr<1. && md>0.){
    float zz = sqrt(1.-mr*mr); vec3 sl = normalize(vec3(dot(uSunDir,mx),dot(uSunDir,my),dot(uSunDir,uMoonDir)));
    float ph = smoothstep(-.05,.12,dot(vec3(mp,zz),sl));
    float tx = .62+.5*fbm(mp*2.6+4.)+.15*fbm(mp*9.);
    moonDisc = (ph*tx*3.4+.05)*smoothstep(1.,.94,mr);
  }
  col += vec3(.85,.91,1.)*(moonDisc + pow(max(md,0.),500.)*.35 + pow(max(md,0.),50.)*.04)*uMoonVis;
  if (y>0. && uStars>.01){
    vec3 sp=d*170.; vec3 id=floor(sp); vec3 f=fract(sp)-.5;
    float r=h31(id); vec3 j=vec3(h31(id+1.7),h31(id+3.1),h31(id+5.3))-.5;
    float st=smoothstep(.2,.0,length(f-j*.55))*step(.985,r)*(.35+.65*h31(id+9.));
    st*=.75+.25*sin(uTime*2.5+r*60.);
    col += vec3(.9,.95,1.)*st*uStars*smoothstep(.02,.3,y)*3.;
  }
  if (y>.012){
    vec2 cp = d.xz/(y+.12)*.9 + vec2(uTime*.004,uTime*.0016);
    float c = fbm(cp*1.3);
    float c2 = uLite>.5 ? c-.02 : fbm(cp*1.3 + uSunDir.xz*.07);
    float cov = smoothstep(1.-uCloudCover, 1.-uCloudCover+.26, c) * smoothstep(.012,.18,y);
    float lit = clamp(.62+(c-c2)*5.,.3,1.2);
    vec3 cc = uCloudCol*lit + uGlow*uGlowAmt*.5*pow(sd,3.);
    col = mix(col, cc, cov*.9);
  }
  col += uCityGlow*exp(-up*9.)*smoothstep(-.1,.9,-d.z)*(.45+.55*exp(-pow((d.x-.2)*2.4,2.)));
  gl_FragColor = vec4(col,1.);
` + GLSL_END + `}`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 48, 28), skyMat);
sky.frustumCulled = false; sky.renderOrder = VR_BUILD ? 50 : -10;
scene.add(sky);

/* ============== CITY GRID ============== */
const OX = 60, OZ = 45, CX = 120, CZ = 90;
const BI0 = -20, BI1 = 19, BJ0 = -21, BJ1 = 1;           // inclusive block index ranges
const hwX = i => (Math.abs(i) % 4 === 0) ? 12 : 7;        // half road width, roads that run along z
const hwZ = j => (Math.abs(j) % 5 === 0) ? 14 : 7;        // half road width, roads that run along x
const CN_POS = new THREE.Vector3(360, -GROUND, -1170);
const RC_POS = new THREE.Vector3(360, -GROUND, -1350);
const RESERVED = { '-1,-1': 'tower', '2,-14': 'cn', '2,-15': 'park', '2,-16': 'rc' };
const nbx = BI1 - BI0 + 1, nbz = BJ1 - BJ0 + 1;
const blockTex = new Uint8Array(nbx * nbz * 4);
const insts = [];       // {x,y,z,sx,sy,sz,seed,type,tint,crown}
const beaconList = [];  // tall tower tops

function pickHeight(cx, cz, r) {
  const dc = Math.hypot((cx - 150) / 650, (cz + 1000) / 430), core = Math.exp(-dc * dc * 1.1);
  const dm = Math.hypot(cx / 520, (cz + 60) / 300), mid = Math.exp(-dm * dm);
  const base = 8 + r() * 16;
  let h;
  if (r() < 0.14 + 0.72 * core + 0.22 * mid) h = base + 30 + r() * (60 + 250 * core + 90 * mid);
  else h = base + r() * 24 * (1 + core);
  if (cz > -260 && Math.abs(cx) < 420) h = Math.min(h, 62 + 20 * r());
  else if (cz > -520 && Math.abs(cx) < 300) h = Math.min(h, 125);
  return Math.min(h, 308);
}
function pickType(h, r) {
  const q = r();
  if (h > 180) return q < .5 ? 0 : q < .75 ? 3 : q < .87 ? 4 : 1;
  if (h > 60) return q < .45 ? 1 : q < .8 ? 0 : q < .9 ? 2 : 5;
  return q < .4 ? 2 : q < .7 ? 5 : 1;
}
function addInst(x, yBase, z, sx, sy, sz, seed, type, tint, crown) {
  insts.push({ x, y: yBase + sy / 2, z, sx, sy, sz, seed, type, tint, crown });
}
(function buildCity() {
  const r = mulberry32(777);
  for (let bi = BI0; bi <= BI1; bi++) for (let bj = BJ0; bj <= BJ1; bj++) {
    const ti = ((bj - BJ0) * nbx + (bi - BI0)) * 4;
    const key = bi + ',' + bj, res = RESERVED[key];
    const park = res ? (res === 'park' || res === 'tower') : r() < 0.1;
    blockTex[ti] = park ? 255 : 0; blockTex[ti + 1] = Math.floor(r() * 255); blockTex[ti + 2] = 0; blockTex[ti + 3] = 255;
    if (park || res) continue;
    const x0 = bi * CX + OX + hwX(bi) + 4.3, x1 = (bi + 1) * CX + OX - hwX(bi + 1) - 4.3;
    const z0 = bj * CZ + OZ + hwZ(bj) + 4.3, z1 = (bj + 1) * CZ + OZ - hwZ(bj + 1) - 4.3;
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const nLots = 1 + Math.floor(r() * 3), lotW = (x1 - x0) / nLots, lotD = z1 - z0;
    for (let l = 0; l < nLots; l++) {
      const lx = x0 + lotW * (l + .5);
      const h = pickHeight(lx, cz, r), type = pickType(h, r), seed = r() * 100, tint = r();
      let w = lotW * (.78 + r() * .2), d = lotD * (.62 + r() * .3);
      const bx = lx + (r() - .5) * (lotW - w) * .6, bz = cz + (r() - .5) * (lotD - d) * .6;
      const gy = -GROUND;
      if (h > 140) {
        const podH = 10 + r() * 18, tw = Math.min(w * .8, 30 + r() * 18), td = Math.min(d * .8, 30 + r() * 16);
        addInst(bx, gy, bz, w, podH, d, seed + 3, 2, tint, 0);
        const th = h - podH;
        addInst(bx, gy + podH, bz, tw, th, td, seed, type, tint, 0);
        let top = h;
        if (r() < .6) { const ch = th * (.05 + r() * .08); addInst(bx, gy + h, bz, tw * .7, ch, td * .7, seed + 9, type, tint, h > 190 && r() < .6 ? 1 : 0); top += ch; }
        if (top > 110) beaconList.push(bx, gy + top, bz);
      } else {
        addInst(bx, gy, bz, w, h, d, seed, type, tint, 0);
        if (h > 45 && r() < .5) { const ch = 4 + r() * 10; addInst(bx, gy + h, bz, w * .6, ch, d * .6, seed + 5, type, tint, 0); }
        if (h > 110) beaconList.push(bx, gy + h, bz);
      }
    }
  }
  // rooftop furniture: mechanical boxes, elevator cores, tanks and masts (type 6), own RNG so the city layout never shifts
  const rr = mulberry32(4242), base = insts.length;
  const tops = [];
