<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sofa On The Tracks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed paper-white stage, a pixel-art diorama centred on it, a small control pill under it.
   Single look by design: the diorama needs the white page of a cut-out, so both themes share it. */
:root{
  --paper:#ffffff;
  --ink:#1f2745;
  --ink-soft:#6f82a8;
  --pill:#f1f4f9;
  --pill-line:#d6e0ee;
  --accent:#e23a3a;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{overflow:hidden;font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;box-sizing:border-box}
#stage{position:fixed;inset:0;background:var(--paper)}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#ui{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;
  background:var(--pill);border:1px solid var(--pill-line);border-radius:999px;
  opacity:.55;transition:opacity .2s}
#ui:hover,#ui:focus-within{opacity:1}
#ui button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:10px}
#ui button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#ui input{width:min(46vw,260px);accent-color:var(--ink)}
#ui output{min-width:5.2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
#err{position:fixed;inset:auto 16px 56px 16px;color:#b02530;font:12px monospace;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){#ui{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Pixel-art diorama: two movers carry a red sofa across streetcar tracks in the snow"></canvas></div>
<div id="ui" role="group" aria-label="Playback">
  <button id="pp" type="button" aria-label="Pause">❚❚</button>
  <input id="seek" type="range" min="0" max="36" step="0.01" value="0" aria-label="Time">
  <output id="tl">0.0 s</output>
</div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
try{

const TAU=Math.PI*2;

/* ---------- palette: 64 entries, every material samples one ---------- */
const P={
 ink0:'#0b0f1c',ink1:'#151b30',ink2:'#1f2745',ink3:'#2c3659',ink4:'#3b4870',ink5:'#51618a',ink6:'#6f82a8',ink7:'#93a6c8',ink8:'#b8c8e0',ink9:'#d6e0ee',snow:'#eef3f9',white:'#ffffff',
 g0:'#23262e',g1:'#353a45',g2:'#4a505c',g3:'#646b78',g4:'#838a96',g5:'#a5abb5',
 l0:'#fff3b8',l1:'#ffe27a',l2:'#ffc43d',l3:'#f59e1c',l4:'#c9710f',l5:'#8f4a12',

 t0:'#b5fff1',t1:'#4fe3d0',t2:'#1fb3a8',t3:'#137a80',t4:'#0d4a56',t5:'#072a35',
 p0:'#ffc2ea',p1:'#ff7ad1',p2:'#e0409f',p3:'#962a78',
 b0:'#7fb2ff',b1:'#3d7be0',b2:'#2a52b0',b3:'#1d3380',
 s0:'#ffe0c9',s1:'#f2bf9a',s2:'#d99a72',s3:'#b07350',s4:'#7e4c34',s5:'#54301f',
 w0:'#d9a86b',w1:'#a97a45',w2:'#7b5230',w3:'#4f321e',
 n0:'#c8f060',n1:'#8cc63f',n2:'#4e9a35',n3:'#2d6a33',n4:'#163f2b',
 o0:'#ff8a1f',u0:'#7b6aa8',u1:'#3a2f55',u2:'#c9c0d8',y0:'#ffd34d'

/* ---------- renderer, camera, post ---------- */

const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,preserveDrawingBuffer:true});
renderer.setClearColor(0xffffff,0);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(20.5,1,4,400);
const SLAB={w:24,d:15,h:0.42};const ZC=-0.5;
const clipPlanes=[
 new THREE.Plane(new THREE.Vector3(1,0,0),SLAB.w/2+0.001),new THREE.Plane(new THREE.Vector3(-1,0,0),SLAB.w/2+0.001),
 new THREE.Plane(new THREE.Vector3(0,0,1),8.001),new THREE.Plane(new THREE.Vector3(0,0,-1),7.001)];

let rt=null,postMat,postScene,postCam;
const palVec=PAL.map(h=>{const c=new THREE.Color(h);return new THREE.Vector3(c.r,c.g,c.b)});

 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`
 precision highp float;varying vec2 vUv;uniform sampler2D tD;uniform vec2 res;uniform vec3 pal[64];uniform float fade;uniform vec3 paper;uniform vec3 ink;
 float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
 float bayer4(vec2 p){vec2 q=mod(floor(p),4.);float a=mod(q.x,2.),b=floor(q.x/2.),c=mod(q.y,2.),d=floor(q.y/2.);
   return (abs(a-c)*8.+c*4.+abs(b-d)*2.+d)/16.;}
 void main(){
  vec2 px=1./res;vec4 c=texture2D(tD,vUv);
  vec2 fp=floor(vUv*res);
  float rnd=fract(sin(dot(fp,vec2(12.9898,78.233)))*43758.5453);
  if(rnd<fade){gl_FragColor=vec4(paper,1.);return;}
  if(c.a<.5){gl_FragColor=vec4(paper,1.);return;}
  if(c.a<.9){gl_FragColor=vec4(1.,1.,1.,1.);return;}
  vec4 n1=texture2D(tD,vUv+vec2(px.x,0.)),n2=texture2D(tD,vUv-vec2(px.x,0.)),n3=texture2D(tD,vUv+vec2(0.,px.y)),n4=texture2D(tD,vUv-vec2(0.,px.y));
  float l=lum(c.rgb);
  float e=max(max(abs(lum(n1.rgb)-l)*step(.9,n1.a),abs(lum(n2.rgb)-l)*step(.9,n2.a)),max(abs(lum(n3.rgb)-l)*step(.9,n3.a),abs(lum(n4.rgb)-l)*step(.9,n4.a)));
  float rim=min(min(n1.a,n2.a),min(n3.a,n4.a));
  float inkA=smoothstep(.10,.26,e)*.62*step(.5,rim);
  float gate=smoothstep(.0,.05,e)*(1.-smoothstep(.05,.2,e));
  vec3 col=pow(c.rgb,vec3(.92));
  float dth=(bayer4(fp)-.5);
  col+=dth*(.012+.05*gate);
  col=mix(col,ink,inkA);
  float bd=1e9,sd=1e9;vec3 bc=vec3(0.),sc=vec3(0.);
  for(int i=0;i<64;i++){vec3 d=col-pal[i];float dd=dot(d,d*vec3(1.,1.15,.9));
    if(dd<bd){sd=bd;sc=bc;bd=dd;bc=pal[i];}else if(dd<sd){sd=dd;sc=pal[i];}}
  vec3 o=bc;if(sd-bd<.0005&&lum(sc)>lum(bc))o=sc;
  gl_FragColor=vec4(o,1.);
 }`,depthTest:false,depthWrite:false});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

let CSSW=1,CSSH=1;
const fitPts=[];
for(const x of[-12,12])for(const z of[-8,7])for(const y of[-0.42,0])fitPts.push(new THREE.Vector3(x,y,z));

 camera.position.set(TARGET.x+D*Math.sin(az)*Math.cos(el),TARGET.y+D*Math.sin(el),TARGET.z+D*Math.cos(az)*Math.cos(el));
 camera.lookAt(TARGET);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();
}
function fitCamera(){
 const fx=.95,fy=.90;TARGET.y=1.4;let hi=100;
 for(let it=0;it<4;it++){
  let lo=20;hi=400;
  for(let k=0;k<40;k++){const mid=(lo+hi)/2;placeCamera(mid);let mx=0,mn=0,my=-9,yn=9;
   for(const p of fitPts){const v=p.clone().project(camera);mx=Math.max(mx,Math.abs(v.x));my=Math.max(my,v.y);yn=Math.min(yn,v.y);}
   if(mx<=fx&&my<=fy&&yn>=-fy)hi=mid;else lo=mid;}

  for(const p of fitPts){const v=p.clone().project(camera);my=Math.max(my,v.y);yn=Math.min(yn,v.y);}
  const c=(my+yn)/2;TARGET.y+=c*hi*Math.tan(20.5*Math.PI/360)/Math.cos(33*Math.PI/180);
 }
 placeCamera(hi);
}
function resize(){
 CSSW=Math.max(2,window.innerWidth);CSSH=Math.max(2,window.innerHeight);
 const dpr=Math.min(window.devicePixelRatio||1,2);
 renderer.setPixelRatio(1);renderer.setSize(Math.round(CSSW*dpr),Math.round(CSSH*dpr),false);
 const bw=clamp(Math.round(CSSW/1.5),380,960);const bh=Math.round(bw*CSSH/CSSW);
 if(rt)rt.dispose();
 rt=new THREE.WebGLRenderTarget(bw,bh,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,depthBuffer:true});
 postMat.uniforms.res.value.set(bw,bh);
 camera.aspect=CSSW/CSSH;camera.updateProjectionMatrix();fitCamera();
}

function CYL(rt,rb,h,m,x,y,z,par,seg){const g=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||10),m);g.position.set(x||0,y||0,z||0);g.castShadow=true;g.receiveShadow=true;if(par)par.add(g);return g}

function radialTex(){return ctex(64,64,(x,w,h)=>{const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.55,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h)})}

B(24,0.42,15,mat(P.ink3),0,-0.21,-0.5,world,true);

for(let i=0;i<26;i++){B(0.08,0.04,2.3,mat(P.g3),-11.5+i*0.92,0.012,1.2,world,true)}

for(let i=0;i<30;i++){const x=-11.5+hsh(i*3.1)*23,z=-1.0+hsh(i*7.7)*6.2;

const params=new URLSearchParams(location.search);

}
let last=performance.now();
function frame(now){

 draw(tNow);requestAnimationFrame(frame);
}
