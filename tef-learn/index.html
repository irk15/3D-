    {t:'p',lv:2,fr:'Toutes les marques sont disponibles, donc tu ne perds rien.',en:'All brands are available, so you lose nothing.',ex:'Toutes les marques sont disponibles, donc tu ne perds rien en qualité.',exE:'All brands are available, so you lose nothing in quality.'},
    {t:'p',lv:2,fr:'Un chat, c\'est de la compagnie sans trop de contraintes.',en:'A cat is company without too many constraints.',ex:'Un chat, c\'est de la compagnie sans trop de contraintes, surtout en appartement.',exE:'A cat is company without too many constraints, especially in an apartment.'},
    {t:'p',lv:2,fr:'Beaucoup de gens le font déjà et en sont très contents.',en:'Many people already do it and are very happy.',ex:'Beaucoup de gens le font déjà et en sont très contents.',exE:'Many people already do it and are very happy.'},
    {t:'p',lv:3,fr:'À long terme, ça pourrait même devenir …',en:'In the long run, it could even become …',ex:'À long terme, ça pourrait même devenir ton activité principale.',exE:'In the long run, it could even become your main activity.'},
    {t:'p',lv:3,fr:'Je ne dis pas que c\'est facile, mais ça en vaut la peine.',en:'I\'m not saying it\'s easy, but it\'s worth it.',ex:'Je ne dis pas que c\'est facile, mais ça en vaut vraiment la peine.',exE:'I\'m not saying it\'s easy, but it\'s really worth it.'},
   ]},
  {id:'eoB_aventure',fr:'Aventure & sport',en:'Adventure & sports persuasion',c:'#7B5BD6',l:false,items:[
    {t:'p',lv:2,fr:'Ce type d\'activité va vraiment faire monter l\'adrénaline !',en:'This type of activity will really get the adrenaline pumping!',ex:'Ce saut en chute libre va vraiment faire monter l\'adrénaline, tu verras !',exE:'This freefall jump will really get the adrenaline pumping, you\'ll see!'},
    {t:'p',lv:2,fr:'C\'est encadré par des professionnels, donc tu seras en sécurité à tout moment.',en:'It\'s supervised by professionals, so you\'ll be safe at all times.',ex:'La descente est encadrée par des professionnels donc tu seras en sécurité à tout moment.',exE:'The descent is supervised by professionals so you\'ll be safe at all times.'},
    {t:'p',lv:2,fr:'Des milliers de personnes le font chaque année sans problème.',en:'Thousands of people do it every year without any problem.',ex:'Des milliers de personnes font de la chute libre chaque année sans aucun problème.',exE:'Thousands of people go skydiving every year without any problem.'},
    {t:'p',lv:1,fr:'Tu n\'as pas besoin d\'être sportif(ve) pour y participer.',en:'You don\'t need to be sporty to take part.',ex:'Tu n\'as pas besoin d\'être sportif pour faire du vélo en ville — c\'est à ta portée.',exE:'You don\'t need to be sporty to cycle in the city — it\'s well within your reach.'},
    {t:'v',lv:2,fr:'l\'adrénaline (nf)',wc:'nf',en:'adrenaline',ex:'La montée d\'adrénaline que tu ressentiras vaut largement la peur du départ.',exE:'The rush of adrenaline you\'ll feel is well worth the initial fear.'},
    {t:'v',lv:3,fr:'le dépassement de soi (nm)',wc:'nm',en:'self-surpassing / pushing one\'s limits',ex:'Ce marathon cycliste est une belle opportunité de dépassement de soi.',exE:'This cycling marathon is a great opportunity to push your personal limits.'},
    {t:'v',lv:2,fr:'en toute sécurité (loc)',wc:'loc',en:'in complete safety',ex:'Tu pourras pratiquer cette activité en toute sécurité avec des moniteurs qualifiés.',exE:'You\'ll be able to do this activity in complete safety with qualified instructors.'},
    {t:'p',lv:2,fr:'Pense à la fierté que tu ressentiras après avoir accompli ça !',en:'Think of the pride you\'ll feel after accomplishing this!',ex:'Pense à la fierté que tu ressentiras après avoir terminé le défi cycliste !',exE:'Think of the pride you\'ll feel after completing the cycling challenge!'},
    {t:'v',lv:2,fr:'un accompagnateur (nm)',wc:'nm',en:'a companion / leader (sports)',ex:'Un accompagnateur qualifié sera présent pour encadrer toute l\'activité.',exE:'A qualified group leader will be present to supervise the entire activity.'},
    {t:'v',lv:2,fr:'accessible à tous / pour tous les niveaux',wc:'loc',en:'accessible to everyone / for all levels',ex:'L\'activité est accessible à tous les niveaux, même aux grands débutants.',exE:'The activity is accessible to all levels, even complete beginners.'},
    {t:'p',lv:2,fr:'Tu verras que tu te sentiras beaucoup plus confiant(e) après.',en:'You\'ll see you\'ll feel much more confident afterwards.',ex:'Tu verras que tu te sentiras beaucoup plus confiant après cet entraînement.',exE:'You\'ll see that you\'ll feel much more confident after this training session.'},
    {t:'v',h:1,fr:'brûler des calories (loc)',wc:'loc',en:'to burn calories',ex:'En plus du plaisir, on brûle énormément de calories lors de cette randonnée.',exE:'On top of the enjoyment, we burn a huge number of calories on this hike.'},
    {t:'v',lv:1,fr:'la randonnée (nf)',wc:'nf',en:'hiking / walking',ex:'La randonnée bénévole est un excellent moyen de combiner sport et solidarité.',exE:'Volunteer hiking is an excellent way to combine sport and solidarity.'},
    {t:'p',lv:1,fr:'L\'équipement est fourni donc tu n\'as rien à acheter.',en:'The equipment is provided so you don\'t need to buy anything.',ex:'L\'équipement de ski est entièrement fourni donc tu n\'as rien à acheter ou louer.',exE:'All the ski equipment is provided so you don\'t need to buy or rent anything.'},
    {t:'v',lv:3,fr:'incroyable / époustouflant(e)',wc:'adj',en:'incredible / breathtaking',ex:'La vue depuis le sommet est absolument époustouflante, tu ne le regretteras pas.',exE:'The view from the summit is absolutely breathtaking, you won\'t regret it.'},
    {t:'v',lv:1,fr:'le paysage (nm)',wc:'nm',en:'the landscape / scenery',ex:'Les paysages que tu vas découvrir pendant cette randonnée sont magnifiques.',exE:'The landscapes you\'ll discover during this hike are magnificent.'},
    {t:'p',lv:2,fr:'Ça te permettra de te dépasser et de découvrir tes propres limites.',en:'It will allow you to push yourself and discover your own limits.',ex:'Ce défi va te permettre de te dépasser et de découvrir tes vraies limites.',exE:'This challenge will allow you to push yourself and discover your true limits.'},
    {t:'v',lv:2,fr:'une sensation forte (nf)',wc:'nf',en:'a thrill / an intense sensation',ex:'Les sensations fortes de la chute libre sont inoubliables, je t\'assure.',exE:'The thrills of skydiving are unforgettable, I promise you.'},
    {t:'p',lv:2,fr:'On fait ça une seule fois dans sa vie — autant ne pas passer à côté.',en:'You only do this once in your life — might as well not miss out.',ex:'On fait de la chute libre une seule fois dans sa vie — autant ne pas passer à côté.',exE:'You only go skydiving once in your life — might as well not miss out.'},
    {t:'v',lv:1,fr:'s\'entraîner (v)',wc:'v',en:'to train / to work out',ex:'S\'entraîner pour ce défi va te maintenir en forme tout au long de l\'année.',exE:'Training for this challenge will keep you in shape throughout the year.'},
    {t:'v',h:1,fr:'le courage',wc:'nm',en:'courage',ex:'Il faut beaucoup de courage pour sauter en parachute.',exE:'It takes a lot of courage to skydive.'},
    {t:'v',h:1,fr:'le risque',wc:'nm',en:'risk',ex:'Le risque est faible si on respecte les consignes.',exE:'The risk is low if you follow the instructions.'},
    {t:'v',h:1,fr:'un sommet',wc:'nm',en:'a summit',ex:'Le sommet offre une vue à couper le souffle.',exE:'The summit offers a breathtaking view.'},
    {t:'v',h:1,fr:'le parachute',wc:'nm',en:'parachute',ex:'Le saut en parachute est une expérience inoubliable.',exE:'Skydiving is an unforgettable experience.'},
    {t:'v',h:1,fr:'un saut',wc:'nm',en:'a jump',ex:'Le saut dure à peine une minute.',exE:'The jump lasts barely a minute.'},
    {t:'v',h:1,fr:'la plongée',wc:'nf',en:'scuba diving',ex:'La plongée permet de découvrir des fonds marins magnifiques.',exE:'Diving lets you discover magnificent seabeds.'},
    {t:'v',h:1,fr:'le rafting / le kayak',wc:'nm',en:'rafting / kayaking',ex:'Le rafting est idéal pour les groupes d\'amis.',exE:'Rafting is ideal for groups of friends.'},
    {t:'v',h:1,fr:'la voile',wc:'nf',en:'sailing',ex:'Venez essayer la voile ce week-end !',exE:'Come and try sailing this weekend!'},
    {t:'v',h:1,fr:'la tente',wc:'nf',en:'the tent',ex:'Nous avons dormi sous la tente au bord du lac.',exE:'We slept in a tent by the lake.'},
    {t:'v',h:1,fr:'une falaise',wc:'nf',en:'a cliff',ex:'L\'escalade de cette falaise est accessible aux débutants.',exE:'Climbing this cliff is accessible to beginners.'},
    {t:'v',h:1,fr:'un sentier',wc:'nm',en:'a trail',ex:'Le sentier traverse une forêt magnifique.',exE:'The trail goes through a beautiful forest.'},
    {t:'v',h:1,fr:'la forme physique',wc:'nf',en:'physical fitness',ex:'Il faut une bonne forme physique pour cette randonnée.',exE:'You need good physical fitness for this hike.'},
    {t:'v',h:1,fr:'l\'effort',wc:'nm',en:'effort',ex:'L\'effort en vaut vraiment la peine.',exE:'The effort is really worth it.'},
    {t:'v',h:1,fr:'sauter',wc:'v',en:'to jump',ex:'Vous allez sauter avec un moniteur expérimenté.',exE:'You will jump with an experienced instructor.'},
    {t:'v',h:1,fr:'grimper',wc:'v',en:'to climb',ex:'Nous allons grimper jusqu\'au refuge.',exE:'We are going to climb up to the mountain hut.'},
    {t:'v',h:1,fr:'nager / plonger',wc:'v',en:'to swim / to dive',ex:'Vous pourrez nager avec des tortues.',exE:'You\'ll be able to swim with turtles.'},
    {t:'v',h:1,fr:'vivre une expérience unique',wc:'loc',en:'to have a one-of-a-kind experience',ex:'Venez vivre une expérience unique en pleine nature !',exE:'Come and live a unique experience in the great outdoors!'},
    {t:'v',h:1,fr:'un souvenir inoubliable',wc:'nm',en:'an unforgettable memory',ex:'Cette journée restera un souvenir inoubliable.',exE:'This day will remain an unforgettable memory.'},
    {t:'v',h:1,fr:'repousser ses limites',wc:'loc',en:'to push one\'s limits',ex:'Cette activité vous aidera à repousser vos limites.',exE:'This activity will help you push your limits.'},
    {t:'v',lv:1,fr:'le courage',wc:'nm',en:'courage',ex:'Il faut du courage, mais tu en as !',exE:'It takes courage, but you have it!'},
    {t:'v',lv:1,fr:'le risque',wc:'nm',en:'risk',ex:'Le risque est très faible si on respecte les consignes.',exE:'The risk is very low if you follow the instructions.'},
    {t:'v',lv:1,fr:'l\'effort',wc:'nm',en:'effort',ex:'L\'effort en vaut vraiment la peine.',exE:'The effort is really worth it.'},
    {t:'v',lv:1,fr:'un souvenir inoubliable',wc:'nm',en:'an unforgettable memory',ex:'Cette journée restera un souvenir inoubliable.',exE:'This day will remain an unforgettable memory.'},
    {t:'p',lv:1,fr:'Vivre une expérience unique',en:'To live a one-of-a-kind experience',ex:'Viens vivre une expérience unique en pleine nature !',exE:'Come and live a one-of-a-kind experience in the great outdoors!'},
    {t:'v',lv:2,fr:'la forme physique',wc:'nf',en:'physical fitness',ex:'Tu n\'as pas besoin d\'une grande forme physique.',exE:'You don\'t need great physical fitness.'},
    {t:'v',lv:2,fr:'repousser ses limites',wc:'loc',en:'to push one\'s limits',ex:'Cette activité t\'aidera à repousser tes limites.',exE:'This activity will help you push your limits.'},
   ]},

   {id:'eoB_culture',fr:'Culture & créativité',en:'Culture & creativity persuasion',c:'#FF3D8B',l:false,items:[
    {t:'p',lv:2,fr:'Tu vas découvrir un univers que tu ne connaissais pas du tout.',en:'You\'re going to discover a world you didn\'t know at all.',ex:'En allant à l\'opéra, tu vas découvrir un univers que tu ne connaissais vraiment pas.',exE:'By going to the opera, you\'re going to discover a world you didn\'t know at all.'},
    {t:'p',lv:2,fr:'Ce n\'est pas aussi compliqué / ennuyeux que tu le crois.',en:'It\'s not as complicated / boring as you think.',ex:'Le théâtre d\'improvisation n\'est pas aussi compliqué que tu le crois — c\'est surtout drôle !',exE:'Improv theatre isn\'t as complicated as you think — it\'s mostly funny!'},
    {t:'p',lv:2,fr:'C\'est une excellente façon de stimuler ta créativité.',en:'It\'s an excellent way to stimulate your creativity.',ex:'Les ateliers de poterie sont une excellente façon de stimuler ta créativité.',exE:'Pottery workshops are an excellent way to stimulate your creativity.'},
    {t:'p',lv:2,fr:'Ça nous donnera quelque chose à faire ensemble et à partager.',en:'It\'ll give us something to do together and share.',ex:'Ça nous donnera quelque chose de concret à faire ensemble et à partager.',exE:'It\'ll give us something concrete to do together and to share.'},
    {t:'v',lv:3,fr:'s\'épanouir (v)',wc:'v',en:'to thrive / to blossom / to flourish',ex:'Ce genre d\'activité créative te permettra vraiment de t\'épanouir.',exE:'This kind of creative activity will truly allow you to flourish.'},
    {t:'v',lv:2,fr:'libérer sa créativité (loc)',wc:'loc',en:'to unleash one\'s creativity',ex:'Les ateliers d\'écriture poétique permettent vraiment de libérer sa créativité.',exE:'Poetry writing workshops truly allow you to unleash your creativity.'},
    {t:'v',lv:1,fr:'s\'exprimer (v)',wc:'v',en:'to express oneself',ex:'La danse est une façon merveilleuse de s\'exprimer sans utiliser les mots.',exE:'Dance is a wonderful way to express oneself without using words.'},
    {t:'p',lv:2,fr:'Tu n\'as pas besoin d\'être doué(e) pour apprécier / participer.',en:'You don\'t need to be talented to enjoy / participate.',ex:'Tu n\'as pas besoin d\'être doué en dessin pour apprécier un atelier de poterie.',exE:'You don\'t need to be talented at drawing to enjoy a pottery workshop.'},
    {t:'v',lv:2,fr:'une expérience enrichissante (nf)',wc:'nf',en:'an enriching experience',ex:'Assister à un opéra est une expérience culturelle vraiment enrichissante.',exE:'Attending an opera is a truly enriching cultural experience.'},
    {t:'v',lv:3,fr:'éveiller la curiosité (loc)',wc:'loc',en:'to awaken curiosity',ex:'Ce type de spectacle est fait pour éveiller la curiosité des spectateurs.',exE:'This type of show is designed to awaken the curiosity of the audience.'},
    {t:'p',lv:1,fr:'Au pire, si tu n\'aimes pas, tu auras au moins essayé.',en:'At worst, if you don\'t like it, you\'ll have at least tried.',ex:'Au pire, si tu n\'aimes pas le concours de conte, tu auras au moins essayé quelque chose de nouveau.',exE:'At worst, if you don\'t like the storytelling competition, you\'ll have at least tried something new.'},
    {t:'v',lv:1,fr:'s\'amuser (v)',wc:'v',en:'to have fun / enjoy oneself',ex:'Je suis sûre qu\'on va énormément s\'amuser au cours de danse.',exE:'I\'m sure we\'re going to have a great time at the dance class.'},
    {t:'v',lv:1,fr:'créatif(ve) / artistique',wc:'adj',en:'creative / artistic',ex:'Tu as un côté très créatif que ces ateliers te permettront d\'explorer.',exE:'You have a very creative side that these workshops will allow you to explore.'},
    {t:'p',lv:2,fr:'C\'est l\'occasion de te faire de nouveaux amis qui partagent les mêmes intérêts.',en:'It\'s a chance to make new friends who share the same interests.',ex:'C\'est l\'occasion parfaite de te faire de nouveaux amis qui partagent les mêmes intérêts.',exE:'It\'s the perfect chance to make new friends who share the same interests.'},
    {t:'v',lv:2,fr:'le partage (nm)',wc:'nm',en:'sharing',ex:'Le partage d\'une expérience culturelle renforce toujours les liens d\'amitié.',exE:'Sharing a cultural experience always strengthens bonds of friendship.'},
    {t:'p',lv:2,fr:'Tu risques d\'y prendre goût et de vouloir y retourner !',en:'You might develop a taste for it and want to go back!',ex:'Tu risques d\'y prendre goût au théâtre et de vouloir y retourner chaque semaine !',exE:'You might develop a taste for theatre and want to go back every week!'},
    {t:'v',lv:2,fr:'y prendre goût (loc)',wc:'loc',en:'to develop a taste for it / get into it',ex:'Une fois qu\'on y a goûté, on y prend goût et on ne peut plus s\'en passer.',exE:'Once you\'ve tried it, you develop a taste for it and can\'t do without it.'},
    {t:'v',lv:3,fr:'cultiver sa passion (loc)',wc:'loc',en:'to nurture one\'s passion',ex:'Ces ateliers sont parfaits pour cultiver ta passion pour l\'écriture créative.',exE:'These workshops are perfect for nurturing your passion for creative writing.'},
    {t:'p',lv:2,fr:'On peut y aller une seule fois juste pour voir si ça nous plaît.',en:'We can go just once to see if we like it.',ex:'On peut y aller une seule fois juste pour voir si ça nous plaît — sans engagement.',exE:'We can go just once to see if we like it — with no commitment.'},
    {t:'v',lv:2,fr:'une découverte (nf)',wc:'nf',en:'a discovery',ex:'Chaque nouvelle activité artistique est une découverte sur soi-même.',exE:'Every new artistic activity is a discovery about yourself.'},
    {t:'v',h:1,fr:'la peinture',wc:'nf',en:'painting',ex:'La peinture est une façon de s\'exprimer librement.',exE:'Painting is a way to express yourself freely.'},
    {t:'v',h:1,fr:'le dessin',wc:'nm',en:'drawing',ex:'Le dessin est accessible à tous les âges.',exE:'Drawing is accessible at any age.'},
    {t:'v',h:1,fr:'la musique',wc:'nf',en:'music',ex:'La musique rapproche les gens.',exE:'Music brings people together.'},
    {t:'v',h:1,fr:'le théâtre',wc:'nm',en:'theatre',ex:'Le théâtre aide à prendre confiance en soi.',exE:'Theatre helps build self-confidence.'},
    {t:'v',h:1,fr:'l\'écriture',wc:'nf',en:'writing',ex:'Un atelier d\'écriture peut libérer votre imagination.',exE:'A writing workshop can free your imagination.'},
    {t:'v',h:1,fr:'la photographie',wc:'nf',en:'photography',ex:'La photographie permet de voir le monde autrement.',exE:'Photography lets you see the world differently.'},
    {t:'v',h:1,fr:'la sculpture / la poterie',wc:'nf',en:'sculpture / pottery',ex:'La poterie est un excellent moyen de se détendre.',exE:'Pottery is an excellent way to relax.'},
    {t:'v',h:1,fr:'un atelier d\'art',wc:'nm',en:'an art workshop',ex:'Rejoignez notre atelier d\'art le samedi matin.',exE:'Join our art workshop on Saturday mornings.'},
    {t:'v',h:1,fr:'un instrument',wc:'nm',en:'an instrument',ex:'Quel instrument aimeriez-vous apprendre ?',exE:'Which instrument would you like to learn?'},
    {t:'v',h:1,fr:'une chorale',wc:'nf',en:'a choir',ex:'Notre chorale accueille tous les niveaux.',exE:'Our choir welcomes all levels.'},
    {t:'v',h:1,fr:'une troupe',wc:'nf',en:'a (theatre) troupe',ex:'La troupe prépare un nouveau spectacle.',exE:'The troupe is preparing a new show.'},
    {t:'v',h:1,fr:'l\'imagination',wc:'nf',en:'imagination',ex:'Les enfants ont une imagination débordante.',exE:'Children have a boundless imagination.'},
    {t:'v',h:1,fr:'l\'inspiration',wc:'nf',en:'inspiration',ex:'La nature est une grande source d\'inspiration.',exE:'Nature is a great source of inspiration.'},
    {t:'v',h:1,fr:'un talent caché',wc:'nm',en:'a hidden talent',ex:'Vous découvrirez peut-être un talent caché.',exE:'You might discover a hidden talent.'},
    {t:'v',h:1,fr:'créer',wc:'v',en:'to create',ex:'Vous allez créer votre propre œuvre.',exE:'You will create your own work.'},
    {t:'v',h:1,fr:'peindre / dessiner',wc:'v',en:'to paint / to draw',ex:'Nous allons peindre en plein air.',exE:'We are going to paint outdoors.'},
    {t:'v',h:1,fr:'chanter / danser',wc:'v',en:'to sing / to dance',ex:'Chanter en groupe fait du bien au moral.',exE:'Singing in a group lifts your spirits.'},
    {t:'v',h:1,fr:'jouer d\'un instrument',wc:'loc',en:'to play an instrument',ex:'Jouer d\'un instrument améliore la concentration.',exE:'Playing an instrument improves concentration.'},
    {t:'v',h:1,fr:'écrire',wc:'v',en:'to write',ex:'Écrire chaque jour aide à organiser ses idées.',exE:'Writing every day helps organize your ideas.'},
    {t:'v',h:1,fr:'improviser',wc:'v',en:'to improvise',ex:'Le théâtre apprend à improviser.',exE:'Theatre teaches you to improvise.'},
    {t:'v',h:1,fr:'la scène',wc:'nf',en:'the stage',ex:'Monter sur scène est une expérience inoubliable.',exE:'Going on stage is an unforgettable experience.'},
    {t:'v',lv:1,fr:'créer',wc:'v',en:'to create',ex:'Tu vas créer ta propre œuvre.',exE:'You will create your own work.'},
    {t:'v',lv:2,fr:'l\'imagination',wc:'nf',en:'imagination',ex:'Les enfants ont une imagination débordante.',exE:'Children have a boundless imagination.'},
    {t:'v',lv:2,fr:'l\'inspiration',wc:'nf',en:'inspiration',ex:'La nature est une grande source d\'inspiration.',exE:'Nature is a great source of inspiration.'},
    {t:'v',lv:2,fr:'un talent caché',wc:'nm',en:'a hidden talent',ex:'Tu découvriras peut-être un talent caché.',exE:'You might discover a hidden talent.'},
   ]},

   {id:'eoB_benevole',fr:'Bénévolat & causes',en:'Volunteering & social causes',c:'#007A42',l:false,items:[
    {t:'p',lv:1,fr:'C\'est une façon concrète d\'aider les autres tout en te sentant utile.',en:'It\'s a concrete way to help others while feeling useful.',ex:'Le bénévolat est une façon concrète d\'aider les autres tout en te sentant utile.',exE:'Volunteering is a concrete way to help others while feeling useful.'},
    {t:'p',lv:2,fr:'Tu vas tisser des liens forts avec les autres bénévoles.',en:'You\'ll forge strong bonds with the other volunteers.',ex:'Tu vas tisser des liens forts avec les autres bénévoles et créer de vraies amitiés.',exE:'You\'ll forge strong bonds with the other volunteers and create real friendships.'},
    {t:'p',lv:2,fr:'Ça enrichit ton CV et démontre ton engagement.',en:'It boosts your CV and demonstrates your commitment.',ex:'Ce bénévolat va vraiment enrichir ton CV et démontrer ton engagement social.',exE:'This volunteering will really boost your CV and demonstrate your social commitment.'},
    {t:'p',lv:2,fr:'Tu verras à quel point ça donne du sens à sa vie.',en:'You\'ll see how much meaning it gives to your life.',ex:'Tu verras à quel point faire du bénévolat donne du sens à sa vie quotidienne.',exE:'You\'ll see how much volunteering gives meaning to your everyday life.'},
    {t:'v',lv:2,fr:'s\'engager (v)',wc:'v',en:'to commit / get involved',ex:'S\'engager dans une cause, même ponctuellement, a un impact réel sur la communauté.',exE:'Committing to a cause, even occasionally, has a real impact on the community.'},
    {t:'v',lv:2,fr:'la solidarité (nf)',wc:'nf',en:'solidarity',ex:'Participer à cet événement, c\'est un beau geste de solidarité envers les autres.',exE:'Taking part in this event is a beautiful gesture of solidarity towards others.'},
    {t:'v',lv:2,fr:'avoir un impact positif (loc)',wc:'loc',en:'to have a positive impact',ex:'Chaque heure de bénévolat a un impact positif réel sur ceux qui en bénéficient.',exE:'Every hour of volunteering has a real positive impact on those who benefit.'},
    {t:'v',lv:2,fr:'épanouissant(e) (adj)',wc:'adj',en:'fulfilling / rewarding',ex:'Les témoignages de bénévoles montrent que c\'est une activité très épanouissante.',exE:'Volunteer testimonials show that it\'s a very fulfilling activity.'},
    {t:'p',lv:1,fr:'Tu n\'as pas besoin de beaucoup de temps — même quelques heures suffisent.',en:'You don\'t need a lot of time — even a few hours are enough.',ex:'Tu n\'as pas besoin de beaucoup de temps — même quelques heures par mois suffisent.',exE:'You don\'t need a lot of time — even a few hours per month are enough.'},

let exam='EE', sec='A', ti=0, ci=0, filt='all', lvl=0, expanded=false;
let exPref=false;try{exPref=localStorage.getItem('tef_ex')==='1'}catch(e){}
expanded=exPref;
try{const P=JSON.parse(localStorage.getItem('tef_pos')||'null');
  if(P&&D[P.exam]&&D[P.exam][P.sec]&&D[P.exam][P.sec][P.ti]){exam=P.exam;sec=P.sec;ti=P.ti;ci=P.ci|0;filt=P.filt||'all';lvl=P.lvl|0}}catch(e){}
const savePos=()=>{try{localStorage.setItem('tef_pos',JSON.stringify({exam,sec,ti,ci,filt,lvl}))}catch(e){}};
let known={};
try{known=JSON.parse(localStorage.getItem('ecrire_k')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ecrire_k',JSON.stringify(known))}catch(e){}};

const topics=()=>D[exam][sec];
const topic=()=>topics()[ti];
const all=()=>topic().items;
const LVN={1:'Basics',2:'CLB 7–8',3:'Advanced'};
// visible items sorted Basics → CLB 7–8 → Advanced (original order kept inside a level); oi stays the ORIGINAL index so "known" keys never break
const sortedItems=t=>t.items.map((item,i)=>({item,oi:i})).filter(x=>!x.item.h).sort((a,b)=>((a.item.lv||2)-(b.item.lv||2))||(a.oi-b.oi));
const filtered=()=>sortedItems(topic()).filter(({item})=>(filt==='all'||item.t===filt[0])&&(!lvl||(item.lv||2)===lvl));
const entry=()=>{const f=filtered();if(ci>=f.length)ci=Math.max(0,f.length-1);return f[ci]};
const kk=(topId,oi)=>`${topId}_${oi}`;

/* ═══════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════ */
function renderTopics(){
  const row=document.getElementById('topicsRow');
  row.innerHTML='';
  topics().forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tpill'+(i===ti?' on':'')+(t.l?' light':'');
    b.style.setProperty('--tc',t.c);
    b.textContent=t.fr;
    b.onclick=()=>{ti=i;ci=0;expanded=exPref;render()};
    row.appendChild(b);
  });
  const on=row.querySelector('.tpill.on');if(on&&on.scrollIntoView)row.parentElement.scrollTo({left:Math.max(0,on.offsetLeft-24),behavior:'smooth'});
  const cnt={0:0,1:0,2:0,3:0};
  topic().items.forEach(it=>{if(!it.h&&(filt==='all'||it.t===filt[0])){cnt[0]++;cnt[it.lv||2]++}});
  document.querySelectorAll('.lvl-tab').forEach(b=>{const l=+b.dataset.l;b.querySelector('i').textContent=cnt[l];b.classList.toggle('on',l===lvl)});
}

function renderCard(dir){
  const area=document.getElementById('cardArea');
  const f=filtered();

  if(!f.length){
    area.innerHTML='<div class="empty"><div style="font-size:2rem">🤷</div><div>No items for this filter</div></div>';
    updateChrome(0,0);return;
  }

  const {item,oi}=f[ci];
  const t=topic();
  const ki=kk(t.id,oi);
  const isKn=!!known[ki];
  const knCnt=f.filter(({oi:o})=>!!known[kk(t.id,o)]).length;

  updateChrome(ci+1,f.length,knCnt);

  document.getElementById('btnPrev').disabled=ci===0;
  document.getElementById('btnNext').disabled=ci===f.length-1;
  document.getElementById('knowBtn').className='know-btn'+(isKn?' on':'');
  document.getElementById('knowLabel').textContent=isKn?'Marked known':'Mark as known';

  const isV=item.t==='v';
  const typeBadge=isV
    ?`<div class="type-badge badge-v">Vocab${item.wc?` · <span class="wc">${item.wc}</span>`:''}</div>`
    :`<div class="type-badge badge-p">Phrase</div>`;
  const lvBadge=`<div class="type-badge lv-b lv-${item.lv||2}">${LVN[item.lv||2]}</div>`;

  const exId='ex'+Date.now();
  const card=document.createElement('div');
  card.className='card'+(dir?` enter-${dir}`:'');
  card.style.setProperty('--tc',t.c);
  card.innerHTML=`
    <div class="card-top"></div>
    <div class="card-scroll">
      <div class="badge-row">
        ${typeBadge}${lvBadge}
        <button class="spk" onclick="playCard(event,'w')" aria-label="Hear this card">${AU_SPK}</button>
        <div class="known-chip${isKn?' show':''}">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1"/></svg>
          Known
        </div>
      </div>
      <div class="card-fr">${item.fr}</div>
      <div class="card-en">${item.en}</div>
      <div class="card-divider"></div>
      <div class="ex-toggle${expanded?' open':''}" id="${exId}" onclick="toggleEx(this)">
        <svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,1 6,6 11,1"/></svg>
        Example
      </div>
      <div class="ex-body">
        <div class="ex-fr">${item.ex}</div>
        <div class="ex-en-label">↳ in English<button class="spk ex-spk" onclick="playCard(event,'x')" aria-label="Hear the example">${AU_SPK}</button></div>
        <div class="ex-en">${item.exE}</div>
      </div>
    </div>`;
  area.innerHTML='';
  area.appendChild(card);
  auFollow();
}

function updateChrome(cur,tot,knCnt){
  savePos();
  document.getElementById('progFill').style.width=tot?((cur-1)/tot*100)+'%':'0%';
  document.getElementById('progLabel').textContent=tot?`${cur} / ${tot}`:'— / —';
  document.getElementById('knownRow').textContent=knCnt>0?`${knCnt} ✓`:'';
  ['A','B'].forEach(s=>document.getElementById('btn'+s).className=(sec===s?'on':''));
  ['EE','EO'].forEach(e=>document.getElementById('btn'+e).className=(exam===e?'on':''));
  ['All','Vocab','Phrase'].forEach(id=>{
    const f2=id.toLowerCase();
    document.getElementById('f'+id).className='filt-tab'+(filt===f2?'':filt==='all'&&f2==='all'?'':'')+((filt===f2||(f2==='all'&&filt==='all'))?'on':' on'.replace(' on',''));
  });
  // simpler filter sync:
  document.getElementById('fAll').className='filt-tab'+(filt==='all'?' on':'');
  document.getElementById('fVocab').className='filt-tab'+(filt==='vocab'?' on':'');
  document.getElementById('fPhrase').className='filt-tab'+(filt==='phrase'?' on':'');
}

function render(dir){
  renderTopics();
  renderCard(dir);
  document.documentElement.style.setProperty('--accent',topic().c);
  ['A','B'].forEach(s=>document.getElementById('btn'+s).className=(sec===s?'on':''));
  ['EE','EO'].forEach(e=>document.getElementById('btn'+e).className=(exam===e?'on':''));
}

/* ═══════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════ */
function setSection(s){sec=s;ti=0;ci=0;expanded=exPref;render()}
function setExam(e){exam=e;sec='A';ti=0;ci=0;expanded=exPref;render()}
function setLevel(l){
  lvl=l; ci=0; expanded=exPref;
  document.querySelectorAll('.lvl-tab').forEach(b=>b.classList.toggle('on',+b.dataset.l===l));
  render();
}
function setFilter(f){
  filt=f; ci=0; expanded=exPref;
  document.getElementById('fAll').className='filt-tab'+(f==='all'?' on':'');
  document.getElementById('fVocab').className='filt-tab'+(f==='vocab'?' on':'');
  document.getElementById('fPhrase').className='filt-tab'+(f==='phrase'?' on':'');
  render();
}

function navigate(dir,anim=true){
  const f=filtered();
  const nx=ci+dir;
  if(nx<0||nx>=f.length)return;
  if(anim){
    const old=document.querySelector('.card');
    if(old){old.className='card '+(dir===1?'exit-fwd':'exit-back'); old.addEventListener('animationend',()=>old.remove(),{once:true});}
    ci=nx; expanded=exPref;
    renderCard(dir===1?'fwd':'back');
    renderTopics();
    document.getElementById('btnPrev').disabled=ci===0;
    document.getElementById('btnNext').disabled=ci===filtered().length-1;
  } else {
    ci=nx; expanded=exPref; render();
  }
}

function toggleKnown(){
  const {oi}=entry();
  const ki=kk(topic().id,oi);
  if(known[ki]){delete known[ki]}else{known[ki]=true}
  save();
  const f=filtered();
  const knCnt=f.filter(({oi:o})=>!!known[kk(topic().id,o)]).length;
  updateChrome(ci+1,f.length,knCnt);
  const btn=document.getElementById('knowBtn');
  btn.className='know-btn'+(known[ki]?' on':'');
  document.getElementById('knowLabel').textContent=known[ki]?'Marked known':'Mark as known';
  const chip=document.querySelector('.known-chip');
  if(chip){chip.className='known-chip'+(known[ki]?' show':'')}
  if(known[ki]&&AU.mode!=='auto'&&ci<f.length-1){const at=ci;setTimeout(()=>{if(ci===at&&!Q.open)navigate(1)},450)}
  if(known[ki]&&ci<f.length-1){setTimeout(()=>navigate(1),400)}
}

function toggleEx(el){
  expanded=!expanded;exPref=expanded;
  try{localStorage.setItem('tef_ex',expanded?'1':'0')}catch(e){}
  el.className='ex-toggle'+(expanded?' open':'');
}

/* ═══════════════════════════════════════════════
   QUICK TEST — self-graded flashcard overlay
   Never touches the main deck unless you tap
   "Mark as known" on the results screen.
   ═══════════════════════════════════════════════ */
const Q={open:false,deck:[],byK:{},i:0,rev:false,busy:false,first:{},streak:0,best:0,
  p:{scope:'topic',type:'all',dir:'fr',count:20,unk:true,lv:0}};
try{Object.assign(Q.p,JSON.parse(localStorage.getItem('tef_quiz')||'{}'))}catch(e){}
const qe=id=>document.getElementById(id);
const qSave=()=>{try{localStorage.setItem('tef_quiz',JSON.stringify(Q.p))}catch(e){}};
const qBuzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const qShuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SVG_X='<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>';
const SVG_OK='<svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,6 5,10 13,2"/></svg>';

function qPool(){
  const p=Q.p;let tops;
  if(p.scope==='topic')tops=[topic()];
  else if(p.scope==='section')tops=topics();
  else{tops=[];for(const e in D)for(const s in D[e])tops.push(...D[e][s])}
  const out=[];
  tops.forEach(t=>t.items.forEach((it,oi)=>{
    if(it.h)return;
    if(p.lv&&(it.lv||2)!==p.lv)return;
    if(p.type==='vocab'&&it.t!=='v')return;
    if(p.type==='phrase'&&it.t!=='p')return;
    const k=kk(t.id,oi);
    if(p.unk&&known[k])return;
    out.push({it,k,c:t.c});
  }));
  return out;
}
function qOpen(){
  auStop();
  Q.open=true;
  Q.p.type=filt==='vocab'?'vocab':filt==='phrase'?'phrase':'all';
  qe('quiz').classList.add('show');
  qSetup();
}
function qClose(){
  Q.open=false;
  qe('quiz').classList.remove('show');
  render();
}
function qTop(i,total){
  qe('qFill').style.width=(total?i/total*100:0)+'%';
  qe('qCount').textContent=total?`${Math.min(i+1,total)} / ${total}`:'';
  const s=qe('qStreak');s.textContent='🔥'+Q.streak;s.className='q-streak'+(Q.streak>=3?' on':'');
}
function qChip(key,val,label){
  const v=typeof val==='string'?`'${val}'`:val;
  return `<button class="q-chip${Q.p[key]===val?' on':''}" onclick="qSet('${key}',${v})">${label}</button>`;
}
function qSet(k,v){Q.p[k]=v;qSave();qSetup()}
function qSetup(){
  qTop(0,0);
  const n=qPool().length, take=Q.p.count?Math.min(Q.p.count,n):n;
  qe('qbody').innerHTML=`
  <div class="q-setup">
    <div class="q-h">Quick test</div>
    <div class="q-sub">See one side, say the answer in your head, flip, then tap how you did.</div>
    <div class="q-grp"><div class="q-lab">Test me on</div><div class="q-chips">
      ${qChip('scope','topic','This topic')}${qChip('scope','section','This section')}${qChip('scope','all','Everything')}</div></div>
    <div class="q-grp"><div class="q-lab">Cards</div><div class="q-chips">
      ${qChip('type','all','Vocab + phrases')}${qChip('type','vocab','Vocab')}${qChip('type','phrase','Phrases')}</div></div>
    <div class="q-grp"><div class="q-lab">Level</div><div class="q-chips">
      ${qChip('lv',0,'All')}${qChip('lv',1,'Basics')}${qChip('lv',2,'CLB 7–8')}${qChip('lv',3,'Advanced')}</div></div>
    <div class="q-grp"><div class="q-lab">Show me</div><div class="q-chips">
      ${qChip('dir','fr','Français → English')}${qChip('dir','en','English → Français')}${qChip('dir','mix','Mixed')}</div></div>
    <div class="q-grp"><div class="q-lab">How many</div><div class="q-chips">
      ${qChip('count',10,'10')}${qChip('count',20,'20')}${qChip('count',40,'40')}${qChip('count',0,'All')}</div></div>
    <div class="q-grp"><div class="q-lab">Skip cards I already know</div><div class="q-chips">
      ${qChip('unk',true,'Yes')}${qChip('unk',false,'No, include them')}</div></div>
  </div>
  <div class="q-foot">
    <button class="q-go" id="qGo" onclick="qStart()" ${n?'':'disabled'}>${n?`Start · ${take} card${take>1?'s':''}`:'No cards to test'}</button>
    ${n?'':'<div class="q-note">Everything here is marked known. Try “No, include them”.</div>'}
  </div>`;
}
function qStart(deck){
  if(!Array.isArray(deck)){
    const all=qPool();Q.byK={};all.forEach(c=>Q.byK[c.k]=c);
    deck=qShuf(all);if(Q.p.count)deck=deck.slice(0,Q.p.count);
  }
  Q.deck=deck.map(c=>({...c,d:Q.p.dir==='mix'?(Math.random()<.5?'fr':'en'):Q.p.dir,retry:false}));
  Q.i=0;Q.rev=false;Q.busy=false;Q.first={};Q.streak=0;Q.best=0;
  qRender();
}
function qRender(){
  if(Q.i>=Q.deck.length){qDone();return}
  const c=Q.deck[Q.i],it=c.it,front=c.d==='fr'?it.fr:it.en,back=c.d==='fr'?it.en:it.fr;
  const strip=s=>s.replace(/<[^>]*>/g,'');
  const lf=strip(front).length>34, lb=strip(back).length>34;
  const badge=it.t==='v'?`Vocab${it.wc?' · '+it.wc:''}`:'Phrase';
  qTop(Q.i,Q.deck.length);
  qe('qbody').innerHTML=`
  <div class="q-stage"><div class="q-drag" id="qDrag" style="--tc:${c.c}">
    <div class="q-stamp ok" id="stOk">GOT IT</div><div class="q-stamp no" id="stNo">MISSED</div>
    <div class="q-flip">
      <div class="q-face q-front">
        <div class="q-tag"><span>${c.d==='fr'?'Français':'English'}</span><span>${badge}${c.retry?' · again':''}</span></div>
        <div class="q-prompt${lf?' long':''}">${front}</div>
        <div class="q-hint">Tap to reveal</div>
      </div>
      <div class="q-face q-back">
        <div class="q-tag"><span>${c.d==='fr'?'English':'Français'}</span><span>${badge}</span></div>
        <div class="q-mid">
          <div class="q-small">${front}</div>
          <div class="q-ans${lb?' long':''}">${back}</div>
          <div class="q-exbox"><div class="q-exfr">${it.ex}</div><div class="q-exen">${it.exE}</div></div>
        </div>
      </div>
    </div>
  </div></div>
  <div class="q-actions" id="qAct"></div>
  <div class="q-keys">Space = flip · ← missed · → got it · Esc = close</div>`;
  qActs();qBind(qe('qDrag'));
}
function qActs(){
  qe('qAct').innerHTML=Q.rev
    ?`<button class="q-act miss" onclick="qAnswer(false)">${SVG_X} Missed</button><button class="q-act got" onclick="qAnswer(true)">${SVG_OK} Got it</button>`
    :`<button class="q-act rev" onclick="qFlip()">Show answer</button>`;
}
function qFlip(){
  if(Q.busy)return;
  Q.rev=!Q.rev;qe('qDrag').classList.toggle('rev',Q.rev);qActs();qBuzz(8);
}
function qBind(el){
  let sx=0,dx=0,down=false,moved=false;
  const stamps=()=>{
    qe('stOk').style.opacity=Math.max(0,Math.min(1,dx/90));
    qe('stNo').style.opacity=Math.max(0,Math.min(1,-dx/90));
  };
  el.addEventListener('pointerdown',e=>{
    if(Q.busy)return;down=true;moved=false;sx=e.clientX;dx=0;
    el.classList.remove('back');try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  el.addEventListener('pointermove',e=>{
    if(!down)return;dx=e.clientX-sx;
    if(Math.abs(dx)>8)moved=true;
    if(moved&&Q.rev){el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;stamps()}
  });
  const end=ev=>{
    if(!down)return;down=false;
    if(ev.type==='pointerup'&&!moved){qFlip();return}
    if(Q.rev&&Math.abs(dx)>90&&ev.type==='pointerup'){qAnswer(dx>0);return}
    el.classList.add('back');el.style.transform='';dx=0;stamps();
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function qAnswer(ok){
  if(Q.busy||!Q.rev)return;Q.busy=true;
  const c=Q.deck[Q.i];
  if(Q.first[c.k]===undefined)Q.first[c.k]=ok;
  if(ok){Q.streak++;Q.best=Math.max(Q.best,Q.streak);qBuzz(12)}
  else{
    Q.streak=0;qBuzz([20,40,20]);
    if(!c.retry)Q.deck.splice(Math.min(Q.i+5,Q.deck.length),0,{...c,retry:true});
  }
  const el=qe('qDrag');
  qe('stOk').style.opacity=ok?1:0;qe('stNo').style.opacity=ok?0:1;
  el.classList.remove('back');el.classList.add('fly');
  el.style.transform=`translateX(${ok?'':'-'}130vw) rotate(${ok?18:-18}deg)`;el.style.opacity=0;
  setTimeout(()=>{Q.i++;Q.rev=false;Q.busy=false;qRender()},240);
}
function qDone(){
  const ks=Object.keys(Q.first),got=ks.filter(k=>Q.first[k]),miss=ks.filter(k=>!Q.first[k]);
  const pct=ks.length?Math.round(got.length/ks.length*100):0;
  qTop(1,1);qe('qFill').style.width='100%';qe('qCount').textContent='Done';
  qe('qbody').innerHTML=`
  <div class="q-done">
    <div class="q-h">${pct>=90?'Excellent !':pct>=70?'Bien joué !':pct>=40?'Getting there':'Keep going'}</div>
    <div class="q-ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="qRing" cx="50" cy="50" r="44"/></svg><div class="q-pct">${pct}%</div></div>
    <div class="q-stats"><span><b>${got.length}</b> got it</span><span><b>${miss.length}</b> missed</span><span>best streak <b>${Q.best}</b></span></div>
    ${miss.length?`<div class="q-mlist"><div class="q-mhead">To review</div>${miss.map(k=>{const it=Q.byK[k].it;return `<div class="q-mrow"><b>${it.fr}</b><br><span>${it.en}</span></div>`}).join('')}</div>`:''}
  </div>
  <div class="q-foot"><div class="q-donebtns">
    ${got.length?`<button class="q-go" id="qMark" onclick="qMarkKnown()">Mark ${got.length} as known</button>`:''}
    ${miss.length?`<button class="q-sec" onclick="qRetry()">Retry ${miss.length} missed</button>`:''}
    <button class="q-sec" onclick="qClose()">Back to cards</button>
  </div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=qe('qRing');if(r)r.style.strokeDashoffset=276.46*(1-pct/100)}));
}
function qMarkKnown(){
  Object.keys(Q.first).filter(k=>Q.first[k]).forEach(k=>{known[k]=true});save();
  const b=qe('qMark');b.textContent='✓ Marked as known';b.disabled=true;qBuzz(15);
}
function qRetry(){
  const m=Object.keys(Q.first).filter(k=>!Q.first[k]).map(k=>Q.byK[k]);
  qStart(qShuf(m));
}
document.addEventListener('keydown',e=>{
  if(!Q.open)return;
  const run=!!qe('qDrag');
  if(e.key==='Escape'){qClose();return}
  if(!run){if(e.key==='Enter'&&qe('qGo')&&!qe('qGo').disabled)qStart();return}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!Q.rev)qFlip();else qAnswer(true)}
  else if(e.key==='ArrowRight'){Q.rev?qAnswer(true):qFlip()}
  else if(e.key==='ArrowLeft'){Q.rev?qAnswer(false):qFlip()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){qFlip()}
});

/* ═══════════════════════════════════════════════
   LISTEN — recorded female voice (see tools/make_audio.py)
   One mp3 episode per topic: word · meaning · example.
   Auto mode just keeps that file playing, so it keeps
   going with the screen off. Card buttons play a clip.
   ═══════════════════════════════════════════════ */
const AU={cues:null,el:null,mode:'idle',on:false,tid:null,row:null,internal:false,stopAt:0,
  p:{rate:1,loop:'next'}};
try{Object.assign(AU.p,JSON.parse(localStorage.getItem('tef_audio')||'{}'))}catch(e){}
const auSave=()=>{try{localStorage.setItem('tef_audio',JSON.stringify(AU.p))}catch(e){}};
const AU_RATES=[0.85,1,1.15,1.3], AU_LOOPS=[['next','Next topic'],['topic','Repeat topic'],['stop','Play once']];
const AU_SPK='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6v4h3l4 3V3L5 6z"/><path d="M11 5.2a4 4 0 010 5.6M12.8 3.5a6.5 6.5 0 010 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const AU_PLAY='<svg viewBox="0 0 14 14" fill="currentColor"><path d="M3 1l10 6-10 6z"/></svg>';
const AU_PAUSE='<svg viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="4" height="12" rx="1"/><rect x="8" y="1" width="4" height="12" rx="1"/></svg>';
fetch('audio/cues.json').then(r=>r.ok?r.json():null).then(j=>{
  if(j&&j.topics){AU.cues=j;document.body.classList.add('has-audio');render()}
}).catch(()=>{});
const auStrip=s=>String(s||'').replace(/<[^>]*>/g,'');
const auRow=(tid,oi)=>{const T=AU.cues&&AU.cues.topics[tid];return T?T.c.find(r=>r[0]===oi):null};

function auEl(){
  if(AU.el)return AU.el;
  const a=AU.el=new Audio();a.preload='auto';a.setAttribute('playsinline','');
  a.addEventListener('timeupdate',auTick);
  a.addEventListener('ended',auEnded);
  a.addEventListener('play',()=>{AU.on=true;auUI();if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
  a.addEventListener('pause',()=>{if(AU.mode==='auto'){AU.on=false;auUI()}if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
  if('mediaSession' in navigator){
    const ms=navigator.mediaSession,set=(n,f)=>{try{ms.setActionHandler(n,f)}catch(e){}};
    set('play',()=>{if(AU.mode==='auto')a.play();else auStart()});
    set('pause',()=>a.pause());
    set('nexttrack',()=>navigate(1));
    set('previoustrack',()=>navigate(-1));
  }
  return a;
}
function auGo(tid,t,play){
  const el=auEl(),T=AU.cues.topics[tid];AU.tid=tid;
  const go=()=>{
    try{el.currentTime=Math.max(0,t)}catch(e){}
    el.playbackRate=AU.p.rate;el.loop=AU.mode==='auto'&&AU.p.loop==='topic';
    if(play){const pr=el.play();if(pr&&pr.catch)pr.catch(()=>{AU.on=false;auUI()})}
  };
  if(el.getAttribute('data-t')===tid&&el.readyState>0){go();return}
  el.setAttribute('data-t',tid);el.src='audio/'+T.f;el.load();
  el.addEventListener('loadedmetadata',go,{once:true});
}
function auStart(){
  if(!AU.cues)return;
  if(Q.open)qClose();
  if(filt!=='all'||lvl){filt='all';lvl=0;document.querySelectorAll('.lvl-tab').forEach(b=>b.classList.toggle('on',+b.dataset.l===0));ci=0;render();}
  const e=entry();if(!e)return;
  const tid=topic().id,r=auRow(tid,e.oi);
  AU.mode='auto';AU.row=r;
  auGo(tid,r?r[1]-0.05:0,true);auMeta();auUI();
}
function auStop(){
  if(AU.el){AU.el.pause();AU.el.loop=false}
  AU.mode='idle';AU.on=false;AU.row=null;auUI();
  document.querySelectorAll('.sp').forEach(x=>x.classList.remove('sp'));
}
function auToggleStart(){AU.mode==='auto'?auStop():auStart()}
function auToggle(){if(!AU.el)return;AU.el.paused?AU.el.play():AU.el.pause()}
function auRate(){
  const i=AU_RATES.indexOf(AU.p.rate);AU.p.rate=AU_RATES[(i+1)%AU_RATES.length];auSave();
  if(AU.el)AU.el.playbackRate=AU.p.rate;auUI();
}
function auLoop(){
  const i=AU_LOOPS.findIndex(x=>x[0]===AU.p.loop);AU.p.loop=AU_LOOPS[(i+1)%AU_LOOPS.length][0];auSave();
  if(AU.el)AU.el.loop=AU.mode==='auto'&&AU.p.loop==='topic';auUI();
}
function auUI(){
  const on=AU.mode==='auto';
  const pl=document.getElementById('player');if(!pl)return;
  pl.className='player'+(on?' show':'');
  const lb=document.getElementById('listenBtn');if(lb)lb.className='listen-btn'+(on?' on':'');
  if(!on)return;
  document.getElementById('plPlay').innerHTML=AU.on?AU_PAUSE:AU_PLAY;
  document.getElementById('plRate').textContent=AU.p.rate+'×';
  document.getElementById('plLoop').textContent=AU_LOOPS.find(x=>x[0]===AU.p.loop)[1];
  const e=entry();
  document.getElementById('plT').textContent=e?auStrip(e.item.fr):'Listening';
  document.getElementById('plS').textContent=topic().fr+' · '+(ci+1)+' / '+filtered().length;
}
function auMeta(){
  if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;
  const e=entry();if(!e)return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:auStrip(e.item.fr),artist:auStrip(e.item.en),album:'TEF · '+topic().fr})}catch(x){}
}
function auShow(oi){
  const idx=filtered().findIndex(x=>x.oi===oi);if(idx<0)return;
  AU.internal=true;ci=idx;expanded=exPref;renderCard('fwd');renderTopics();
  document.getElementById('btnPrev').disabled=ci===0;
  document.getElementById('btnNext').disabled=ci===filtered().length-1;
  AU.internal=false;auMeta();auUI();
}
function auTick(){
  const el=AU.el,t=el.currentTime;
  if(AU.mode==='seg'){if(t>=AU.stopAt){el.pause();AU.mode='idle'}auMarkSeg(t);return}
  if(AU.mode!=='auto')return;
  const T=AU.cues.topics[AU.tid];if(!T)return;
  let row=null;for(const r of T.c){if(r[1]-0.15<=t)row=r;else break}
  if(!row)return;
  if(AU.row!==row){AU.row=row;if(topic().id===AU.tid)auShow(row[0])}
  if(t>=row[5]-0.05&&!expanded){expanded=true;const x=document.querySelector('.ex-toggle');if(x)x.className='ex-toggle open'}
  auMarkSeg(t,row);
}
function auMarkSeg(t,row){
  if(!row){const T=AU.cues.topics[AU.tid];row=T&&T.c.find(r=>t>=r[1]-0.1&&t<=r[6]+0.2)}
  if(!row)return;
  const q=s=>document.querySelector(s);
  const f=q('.card-fr'),n=q('.card-en'),x=q('.ex-fr');
  if(f)f.classList.toggle('sp',t>=row[1]-0.1&&t<=row[2]+0.2);
  if(n)n.classList.toggle('sp',t>=row[3]-0.1&&t<=row[4]+0.2);
  if(x)x.classList.toggle('sp',t>=row[5]-0.1&&t<=row[6]+0.2);
}
function auEnded(){
  if(AU.mode==='seg'){AU.mode='idle';return}
  if(AU.mode!=='auto')return;
  if(AU.p.loop==='stop'){auStop();return}
  const n=topics().length;AU.internal=true;ti=(ti+1)%n;ci=0;expanded=exPref;render();AU.internal=false;
  AU.row=null;auGo(topic().id,0,true);auMeta();auUI();
}
function auFollow(){   /* user moved to another card/topic while listening: jump the audio there */
  if(AU.mode!=='auto'||AU.internal||!AU.cues)return;
  const e=entry();if(!e)return;
  const tid=topic().id,r=auRow(tid,e.oi);
  if(!r||(AU.row===r&&AU.tid===tid)){auUI();return}
  AU.row=r;auGo(tid,r[1]-0.05,AU.on);auMeta();auUI();
}
function playCard(ev,kind){
  if(ev)ev.stopPropagation();
  if(!AU.cues)return;
  const e=entry();if(!e)return;
  const r=auRow(topic().id,e.oi);if(!r)return;
  if(AU.mode==='auto')auStop();
  AU.mode='seg';AU.stopAt=(kind==='w'?r[4]:r[6])+0.15;
  auGo(topic().id,(kind==='w'?r[1]:r[5])-0.05,true);
}

/* ═══════════════════════════════════════════════
   KEYBOARD + SWIPE
   ═══════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(Q.open)return;
  if(e.key==='p'||e.key==='P'){AU.mode==='auto'?auToggle():auStart();return}
  if(e.key==='ArrowRight')navigate(1);
  if(e.key==='ArrowLeft')navigate(-1);
  if(e.key===' '){e.preventDefault();toggleKnown()}
  if(e.key==='e'||e.key==='E'){const el=document.querySelector('.ex-toggle');if(el)toggleEx(el)}
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(Q.open)return;
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>45)navigate(dx<0?1:-1);
},{passive:true});

render();
</script>
</body>
</html>
