  B:[
   {id:'eoB_persuasion',fr:'Convaincre',en:'Universal persuasion phrases',c:'#FF6B2C',l:false,items:[
    {t:'p',fr:'Je voudrais te convaincre d\'essayer… avec moi.',en:'I\'d like to convince you to try… with me.',ex:'Je voudrais te convaincre d\'essayer les cours de danse avec moi ce samedi.',exE:'I\'d like to convince you to try dance classes with me this Saturday.'},
    {t:'p',fr:'Tu ne regretteras pas d\'avoir essayé, je t\'assure.',en:'You won\'t regret trying it, I promise.',ex:'Tu ne regretteras pas d\'avoir essayé, je t\'assure — c\'est vraiment génial.',exE:'You won\'t regret trying it, I promise — it\'s really great.'},
    {t:'p',fr:'Je comprends tes réticences, mais…',en:'I understand your reluctance, but…',ex:'Je comprends tes réticences, mais tu verras que c\'est bien moins effrayant que tu ne l\'imagines.',exE:'I understand your reluctance, but you\'ll see it\'s much less frightening than you imagine.'},
    {t:'p',fr:'Imagine un peu… / Imagine-toi en train de…',en:'Just imagine… / Picture yourself…',ex:'Imagine-toi en train de sauter en parachute au-dessus des Alpes — quelle vue !',exE:'Picture yourself skydiving over the Alps — what a view!'},
    {t:'p',fr:'C\'est une expérience unique / inoubliable.',en:'It\'s a unique / unforgettable experience.',ex:'C\'est une expérience vraiment unique qu\'on ne peut pas vivre ailleurs.',exE:'It\'s a truly unique experience you can\'t have anywhere else.'},
    {t:'p',fr:'Tu n\'as rien à perdre à essayer.',en:'You have nothing to lose by trying.',ex:'Tu n\'as rien à perdre à essayer — si ça ne te plaît pas, on rentre à la maison.',exE:'You have nothing to lose by trying — if you don\'t like it, we go home.'},
    {t:'p',fr:'Pense à tout ce que tu pourrais apprendre / découvrir.',en:'Think about everything you could learn / discover.',ex:'Pense à tout ce que tu pourrais découvrir sur toi-même en relevant ce défi.',exE:'Think about everything you could discover about yourself by taking on this challenge.'},
    {t:'p',fr:'Ce serait l\'occasion idéale de…',en:'It would be the perfect opportunity to…',ex:'Ce serait l\'occasion idéale de sortir de ta zone de confort pour une fois.',exE:'It would be the perfect opportunity to step out of your comfort zone for once.'},
    {t:'p',fr:'On pourrait y aller ensemble pour que tu te sentes plus à l\'aise.',en:'We could go together so you feel more comfortable.',ex:'On pourrait y aller ensemble pour que tu te sentes plus à l\'aise la première fois.',exE:'We could go together so you feel more comfortable the first time.'},
    {t:'p',fr:'Ça ne coûte pas grand-chose et les bénéfices sont énormes.',en:'It doesn\'t cost much and the benefits are huge.',ex:'Ça ne coûte pas grand-chose et les bénéfices sur ta santé sont vraiment énormes.',exE:'It doesn\'t cost much and the health benefits are truly huge.'},
    {t:'v',fr:'convaincre (v)',wc:'v',en:'to convince',ex:'J\'espère t\'avoir convaincu de participer à cet événement avec moi.',exE:'I hope to have convinced you to take part in this event with me.'},
    {t:'v',fr:'persuader (v)',wc:'v',en:'to persuade',ex:'Je vais te persuader que c\'est exactement ce qu\'il te faut.',exE:'I\'m going to persuade you that it\'s exactly what you need.'},
    {t:'v',fr:'les avantages vs les inconvénients',wc:'nm',en:'the pros vs the cons',ex:'Si on analyse les avantages et les inconvénients, les avantages l\'emportent largement.',exE:'If we weigh up the pros and cons, the pros clearly outweigh the cons.'},
    {t:'v',fr:'sortir de sa zone de confort',wc:'loc',en:'to step out of one\'s comfort zone',ex:'Ce genre d\'activité te poussera à sortir de ta zone de confort de façon positive.',exE:'This kind of activity will push you to step outside your comfort zone in a positive way.'},
    {t:'v',fr:'avoir peur de / craindre',wc:'v',en:'to be afraid of / to fear',ex:'Je sais que tu as peur, mais c\'est justement ce qui rend l\'expérience intéressante.',exE:'I know you\'re afraid, but that\'s exactly what makes the experience interesting.'},
    {t:'v',fr:'ça vaut le coup / ça vaut la peine',wc:'loc',en:'it\'s worth it',ex:'Je te promets que ça vaut vraiment le coup de dépasser ses appréhensions.',exE:'I promise you it\'s truly worth overcoming your apprehensions.'},
    {t:'p',fr:'Qu\'est-ce qui te retient vraiment ?',en:'What\'s really holding you back?',ex:'Qu\'est-ce qui te retient vraiment — ce n\'est quand même pas la peur de l\'échec ?',exE:'What\'s really holding you back — it\'s not fear of failure, is it?'},
    {t:'p',fr:'Je suis sûr(e) que tu adoreras ça une fois que tu auras essayé.',en:'I\'m sure you\'ll love it once you\'ve tried it.',ex:'Je suis sûre que tu adoreras ça une fois que tu auras essayé la première fois.',exE:'I\'m sure you\'ll love it once you\'ve tried it the first time.'},
    {t:'v',fr:'enthousiasmant(e) (adj)',wc:'adj',en:'exciting / thrilling',ex:'L\'idée de découvrir quelque chose de nouveau est toujours enthousiasmante.',exE:'The idea of discovering something new is always exciting.'},
    {t:'p',fr:'Si ça ne te plaît pas, on ne recommence pas — promis.',en:'If you don\'t like it, we won\'t do it again — promise.',ex:'Si ça ne te plaît vraiment pas, on ne recommence pas — c\'est promis.',exE:'If you really don\'t like it, we won\'t do it again — that\'s a promise.'},
    {t:'v',fr:'une appréhension (nf)',wc:'nf',en:'an apprehension / worry',ex:'Toutes tes appréhensions vont disparaître dès que tu commenceras.',exE:'All your apprehensions will disappear as soon as you start.'},
    {t:'v',fr:'défi / relever un défi',wc:'nm',en:'challenge / to take on a challenge',ex:'Relever ce défi ensemble va renforcer notre amitié, j\'en suis convaincu.',exE:'Taking on this challenge together will strengthen our friendship, I\'m sure of it.'},
   ]},

   {id:'eoB_aventure',fr:'Aventure & sport',en:'Adventure & sports persuasion',c:'#7B5BD6',l:false,items:[
    {t:'p',fr:'Ce type d\'activité va vraiment faire monter l\'adrénaline !',en:'This type of activity will really get the adrenaline pumping!',ex:'Ce saut en chute libre va vraiment faire monter l\'adrénaline, tu verras !',exE:'This freefall jump will really get the adrenaline pumping, you\'ll see!'},

    {t:'v',fr:'l\'adrénaline (nf)',wc:'nf',en:'adrenaline',ex:'La montée d\'adrénaline que tu ressentiras vaut largement la peur du départ.',exE:'The rush of adrenaline you\'ll feel is well worth the initial fear.'},

    {t:'p',fr:'L\'équipement est fourni donc tu n\'as rien à acheter.',en:'The equipment is provided so you don\'t need to buy anything.',ex:'L\'équipement de ski est entièrement fourni donc tu n\'as rien à acheter ou louer.',exE:'All the ski equipment is provided so you don\'t need to buy or rent anything.'},
    {t:'v',fr:'incroyable / époustouflant(e)',wc:'adj',en:'incredible / breathtaking',ex:'La vue depuis le sommet est absolument époustouflante, tu ne le regretteras pas.',exE:'The view from the summit is absolutely breathtaking, you won\'t regret it.'},
    {t:'v',fr:'le paysage (nm)',wc:'nm',en:'the landscape / scenery',ex:'Les paysages que tu vas découvrir pendant cette randonnée sont magnifiques.',exE:'The landscapes you\'ll discover during this hike are magnificent.'},
    {t:'p',fr:'Ça te permettra de te dépasser et de découvrir tes propres limites.',en:'It will allow you to push yourself and discover your own limits.',ex:'Ce défi va te permettre de te dépasser et de découvrir tes vraies limites.',exE:'This challenge will allow you to push yourself and discover your true limits.'},
    {t:'v',fr:'une sensation forte (nf)',wc:'nf',en:'a thrill / an intense sensation',ex:'Les sensations fortes de la chute libre sont inoubliables, je t\'assure.',exE:'The thrills of skydiving are unforgettable, I promise you.'},
    {t:'p',fr:'On fait ça une seule fois dans sa vie — autant ne pas passer à côté.',en:'You only do this once in your life — might as well not miss out.',ex:'On fait de la chute libre une seule fois dans sa vie — autant ne pas passer à côté.',exE:'You only go skydiving once in your life — might as well not miss out.'},
    {t:'v',fr:'s\'entraîner (v)',wc:'v',en:'to train / to work out',ex:'S\'entraîner pour ce défi va te maintenir en forme tout au long de l\'année.',exE:'Training for this challenge will keep you in shape throughout the year.'},
    {t:'v',fr:'le courage',wc:'nm',en:'courage',ex:'Il faut beaucoup de courage pour sauter en parachute.',exE:'It takes a lot of courage to skydive.'},
    {t:'v',fr:'le risque',wc:'nm',en:'risk',ex:'Le risque est faible si on respecte les consignes.',exE:'The risk is low if you follow the instructions.'},
    {t:'v',fr:'un sommet',wc:'nm',en:'a summit',ex:'Le sommet offre une vue à couper le souffle.',exE:'The summit offers a breathtaking view.'},
    {t:'v',fr:'le parachute',wc:'nm',en:'parachute',ex:'Le saut en parachute est une expérience inoubliable.',exE:'Skydiving is an unforgettable experience.'},
    {t:'v',fr:'un saut',wc:'nm',en:'a jump',ex:'Le saut dure à peine une minute.',exE:'The jump lasts barely a minute.'},
    {t:'v',fr:'la plongée',wc:'nf',en:'scuba diving',ex:'La plongée permet de découvrir des fonds marins magnifiques.',exE:'Diving lets you discover magnificent seabeds.'},
    {t:'v',fr:'le rafting / le kayak',wc:'nm',en:'rafting / kayaking',ex:'Le rafting est idéal pour les groupes d\'amis.',exE:'Rafting is ideal for groups of friends.'},
    {t:'v',fr:'la voile',wc:'nf',en:'sailing',ex:'Venez essayer la voile ce week-end !',exE:'Come and try sailing this weekend!'},
    {t:'v',fr:'la tente',wc:'nf',en:'the tent',ex:'Nous avons dormi sous la tente au bord du lac.',exE:'We slept in a tent by the lake.'},
    {t:'v',fr:'une falaise',wc:'nf',en:'a cliff',ex:'L\'escalade de cette falaise est accessible aux débutants.',exE:'Climbing this cliff is accessible to beginners.'},
    {t:'v',fr:'un sentier',wc:'nm',en:'a trail',ex:'Le sentier traverse une forêt magnifique.',exE:'The trail goes through a beautiful forest.'},
    {t:'v',fr:'la forme physique',wc:'nf',en:'physical fitness',ex:'Il faut une bonne forme physique pour cette randonnée.',exE:'You need good physical fitness for this hike.'},
    {t:'v',fr:'l\'effort',wc:'nm',en:'effort',ex:'L\'effort en vaut vraiment la peine.',exE:'The effort is really worth it.'},
    {t:'v',fr:'sauter',wc:'v',en:'to jump',ex:'Vous allez sauter avec un moniteur expérimenté.',exE:'You will jump with an experienced instructor.'},
    {t:'v',fr:'grimper',wc:'v',en:'to climb',ex:'Nous allons grimper jusqu\'au refuge.',exE:'We are going to climb up to the mountain hut.'},
    {t:'v',fr:'nager / plonger',wc:'v',en:'to swim / to dive',ex:'Vous pourrez nager avec des tortues.',exE:'You\'ll be able to swim with turtles.'},
    {t:'v',fr:'vivre une expérience unique',wc:'loc',en:'to have a one-of-a-kind experience',ex:'Venez vivre une expérience unique en pleine nature !',exE:'Come and live a unique experience in the great outdoors!'},
    {t:'v',fr:'un souvenir inoubliable',wc:'nm',en:'an unforgettable memory',ex:'Cette journée restera un souvenir inoubliable.',exE:'This day will remain an unforgettable memory.'},
    {t:'v',fr:'repousser ses limites',wc:'loc',en:'to push one\'s limits',ex:'Cette activité vous aidera à repousser vos limites.',exE:'This activity will help you push your limits.'},
   ]},

   {id:'eoB_culture',fr:'Culture & créativité',en:'Culture & creativity persuasion',c:'#FF3D8B',l:false,items:[
    {t:'p',fr:'Tu vas découvrir un univers que tu ne connaissais pas du tout.',en:'You\'re going to discover a world you didn\'t know at all.',ex:'En allant à l\'opéra, tu vas découvrir un univers que tu ne connaissais vraiment pas.',exE:'By going to the opera, you\'re going to discover a world you didn\'t know at all.'},
    {t:'p',fr:'Ce n\'est pas aussi compliqué / ennuyeux que tu le crois.',en:'It\'s not as complicated / boring as you think.',ex:'Le théâtre d\'improvisation n\'est pas aussi compliqué que tu le crois — c\'est surtout drôle !',exE:'Improv theatre isn\'t as complicated as you think — it\'s mostly funny!'},
    {t:'p',fr:'C\'est une excellente façon de stimuler ta créativité.',en:'It\'s an excellent way to stimulate your creativity.',ex:'Les ateliers de poterie sont une excellente façon de stimuler ta créativité.',exE:'Pottery workshops are an excellent way to stimulate your creativity.'},
    {t:'p',fr:'Ça nous donnera quelque chose à faire ensemble et à partager.',en:'It\'ll give us something to do together and share.',ex:'Ça nous donnera quelque chose de concret à faire ensemble et à partager.',exE:'It\'ll give us something concrete to do together and to share.'},
    {t:'v',fr:'s\'épanouir (v)',wc:'v',en:'to thrive / to blossom / to flourish',ex:'Ce genre d\'activité créative te permettra vraiment de t\'épanouir.',exE:'This kind of creative activity will truly allow you to flourish.'},
    {t:'v',fr:'libérer sa créativité (loc)',wc:'loc',en:'to unleash one\'s creativity',ex:'Les ateliers d\'écriture poétique permettent vraiment de libérer sa créativité.',exE:'Poetry writing workshops truly allow you to unleash your creativity.'},
    {t:'v',fr:'s\'exprimer (v)',wc:'v',en:'to express oneself',ex:'La danse est une façon merveilleuse de s\'exprimer sans utiliser les mots.',exE:'Dance is a wonderful way to express oneself without using words.'},
    {t:'p',fr:'Tu n\'as pas besoin d\'être doué(e) pour apprécier / participer.',en:'You don\'t need to be talented to enjoy / participate.',ex:'Tu n\'as pas besoin d\'être doué en dessin pour apprécier un atelier de poterie.',exE:'You don\'t need to be talented at drawing to enjoy a pottery workshop.'},
    {t:'v',fr:'une expérience enrichissante (nf)',wc:'nf',en:'an enriching experience',ex:'Assister à un opéra est une expérience culturelle vraiment enrichissante.',exE:'Attending an opera is a truly enriching cultural experience.'},
    {t:'v',fr:'éveiller la curiosité (loc)',wc:'loc',en:'to awaken curiosity',ex:'Ce type de spectacle est fait pour éveiller la curiosité des spectateurs.',exE:'This type of show is designed to awaken the curiosity of the audience.'},
    {t:'p',fr:'Au pire, si tu n\'aimes pas, tu auras au moins essayé.',en:'At worst, if you don\'t like it, you\'ll have at least tried.',ex:'Au pire, si tu n\'aimes pas le concours de conte, tu auras au moins essayé quelque chose de nouveau.',exE:'At worst, if you don\'t like the storytelling competition, you\'ll have at least tried something new.'},
    {t:'v',fr:'s\'amuser (v)',wc:'v',en:'to have fun / enjoy oneself',ex:'Je suis sûre qu\'on va énormément s\'amuser au cours de danse.',exE:'I\'m sure we\'re going to have a great time at the dance class.'},
    {t:'v',fr:'créatif(ve) / artistique',wc:'adj',en:'creative / artistic',ex:'Tu as un côté très créatif que ces ateliers te permettront d\'explorer.',exE:'You have a very creative side that these workshops will allow you to explore.'},
    {t:'p',fr:'C\'est l\'occasion de te faire de nouveaux amis qui partagent les mêmes intérêts.',en:'It\'s a chance to make new friends who share the same interests.',ex:'C\'est l\'occasion parfaite de te faire de nouveaux amis qui partagent les mêmes intérêts.',exE:'It\'s the perfect chance to make new friends who share the same interests.'},
    {t:'v',fr:'le partage (nm)',wc:'nm',en:'sharing',ex:'Le partage d\'une expérience culturelle renforce toujours les liens d\'amitié.',exE:'Sharing a cultural experience always strengthens bonds of friendship.'},
    {t:'p',fr:'Tu risques d\'y prendre goût et de vouloir y retourner !',en:'You might develop a taste for it and want to go back!',ex:'Tu risques d\'y prendre goût au théâtre et de vouloir y retourner chaque semaine !',exE:'You might develop a taste for theatre and want to go back every week!'},
    {t:'v',fr:'y prendre goût (loc)',wc:'loc',en:'to develop a taste for it / get into it',ex:'Une fois qu\'on y a goûté, on y prend goût et on ne peut plus s\'en passer.',exE:'Once you\'ve tried it, you develop a taste for it and can\'t do without it.'},
    {t:'v',fr:'cultiver sa passion (loc)',wc:'loc',en:'to nurture one\'s passion',ex:'Ces ateliers sont parfaits pour cultiver ta passion pour l\'écriture créative.',exE:'These workshops are perfect for nurturing your passion for creative writing.'},
    {t:'p',fr:'On peut y aller une seule fois juste pour voir si ça nous plaît.',en:'We can go just once to see if we like it.',ex:'On peut y aller une seule fois juste pour voir si ça nous plaît — sans engagement.',exE:'We can go just once to see if we like it — with no commitment.'},
    {t:'v',fr:'une découverte (nf)',wc:'nf',en:'a discovery',ex:'Chaque nouvelle activité artistique est une découverte sur soi-même.',exE:'Every new artistic activity is a discovery about yourself.'},
    {t:'v',fr:'la peinture',wc:'nf',en:'painting',ex:'La peinture est une façon de s\'exprimer librement.',exE:'Painting is a way to express yourself freely.'},
    {t:'v',fr:'le dessin',wc:'nm',en:'drawing',ex:'Le dessin est accessible à tous les âges.',exE:'Drawing is accessible at any age.'},
    {t:'v',fr:'la musique',wc:'nf',en:'music',ex:'La musique rapproche les gens.',exE:'Music brings people together.'},
    {t:'v',fr:'le théâtre',wc:'nm',en:'theatre',ex:'Le théâtre aide à prendre confiance en soi.',exE:'Theatre helps build self-confidence.'},
    {t:'v',fr:'l\'écriture',wc:'nf',en:'writing',ex:'Un atelier d\'écriture peut libérer votre imagination.',exE:'A writing workshop can free your imagination.'},
    {t:'v',fr:'la photographie',wc:'nf',en:'photography',ex:'La photographie permet de voir le monde autrement.',exE:'Photography lets you see the world differently.'},
    {t:'v',fr:'la sculpture / la poterie',wc:'nf',en:'sculpture / pottery',ex:'La poterie est un excellent moyen de se détendre.',exE:'Pottery is an excellent way to relax.'},
    {t:'v',fr:'un atelier d\'art',wc:'nm',en:'an art workshop',ex:'Rejoignez notre atelier d\'art le samedi matin.',exE:'Join our art workshop on Saturday mornings.'},
    {t:'v',fr:'un instrument',wc:'nm',en:'an instrument',ex:'Quel instrument aimeriez-vous apprendre ?',exE:'Which instrument would you like to learn?'},
    {t:'v',fr:'une chorale',wc:'nf',en:'a choir',ex:'Notre chorale accueille tous les niveaux.',exE:'Our choir welcomes all levels.'},
    {t:'v',fr:'une troupe',wc:'nf',en:'a (theatre) troupe',ex:'La troupe prépare un nouveau spectacle.',exE:'The troupe is preparing a new show.'},
    {t:'v',fr:'l\'imagination',wc:'nf',en:'imagination',ex:'Les enfants ont une imagination débordante.',exE:'Children have a boundless imagination.'},
    {t:'v',fr:'l\'inspiration',wc:'nf',en:'inspiration',ex:'La nature est une grande source d\'inspiration.',exE:'Nature is a great source of inspiration.'},
    {t:'v',fr:'un talent caché',wc:'nm',en:'a hidden talent',ex:'Vous découvrirez peut-être un talent caché.',exE:'You might discover a hidden talent.'},
    {t:'v',fr:'créer',wc:'v',en:'to create',ex:'Vous allez créer votre propre œuvre.',exE:'You will create your own work.'},
    {t:'v',fr:'peindre / dessiner',wc:'v',en:'to paint / to draw',ex:'Nous allons peindre en plein air.',exE:'We are going to paint outdoors.'},
    {t:'v',fr:'chanter / danser',wc:'v',en:'to sing / to dance',ex:'Chanter en groupe fait du bien au moral.',exE:'Singing in a group lifts your spirits.'},
    {t:'v',fr:'jouer d\'un instrument',wc:'loc',en:'to play an instrument',ex:'Jouer d\'un instrument améliore la concentration.',exE:'Playing an instrument improves concentration.'},
    {t:'v',fr:'écrire',wc:'v',en:'to write',ex:'Écrire chaque jour aide à organiser ses idées.',exE:'Writing every day helps organize your ideas.'},
    {t:'v',fr:'improviser',wc:'v',en:'to improvise',ex:'Le théâtre apprend à improviser.',exE:'Theatre teaches you to improvise.'},
    {t:'v',fr:'la scène',wc:'nf',en:'the stage',ex:'Monter sur scène est une expérience inoubliable.',exE:'Going on stage is an unforgettable experience.'},
   ]},

   {id:'eoB_benevole',fr:'Bénévolat & causes',en:'Volunteering & social causes',c:'#007A42',l:false,items:[
    {t:'p',fr:'C\'est une façon concrète d\'aider les autres tout en te sentant utile.',en:'It\'s a concrete way to help others while feeling useful.',ex:'Le bénévolat est une façon concrète d\'aider les autres tout en te sentant utile.',exE:'Volunteering is a concrete way to help others while feeling useful.'},
    {t:'p',fr:'Tu vas tisser des liens forts avec les autres bénévoles.',en:'You\'ll forge strong bonds with the other volunteers.',ex:'Tu vas tisser des liens forts avec les autres bénévoles et créer de vraies amitiés.',exE:'You\'ll forge strong bonds with the other volunteers and create real friendships.'},
    {t:'p',fr:'Ça enrichit ton CV et démontre ton engagement.',en:'It boosts your CV and demonstrates your commitment.',ex:'Ce bénévolat va vraiment enrichir ton CV et démontrer ton engagement social.',exE:'This volunteering will really boost your CV and demonstrate your social commitment.'},
    {t:'p',fr:'Tu verras à quel point ça donne du sens à sa vie.',en:'You\'ll see how much meaning it gives to your life.',ex:'Tu verras à quel point faire du bénévolat donne du sens à sa vie quotidienne.',exE:'You\'ll see how much volunteering gives meaning to your everyday life.'},
    {t:'v',fr:'s\'engager (v)',wc:'v',en:'to commit / get involved',ex:'S\'engager dans une cause, même ponctuellement, a un impact réel sur la communauté.',exE:'Committing to a cause, even occasionally, has a real impact on the community.'},
    {t:'v',fr:'la solidarité (nf)',wc:'nf',en:'solidarity',ex:'Participer à cet événement, c\'est un beau geste de solidarité envers les autres.',exE:'Taking part in this event is a beautiful gesture of solidarity towards others.'},
    {t:'v',fr:'avoir un impact positif (loc)',wc:'loc',en:'to have a positive impact',ex:'Chaque heure de bénévolat a un impact positif réel sur ceux qui en bénéficient.',exE:'Every hour of volunteering has a real positive impact on those who benefit.'},
    {t:'v',fr:'épanouissant(e) (adj)',wc:'adj',en:'fulfilling / rewarding',ex:'Les témoignages de bénévoles montrent que c\'est une activité très épanouissante.',exE:'Volunteer testimonials show that it\'s a very fulfilling activity.'},
    {t:'p',fr:'Tu n\'as pas besoin de beaucoup de temps — même quelques heures suffisent.',en:'You don\'t need a lot of time — even a few hours are enough.',ex:'Tu n\'as pas besoin de beaucoup de temps — même quelques heures par mois suffisent.',exE:'You don\'t need a lot of time — even a few hours per month are enough.'},
    {t:'v',fr:'une cause (nf)',wc:'nf',en:'a cause',ex:'C\'est l\'occasion de soutenir une cause qui correspond à tes valeurs.',exE:'It\'s an opportunity to support a cause that matches your values.'},
    {t:'p',fr:'Tu vas rencontrer des gens extraordinaires qui partagent tes valeurs.',en:'You\'ll meet extraordinary people who share your values.',ex:'Tu vas rencontrer des gens extraordinaires qui partagent les mêmes valeurs que toi.',exE:'You\'ll meet extraordinary people who share the same values as you.'},
    {t:'v',fr:'le don de soi (nm)',wc:'nm',en:'self-giving / selflessness',ex:'Le don de soi est l\'une des choses les plus valorisantes qui soit.',exE:'Selflessness is one of the most rewarding things there is.'},
    {t:'v',fr:'contribuer à (v)',wc:'v',en:'to contribute to',ex:'Ce voyage bénévole te permettra de contribuer à quelque chose de vraiment important.',exE:'This volunteer trip will allow you to contribute to something truly important.'},
    {t:'p',fr:'Ça ne t\'engage à rien — tu peux essayer une seule fois pour voir.',en:'It doesn\'t commit you to anything — you can try it just once to see.',ex:'Ça ne t\'engage à rien pour l\'avenir — tu peux essayer une seule fois pour voir.',exE:'It doesn\'t commit you to anything for the future — you can try it just once to see.'},
    {t:'v',fr:'valorisant(e) (adj)',wc:'adj',en:'rewarding / gratifying',ex:'Aider les enfants dans leurs devoirs est une expérience vraiment valorisante.',exE:'Helping children with their homework is a truly gratifying experience.'},
    {t:'p',fr:'C\'est une belle manière de donner en retour à la société.',en:'It\'s a beautiful way to give back to society.',ex:'C\'est une belle manière de donner en retour à la société tout ce qu\'elle t\'a apporté.',exE:'It\'s a beautiful way to give back to society everything it has given you.'},
    {t:'v',fr:'l\'altruisme (nm)',wc:'nm',en:'altruism',ex:'L\'altruisme est une valeur que peu de gens pratiquent vraiment au quotidien.',exE:'Altruism is a value that few people truly practise in their daily lives.'},
    {t:'p',fr:'L\'expérience sera encore plus belle parce qu\'on la vivra ensemble.',en:'The experience will be even more beautiful because we\'ll live it together.',ex:'L\'expérience bénévole sera encore plus belle parce qu\'on la vivra ensemble.',exE:'The volunteer experience will be even more beautiful because we\'ll live it together.'},
    {t:'v',fr:'l\'impact social (nm)',wc:'nm',en:'social impact',ex:'L\'impact social de ce projet dépasse largement le simple geste individuel.',exE:'The social impact of this project far exceeds a simple individual gesture.'},
    {t:'v',fr:'concilier + deux noms (v)',wc:'v',en:'to combine / reconcile (two things)',ex:'Ce projet permet de concilier voyage et bénévolat de façon très enrichissante.',exE:'This project allows you to combine travel and volunteering in a very enriching way.'},
    {t:'v',fr:'un bénévole / une bénévole',wc:'nm/nf',en:'a volunteer',ex:'Nous cherchons des bénévoles pour le week-end.',exE:'We are looking for volunteers for the weekend.'},
    {t:'v',fr:'une ONG',wc:'nf',en:'an NGO',ex:'Cette ONG aide les enfants du monde entier.',exE:'This NGO helps children around the world.'},
    {t:'v',fr:'un don / donner',wc:'nm/v',en:'a donation / to give',ex:'Chaque don, même petit, est précieux.',exE:'Every donation, even a small one, is precious.'},
    {t:'v',fr:'aider',wc:'v',en:'to help',ex:'Vous pouvez aider en donnant quelques heures par semaine.',exE:'You can help by giving a few hours a week.'},
    {t:'v',fr:'une personne sans-abri',wc:'nf',en:'a homeless person',ex:'Nous distribuons des repas aux personnes sans-abri.',exE:'We distribute meals to homeless people.'},
    {t:'v',fr:'la banque alimentaire',wc:'nf',en:'the food bank',ex:'La banque alimentaire manque de volontaires.',exE:'The food bank is short of volunteers.'},
    {t:'v',fr:'un refuge',wc:'nm',en:'a shelter',ex:'Le refuge accueille des chiens abandonnés.',exE:'The shelter takes in abandoned dogs.'},
    {t:'v',fr:'une collecte',wc:'nf',en:'a collection / drive',ex:'Une collecte de vêtements aura lieu samedi.',exE:'A clothing drive will take place on Saturday.'},
    {t:'v',fr:'un repas',wc:'nm',en:'a meal',ex:'Nous servons un repas chaud chaque soir.',exE:'We serve a hot meal every evening.'},
    {t:'v',fr:'les personnes âgées',wc:'nfpl',en:'elderly people',ex:'Rendre visite aux personnes âgées leur fait du bien.',exE:'Visiting elderly people does them good.'},
    {t:'v',fr:'nettoyer',wc:'v',en:'to clean',ex:'Nous allons nettoyer la plage ensemble.',exE:'We\'re going to clean the beach together.'},
    {t:'v',fr:'planter',wc:'v',en:'to plant',ex:'Venez planter des arbres avec nous !',exE:'Come and plant trees with us!'},
    {t:'v',fr:'distribuer',wc:'v',en:'to distribute',ex:'Les bénévoles distribuent des repas dans la rue.',exE:'Volunteers distribute meals on the street.'},
    {t:'v',fr:'organiser',wc:'v',en:'to organize',ex:'Nous organisons un événement pour récolter des fonds.',exE:'We are organizing an event to raise funds.'},
    {t:'v',fr:'le temps libre',wc:'nm',en:'free time',ex:'Donnez un peu de votre temps libre à une bonne cause.',exE:'Give a bit of your free time to a good cause.'},
    {t:'v',fr:'rencontrer des gens',wc:'loc',en:'to meet people',ex:'Le bénévolat permet de rencontrer des gens formidables.',exE:'Volunteering lets you meet wonderful people.'},
    {t:'v',fr:'l\'entraide',wc:'nf',en:'mutual aid',ex:'L\'entraide est essentielle dans un quartier.',exE:'Mutual aid is essential in a neighbourhood.'},
    {t:'v',fr:'la générosité',wc:'nf',en:'generosity',ex:'Votre générosité change des vies.',exE:'Your generosity changes lives.'},
    {t:'v',fr:'un besoin',wc:'nm',en:'a need',ex:'Les besoins sont énormes cet hiver.',exE:'The needs are huge this winter.'},
    {t:'v',fr:'soutenir',wc:'v',en:'to support',ex:'Soutenez notre association en devenant membre.',exE:'Support our association by becoming a member.'},
    {t:'v',fr:'accompagner',wc:'v',en:'to accompany / support',ex:'Les bénévoles accompagnent les personnes isolées.',exE:'Volunteers support isolated people.'},
   ]},

   {id:'eoB_lifestyle',fr:'Style de vie & gastronomie',en:'Lifestyle & food persuasion',c:'#FFC400',l:true,items:[
    {t:'p',fr:'Tu vas épater tes amis avec ce que tu vas apprendre !',en:'You\'re going to impress your friends with what you\'ll learn!',ex:'Tu vas épater tous tes amis avec les plats que tu vas apprendre à cuisiner.',exE:'You\'re going to impress all your friends with the dishes you\'ll learn to cook.'},
    {t:'p',fr:'C\'est une compétence qui te servira toute ta vie.',en:'It\'s a skill that will serve you for life.',ex:'Apprendre à cuisiner des plats sains est une compétence qui te servira toute ta vie.',exE:'Learning to cook healthy meals is a skill that will serve you for life.'},
    {t:'p',fr:'Tu risques de faire de belles découvertes gustatives.',en:'You might make some wonderful taste discoveries.',ex:'Dans ce restaurant insolite, tu risques de faire de belles découvertes gustatives.',exE:'In this unusual restaurant, you\'re likely to make some wonderful taste discoveries.'},
    {t:'p',fr:'Ça nous permettra de faire quelque chose d\'original ensemble.',en:'It\'ll let us do something original together.',ex:'Faire de la cuisine communautaire nous permettra de faire quelque chose d\'original ensemble.',exE:'Community cooking will let us do something original together.'},
    {t:'v',fr:'culinaire (adj)',wc:'adj',en:'culinary',ex:'Ce cours culinaire va transformer ta façon de voir la nourriture.',exE:'This cookery course will transform the way you see food.'},
    {t:'v',fr:'les papilles gustatives (nfpl)',wc:'nf',en:'taste buds',ex:'Ce restaurant d\'insectes va éveiller tes papilles gustatives comme jamais !',exE:'This insect restaurant will awaken your taste buds like never before!'},
    {t:'v',fr:'éco-responsable (adj)',wc:'adj',en:'eco-responsible / environmentally friendly',ex:'Les repas à base d\'insectes sont très éco-responsables et nutritifs.',exE:'Insect-based meals are very eco-responsible and nutritious.'},

    {t:'v',fr:'adopter un animal (loc)',wc:'loc',en:'to adopt a pet',ex:'Adopter un chat, c\'est l\'une des décisions les plus gratifiantes qui soit.',exE:'Adopting a cat is one of the most rewarding decisions there is.'},

/* ═══════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════ */
let exam='EE', sec='A', ti=0, ci=0, filt='all', expanded=false;
let known={};
try{known=JSON.parse(localStorage.getItem('ecrire_k')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ecrire_k',JSON.stringify(known))}catch(e){}};

const topics=()=>D[exam][sec];
const topic=()=>topics()[ti];
const all=()=>topic().items;
const filtered=()=>{
  const a=all();
  if(filt==='all')return a.map((item,i)=>({item,oi:i}));
  return a.map((item,i)=>({item,oi:i})).filter(({item})=>item.t===filt[0]); // 'v' or 'p'
};
const entry=()=>filtered()[ci];
const kk=(topId,oi)=>`${topId}_${oi}`;

/* ═══════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════ */
function renderTopics(){
  const row=document.getElementById('topicsRow');
  row.innerHTML='';
  topics().forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tpill'+(i===ti?' on':'')+(t.l?' light':'');
    b.style.setProperty('--tc',t.c);
    b.textContent=t.fr;
    b.onclick=()=>{ti=i;ci=0;expanded=false;render()};
    row.appendChild(b);
  });
}

function renderCard(dir){
  const area=document.getElementById('cardArea');
  const f=filtered();

  if(!f.length){
    area.innerHTML='<div class="empty"><div style="font-size:2rem">🤷</div><div>No items for this filter</div></div>';
    updateChrome(0,0);return;
  }

  const {item,oi}=f[ci];
  const t=topic();
  const ki=kk(t.id,oi);
  const isKn=!!known[ki];
  const knCnt=f.filter(({oi:o})=>!!known[kk(t.id,o)]).length;

  updateChrome(ci+1,f.length,knCnt);

  document.getElementById('btnPrev').disabled=ci===0;
  document.getElementById('btnNext').disabled=ci===f.length-1;
  document.getElementById('knowBtn').className='know-btn'+(isKn?' on':'');
  document.getElementById('knowLabel').textContent=isKn?'Marked known':'Mark as known';

  const isV=item.t==='v';
  const typeBadge=isV
    ?`<div class="type-badge badge-v">Vocab${item.wc?` · <span class="wc">${item.wc}</span>`:''}</div>`
    :`<div class="type-badge badge-p">Phrase</div>`;

  const exId='ex'+Date.now();
  const card=document.createElement('div');
  card.className='card'+(dir?` enter-${dir}`:'');
  card.style.setProperty('--tc',t.c);
  card.innerHTML=`
    <div class="card-top"></div>
    <div class="card-scroll">
      <div class="badge-row">
        ${typeBadge}
        <div class="known-chip${isKn?' show':''}">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1"/></svg>
          Known
        </div>
      </div>
      <div class="card-fr">${item.fr}</div>
      <div class="card-en">${item.en}</div>
      <div class="card-divider"></div>
      <div class="ex-toggle${expanded?' open':''}" id="${exId}" onclick="toggleEx(this)">
        <svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1,1 6,6 11,1"/></svg>
        Example
      </div>
      <div class="ex-body">
        <div class="ex-fr">${item.ex}</div>
        <div class="ex-en-label">↳ in English</div>
        <div class="ex-en">${item.exE}</div>
      </div>
    </div>`;
  area.innerHTML='';
  area.appendChild(card);
}

function updateChrome(cur,tot,knCnt){
  document.getElementById('progFill').style.width=tot?((cur-1)/tot*100)+'%':'0%';
  document.getElementById('progLabel').textContent=tot?`${cur} / ${tot}`:'— / —';
  document.getElementById('knownRow').textContent=knCnt>0?`${knCnt} ✓`:'';
  ['A','B'].forEach(s=>document.getElementById('btn'+s).className=(sec===s?'on':''));
  ['EE','EO'].forEach(e=>document.getElementById('btn'+e).className=(exam===e?'on':''));
  ['All','Vocab','Phrase'].forEach(id=>{
    const f2=id.toLowerCase();
    document.getElementById('f'+id).className='filt-tab'+(filt===f2?'':filt==='all'&&f2==='all'?'':'')+((filt===f2||(f2==='all'&&filt==='all'))?'on':' on'.replace(' on',''));
  });
  // simpler filter sync:
  document.getElementById('fAll').className='filt-tab'+(filt==='all'?' on':'');
  document.getElementById('fVocab').className='filt-tab'+(filt==='vocab'?' on':'');
  document.getElementById('fPhrase').className='filt-tab'+(filt==='phrase'?' on':'');
}

function render(dir){
  renderTopics();
  renderCard(dir);
  document.documentElement.style.setProperty('--accent',topic().c);
  ['A','B'].forEach(s=>document.getElementById('btn'+s).className=(sec===s?'on':''));
  ['EE','EO'].forEach(e=>document.getElementById('btn'+e).className=(exam===e?'on':''));
}

/* ═══════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════ */
function setSection(s){sec=s;ti=0;ci=0;expanded=false;render()}
function setExam(e){exam=e;sec='A';ti=0;ci=0;expanded=false;render()}
function setFilter(f){
  filt=f; ci=0; expanded=false;
  document.getElementById('fAll').className='filt-tab'+(f==='all'?' on':'');
  document.getElementById('fVocab').className='filt-tab'+(f==='vocab'?' on':'');
  document.getElementById('fPhrase').className='filt-tab'+(f==='phrase'?' on':'');
  render();
}

function navigate(dir,anim=true){
  const f=filtered();
  const nx=ci+dir;
  if(nx<0||nx>=f.length)return;
  if(anim){
    const old=document.querySelector('.card');
    if(old){old.className='card '+(dir===1?'exit-fwd':'exit-back'); old.addEventListener('animationend',()=>old.remove(),{once:true});}
    ci=nx; expanded=false;
    renderCard(dir===1?'fwd':'back');
    renderTopics();
    document.getElementById('btnPrev').disabled=ci===0;
    document.getElementById('btnNext').disabled=ci===filtered().length-1;
  } else {
    ci=nx; expanded=false; render();
  }
}

function toggleKnown(){
  const {oi}=entry();
  const ki=kk(topic().id,oi);
  if(known[ki]){delete known[ki]}else{known[ki]=true}
  save();
  const f=filtered();
  const knCnt=f.filter(({oi:o})=>!!known[kk(topic().id,o)]).length;
  updateChrome(ci+1,f.length,knCnt);
  const btn=document.getElementById('knowBtn');
  btn.className='know-btn'+(known[ki]?' on':'');
  document.getElementById('knowLabel').textContent=known[ki]?'Marked known':'Mark as known';
  const chip=document.querySelector('.known-chip');
  if(chip){chip.className='known-chip'+(known[ki]?' show':'')}
  if(known[ki]&&ci<f.length-1){setTimeout(()=>navigate(1),400)}
}

function toggleEx(el){
  expanded=!expanded;
  el.className='ex-toggle'+(expanded?' open':'');
}

/* ═══════════════════════════════════════════════
   KEYBOARD + SWIPE
   ═══════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')navigate(1);
  if(e.key==='ArrowLeft')navigate(-1);
  if(e.key===' '){e.preventDefault();toggleKnown()}
  if(e.key==='e'||e.key==='E'){const el=document.querySelector('.ex-toggle');if(el)toggleEx(el)}
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>45)navigate(dx<0?1:-1);
},{passive:true});

render();
</script>
</body>
</html>
