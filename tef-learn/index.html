<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TEF — Écrire &amp; Parler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF4; --ink:#16121F; --soft:#6D6480; --hair:#E3DCCD; --sunk:#F0EAD9;
  --vert:#007A42; --rouge:#C4221C;
  --pop:3px 3px 0 var(--ink);
  --ff:'Poppins',sans-serif;
  --ui:'Poppins',sans-serif;
  --accent:#7B5BD6;
  --bar: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ui);
  min-height:100dvh; height:100dvh;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ── TOP CHROME ─────────────────────────────── */
.topbar{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  border-bottom:1.5px solid var(--hair);
  background:var(--paper);
  flex-shrink:0;
}
/* row 1: wordmark left, A/B buttons right — no middle element */
.topbar-r1{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
/* row 2: Section A/B buttons full width */
.topbar-r2{
  display:flex;
  align-items:center;
}
/* row 3: progress bar */
.topbar-r3{
  display:flex;
  align-items:center;
  gap:8px;
}
.wordmark{
  font-family:var(--ff); font-size:1.15rem; font-weight:700;
  letter-spacing:-0.03em; line-height:1;
  white-space:nowrap;
}
.wordmark em{color:var(--accent); font-style:normal}

.prog-track{flex:1; height:4px; background:var(--hair); border-radius:2px; overflow:hidden; min-width:0}
.prog-fill{height:100%; background:var(--accent); border-radius:2px; transition:width .3s}
.prog-label{font-size:0.7rem; font-weight:600; color:var(--soft); white-space:nowrap}

.seg{
  display:flex; gap:3px; background:var(--hair);
  border-radius:8px; padding:3px;
}
.seg button{
  font-family:var(--ui); font-size:0.72rem; font-weight:600;
  border:none; background:transparent; color:var(--soft);
  padding:5px 10px; border-radius:5px; cursor:pointer;
  transition:background .15s,color .15s; white-space:nowrap;
}
.seg button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* seg full-width in topbar-r2 */
.topbar-r2 .seg{width:100%}
.topbar-r2 .seg button{flex:1; text-align:center}

/* ── TOPICS ─────────────────────────────────── */
.topics-wrap{
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding:10px 16px 6px; flex-shrink:0;
}
.topics-wrap::-webkit-scrollbar{display:none}
.topics-row{display:flex; gap:6px; width:max-content}
.tpill{
  font-family:var(--ui); font-size:0.75rem; font-weight:600;
  border:2px solid var(--hair); padding:5px 12px; border-radius:100px;
  cursor:pointer; background:transparent; color:var(--ink);
  transition:all .15s; white-space:nowrap;
}
.tpill.on{
  background:var(--tc,var(--accent)); border-color:var(--tc,var(--accent));
  color:#fff; box-shadow:var(--pop);
}
.tpill.on.light{color:var(--ink)}

/* ── FILTER ─────────────────────────────────── */
.filter-row{
  display:flex; align-items:center; gap:8px;
  padding:10px 16px 0; flex-shrink:0;
}
.filt-tabs{display:flex; gap:3px; background:var(--hair); border-radius:7px; padding:3px}
.filt-tab{
  font-family:var(--ui); font-size:0.7rem; font-weight:600;
  border:none; background:transparent; color:var(--soft);
  padding:4px 10px; border-radius:4px; cursor:pointer;
  transition:all .15s; white-space:nowrap;
}
.filt-tab.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lvl-row{display:flex;gap:6px;padding:8px 16px 10px;overflow-x:auto;scrollbar-width:none}
.lvl-row::-webkit-scrollbar{display:none}
.lvl-tab{flex:none;border:1px solid var(--sunk);background:transparent;color:var(--soft);font:600 .72rem/1 inherit;font-family:inherit;padding:7px 12px;border-radius:99px;cursor:pointer}
.lvl-tab i{font-style:normal;opacity:.6;margin-left:3px;font-weight:500}
.lvl-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lv-b{background:transparent;border:1px solid currentColor}
.lv-1{color:#16a34a}.lv-2{color:#0A6CF0}.lv-3{color:#a855f7}
.known-badge-row{margin-left:auto; font-size:0.72rem; font-weight:600; color:var(--vert)}

/* ── CARD AREA ───────────────────────────────── */
.card-area{
  flex:1; overflow:hidden;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px 16px 8px;
  position:relative;
}

/* ── CARD ────────────────────────────────────── */
.card{
  width:100%; max-width:480px;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:14px;
  box-shadow:var(--pop);
  overflow:hidden;
  cursor:pointer; user-select:none;
  position:relative;
  display:flex; flex-direction:column;
  /* fill available height between filter and bottom bar */
  max-height:100%;
  transition:transform .18s cubic-bezier(.2,1.4,.4,1), box-shadow .18s, opacity .15s;
}
.card:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}

/* swipe animations */
@keyframes swipeFwd {
  from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(-40px)}
}
@keyframes swipeBack {
  from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(40px)}
}
@keyframes enterFwd  { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:none} }
@keyframes enterBack { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:none} }
.card.exit-fwd   { animation:swipeFwd  .2s ease forwards }
.card.exit-back  { animation:swipeBack .2s ease forwards }
.card.enter-fwd  { animation:enterFwd  .22s cubic-bezier(.2,1.4,.4,1) forwards }
.card.enter-back { animation:enterBack .22s cubic-bezier(.2,1.4,.4,1) forwards }
@media (prefers-reduced-motion:reduce){
  .card.exit-fwd,.card.exit-back,.card.enter-fwd,.card.enter-back{animation:none}
}

.card-top{height:6px; background:var(--tc,var(--accent)); flex-shrink:0}
.card-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 22px 18px}

/* badge row — type badge + optional known chip, side by side, no overlap */
.badge-row{display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap}
.type-badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:0.65rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 10px; border-radius:6px; flex-shrink:0;
}
.badge-v{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent); color:var(--tc,var(--accent))}
.badge-p{background:var(--sunk); color:var(--soft)}
.wc{font-weight:400; opacity:.7; letter-spacing:.01em; text-transform:none}
/* known chip — inline, no absolute positioning */
.known-chip{
  display:none; align-items:center; gap:4px;
  font-size:0.65rem; font-weight:700; letter-spacing:.04em;
  color:var(--vert); flex-shrink:0;
}
.known-chip.show{display:flex}
.known-chip svg{width:12px;height:12px;fill:none;stroke:var(--vert);stroke-width:2.5}

/* french — the star: big, bold, optically weighted */
.card-fr{
  font-family:var(--ff);
  font-size:clamp(1.65rem,6.5vw,2.1rem);
  font-weight:800; line-height:1.15; letter-spacing:-0.03em;
  color:var(--ink); margin-bottom:14px;
}

/* english translation — always visible, medium weight, clear size */
.card-en{
  font-size:1rem; font-weight:500; font-style:italic;
  color:var(--soft); line-height:1.5; padding-left:2px;
}

/* divider between phrase and example */
.card-divider{height:1.5px; background:var(--hair); margin:18px 0 0}

/* example */
.ex-toggle{
  display:flex; align-items:center; gap:8px;
  padding:14px 0 0;
  font-size:0.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--tc,var(--accent)); cursor:pointer; user-select:none;
}
.ex-toggle svg{width:12px;height:12px;transition:transform .22s;flex-shrink:0}
.ex-toggle.open svg{transform:rotate(180deg)}
.ex-body{display:none; padding-top:12px; padding-bottom:4px}
.ex-toggle.open + .ex-body{display:block}
.ex-fr{
  font-family:var(--ff); font-style:italic;
  font-size:0.97rem; line-height:1.65; color:var(--ink); margin-bottom:8px;
}
/* english translation of example — clearly separated */
.ex-en-label{
  font-size:0.65rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--soft); opacity:.5; margin-bottom:4px;
}
.ex-en{font-size:0.88rem; font-weight:400; color:var(--soft); line-height:1.55}

/* ── BOTTOM NAV ──────────────────────────────── */
.bottom-nav{
  flex-shrink:0;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px calc(10px + var(--bar));
  border-top:1.5px solid var(--hair);
  background:var(--paper);
}
.nav-btn{
  width:46px; height:46px; border-radius:50%;
  border:2px solid var(--ink); background:var(--paper);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--pop); transition:transform .1s,box-shadow .1s; flex-shrink:0;
}
.nav-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.nav-btn:disabled{opacity:.25; cursor:default; box-shadow:none}
.nav-btn svg{width:16px;height:16px}
.know-btn{
  flex:1; height:46px; border-radius:100px;
  border:2px solid var(--ink); background:var(--paper);
  font-family:var(--ui); font-size:0.85rem; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  box-shadow:var(--pop); transition:transform .1s,box-shadow .1s,background .15s,color .15s;
  color:var(--ink);
}
.know-btn.on{background:var(--vert); color:#fff; border-color:var(--vert)}
.know-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.know-btn svg{width:14px;height:14px}

/* ── EMPTY ───────────────────────────────────── */
.empty{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:10px; color:var(--soft); font-size:.9rem; text-align:center;
}

/* ── QUICK TEST (overlay) ───────────────────── */
.quiz-btn{
  font-family:var(--ui); font-size:0.7rem; font-weight:700; color:#fff;
  background:var(--accent); border:2px solid var(--ink); border-radius:100px;
  padding:4px 11px 4px 9px; margin-left:10px; cursor:pointer;
  display:flex; align-items:center; gap:5px; box-shadow:2px 2px 0 var(--ink);
  transition:transform .1s, box-shadow .1s; white-space:nowrap;
}
.quiz-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.quiz-btn svg{width:11px; height:11px}
#quiz{
  position:fixed; inset:0; z-index:100; background:var(--paper);
  display:none; flex-direction:column; padding-top:env(safe-area-inset-top,0px);
}
#quiz.show{display:flex; animation:qin .25s cubic-bezier(.2,.8,.3,1)}
@keyframes qin{from{opacity:0; transform:translateY(28px)}to{opacity:1; transform:none}}
.q-top{display:flex; align-items:center; gap:10px; padding:12px 16px 6px; flex-shrink:0}
.q-x{
  width:34px; height:34px; border-radius:50%; border:2px solid var(--hair);
  background:none; color:var(--soft); font-size:1rem; cursor:pointer; flex-shrink:0;
}
.q-track{flex:1; height:6px; background:var(--hair); border-radius:3px; overflow:hidden}
.q-fill{height:100%; width:0; background:var(--accent); border-radius:3px; transition:width .3s}
.q-count{font-size:0.72rem; font-weight:700; color:var(--soft); min-width:42px; text-align:right}
.q-streak{font-size:0.72rem; font-weight:700; color:#FF6B2C; min-width:30px; opacity:0; transition:opacity .2s}
.q-streak.on{opacity:1}
#qbody{flex:1; display:flex; flex-direction:column; min-height:0}

/* setup */
.q-setup{flex:1; overflow-y:auto; padding:8px 20px 12px; max-width:480px; width:100%; margin:0 auto}
.q-h{font-size:1.5rem; font-weight:800; letter-spacing:-0.03em; margin-top:6px}
.q-sub{font-size:0.8rem; color:var(--soft); margin:4px 0 14px}
.q-grp{margin-bottom:14px}
.q-lab{font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-bottom:6px}
.q-chips{display:flex; gap:6px; flex-wrap:wrap}
.q-chip{
  font-family:var(--ui); font-size:0.78rem; font-weight:600; color:var(--ink);
  background:transparent; border:2px solid var(--hair); border-radius:100px;
  padding:6px 13px; cursor:pointer; transition:all .12s;
}
.q-chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.q-foot{padding:10px 20px calc(14px + var(--bar)); max-width:480px; width:100%; margin:0 auto; flex-shrink:0}
.q-go{
  width:100%; font-family:var(--ui); font-size:0.95rem; font-weight:700; color:#fff;
  background:var(--accent); border:2px solid var(--ink); border-radius:12px;
  padding:14px; cursor:pointer; box-shadow:var(--pop);
}
.q-go:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.q-go:disabled{opacity:.4; box-shadow:none}
.q-note{font-size:0.74rem; color:var(--soft); text-align:center; margin-top:8px}

/* run */
.q-stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 16px; perspective:1200px}
.q-drag{
  width:100%; max-width:480px; height:min(100%,440px); position:relative;
  touch-action:pan-y; will-change:transform; user-select:none; -webkit-user-select:none;
}
.q-drag.fly{transition:transform .28s cubic-bezier(.4,0,.8,.6), opacity .28s}
.q-drag.back{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.q-flip{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.q-drag.rev .q-flip{transform:rotateY(180deg)}
.q-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--paper); border:2px solid var(--ink); border-top:8px solid var(--tc,var(--accent));
  border-radius:14px; box-shadow:var(--pop); overflow-y:auto; padding:18px 20px;
  display:flex; flex-direction:column; cursor:pointer;
}
.q-back{transform:rotateY(180deg)}
.q-mid{margin:auto 0; text-align:center}
.q-tag{display:flex; justify-content:space-between; align-items:center; font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft)}
.q-prompt{font-size:1.65rem; font-weight:700; line-height:1.25; letter-spacing:-0.02em; margin:auto 0; text-align:center}
.q-prompt.long{font-size:1.2rem; line-height:1.4}
.q-hint{text-align:center; font-size:0.72rem; color:var(--soft); font-weight:500}
.q-small{font-size:0.8rem; color:var(--soft); font-weight:500; margin-bottom:8px}
.q-ans{font-size:1.5rem; font-weight:800; line-height:1.25; letter-spacing:-0.02em}
.q-ans.long{font-size:1.15rem; line-height:1.4}
.q-exbox{margin-top:16px; padding-top:12px; border-top:1.5px dashed var(--hair); text-align:left}
.q-exfr{font-size:0.88rem; font-weight:600; line-height:1.5}
.q-exen{font-size:0.8rem; color:var(--soft); line-height:1.5; margin-top:4px}
.q-stamp{
  position:absolute; top:22px; z-index:5; pointer-events:none; opacity:0;
  font-weight:800; font-size:1.1rem; letter-spacing:.06em; padding:3px 10px;
  border:3px solid; border-radius:8px; background:var(--paper);
}
.q-stamp.ok{right:18px; color:var(--vert); transform:rotate(10deg)}
.q-stamp.no{left:18px; color:var(--rouge); transform:rotate(-10deg)}
.q-actions{display:flex; gap:10px; padding:10px 16px calc(12px + var(--bar)); max-width:480px; width:100%; margin:0 auto; flex-shrink:0}
.q-act{
  flex:1; font-family:var(--ui); font-size:0.9rem; font-weight:700; border:2px solid var(--ink);
  border-radius:12px; padding:13px 8px; cursor:pointer; box-shadow:var(--pop); color:#fff;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.q-act:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.q-act svg{width:15px; height:15px}
.q-act.rev{background:var(--ink)}
.q-act.miss{background:var(--rouge)}
.q-act.got{background:var(--vert)}
.q-keys{text-align:center; font-size:0.66rem; color:var(--soft); padding-bottom:calc(8px + var(--bar)); margin-top:-4px}
@media (hover:none){.q-keys{display:none}}

/* done */
.q-done{flex:1; overflow-y:auto; padding:6px 20px 12px; max-width:480px; width:100%; margin:0 auto; text-align:center}
.q-ring{width:132px; height:132px; margin:10px auto 6px; position:relative}
.q-ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.q-ring circle{fill:none; stroke-width:10; stroke-linecap:round}
.q-ring .bg{stroke:var(--hair)}
.q-ring .fg{stroke:var(--vert); stroke-dasharray:276.46; stroke-dashoffset:276.46; transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1) .15s}
.q-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.9rem; font-weight:800; letter-spacing:-0.04em}
.q-stats{display:flex; justify-content:center; gap:18px; font-size:0.78rem; font-weight:600; color:var(--soft); margin:8px 0 14px}
.q-stats b{color:var(--ink); font-weight:800}
.q-mlist{text-align:left; border:2px solid var(--ink); border-radius:12px; box-shadow:var(--pop); overflow:hidden; margin-bottom:6px}
.q-mhead{font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--rouge); padding:8px 12px; background:var(--sunk)}
.q-mrow{padding:8px 12px; border-top:1.5px solid var(--hair); font-size:0.82rem; line-height:1.4}
.q-mrow b{font-weight:700}
.q-mrow span{color:var(--soft)}
.q-donebtns{display:flex; flex-direction:column; gap:8px}
.q-sec{
  font-family:var(--ui); font-size:0.85rem; font-weight:700; color:var(--ink); background:transparent;
  border:2px solid var(--ink); border-radius:12px; padding:12px; cursor:pointer;
}
.q-sec:disabled{opacity:.5}

/* ── LISTEN (recorded audio + hands-free) ───── */
.listen-btn,.spk{display:none}
body.has-audio .listen-btn{display:flex}
body.has-audio .spk{display:flex}
.listen-btn{
  font-family:var(--ui); font-size:0.7rem; font-weight:700; color:var(--ink);
  background:var(--paper); border:2px solid var(--ink); border-radius:100px;
  padding:4px 11px 4px 9px; margin-left:8px; cursor:pointer;
  align-items:center; gap:5px; box-shadow:2px 2px 0 var(--ink); white-space:nowrap;
}
.listen-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.listen-btn.on{background:var(--ink); color:var(--paper)}
.listen-btn svg{width:12px; height:12px}
.spk{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--ink);
  background:var(--paper); color:var(--ink); cursor:pointer; flex-shrink:0;
  align-items:center; justify-content:center; box-shadow:2px 2px 0 var(--ink); margin-left:auto;
}
.spk:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.spk svg{width:13px; height:13px}
.known-chip + .spk{margin-left:8px}
.ex-spk{width:24px; height:24px; margin-left:8px; box-shadow:1px 1px 0 var(--ink)}
.ex-spk svg{width:11px; height:11px}
.ex-en-label{display:flex; align-items:center}
.card-fr.sp,.card-en.sp,.ex-fr.sp{color:var(--tc,var(--accent)); transition:color .2s}
.player{
  display:none; align-items:center; gap:8px; flex-shrink:0;
  margin:0 12px 8px; padding:8px 10px; background:var(--ink); color:var(--paper);
  border-radius:14px; box-shadow:0 4px 14px rgba(22,18,31,.25);
}
.player.show{display:flex; animation:qin .25s cubic-bezier(.2,.8,.3,1)}
.pl-play{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--accent);
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.pl-play svg{width:15px; height:15px}
.pl-info{flex:1; min-width:0}
.pl-t{font-size:0.82rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  {id:'sujA_insolite',fr:'★ Insolite',en:'Odd situations',c:'#F08A00',l:false,items:[

    {t:'v',lv:3,fr:'le sang-froid',wc:'nm',en:'composure / cool-headedness',ex:'Il a gardé son sang-froid face à une situation pourtant terrifiante.',exE:'He kept his composure despite a truly terrifying situation.'},
    {t:'v',lv:2,fr:'débrouillard(e)',wc:'adj',en:'resourceful / good at finding solutions',ex:'Cette fillette de huit ans s\'est révélée particulièrement débrouillarde.',exE:'This eight-year-old girl proved to be particularly resourceful.'},
    {t:'v',lv:1,fr:'tomber à l\'eau',wc:'loc',en:'to fall into the water',ex:'Le petit garçon est tombé à l\'eau sans que personne ne le voie.',exE:'The little boy fell into the water without anyone seeing.'},
    {t:'v',lv:2,fr:'faire preuve de + nom',wc:'loc',en:'to show / demonstrate (quality)',ex:'Il a fait preuve d\'un courage et d\'un calme remarquables.',exE:'He showed remarkable courage and composure.'},
    {t:'v',lv:3,fr:'téméraire',wc:'adj',en:'daring / reckless / bold',ex:'Son geste téméraire a permis d\'éviter une catastrophe.',exE:'His daring action helped avoid a catastrophe.'},
    {t:'v',lv:1,fr:'une bêtise',wc:'nf',en:'mischief / a silly thing to do',ex:'Les écoliers ont fait une bêtise en creusant dans le jardin du voisin.',exE:'The schoolchildren got into mischief digging in the neighbour\'s garden.'},
    {t:'v',lv:2,fr:'incroyable mais vrai',wc:'loc',en:'unbelievable but true',ex:'Incroyable mais vrai, l\'enfant de sept ans a réussi à conduire le bus scolaire.',exE:'Unbelievable but true, the seven-year-old managed to drive the school bus.'},
    {t:'v',lv:3,fr:'se distinguer',wc:'v',en:'to distinguish oneself / stand out',ex:'Ce jeune garçon s\'est distingué par son acte héroïque.',exE:'This young boy distinguished himself through his heroic act.'},
    {t:'v',lv:1,fr:'les secours / les services d\'urgence',wc:'nmpl',en:'emergency services / rescue services',ex:'Les secours sont intervenus très rapidement après l\'accident.',exE:'Emergency services intervened very quickly after the accident.'},
  
    {t:'p',h:1,lv:1,fr:'avoir l\'air + adj',en:'to seem / look (adjective)',ex:'L\'enfant avait l\'air inquiet depuis le début de la journée.',exE:'The child looked worried from the start of the day.'},
    {t:'p',h:1,fr:'tout(e) seul(e) / sans aide',en:'all alone / without help',ex:'Walid a réussi à arrêter le bus tout seul, sans aide d\'un adulte.',exE:'Walid managed to stop the bus all by himself, without help from an adult.'},
    {t:'p',h:1,lv:1,fr:'être fier / fière de quelqu\'un',en:'to be proud of someone',ex:'Ses parents étaient tellement fiers de ce qu\'il avait accompli.',exE:'His parents were so proud of what he had accomplished.'},
    {t:'p',h:1,lv:2,fr:'ne pas réfléchir avant d\'agir',en:'to act without thinking',ex:'Il n\'a pas réfléchi avant d\'agir — c\'est instinctif chez lui.',exE:'He didn\'t think before acting — it comes instinctively to him.'},
    {t:'p',h:1,lv:2,fr:'tout le monde était admiratif',en:'everyone was full of admiration',ex:'Après la nouvelle, tout le monde était admiratif devant son geste.',exE:'After the news broke, everyone was full of admiration for his act.'},
    {t:'p',h:1,lv:1,fr:'en parler à ses parents',en:'to tell one\'s parents about it',ex:'Il n\'a pas eu peur d\'en parler à ses parents dès son retour.',exE:'He wasn\'t afraid to tell his parents about it as soon as he got home.'},
    {t:'v',h:1,fr:'bravo / félicitations',wc:'interj',en:'well done / congratulations',ex:'Bravo ! Tu as réussi à faire quelque chose qu\'un adulte n\'aurait pas osé faire.',exE:'Well done! You managed to do something that an adult wouldn\'t have dared to do.'},
    {t:'v',lv:2,fr:'un geste héroïque',wc:'nm',en:'a heroic act / gesture',ex:'Son geste héroïque a été salué par toute la ville.',exE:'His heroic act was praised by the entire town.'},
    {t:'v',lv:1,fr:'avoir peur / prendre peur',wc:'loc',en:'to be scared / get frightened',ex:'Malgré la situation, il n\'a pas pris peur et a gardé la tête froide.',exE:'Despite the situation, he didn\'t get frightened and kept a cool head.'},
    {t:'v',lv:1,fr:'réagir vite / rapidement',wc:'loc',en:'to react quickly',ex:'Il a fallu réagir très vite pour éviter un accident.',exE:'It was necessary to react very quickly to avoid an accident.'},
    {t:'v',lv:1,fr:'incroyable / remarquable',wc:'adj',en:'incredible / remarkable',ex:'La réaction de cet enfant était vraiment incroyable pour son âge.',exE:'This child\'s reaction was truly incredible for his age.'},
    {t:'v',lv:1,fr:'un enfant de + âge',wc:'loc',en:'a child of (age)',ex:'Un enfant de sept ans a réussi à conduire le bus scolaire.',exE:'A seven-year-old child managed to drive the school bus.'},
    {t:'v',h:1,fr:'sauver la mise',wc:'loc',en:'to save the day / save the situation',ex:'Grâce à son intervention, il a sauvé la mise pour tout le groupe.',exE:'Thanks to his intervention, he saved the day for the whole group.'},
    {t:'v',h:1,fr:'la rue',wc:'nf',en:'the street',ex:'L\'enfant a traversé la rue sans regarder.',exE:'The child crossed the street without looking.'},
    {t:'v',h:1,fr:'un jouet',wc:'nm',en:'a toy',ex:'Le petit garçon a perdu son jouet préféré.',exE:'The little boy lost his favourite toy.'},
    {t:'v',h:1,fr:'un ballon',wc:'nm',en:'a ball / a balloon',ex:'Le ballon a roulé jusque sur la route.',exE:'The ball rolled all the way onto the road.'},
    {t:'v',h:1,fr:'un vélo',wc:'nm',en:'a bicycle',ex:'Elle apprend à faire du vélo sans roulettes.',exE:'She is learning to ride a bike without training wheels.'},
    {t:'v',h:1,fr:'la cour de récréation',wc:'nf',en:'the playground (at school)',ex:'Les enfants jouent dans la cour de récréation.',exE:'The children play in the schoolyard.'},

    {t:'v',h:1,fr:'un voisin / une voisine',wc:'nm/nf',en:'a neighbour',ex:'Une voisine a entendu les cris et a appelé la police.',exE:'A neighbour heard the shouts and called the police.'},
    {t:'v',lv:1,fr:'un pompier',wc:'nm',en:'a firefighter',ex:'Un pompier est monté dans l\'arbre pour sauver le chat.',exE:'A firefighter climbed the tree to save the cat.'},
    {t:'v',h:1,fr:'une rivière',wc:'nf',en:'a river',ex:'Le garçon est tombé dans la rivière.',exE:'The boy fell into the river.'},
    {t:'v',h:1,fr:'un héros / une héroïne',wc:'nm/nf',en:'a hero / heroine',ex:'La petite fille est devenue une héroïne locale.',exE:'The little girl became a local heroine.'},
    {t:'v',lv:1,fr:'crier',wc:'v',en:'to shout / scream',ex:'Il a crié de toutes ses forces pour appeler à l\'aide.',exE:'He shouted with all his might to call for help.'},
    {t:'v',lv:1,fr:'pleurer',wc:'v',en:'to cry',ex:'Le bébé pleurait parce qu\'il avait faim.',exE:'The baby was crying because he was hungry.'},
    {t:'v',h:1,fr:'courir',wc:'v',en:'to run',ex:'Elle a couru jusqu\'à la maison pour prévenir sa mère.',exE:'She ran all the way home to warn her mother.'},
    {t:'v',lv:1,fr:'tomber',wc:'v',en:'to fall',ex:'Il est tombé de son vélo en descendant la colline.',exE:'He fell off his bike going down the hill.'},
    {t:'v',lv:1,fr:'se cacher',wc:'v',en:'to hide',ex:'Les enfants se sont cachés derrière un arbre.',exE:'The children hid behind a tree.'},
    {t:'v',h:1,fr:'se perdre',wc:'v',en:'to get lost',ex:'Le petit s\'est perdu dans le grand magasin.',exE:'The little one got lost in the department store.'},
    {t:'v',h:1,fr:'retrouver',wc:'v',en:'to find again / to locate',ex:'La police a retrouvé l\'enfant sain et sauf.',exE:'The police found the child safe and sound.'},
    {t:'v',lv:1,fr:'appeler à l\'aide',wc:'loc',en:'to call for help',ex:'Il a appelé à l\'aide quand il a vu la fumée.',exE:'He called for help when he saw the smoke.'},
    {t:'v',lv:1,fr:'perdu(e)',wc:'adj',en:'lost',ex:'Un enfant perdu pleurait au milieu de la foule.',exE:'A lost child was crying in the middle of the crowd.'},
    {t:'v',h:1,fr:'seul(e)',wc:'adj',en:'alone',ex:'Il se trouvait seul à la maison ce soir-là.',exE:'He was alone at home that evening.'},
    {t:'v',lv:1,fr:'la peur',wc:'nf',en:'fear',ex:'La peur l\'a empêché de bouger.',exE:'Fear stopped him from moving.'},

    {t:'v',lv:1,fr:'un héros / une héroïne',wc:'nm/nf',en:'a hero / heroine',ex:'La petite fille est devenue une héroïne locale.',exE:'The little girl became a local heroine.'},

    {t:'p',h:1,lv:1,fr:'Il/Elle avait à peine… ans lorsque…',en:'He/She was barely… years old when…',ex:'Il avait à peine sept ans lorsqu\'il a sauvé son frère.',exE:'He was barely seven years old when he saved his brother.'},
    {t:'p',h:1,lv:2,fr:'Sans hésiter une seconde,…',en:'Without hesitating for a second,…',ex:'Sans hésiter une seconde, la fillette a appelé les secours.',exE:'Without hesitating for a second, the little girl called the emergency services.'},
    {t:'p',h:1,lv:2,fr:'Grâce à son sang-froid,…',en:'Thanks to his/her composure,…',ex:'Grâce à son sang-froid, l\'adolescent a évité le pire.',exE:'Thanks to his composure, the teenager avoided the worst.'},
    {t:'v',lv:2,fr:'un adolescent / une adolescente',wc:'nm/nf',en:'a teenager',ex:'Un adolescent a sauvé un enfant de la noyade.',exE:'A teenager saved a child from drowning.'},
    {t:'v',lv:2,fr:'la noyade / se noyer',wc:'nf/v',en:'drowning',ex:'Il a réussi à sauver son ami de la noyade.',exE:'He managed to save his friend from drowning.'},
    {t:'p',h:1,lv:3,fr:'Son geste lui a valu les félicitations de toute la ville.',en:'His/Her act earned him/her the congratulations of the whole town.',ex:'Son geste lui a valu les félicitations de toute la ville.',exE:'His act earned him the congratulations of the whole town.'},
    {t:'p',lv:1,fr:'Un garçon / une fille de … ans a eu le courage de …',en:'A boy / girl of … years old had the courage to …',ex:'Un garçon de dix ans a eu le courage de prévenir les secours.',exE:'A ten-year-old boy had the courage to alert the emergency services.'},
    {t:'p',lv:1,fr:'Sans hésiter, l\'enfant a …',en:'Without hesitating, the child …',ex:'Sans hésiter, l\'enfant a couru chercher un adulte.',exE:'Without hesitating, the child ran to get an adult.'},
    {t:'p',lv:1,fr:'Ses parents étaient fiers de lui, car …',en:'His parents were proud of him, because …',ex:'Ses parents étaient fiers de lui, car il avait gardé son calme.',exE:'His parents were proud of him, because he had stayed calm.'},
    {t:'p',lv:1,fr:'Heureusement, quelqu\'un a entendu …',en:'Luckily, someone heard …',ex:'Heureusement, un voisin a entendu les cris de la petite fille.',exE:'Luckily, a neighbour heard the little girl\'s cries.'},
    {t:'p',lv:2,fr:'Grâce à son sang-froid, il / elle a pu …',en:'Thanks to his/her composure, he/she was able to …',ex:'Grâce à son sang-froid, Léa a pu faire sortir tous ses camarades.',exE:'Thanks to her composure, Léa was able to get all her classmates out.'},
    {t:'p',lv:2,fr:'Personne ne s\'attendait à ce qu\'un enfant …',en:'Nobody expected a child to …',ex:'Personne ne s\'attendait à ce qu\'un enfant de huit ans réagisse aussi vite.',exE:'Nobody expected an eight-year-old child to react so quickly.'},
    {t:'p',lv:2,fr:'Quelques minutes plus tard, les secours sont arrivés et …',en:'A few minutes later, the emergency services arrived and …',ex:'Quelques minutes plus tard, les secours sont arrivés et ont pris les enfants en charge.',exE:'A few minutes later, the emergency services arrived and took charge of the children.'},
    {t:'p',lv:2,fr:'Le lendemain, les journaux ont salué le courage de …',en:'The next day, the newspapers praised … \'s courage',ex:'Le lendemain, les journaux ont salué le courage du jeune garçon.',exE:'The next day, the newspapers praised the young boy\'s courage.'},
    {t:'p',lv:3,fr:'Rien ne laissait présager que …',en:'Nothing suggested that …',ex:'Rien ne laissait présager que cette sortie scolaire tournerait au drame.',exE:'Nothing suggested that this school trip would turn into a drama.'},
    {t:'p',lv:3,fr:'Par sa présence d\'esprit, il / elle a évité le pire.',en:'Through his/her presence of mind, he/she avoided the worst.',ex:'Par sa présence d\'esprit, l\'enfant a évité le pire.',exE:'Through his presence of mind, the child avoided the worst.'},
    {t:'p',lv:3,fr:'Cet acte de bravoure lui a valu …',en:'This act of bravery earned him/her …',ex:'Cet acte de bravoure lui a valu les félicitations de toute la ville.',exE:'This act of bravery earned him the congratulations of the whole town.'},
]},

  {id:'famille',fr:'Famille',en:'Family & couples',c:'#FFC400',l:true,items:[
    {t:'p',h:1,lv:2,fr:'cacher une vérité à quelqu\'un depuis des années',en:'to hide a truth from someone for years',ex:'Elle a découvert que son mari lui cachait une vérité depuis plus de trente ans.',exE:'She discovered her husband had been hiding a truth from her for more than thirty years.'},
    {t:'p',h:1,lv:2,fr:'prendre une décision qui va tout changer',en:'to make a decision that will change everything',ex:'Ce jour-là, elle a pris une décision qui allait changer leur vie pour toujours.',exE:'That day, she made a decision that would change their lives forever.'},
    {t:'p',h:1,lv:2,fr:'malgré les apparences,…',en:'despite appearances,…',ex:'Malgré les apparences, leur relation était bien plus fragile qu\'ils ne le montraient.',exE:'Despite appearances, their relationship was far more fragile than they showed.'},
    {t:'p',h:1,fr:'fêter leur Nième anniversaire de mariage',en:'to celebrate their Nth wedding anniversary',ex:'Ils fêtaient leur vingtième anniversaire de mariage au bord de la mer.',exE:'They were celebrating their twentieth wedding anniversary by the sea.'},
    {t:'p',h:1,lv:3,fr:'garder un secret pendant des décennies',en:'to keep a secret for decades',ex:'Ce couple discret avait gardé un secret extraordinaire pendant soixante ans.',exE:'This discreet couple had kept an extraordinary secret for sixty years.'},
    {t:'p',h:1,lv:2,fr:'se réconcilier après une brouille',en:'to make up after a falling-out',ex:'Après des années de silence, les deux frères ont fini par se réconcilier.',exE:'After years of silence, the two brothers finally made up.'},
    {t:'p',h:1,lv:2,fr:'se confier à quelqu\'un',en:'to confide in someone / open up to someone',ex:'Elle n\'avait jamais osé se confier à quiconque avant ce soir-là.',exE:'She had never dared confide in anyone before that evening.'},
    {t:'p',h:1,lv:3,fr:'remettre en question leur relation',en:'to call their relationship into question',ex:'Cette découverte a remis en question toute leur relation.',exE:'This discovery called their entire relationship into question.'},
    {t:'v',lv:2,fr:'une grande complicité',wc:'nf',en:'a close, easy bond / strong rapport',ex:'La grand-mère et sa petite-fille vivaient dans une grande complicité.',exE:'The grandmother and granddaughter lived in a close, easy bond.'},
    {t:'v',lv:2,fr:'protecteur / protectrice',wc:'adj',en:'protective',ex:'La petite-fille était très protectrice envers sa grand-mère âgée.',exE:'The granddaughter was very protective of her elderly grandmother.'},
    {t:'v',lv:3,fr:'se venger discrètement',wc:'loc',en:'to take quiet revenge',ex:'Elle a décidé de se venger discrètement, sans rien laisser paraître.',exE:'She decided to take quiet revenge, without letting anything show.'},
    {t:'v',lv:3,fr:'capricieux / capricieuse',wc:'adj',en:'unpredictable / capricious',ex:'La météo est devenue capricieuse en plein après-midi.',exE:'The weather turned unpredictable in the middle of the afternoon.'},
    {t:'v',h:1,fr:'prendre sa liberté',wc:'loc',en:'to claim one\'s independence',ex:'Un jour, la grand-mère de 80 ans a décidé de prendre sa liberté.',exE:'One day, the 80-year-old grandmother decided to claim her independence.'},
    {t:'v',lv:3,fr:'une brouille',wc:'nf',en:'a falling-out / a quarrel',ex:'Une simple brouille s\'est transformée en dispute qui a duré dix ans.',exE:'A simple falling-out turned into a dispute that lasted ten years.'},
    {t:'v',lv:1,fr:'un malentendu',wc:'nm',en:'a misunderstanding',ex:'Tout était parti d\'un malentendu qui aurait pu être évité.',exE:'It all started from a misunderstanding that could have been avoided.'},
    {t:'v',lv:3,fr:'dévoiler / révéler un secret',wc:'v',en:'to reveal / unveil a secret',ex:'Ce jour-là, ils ont enfin révélé le secret qu\'ils gardaient depuis soixante ans.',exE:'That day, they finally revealed the secret they had kept for sixty years.'},
    {t:'v',lv:2,fr:'se méfier de',wc:'v',en:'to be wary of / distrust',ex:'Depuis cette trahison, elle ne pouvait plus s\'empêcher de se méfier de lui.',exE:'Since that betrayal, she could not help but be wary of him.'},
    {t:'v',lv:2,fr:'soupçonner quelqu\'un',wc:'v',en:'to suspect someone',ex:'Elle avait longtemps soupçonné que son mari lui cachait quelque chose.',exE:'She had long suspected that her husband was hiding something from her.'},
    {t:'v',lv:2,fr:'une rupture / une séparation',wc:'nf',en:'a break-up / separation',ex:'Après cette révélation, une rupture semblait inévitable.',exE:'After this revelation, a break-up seemed inevitable.'},
    {t:'v',lv:2,fr:'pardonner / ne pas pardonner',wc:'v',en:'to forgive / not forgive',ex:'Contre toute attente, elle a choisi de tout pardonner.',exE:'Against all expectations, she chose to forgive everything.'},
  
    {t:'p',h:1,lv:1,fr:'s\'entendre bien / mal avec quelqu\'un',en:'to get along well / badly with someone',ex:'Depuis toujours, elle s\'entendait très bien avec sa grand-mère.',exE:'She had always got along very well with her grandmother.'},
    {t:'p',h:1,lv:2,fr:'tenir à quelqu\'un / quelque chose',en:'to care about someone / something',ex:'Il tenait beaucoup à cette montre que son père lui avait offerte.',exE:'He really cared about this watch that his father had given him.'},
    {t:'p',h:1,lv:2,fr:'avoir du mal à pardonner',en:'to have difficulty forgiving',ex:'Après cette trahison, elle avait du mal à lui pardonner.',exE:'After this betrayal, she had difficulty forgiving him.'},
    {t:'p',h:1,lv:2,fr:'ne plus se parler depuis…',en:'to no longer speak to each other since…',ex:'Les deux sœurs ne se parlaient plus depuis leur dispute l\'année dernière.',exE:'The two sisters had not spoken to each other since their argument last year.'},
    {t:'p',h:1,lv:2,fr:'tout recommencer de zéro',en:'to start everything from scratch again',ex:'Après leur séparation, elle a décidé de tout recommencer de zéro.',exE:'After their separation, she decided to start everything from scratch again.'},
    {t:'p',h:1,lv:1,fr:'manquer à quelqu\'un',en:'to be missed by someone / to miss (French structure)',ex:'Tu me manques beaucoup depuis que tu es parti vivre à l\'étranger.',exE:'I miss you a lot since you went to live abroad.'},
    {t:'v',lv:1,fr:'les liens familiaux',wc:'nm pl',en:'family bonds / ties',ex:'Elle accordait une grande importance aux liens familiaux.',exE:'She placed great importance on family bonds.'},
    {t:'v',lv:1,fr:'élever ses enfants',wc:'v',en:'to raise one\'s children',ex:'Elle a élevé ses trois enfants seule après leur séparation.',exE:'She raised her three children alone after their separation.'},
    {t:'v',lv:1,fr:'une dispute / se disputer',wc:'nf/v',en:'an argument / to argue',ex:'Une dispute ridicule a failli détruire leur amitié de vingt ans.',exE:'A ridiculous argument almost destroyed their twenty-year friendship.'},
    {t:'v',lv:2,fr:'proche de quelqu\'un',wc:'adj',en:'close to someone',ex:'Elle était très proche de sa cousine pendant l\'enfance.',exE:'She was very close to her cousin during childhood.'},
    {t:'v',lv:2,fr:'s\'en vouloir de + inf',wc:'loc',en:'to blame oneself for doing something',ex:'Il s\'en voulait de ne pas avoir appelé sa mère plus souvent.',exE:'He blamed himself for not calling his mother more often.'},
    {t:'v',lv:2,fr:'avoir besoin de soutien',wc:'loc',en:'to need support',ex:'Dans les moments difficiles, elle avait besoin du soutien de sa famille.',exE:'In difficult times, she needed the support of her family.'},
    {t:'v',lv:1,fr:'s\'occuper de',wc:'v',en:'to take care of / look after',ex:'La fille aînée s\'occupait de ses parents depuis leur retraite.',exE:'The eldest daughter had been looking after her parents since their retirement.'},
    {t:'v',h:1,fr:'un mari / une épouse',wc:'nm/nf',en:'a husband / a wife',ex:'Son mari lui a préparé une belle surprise.',exE:'Her husband prepared a lovely surprise for her.'},
    {t:'v',h:1,fr:'un frère / une sœur',wc:'nm/nf',en:'a brother / a sister',ex:'Ma sœur aînée m\'a toujours protégé.',exE:'My older sister has always protected me.'},
    {t:'v',h:1,fr:'les grands-parents',wc:'nmpl',en:'grandparents',ex:'Les grands-parents gardent les enfants le mercredi.',exE:'The grandparents look after the children on Wednesdays.'},
    {t:'v',h:1,fr:'un oncle / une tante',wc:'nm/nf',en:'an uncle / an aunt',ex:'Mon oncle habite au Québec depuis dix ans.',exE:'My uncle has lived in Quebec for ten years.'},
    {t:'v',h:1,fr:'un cousin / une cousine',wc:'nm/nf',en:'a cousin',ex:'Tous mes cousins se retrouvent à Noël.',exE:'All my cousins get together at Christmas.'},
    {t:'v',h:1,fr:'un beau-père / une belle-mère',wc:'nm/nf',en:'a step-/father-/mother-in-law',ex:'Sa belle-mère l\'a accueillie très chaleureusement.',exE:'Her mother-in-law welcomed her very warmly.'},
    {t:'v',lv:3,fr:'des jumeaux / des jumelles',wc:'nmpl',en:'twins',ex:'Les jumeaux se ressemblent comme deux gouttes d\'eau.',exE:'The twins look exactly alike.'},
    {t:'v',h:1,fr:'un mariage',wc:'nm',en:'a wedding / a marriage',ex:'Toute la famille est venue au mariage.',exE:'The whole family came to the wedding.'},
    {t:'v',h:1,fr:'un divorce',wc:'nm',en:'a divorce',ex:'Leur divorce a été difficile pour les enfants.',exE:'Their divorce was hard on the children.'},
    {t:'v',h:1,fr:'la naissance',wc:'nf',en:'birth',ex:'La naissance du bébé a rempli la famille de joie.',exE:'The baby\'s birth filled the family with joy.'},
    {t:'v',h:1,fr:'un anniversaire',wc:'nm',en:'a birthday / anniversary',ex:'Nous préparons une fête pour son anniversaire.',exE:'We are preparing a party for his birthday.'},
    {t:'v',h:1,fr:'un héritage',wc:'nm',en:'an inheritance',ex:'L\'héritage a provoqué une dispute entre les frères.',exE:'The inheritance caused an argument between the brothers.'},
    {t:'v',h:1,fr:'la confiance',wc:'nf',en:'trust / confidence',ex:'La confiance est la base d\'une famille unie.',exE:'Trust is the foundation of a close family.'},
    {t:'v',h:1,fr:'la jalousie',wc:'nf',en:'jealousy',ex:'La jalousie a détruit leur relation.',exE:'Jealousy destroyed their relationship.'},
    {t:'v',lv:1,fr:'l\'enfance',wc:'nf',en:'childhood',ex:'Il garde de beaux souvenirs de son enfance.',exE:'He has fond memories of his childhood.'},

  {id:'police',fr:'Police',en:'Police & mystery',c:'#0A6CF0',l:false,items:[

    {t:'p',h:1,lv:2,fr:'être contraint(e) de faire demi-tour',en:'to be forced to turn back',ex:'Les randonneurs ont été contraints de faire demi-tour à cause des conditions météo.',exE:'The hikers were forced to turn back because of the weather conditions.'},
    {t:'p',h:1,lv:2,fr:'s\'aventurer dans un endroit inconnu',en:'to venture into an unknown place',ex:'Elle s\'est aventurée seule dans les ruelles d\'une ville qu\'elle ne connaissait pas.',exE:'She ventured alone into the alleyways of a city she did not know.'},
    {t:'v',lv:3,fr:'pittoresque',wc:'adj',en:'picturesque',ex:'L\'architecte a choisi de construire sa maison dans un village pittoresque.',exE:'The architect chose to build her house in a picturesque village.'},
    {t:'v',h:1,fr:'les autorités municipales',wc:'nfpl',en:'the local / municipal authorities',ex:'Les autorités municipales sont intervenues sans prévenir le propriétaire.',exE:'The municipal authorities stepped in without warning the owner.'},
    {t:'v',lv:2,fr:'le décollage / l\'atterrissage',wc:'nm',en:'take-off / landing',ex:'L\'avion a eu un problème moteur juste après le décollage.',exE:'The plane had an engine problem right after take-off.'},
    {t:'v',lv:2,fr:'une escale',wc:'nf',en:'a stopover / layover',ex:'Il avait prévu une escale de quelques heures à Paris avant de rejoindre Montréal.',exE:'He had planned a few-hour stopover in Paris before continuing to Montreal.'},
    {t:'v',lv:3,fr:'le dépaysement',wc:'nm',en:'the feeling of being somewhere new / change of scenery',ex:'Elle avait besoin de dépaysement après plusieurs mois de travail intense.',exE:'She needed a change of scenery after several months of intense work.'},
    {t:'v',lv:3,fr:'parcourir',wc:'v',en:'to travel through / cover (a distance)',ex:'Il a parcouru plus de cinq mille kilomètres en voiture pour ce voyage.',exE:'He covered more than five thousand kilometres by car for this journey.'},
    {t:'v',lv:2,fr:'une correspondance',wc:'nf',en:'a connecting flight / train connection',ex:'Il a raté sa correspondance à cause d\'un retard imprévu.',exE:'He missed his connecting flight because of an unexpected delay.'},
    {t:'v',lv:2,fr:'interrompre son voyage',wc:'loc',en:'to interrupt / cut short one\'s trip',ex:'Un problème médical l\'a obligé à interrompre son voyage.',exE:'A medical problem forced him to cut his trip short.'},
    {t:'v',lv:2,fr:'un incident / un imprévu',wc:'nm',en:'an incident / unexpected event',ex:'Un imprévu de dernière minute a failli tout compromettre.',exE:'A last-minute unexpected event almost ruined everything.'},
    {t:'v',h:1,fr:'contraint(e) et forcé(e)',wc:'loc',en:'under duress / with no choice',ex:'Contraint et forcé, il a dû abandonner son projet de voyage.',exE:'With no other choice, he had to abandon his travel plan.'},
    {t:'v',lv:2,fr:'interdit(e) d\'entrée',wc:'adj',en:'banned from entering / denied entry',ex:'Il a été interdit d\'entrée dans le monument pour des raisons de sécurité.',exE:'He was denied entry to the monument for security reasons.'},
  
    {t:'p',h:1,lv:1,fr:'partir en voyage pour la première fois',en:'to go on a trip for the first time',ex:'C\'était la première fois qu\'elle partait seule en voyage à l\'étranger.',exE:'It was the first time she had gone on a trip abroad alone.'},
    {t:'p',h:1,lv:1,fr:'avoir peur de / ne pas avoir l\'habitude de',en:'to be afraid of / not be used to',ex:'Au début, elle avait un peu peur de voyager seule, mais elle s\'y est vite habituée.',exE:'At first, she was a little afraid of travelling alone, but she quickly got used to it.'},
    {t:'p',h:1,lv:1,fr:'se perdre dans une grande ville',en:'to get lost in a big city',ex:'Il s\'est perdu dans les ruelles d\'une vieille médina pendant plusieurs heures.',exE:'He got lost in the alleyways of an old medina for several hours.'},
    {t:'p',h:1,lv:1,fr:'demander son chemin',en:'to ask for directions',ex:'Il a dû demander son chemin plusieurs fois avant de trouver l\'hôtel.',exE:'He had to ask for directions several times before finding the hotel.'},
    {t:'p',h:1,lv:1,fr:'manquer son vol / son train',en:'to miss one\'s flight / train',ex:'À cause des embouteillages, elle a manqué son vol de deux minutes.',exE:'Because of traffic jams, she missed her flight by two minutes.'},
    {t:'p',h:1,lv:2,fr:'arriver à destination sain(e) et sauf(ve)',en:'to arrive at the destination safe and sound',ex:'Après vingt heures de voyage, ils sont arrivés à destination sains et saufs.',exE:'After twenty hours of travel, they arrived at their destination safe and sound.'},
    {t:'v',lv:1,fr:'les bagages / la valise',wc:'nm pl',en:'luggage / suitcase',ex:'Elle avait perdu ses bagages à l\'aéroport de transit.',exE:'She had lost her luggage at the transit airport.'},
    {t:'v',lv:1,fr:'réserver / faire une réservation',wc:'v',en:'to book / make a reservation',ex:'Il avait réservé son billet de train trois semaines à l\'avance.',exE:'He had booked his train ticket three weeks in advance.'},
    {t:'v',lv:1,fr:'un retard / être en retard',wc:'nm',en:'a delay / to be late',ex:'Un retard imprévu a compromis l\'ensemble du voyage.',exE:'An unexpected delay disrupted the entire trip.'},
    {t:'v',lv:2,fr:'s\'adapter à la culture locale',wc:'loc',en:'to adapt to the local culture',ex:'Il a fallu du temps pour s\'adapter à la culture locale et aux habitudes du pays.',exE:'It took time to adapt to the local culture and the country\'s customs.'},
    {t:'v',lv:1,fr:'un souvenir de voyage',wc:'nm',en:'a travel souvenir / memory',ex:'Elle avait rapporté de nombreux souvenirs de son séjour en Asie.',exE:'She had brought back many souvenirs from her stay in Asia.'},
    {t:'v',lv:2,fr:'le mal du pays / la nostalgie',wc:'nm',en:'homesickness / nostalgia',ex:'Après trois mois à l\'étranger, le mal du pays s\'est fait sentir.',exE:'After three months abroad, homesickness set in.'},
    {t:'v',lv:2,fr:'en voyage d\'affaires / pour le tourisme',wc:'loc',en:'on a business trip / for tourism',ex:'Il se trouvait à Lyon non pas pour le tourisme, mais en voyage d\'affaires.',exE:'He was in Lyon not for tourism, but on a business trip.'},
    {t:'v',h:1,fr:'un billet',wc:'nm',en:'a ticket',ex:'J\'ai acheté mon billet d\'avion en ligne.',exE:'I bought my plane ticket online.'},
    {t:'v',h:1,fr:'un passeport',wc:'nm',en:'a passport',ex:'N\'oubliez pas votre passeport à la maison !',exE:'Don\'t forget your passport at home!'},
    {t:'v',h:1,fr:'un aéroport',wc:'nm',en:'an airport',ex:'Nous devons arriver à l\'aéroport deux heures avant.',exE:'We have to get to the airport two hours early.'},
    {t:'v',h:1,fr:'une gare',wc:'nf',en:'a train station',ex:'La gare est à dix minutes à pied de l\'hôtel.',exE:'The station is a ten-minute walk from the hotel.'},
    {t:'v',h:1,fr:'un vol',wc:'nm',en:'a flight',ex:'Notre vol a été annulé à cause de la tempête.',exE:'Our flight was cancelled because of the storm.'},

    {t:'v',h:1,fr:'une chambre',wc:'nf',en:'a room',ex:'J\'ai réservé une chambre double avec vue sur la mer.',exE:'I booked a double room with a sea view.'},
    {t:'v',h:1,fr:'un touriste / une touriste',wc:'nm/nf',en:'a tourist',ex:'Les touristes se pressent devant le musée.',exE:'The tourists crowd in front of the museum.'},
    {t:'v',h:1,fr:'un guide',wc:'nm',en:'a guide / guidebook',ex:'Le guide nous a expliqué l\'histoire du château.',exE:'The guide explained the history of the castle to us.'},
    {t:'v',h:1,fr:'une carte / un plan',wc:'nf/nm',en:'a map',ex:'Nous avons suivi le plan de la ville.',exE:'We followed the city map.'},
    {t:'v',h:1,fr:'la frontière',wc:'nf',en:'the border',ex:'Nous avons passé la frontière sans problème.',exE:'We crossed the border without any problem.'},

    {t:'v',h:1,fr:'une destination',wc:'nf',en:'a destination',ex:'Le Portugal est une destination très populaire.',exE:'Portugal is a very popular destination.'},

    {t:'v',h:1,fr:'un séjour',wc:'nm',en:'a stay',ex:'Notre séjour à Paris a duré une semaine.',exE:'Our stay in Paris lasted a week.'},
    {t:'v',h:1,fr:'une excursion',wc:'nf',en:'an excursion / day trip',ex:'Nous avons fait une excursion à la montagne.',exE:'We took a day trip to the mountains.'},
    {t:'v',h:1,fr:'la plage',wc:'nf',en:'the beach',ex:'Nous passons nos journées sur la plage.',exE:'We spend our days at the beach.'},
    {t:'v',h:1,fr:'partir / arriver',wc:'v',en:'to leave / to arrive',ex:'Nous partons à l\'aube et arrivons le soir.',exE:'We leave at dawn and arrive in the evening.'},
    {t:'v',h:1,fr:'visiter',wc:'v',en:'to visit (a place)',ex:'Nous voulons visiter tous les musées de la ville.',exE:'We want to visit all the city\'s museums.'},

    {t:'p',h:1,lv:2,fr:'Ils ont raté leur correspondance.',en:'They missed their connection.',ex:'Ils ont raté leur correspondance et ont dû passer la nuit à l\'aéroport.',exE:'They missed their connection and had to spend the night at the airport.'},
    {t:'v',lv:3,fr:'dépaysant(e)',wc:'adj',en:'exotic / taking you out of your element',ex:'Ce voyage en Asie a été très dépaysant.',exE:'This trip to Asia was a real change of scenery.'},
    {t:'p',lv:1,fr:'Lors de son voyage à …, il / elle a …',en:'During his/her trip to …, he/she …',ex:'Lors de son voyage à Rome, elle a fait une rencontre inattendue.',exE:'During her trip to Rome, she had an unexpected encounter.'},
    {t:'p',lv:1,fr:'À son arrivée, il / elle s\'est rendu compte que …',en:'On arriving, he/she realised that …',ex:'À son arrivée, il s\'est rendu compte que sa valise n\'était pas là.',exE:'On arriving, he realised that his suitcase was not there.'},
    {t:'p',lv:1,fr:'Il / elle avait perdu son passeport / ses bagages.',en:'He/she had lost his/her passport / luggage.',ex:'Elle avait perdu son passeport et ne savait pas quoi faire.',exE:'She had lost her passport and did not know what to do.'},
    {t:'p',lv:1,fr:'Par chance, un touriste / un habitant lui a proposé de l\'aider.',en:'Luckily, a tourist / a local offered to help.',ex:'Par chance, un habitant lui a proposé de l\'aider à retrouver son hôtel.',exE:'Luckily, a local offered to help him find his hotel.'},
    {t:'p',lv:2,fr:'Malgré la fatigue, il / elle a décidé de …',en:'Despite the tiredness, he/she decided to …',ex:'Malgré la fatigue, ils ont décidé de visiter la ville avant la nuit.',exE:'Despite the tiredness, they decided to visit the city before nightfall.'},
    {t:'p',lv:2,fr:'Le vol a été annulé à cause de …',en:'The flight was cancelled because of …',ex:'Le vol a été annulé à cause d\'une tempête de neige.',exE:'The flight was cancelled because of a snowstorm.'},
    {t:'p',lv:2,fr:'Ce voyage lui a fait découvrir que …',en:'This trip made him/her discover that …',ex:'Ce voyage lui a fait découvrir que le bonheur tenait à peu de choses.',exE:'This trip made her discover that happiness depended on very little.'},
    {t:'p',lv:2,fr:'Il / elle en gardera un souvenir inoubliable.',en:'He/she will keep an unforgettable memory of it.',ex:'Elle en gardera un souvenir inoubliable pour le restant de ses jours.',exE:'She will keep an unforgettable memory of it for the rest of her days.'},
    {t:'p',lv:3,fr:'Contraint(e) de changer ses plans, il / elle a …',en:'Forced to change his/her plans, he/she …',ex:'Contraint de changer ses plans, il a pris le premier train pour Lyon.',exE:'Forced to change his plans, he took the first train to Lyon.'},

  {id:'animaux',fr:'Animaux',en:'Animal stories',c:'#7B5BD6',l:false,items:[
    {t:'p',h:1,lv:2,fr:'accueillir / adopter un animal abandonné',en:'to take in / adopt an abandoned animal',ex:'Le zoo a accueilli cinq perroquets abandonnés par leur propriétaire.',exE:'The zoo took in five parrots abandoned by their owner.'},
    {t:'p',h:1,lv:2,fr:'se mettre à faire quelque chose de façon inattendue',en:'to unexpectedly start doing something',ex:'Les perroquets se sont mis à insulter les visiteurs pendant le spectacle.',exE:'The parrots suddenly started insulting the visitors during the show.'},
    {t:'p',h:1,lv:3,fr:'provoquer un fou rire général',en:'to cause general fits of laughter',ex:'La scène a provoqué un fou rire général dans le public.',exE:'The scene caused general fits of laughter in the audience.'},
    {t:'p',h:1,lv:1,fr:'être étonné(e) de voir',en:'to be astonished to see',ex:'Les pompiers étaient très étonnés de voir un tel animal dans cet endroit.',exE:'The firefighters were very astonished to see such an animal in that place.'},
    {t:'p',h:1,lv:2,fr:'se retrouver face à un animal dangereux',en:'to come face to face with a dangerous animal',ex:'Le randonneur s\'est retrouvé face à un ours dans la forêt.',exE:'The hiker came face to face with a bear in the forest.'},
    {t:'p',h:1,lv:3,fr:'nuire à la biodiversité',en:'to harm biodiversity',ex:'Ces espèces invasives nuisent gravement à la biodiversité locale.',exE:'These invasive species seriously harm local biodiversity.'},
    {t:'v',lv:3,fr:'dresser / apprivoiser',wc:'v',en:'to train / tame',ex:'Personne ne savait que les perroquets avaient été dressés à parler ainsi.',exE:'No one knew the parrots had been trained to talk like that.'},
    {t:'v',h:1,fr:'un perroquet',wc:'nm',en:'a parrot',ex:'Les cinq perroquets ont été abandonnés par leur propriétaire.',exE:'The five parrots were abandoned by their owner.'},
    {t:'v',h:1,fr:'un enclos',wc:'nm',en:'an enclosure / pen',ex:'Le peintre célèbre a eu un accident dans l\'enclos des animaux.',exE:'The famous painter had an accident in the animal enclosure.'},
    {t:'v',lv:2,fr:'une espèce menacée / protégée',wc:'nf',en:'an endangered / protected species',ex:'Le braconnier avait chassé des animaux appartenant à une espèce protégée.',exE:'The poacher had hunted animals belonging to a protected species.'},
    {t:'v',lv:3,fr:'le braconnage / un braconnier',wc:'nm',en:'poaching / a poacher',ex:'Le braconnage reste un problème grave dans de nombreuses régions.',exE:'Poaching remains a serious problem in many regions.'},
    {t:'v',lv:3,fr:'réintroduire une espèce',wc:'v',en:'to reintroduce a species',ex:'Des loups ont été réintroduits dans les Alpes après des décennies d\'absence.',exE:'Wolves were reintroduced in the Alps after decades of absence.'},
    {t:'v',lv:2,fr:'la faune sauvage',wc:'nf',en:'wildlife / wild fauna',ex:'Il est essentiel de protéger la faune sauvage des régions nordiques.',exE:'It is essential to protect the wildlife of the northern regions.'},
    {t:'v',lv:3,fr:'inoffensif / inoffensive',wc:'adj',en:'harmless',ex:'Contrairement aux apparences, cet animal est totalement inoffensif.',exE:'Despite appearances, this animal is completely harmless.'},
    {t:'v',lv:1,fr:'un animal de compagnie',wc:'nm',en:'a pet',ex:'Les pompiers ont découvert un animal de compagnie un peu inhabituel.',exE:'The firefighters found a rather unusual pet.'},
    {t:'v',lv:3,fr:'cohabiter avec',wc:'v',en:'to coexist / live alongside',ex:'Il est possible d\'apprendre à cohabiter avec les animaux sauvages.',exE:'It is possible to learn to coexist with wild animals.'},
    {t:'v',h:1,fr:'s\'échapper de son enclos',wc:'loc',en:'to escape from its enclosure',ex:'Un tigre s\'est échappé de son enclos pendant la nuit.',exE:'A tiger escaped from its enclosure during the night.'},
  
    {t:'p',h:1,lv:1,fr:'avoir peur des animaux',en:'to be afraid of animals',ex:'Elle avouait qu\'elle avait un peu peur des grands chiens.',exE:'She admitted that she was a little afraid of big dogs.'},
    {t:'p',h:1,lv:1,fr:'nourrir un animal',en:'to feed an animal',ex:'Les enfants adoraient nourrir les canards au bord du lac.',exE:'The children loved feeding the ducks by the lake.'},
    {t:'p',h:1,lv:2,fr:'être mordu(e) par un animal',en:'to be bitten by an animal',ex:'La femme avait été mordue par un chien errant dans le parc.',exE:'The woman had been bitten by a stray dog in the park.'},
    {t:'p',h:1,lv:3,fr:'appeler les autorités / la fourrière',en:'to call the authorities / animal control',ex:'Les voisins ont appelé la fourrière pour signaler un animal blessé.',exE:'The neighbours called animal control to report an injured animal.'},
    {t:'p',h:1,lv:2,fr:'être en danger / une espèce en voie de disparition',en:'to be in danger / an endangered species',ex:'Ces animaux sont en danger car leur habitat naturel disparaît progressivement.',exE:'These animals are in danger because their natural habitat is gradually disappearing.'},
    {t:'p',h:1,lv:1,fr:'s\'occuper d\'un animal / en prendre soin',en:'to look after an animal / take care of it',ex:'S\'occuper d\'un animal de compagnie demande beaucoup de temps et d\'énergie.',exE:'Looking after a pet requires a lot of time and energy.'},
    {t:'v',lv:1,fr:'un animal domestique / sauvage',wc:'nm',en:'a domestic / wild animal',ex:'Contrairement aux animaux sauvages, les animaux domestiques s\'adaptent à la vie en maison.',exE:'Unlike wild animals, domestic animals adapt to life in a home.'},
    {t:'v',lv:2,fr:'une morsure / une griffure',wc:'nf',en:'a bite / a scratch',ex:'La morsure du chien était assez grave pour nécessiter des soins.',exE:'The dog bite was serious enough to require medical attention.'},
    {t:'v',h:1,fr:'adopter un chien / un chat',wc:'v',en:'to adopt a dog / cat',ex:'Elle avait décidé d\'adopter un vieux chien abandonné dans un refuge.',exE:'She had decided to adopt an old abandoned dog from a shelter.'},
    {t:'v',lv:2,fr:'un refuge pour animaux',wc:'nm',en:'an animal shelter',ex:'Des centaines d\'animaux attendent une famille dans les refuges.',exE:'Hundreds of animals are waiting for a family in shelters.'},
    {t:'v',lv:1,fr:'interdit(e) / autorisé(e)',wc:'adj',en:'forbidden / allowed',ex:'Les chiens sont interdits dans ce parc depuis l\'incident.',exE:'Dogs have been banned in this park since the incident.'},
    {t:'v',lv:2,fr:'attirer l\'attention / se faire remarquer',wc:'loc',en:'to attract attention / get noticed',ex:'L\'animal a attiré l\'attention de tous les passants.',exE:'The animal attracted the attention of all the passers-by.'},
    {t:'v',lv:1,fr:'s\'approcher de / s\'éloigner de',wc:'v',en:'to approach / move away from',ex:'Les secouristes lui ont conseillé de ne pas s\'approcher de l\'animal blessé.',exE:'The rescuers advised him not to approach the injured animal.'},

  {id:'exploits',fr:'Exploits',en:'Records & achievements',c:'#007A42',l:false,items:[
    {t:'p',h:1,lv:2,fr:'se mettre au sport sur le tard / commencer tardivement',en:'to take up sport late in life',ex:'Elle s\'est mise au sport sur le tard, à l\'âge de cinquante-neuf ans.',exE:'She took up sport late in life, at the age of fifty-nine.'},
    {t:'p',h:1,lv:2,fr:'battre un record / entrer dans le livre des records',en:'to break a record / enter the record books',ex:'Le couple a battu le record mondial de longévité conjugale.',exE:'The couple broke the world record for the longest marriage.'},
    {t:'p',h:1,lv:2,fr:'prouver que l\'âge n\'est qu\'un chiffre',en:'to prove that age is just a number',ex:'Elle a prouvé que l\'âge n\'était qu\'un chiffre en terminant son premier marathon.',exE:'She proved that age is just a number by finishing her first marathon.'},
    {t:'p',h:1,lv:3,fr:'contre toute attente, réussir là où…',en:'against all expectations, succeed where…',ex:'Contre toute attente, elle a réussi là où des athlètes professionnels avaient échoué.',exE:'Against all expectations, she succeeded where professional athletes had failed.'},
    {t:'p',h:1,fr:'révéler un secret au grand jour',en:'to reveal a secret publicly',ex:'Ce jour-là, ils ont révélé au grand jour le secret qu\'ils gardaient depuis soixante ans.',exE:'That day, they revealed to the world the secret they had kept for sixty years.'},
    {t:'p',h:1,lv:2,fr:'surmonter un obstacle / une épreuve',en:'to overcome an obstacle / ordeal',ex:'Elle a surmonté de nombreuses épreuves avant d\'atteindre son objectif.',exE:'She overcame many ordeals before reaching her goal.'},
    {t:'p',h:1,lv:2,fr:'être une source d\'inspiration',en:'to be a source of inspiration',ex:'Son parcours est devenu une source d\'inspiration pour de nombreux seniors.',exE:'Her journey became a source of inspiration for many seniors.'},
    {t:'v',lv:2,fr:'malgré + nom',wc:'prép',en:'despite / in spite of',ex:'Elle est devenue athlète malgré son manque total d\'expérience sportive.',exE:'She became an athlete despite her complete lack of sporting experience.'},
    {t:'v',lv:2,fr:'jusqu\'à l\'âge de…',wc:'loc',en:'until the age of…',ex:'Elle n\'avait jamais fait de sport jusqu\'à l\'âge de cinquante-neuf ans.',exE:'She had never done any sport until the age of fifty-nine.'},
    {t:'v',lv:2,fr:'exceptionnel(le)',wc:'adj',en:'exceptional / outstanding',ex:'Son exploit était vraiment exceptionnel pour une femme de son âge.',exE:'Her feat was truly exceptional for a woman of her age.'},
    {t:'v',lv:3,fr:'la persévérance / la ténacité',wc:'nf',en:'perseverance / tenacity',ex:'C\'est grâce à sa persévérance qu\'elle a finalement réussi.',exE:'It is thanks to her perseverance that she finally succeeded.'},
    {t:'v',lv:2,fr:'un défi',wc:'nm',en:'a challenge',ex:'Elle a décidé de relever ce défi pour prouver qu\'il n\'est jamais trop tard.',exE:'She decided to take up this challenge to prove it is never too late.'},
    {t:'v',lv:2,fr:'relever un défi',wc:'loc',en:'to take up / rise to a challenge',ex:'À soixante ans, elle a décidé de relever le défi du marathon.',exE:'At sixty, she decided to rise to the challenge of the marathon.'},
    {t:'v',lv:3,fr:'la longévité',wc:'nf',en:'longevity / long life',ex:'Ce couple est célèbre pour sa longévité conjugale record.',exE:'This couple is famous for their record conjugal longevity.'},
    {t:'v',lv:3,fr:'s\'acharner',wc:'v',en:'to persevere relentlessly / work stubbornly',ex:'Elle s\'est acharnée pendant des mois avant de réussir sa première course.',exE:'She persevered relentlessly for months before completing her first race.'},
    {t:'v',lv:3,fr:'un accomplissement',wc:'nm',en:'an achievement / accomplishment',ex:'Terminer ce marathon était un accomplissement personnel immense pour elle.',exE:'Finishing this marathon was an immense personal accomplishment for her.'},
    {t:'v',lv:2,fr:'inspirer / motiver les autres',wc:'v',en:'to inspire / motivate others',ex:'Son histoire a inspiré des milliers de personnes à travers le monde.',exE:'Her story inspired thousands of people around the world.'},
  
    {t:'p',h:1,lv:2,fr:'ne jamais avoir fait quelque chose avant',en:'to have never done something before',ex:'Elle n\'avait jamais couru plus de deux kilomètres avant ses soixante ans.',exE:'She had never run more than two kilometres before she was sixty.'},
    {t:'p',h:1,lv:2,fr:'tout le monde lui déconseillait de…',en:'everyone advised her against…',ex:'Tout le monde lui déconseillait de se lancer dans cette aventure à son âge.',exE:'Everyone advised her against embarking on this adventure at her age.'},
    {t:'p',h:1,lv:1,fr:'s\'entraîner dur / tous les jours',en:'to train hard / every day',ex:'Pendant deux ans, elle s\'est entraînée tous les jours sans exception.',exE:'For two years, she trained every single day without exception.'},
    {t:'p',h:1,lv:2,fr:'être déterminé(e) à réussir',en:'to be determined to succeed',ex:'Elle était absolument déterminée à réussir, quoi qu\'il arrive.',exE:'She was absolutely determined to succeed, whatever it took.'},
    {t:'p',h:1,lv:1,fr:'réaliser son rêve',en:'to fulfil / achieve one\'s dream',ex:'À l\'âge de soixante-deux ans, elle a finalement réalisé son rêve.',exE:'At the age of sixty-two, she finally fulfilled her dream.'},
    {t:'p',h:1,lv:2,fr:'être reconnu(e) pour ses exploits',en:'to be recognised for one\'s achievements',ex:'Elle a été reconnue et admirée dans le monde entier pour ses exploits.',exE:'She has been recognised and admired around the world for her achievements.'},
    {t:'v',lv:2,fr:'le courage / le cran',wc:'nm',en:'courage / guts',ex:'Il faut beaucoup de courage pour tout quitter à cinquante ans pour recommencer.',exE:'It takes a lot of courage to leave everything behind at fifty to start over.'},
    {t:'v',lv:1,fr:'une médaille / un trophée',wc:'nf',en:'a medal / a trophy',ex:'Elle a reçu une médaille pour son parcours extraordinaire.',exE:'She received a medal for her extraordinary journey.'},
    {t:'v',lv:3,fr:'le dépassement de soi',wc:'nm',en:'self-surpassing / pushing one\'s limits',ex:'Ce marathon représente pour elle un vrai dépassement de soi.',exE:'For her, this marathon represents a true surpassing of one\'s limits.'},
    {t:'v',lv:1,fr:'ne jamais abandonner',wc:'loc',en:'never to give up',ex:'Sa règle d\'or : ne jamais abandonner, même quand c\'est difficile.',exE:'Her golden rule: never give up, even when it is hard.'},
    {t:'v',lv:2,fr:'se dépasser / repousser ses limites',wc:'v',en:'to surpass oneself / push one\'s limits',ex:'Elle avait appris à se dépasser chaque jour pendant son entraînement.',exE:'She had learned to push her limits every day during her training.'},
    {t:'v',lv:2,fr:'une performance / un résultat',wc:'nf',en:'a performance / a result',ex:'Sa performance était d\'autant plus remarquable qu\'elle débutait à soixante ans.',exE:'Her performance was all the more remarkable because she was starting at sixty.'},
    {t:'v',lv:1,fr:'croire en soi / avoir confiance en soi',wc:'loc',en:'to believe in oneself / be self-confident',ex:'Le secret de sa réussite ? Croire en soi et ne jamais douter.',exE:'The secret of her success? Believe in yourself and never doubt.'},
