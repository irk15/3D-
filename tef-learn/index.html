<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TEF — Écrire &amp; Parler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF4; --ink:#16121F; --soft:#6D6480; --hair:#E3DCCD; --sunk:#F0EAD9;
  --vert:#007A42; --rouge:#C4221C;
  --pop:3px 3px 0 var(--ink);
  --ff:'Poppins',sans-serif;
  --ui:'Poppins',sans-serif;
  --accent:#7B5BD6;
  --bar: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ui);
  min-height:100dvh; height:100dvh;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ── TOP CHROME ─────────────────────────────── */
.topbar{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  border-bottom:1.5px solid var(--hair);
  background:var(--paper);
  flex-shrink:0;
}
/* row 1: wordmark left, A/B buttons right — no middle element */
.topbar-r1{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
/* row 2: Section A/B buttons full width */
.topbar-r2{
  display:flex;
  align-items:center;
}
/* row 3: progress bar */
.topbar-r3{
  display:flex;
  align-items:center;
  gap:8px;
}
.wordmark{
  font-family:var(--ff); font-size:1.15rem; font-weight:700;
  letter-spacing:-0.03em; line-height:1;
  white-space:nowrap;
}
.wordmark em{color:var(--accent); font-style:normal}

.prog-track{flex:1; height:4px; background:var(--hair); border-radius:2px; overflow:hidden; min-width:0}
.prog-fill{height:100%; background:var(--accent); border-radius:2px; transition:width .3s}
.prog-label{font-size:0.7rem; font-weight:600; color:var(--soft); white-space:nowrap}

.seg{
  display:flex; gap:3px; background:var(--hair);
  border-radius:8px; padding:3px;
}
.seg button{
  font-family:var(--ui); font-size:0.72rem; font-weight:600;
  border:none; background:transparent; color:var(--soft);
  padding:5px 10px; border-radius:5px; cursor:pointer;
  transition:background .15s,color .15s; white-space:nowrap;
}
.seg button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* seg full-width in topbar-r2 */
.topbar-r2 .seg{width:100%}
.topbar-r2 .seg button{flex:1; text-align:center}

/* ── TOPICS ─────────────────────────────────── */
.topics-wrap{
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding:10px 16px 6px; flex-shrink:0;
}
.topics-wrap::-webkit-scrollbar{display:none}
.topics-row{display:flex; gap:6px; width:max-content}
.tpill{
  font-family:var(--ui); font-size:0.75rem; font-weight:600;
  border:2px solid var(--hair); padding:5px 12px; border-radius:100px;
  cursor:pointer; background:transparent; color:var(--ink);
  transition:all .15s; white-space:nowrap;
}
.tpill.on{
  background:var(--tc,var(--accent)); border-color:var(--tc,var(--accent));
  color:#fff; box-shadow:var(--pop);
}
.tpill.on.light{color:var(--ink)}

/* ── FILTER ─────────────────────────────────── */
.filter-row{
  display:flex; align-items:center; gap:8px;
  padding:10px 16px 0; flex-shrink:0;
}
.filt-tabs{display:flex; gap:3px; background:var(--hair); border-radius:7px; padding:3px}
.filt-tab{
  font-family:var(--ui); font-size:0.7rem; font-weight:600;
  border:none; background:transparent; color:var(--soft);
  padding:4px 10px; border-radius:4px; cursor:pointer;
  transition:all .15s; white-space:nowrap;
}
.filt-tab.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lvl-row{display:flex;gap:6px;padding:2px 16px 8px;overflow-x:auto;scrollbar-width:none}
.lvl-row::-webkit-scrollbar{display:none}
.lvl-tab{flex:none;border:1px solid var(--sunk);background:transparent;color:var(--soft);font:600 .72rem/1 inherit;font-family:inherit;padding:7px 12px;border-radius:99px;cursor:pointer}
.lvl-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lv-b{background:transparent;border:1px solid currentColor}
.lv-1{color:#16a34a}.lv-2{color:#0A6CF0}.lv-3{color:#a855f7}
.known-badge-row{margin-left:auto; font-size:0.72rem; font-weight:600; color:var(--vert)}

/* ── CARD AREA ───────────────────────────────── */
.card-area{
  flex:1; overflow:hidden;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px 16px 8px;
  position:relative;
}

/* ── CARD ────────────────────────────────────── */
.card{
  width:100%; max-width:480px;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:14px;
  box-shadow:var(--pop);
  overflow:hidden;
  cursor:pointer; user-select:none;
  position:relative;
  display:flex; flex-direction:column;
  /* fill available height between filter and bottom bar */
  max-height:100%;
  transition:transform .18s cubic-bezier(.2,1.4,.4,1), box-shadow .18s, opacity .15s;
}
.card:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}

/* swipe animations */
@keyframes swipeFwd {
  from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(-40px)}
}
@keyframes swipeBack {
  from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(40px)}
}
@keyframes enterFwd  { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:none} }
@keyframes enterBack { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:none} }
.card.exit-fwd   { animation:swipeFwd  .2s ease forwards }
.card.exit-back  { animation:swipeBack .2s ease forwards }
.card.enter-fwd  { animation:enterFwd  .22s cubic-bezier(.2,1.4,.4,1) forwards }
.card.enter-back { animation:enterBack .22s cubic-bezier(.2,1.4,.4,1) forwards }
@media (prefers-reduced-motion:reduce){
  .card.exit-fwd,.card.exit-back,.card.enter-fwd,.card.enter-back{animation:none}
}

.card-top{height:6px; background:var(--tc,var(--accent)); flex-shrink:0}
.card-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 22px 18px}

/* badge row — type badge + optional known chip, side by side, no overlap */
.badge-row{display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap}
.type-badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:0.65rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 10px; border-radius:6px; flex-shrink:0;
}
.badge-v{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent); color:var(--tc,var(--accent))}
.badge-p{background:var(--sunk); color:var(--soft)}
.wc{font-weight:400; opacity:.7; letter-spacing:.01em; text-transform:none}
/* known chip — inline, no absolute positioning */
.known-chip{
  display:none; align-items:center; gap:4px;
  font-size:0.65rem; font-weight:700; letter-spacing:.04em;
  color:var(--vert); flex-shrink:0;
}
.known-chip.show{display:flex}
.known-chip svg{width:12px;height:12px;fill:none;stroke:var(--vert);stroke-width:2.5}

/* french — the star: big, bold, optically weighted */
.card-fr{
  font-family:var(--ff);
  font-size:clamp(1.65rem,6.5vw,2.1rem);
  font-weight:800; line-height:1.15; letter-spacing:-0.03em;
  color:var(--ink); margin-bottom:14px;
}

/* english translation — always visible, medium weight, clear size */
.card-en{
  font-size:1rem; font-weight:500; font-style:italic;
  color:var(--soft); line-height:1.5; padding-left:2px;
}

/* divider between phrase and example */
.card-divider{height:1.5px; background:var(--hair); margin:18px 0 0}

/* example */
.ex-toggle{
  display:flex; align-items:center; gap:8px;
  padding:14px 0 0;
  font-size:0.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--tc,var(--accent)); cursor:pointer; user-select:none;
}
.ex-toggle svg{width:12px;height:12px;transition:transform .22s;flex-shrink:0}
.ex-toggle.open svg{transform:rotate(180deg)}
.ex-body{display:none; padding-top:12px; padding-bottom:4px}
.ex-toggle.open + .ex-body{display:block}
.ex-fr{
  font-family:var(--ff); font-style:italic;
  font-size:0.97rem; line-height:1.65; color:var(--ink); margin-bottom:8px;
}
/* english translation of example — clearly separated */
.ex-en-label{
  font-size:0.65rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--soft); opacity:.5; margin-bottom:4px;
}
.ex-en{font-size:0.88rem; font-weight:400; color:var(--soft); line-height:1.55}

/* ── BOTTOM NAV ──────────────────────────────── */
.bottom-nav{
  flex-shrink:0;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px calc(10px + var(--bar));
  border-top:1.5px solid var(--hair);
  background:var(--paper);
}
.nav-btn{
  width:46px; height:46px; border-radius:50%;
  border:2px solid var(--ink); background:var(--paper);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--pop); transition:transform .1s,box-shadow .1s; flex-shrink:0;
}
.nav-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.nav-btn:disabled{opacity:.25; cursor:default; box-shadow:none}
.nav-btn svg{width:16px;height:16px}
.know-btn{
  flex:1; height:46px; border-radius:100px;
  border:2px solid var(--ink); background:var(--paper);
  font-family:var(--ui); font-size:0.85rem; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  box-shadow:var(--pop); transition:transform .1s,box-shadow .1s,background .15s,color .15s;
  color:var(--ink);
}
.know-btn.on{background:var(--vert); color:#fff; border-color:var(--vert)}
.know-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.know-btn svg{width:14px;height:14px}

/* ── EMPTY ───────────────────────────────────── */
.empty{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:10px; color:var(--soft); font-size:.9rem; text-align:center;
}

/* ── QUICK TEST (overlay) ───────────────────── */
.quiz-btn{
  font-family:var(--ui); font-size:0.7rem; font-weight:700; color:#fff;
  background:var(--accent); border:2px solid var(--ink); border-radius:100px;
  padding:4px 11px 4px 9px; margin-left:10px; cursor:pointer;
  display:flex; align-items:center; gap:5px; box-shadow:2px 2px 0 var(--ink);
  transition:transform .1s, box-shadow .1s; white-space:nowrap;
}
.quiz-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.quiz-btn svg{width:11px; height:11px}
#quiz{
  position:fixed; inset:0; z-index:100; background:var(--paper);
  display:none; flex-direction:column; padding-top:env(safe-area-inset-top,0px);
}
#quiz.show{display:flex; animation:qin .25s cubic-bezier(.2,.8,.3,1)}
@keyframes qin{from{opacity:0; transform:translateY(28px)}to{opacity:1; transform:none}}
.q-top{display:flex; align-items:center; gap:10px; padding:12px 16px 6px; flex-shrink:0}
.q-x{
  width:34px; height:34px; border-radius:50%; border:2px solid var(--hair);
  background:none; color:var(--soft); font-size:1rem; cursor:pointer; flex-shrink:0;
}
.q-track{flex:1; height:6px; background:var(--hair); border-radius:3px; overflow:hidden}
.q-fill{height:100%; width:0; background:var(--accent); border-radius:3px; transition:width .3s}
.q-count{font-size:0.72rem; font-weight:700; color:var(--soft); min-width:42px; text-align:right}
.q-streak{font-size:0.72rem; font-weight:700; color:#FF6B2C; min-width:30px; opacity:0; transition:opacity .2s}
.q-streak.on{opacity:1}
#qbody{flex:1; display:flex; flex-direction:column; min-height:0}

/* setup */
.q-setup{flex:1; overflow-y:auto; padding:8px 20px 12px; max-width:480px; width:100%; margin:0 auto}
.q-h{font-size:1.5rem; font-weight:800; letter-spacing:-0.03em; margin-top:6px}
.q-sub{font-size:0.8rem; color:var(--soft); margin:4px 0 14px}
.q-grp{margin-bottom:14px}
.q-lab{font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-bottom:6px}
.q-chips{display:flex; gap:6px; flex-wrap:wrap}
.q-chip{
  font-family:var(--ui); font-size:0.78rem; font-weight:600; color:var(--ink);
  background:transparent; border:2px solid var(--hair); border-radius:100px;
  padding:6px 13px; cursor:pointer; transition:all .12s;
}
.q-chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.q-foot{padding:10px 20px calc(14px + var(--bar)); max-width:480px; width:100%; margin:0 auto; flex-shrink:0}
.q-go{
  width:100%; font-family:var(--ui); font-size:0.95rem; font-weight:700; color:#fff;
  background:var(--accent); border:2px solid var(--ink); border-radius:12px;
  padding:14px; cursor:pointer; box-shadow:var(--pop);
}
.q-go:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.q-go:disabled{opacity:.4; box-shadow:none}
.q-note{font-size:0.74rem; color:var(--soft); text-align:center; margin-top:8px}

/* run */
.q-stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 16px; perspective:1200px}
.q-drag{
  width:100%; max-width:480px; height:min(100%,440px); position:relative;
  touch-action:pan-y; will-change:transform; user-select:none; -webkit-user-select:none;
}
.q-drag.fly{transition:transform .28s cubic-bezier(.4,0,.8,.6), opacity .28s}
.q-drag.back{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.q-flip{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.q-drag.rev .q-flip{transform:rotateY(180deg)}
.q-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--paper); border:2px solid var(--ink); border-top:8px solid var(--tc,var(--accent));
  border-radius:14px; box-shadow:var(--pop); overflow-y:auto; padding:18px 20px;
  display:flex; flex-direction:column; cursor:pointer;
}
.q-back{transform:rotateY(180deg)}
.q-mid{margin:auto 0; text-align:center}
.q-tag{display:flex; justify-content:space-between; align-items:center; font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft)}
.q-prompt{font-size:1.65rem; font-weight:700; line-height:1.25; letter-spacing:-0.02em; margin:auto 0; text-align:center}
.q-prompt.long{font-size:1.2rem; line-height:1.4}
.q-hint{text-align:center; font-size:0.72rem; color:var(--soft); font-weight:500}
.q-small{font-size:0.8rem; color:var(--soft); font-weight:500; margin-bottom:8px}
.q-ans{font-size:1.5rem; font-weight:800; line-height:1.25; letter-spacing:-0.02em}
.q-ans.long{font-size:1.15rem; line-height:1.4}
.q-exbox{margin-top:16px; padding-top:12px; border-top:1.5px dashed var(--hair); text-align:left}
.q-exfr{font-size:0.88rem; font-weight:600; line-height:1.5}
.q-exen{font-size:0.8rem; color:var(--soft); line-height:1.5; margin-top:4px}
.q-stamp{
  position:absolute; top:22px; z-index:5; pointer-events:none; opacity:0;
  font-weight:800; font-size:1.1rem; letter-spacing:.06em; padding:3px 10px;
  border:3px solid; border-radius:8px; background:var(--paper);
}
.q-stamp.ok{right:18px; color:var(--vert); transform:rotate(10deg)}
.q-stamp.no{left:18px; color:var(--rouge); transform:rotate(-10deg)}
.q-actions{display:flex; gap:10px; padding:10px 16px calc(12px + var(--bar)); max-width:480px; width:100%; margin:0 auto; flex-shrink:0}
.q-act{
  flex:1; font-family:var(--ui); font-size:0.9rem; font-weight:700; border:2px solid var(--ink);
  border-radius:12px; padding:13px 8px; cursor:pointer; box-shadow:var(--pop); color:#fff;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.q-act:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.q-act svg{width:15px; height:15px}
.q-act.rev{background:var(--ink)}
.q-act.miss{background:var(--rouge)}
.q-act.got{background:var(--vert)}
.q-keys{text-align:center; font-size:0.66rem; color:var(--soft); padding-bottom:calc(8px + var(--bar)); margin-top:-4px}
@media (hover:none){.q-keys{display:none}}

/* done */
.q-done{flex:1; overflow-y:auto; padding:6px 20px 12px; max-width:480px; width:100%; margin:0 auto; text-align:center}
.q-ring{width:132px; height:132px; margin:10px auto 6px; position:relative}
.q-ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.q-ring circle{fill:none; stroke-width:10; stroke-linecap:round}
.q-ring .bg{stroke:var(--hair)}
.q-ring .fg{stroke:var(--vert); stroke-dasharray:276.46; stroke-dashoffset:276.46; transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1) .15s}
.q-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.9rem; font-weight:800; letter-spacing:-0.04em}
.q-stats{display:flex; justify-content:center; gap:18px; font-size:0.78rem; font-weight:600; color:var(--soft); margin:8px 0 14px}
.q-stats b{color:var(--ink); font-weight:800}
.q-mlist{text-align:left; border:2px solid var(--ink); border-radius:12px; box-shadow:var(--pop); overflow:hidden; margin-bottom:6px}
.q-mhead{font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--rouge); padding:8px 12px; background:var(--sunk)}
.q-mrow{padding:8px 12px; border-top:1.5px solid var(--hair); font-size:0.82rem; line-height:1.4}
.q-mrow b{font-weight:700}
.q-mrow span{color:var(--soft)}
.q-donebtns{display:flex; flex-direction:column; gap:8px}
.q-sec{
  font-family:var(--ui); font-size:0.85rem; font-weight:700; color:var(--ink); background:transparent;
  border:2px solid var(--ink); border-radius:12px; padding:12px; cursor:pointer;
}
.q-sec:disabled{opacity:.5}

/* ── LISTEN (recorded audio + hands-free) ───── */
.listen-btn,.spk{display:none}
body.has-audio .listen-btn{display:flex}
body.has-audio .spk{display:flex}
.listen-btn{
  font-family:var(--ui); font-size:0.7rem; font-weight:700; color:var(--ink);
  background:var(--paper); border:2px solid var(--ink); border-radius:100px;
  padding:4px 11px 4px 9px; margin-left:8px; cursor:pointer;
  align-items:center; gap:5px; box-shadow:2px 2px 0 var(--ink); white-space:nowrap;
}
.listen-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.listen-btn.on{background:var(--ink); color:var(--paper)}
.listen-btn svg{width:12px; height:12px}
.spk{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--ink);
  background:var(--paper); color:var(--ink); cursor:pointer; flex-shrink:0;
  align-items:center; justify-content:center; box-shadow:2px 2px 0 var(--ink); margin-left:auto;
}
.spk:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.spk svg{width:13px; height:13px}
.known-chip + .spk{margin-left:8px}
.ex-spk{width:24px; height:24px; margin-left:8px; box-shadow:1px 1px 0 var(--ink)}
.ex-spk svg{width:11px; height:11px}
.ex-en-label{display:flex; align-items:center}
.card-fr.sp,.card-en.sp,.ex-fr.sp{color:var(--tc,var(--accent)); transition:color .2s}
.player{
  display:none; align-items:center; gap:8px; flex-shrink:0;
  margin:0 12px 8px; padding:8px 10px; background:var(--ink); color:var(--paper);
  border-radius:14px; box-shadow:0 4px 14px rgba(22,18,31,.25);
}
.player.show{display:flex; animation:qin .25s cubic-bezier(.2,.8,.3,1)}
.pl-play{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--accent);
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.pl-play svg{width:15px; height:15px}
.pl-info{flex:1; min-width:0}
.pl-t{font-size:0.82rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pl-s{font-size:0.66rem; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

const D={
 EE:{
  A:[
  {id:'structureA',fr:'Structurer',en:'Story structure',c:'#FF6B2C',l:false,items:[
    {t:'p',lv:2,fr:'Tout a commencé quand…',en:'It all started when…',ex:'Tout a commencé quand le petit garçon est sorti seul dans la rue.',exE:'It all started when the little boy went out alone into the street.'},
    {t:'p',lv:2,fr:'C\'est alors que…',en:'That\'s when… / Then suddenly…',ex:'C\'est alors que le chien s\'est mis à aboyer furieusement.',exE:'That\'s when the dog started barking furiously.'},
    {t:'p',lv:2,fr:'Au moment où…, il/elle…',en:'At the moment when…',ex:'Au moment où il allait partir, quelque chose d\'étrange s\'est produit.',exE:'At the moment when he was about to leave, something strange happened.'},

    {t:'p',lv:1,fr:'Quelques minutes/heures plus tard,…',en:'A few minutes/hours later,…',ex:'Quelques minutes plus tard, les secours sont arrivés sur place.',exE:'A few minutes later, the emergency services arrived on the scene.'},

    {t:'v',lv:3,fr:'malgré les apparences',wc:'loc',en:'despite appearances',ex:'Malgré les apparences, leur relation était plus compliquée que prévu.',exE:'Despite appearances, their relationship was more complicated than expected.'},
    {t:'v',lv:3,fr:'s\'avérer + adj',wc:'v',en:'to turn out to be (formal)',ex:'La situation s\'est avérée bien plus grave qu\'on ne le pensait.',exE:'The situation turned out to be far more serious than expected.'},

    {t:'p',lv:1,fr:'Tout d\'abord,… / Ensuite,… / Enfin,…',en:'First of all,… / Then,… / Finally,…',ex:'Tout d\'abord, le héros était seul. Ensuite, il a rencontré un inconnu. Enfin, tout s\'est résolu.',exE:'First of all, the hero was alone. Then he met a stranger. Finally, everything was resolved.'},

  {id:'famille',fr:'Famille',en:'Family & couples',c:'#FFC400',l:true,items:[
    {t:'p',lv:2,fr:'cacher une vérité à quelqu\'un depuis des années',en:'to hide a truth from someone for years',ex:'Elle a découvert que son mari lui cachait une vérité depuis plus de trente ans.',exE:'She discovered her husband had been hiding a truth from her for more than thirty years.'},

  {id:'police',fr:'Police',en:'Police & mystery',c:'#0A6CF0',l:false,items:[
    {t:'p',lv:2,fr:'ouvrir / mener une enquête',en:'to open / conduct an investigation',ex:'Une enquête a été ouverte après la découverte des 24 000 lettres non remises.',exE:'An investigation was opened after the discovery of the 24,000 undelivered letters.'},

  {id:'voyage',fr:'Voyages',en:'Travel & adventure',c:'#00968F',l:false,items:[
    {t:'p',lv:2,fr:'se rendre quelque part pour la première fois de sa vie',en:'to go somewhere for the first time in one\'s life',ex:'L\'homme de 80 ans se rendait en ville pour la première fois de sa vie.',exE:'The 80-year-old man was going into the city for the first time in his life.'},
    {t:'p',h:1,fr:'faire demi-tour en plein vol',en:'to turn back mid-flight',ex:'L\'avion a dû faire demi-tour en plein vol à cause d\'une passagère malade.',exE:'The plane had to turn back mid-flight because of a sick passenger.'},
    {t:'p',lv:3,fr:'ne pas s\'attendre à ce que…',en:'to not expect / be in for a surprise',ex:'Les voisins ne s\'attendaient pas à une maison aussi moderne dans ce village.',exE:'The neighbours didn\'t expect such a modern house in that village.'},
    {t:'p',lv:1,fr:'avoir l\'habitude de faire quelque chose',en:'to be in the habit of doing something',ex:'Il avait l\'habitude de photographier tous les monuments historiques qu\'il visitait.',exE:'He was in the habit of photographing all the historical monuments he visited.'},
    {t:'p',h:1,fr:'prendre la fuite sans demander son reste',en:'to flee without looking back',ex:'L\'homme a pris la fuite sans demander son reste quand la police est arrivée.',exE:'The man fled without looking back when the police arrived.'},
    {t:'p',lv:2,fr:'être contraint(e) de faire demi-tour',en:'to be forced to turn back',ex:'Les randonneurs ont été contraints de faire demi-tour à cause des conditions météo.',exE:'The hikers were forced to turn back because of the weather conditions.'},
    {t:'p',lv:2,fr:'s\'aventurer dans un endroit inconnu',en:'to venture into an unknown place',ex:'Elle s\'est aventurée seule dans les ruelles d\'une ville qu\'elle ne connaissait pas.',exE:'She ventured alone into the alleyways of a city she did not know.'},

    {t:'v',lv:1,fr:'les pompiers',wc:'nmpl',en:'firefighters',ex:'Les pompiers ont rapidement maîtrisé les flammes.',exE:'The firefighters quickly brought the flames under control.'},
    {t:'v',lv:1,fr:'un incendie',wc:'nm',en:'a fire (building / forest)',ex:'Un incendie a détruit plusieurs maisons.',exE:'A fire destroyed several houses.'},
    {t:'v',lv:1,fr:'une inondation',wc:'nf',en:'a flood',ex:'L\'inondation a forcé des centaines de familles à quitter leur maison.',exE:'The flood forced hundreds of families to leave their homes.'},
    {t:'v',lv:1,fr:'une tempête',wc:'nf',en:'a storm',ex:'La tempête a arraché des toits et coupé l\'électricité.',exE:'The storm ripped off roofs and cut the power.'},
    {t:'v',lv:1,fr:'les dégâts',wc:'nmpl',en:'damage',ex:'Les dégâts matériels sont très importants.',exE:'The material damage is very considerable.'},
    {t:'v',lv:1,fr:'secourir / sauver',wc:'v',en:'to rescue / to save',ex:'Un voisin a secouru la famille piégée dans la maison.',exE:'A neighbour rescued the family trapped in the house.'},
    {t:'v',lv:1,fr:'évacuer',wc:'v',en:'to evacuate',ex:'Les habitants ont été évacués par précaution.',exE:'The residents were evacuated as a precaution.'},
    {t:'v',lv:1,fr:'légèrement / grièvement blessé(e)',wc:'adj',en:'slightly / seriously injured',ex:'Le conducteur est grièvement blessé mais ses jours ne sont pas en danger.',exE:'The driver is seriously injured but his life is not in danger.'},
    {t:'v',lv:1,fr:'un conducteur / une conductrice',wc:'nm/nf',en:'a driver',ex:'La conductrice a perdu le contrôle de son véhicule.',exE:'The driver lost control of her vehicle.'},
    {t:'v',lv:2,fr:'provoquer / causer',wc:'v',en:'to cause',ex:'Une fuite de gaz a provoqué l\'explosion.',exE:'A gas leak caused the explosion.'},
    {t:'v',lv:2,fr:'une collision',wc:'nf',en:'a collision',ex:'Une collision entre deux camions a bloqué l\'autoroute.',exE:'A collision between two trucks blocked the highway.'},
    {t:'v',lv:2,fr:'percuter / heurter',wc:'v',en:'to hit / crash into',ex:'La voiture a percuté un poteau électrique.',exE:'The car hit a power pole.'},
    {t:'v',lv:2,fr:'être hospitalisé(e)',wc:'v',en:'to be hospitalized',ex:'Deux personnes ont été hospitalisées pour des brûlures.',exE:'Two people were hospitalized with burns.'},
    {t:'v',lv:2,fr:'maîtriser un incendie',wc:'loc',en:'to bring a fire under control',ex:'Il a fallu trois heures pour maîtriser l\'incendie.',exE:'It took three hours to bring the fire under control.'},
    {t:'v',lv:2,fr:'une fuite de gaz',wc:'nf',en:'a gas leak',ex:'Une fuite de gaz a forcé l\'évacuation de l\'école.',exE:'A gas leak forced the school\'s evacuation.'},
    {t:'v',lv:2,fr:'être pris(e) au piège',wc:'loc',en:'to be trapped',ex:'Plusieurs randonneurs ont été pris au piège par la neige.',exE:'Several hikers were trapped by the snow.'},
    {t:'v',lv:2,fr:'porter secours à quelqu\'un',wc:'loc',en:'to come to someone\'s aid',ex:'Des passants ont porté secours aux victimes.',exE:'Passers-by came to the victims\' aid.'},
    {t:'v',lv:2,fr:'un bilan (provisoire)',wc:'nm',en:'a (provisional) toll',ex:'Le bilan provisoire fait état de cinq blessés.',exE:'The provisional toll reports five injured.'},
    {t:'v',lv:2,fr:'perdre le contrôle de son véhicule',wc:'loc',en:'to lose control of one\'s vehicle',ex:'Il a perdu le contrôle de son véhicule sur la chaussée glissante.',exE:'He lost control of his vehicle on the slippery road.'},
    {t:'v',lv:3,fr:'sortir indemne',wc:'loc',en:'to come out unharmed',ex:'Par miracle, tous les passagers sont sortis indemnes.',exE:'By a miracle, all the passengers came out unharmed.'},
    {t:'v',lv:3,fr:'un rescapé / une rescapée',wc:'nm/nf',en:'a survivor',ex:'Le seul rescapé a été retrouvé deux jours plus tard.',exE:'The only survivor was found two days later.'},
    {t:'v',lv:3,fr:'un acte de bravoure',wc:'nm',en:'an act of bravery',ex:'Son acte de bravoure lui a valu une médaille.',exE:'His act of bravery earned him a medal.'},
    {t:'v',lv:3,fr:'intervenir sur les lieux',wc:'loc',en:'to step in at the scene',ex:'Les secours sont intervenus sur les lieux en quelques minutes.',exE:'The rescue teams stepped in at the scene within minutes.'},
    {t:'v',lv:3,fr:'un effondrement',wc:'nm',en:'a collapse',ex:'L\'effondrement du toit a surpris tout le monde.',exE:'The roof\'s collapse surprised everyone.'},
    {t:'p',lv:3,fr:'Le bilan s\'est alourdi.',en:'The toll has risen.',ex:'Le bilan s\'est alourdi dans la nuit.',exE:'The toll rose during the night.'},
   ]},
  {id:'evenement',fr:'Événements',en:'Events & gatherings',c:'#F08A00',l:false,items:[
    {t:'v',lv:1,fr:'un événement',wc:'nm',en:'an event',ex:'L\'événement a attiré plus de mille personnes.',exE:'The event attracted more than a thousand people.'},
    {t:'v',lv:1,fr:'une cérémonie',wc:'nf',en:'a ceremony',ex:'La cérémonie a eu lieu devant la mairie.',exE:'The ceremony took place in front of the town hall.'},
    {t:'v',lv:1,fr:'une fête / un festival',wc:'nf/nm',en:'a party / a festival',ex:'Le festival a lieu chaque été dans le village.',exE:'The festival takes place every summer in the village.'},
    {t:'v',lv:1,fr:'un concours',wc:'nm',en:'a competition / contest',ex:'Elle a gagné un concours de pâtisserie.',exE:'She won a baking contest.'},
    {t:'v',lv:1,fr:'un gagnant / une gagnante',wc:'nm/nf',en:'a winner',ex:'La gagnante a reçu un voyage pour deux personnes.',exE:'The winner received a trip for two.'},
    {t:'v',lv:1,fr:'une surprise',wc:'nf',en:'a surprise',ex:'Ses amis lui ont préparé une grande surprise.',exE:'His friends prepared a big surprise for him.'},
    {t:'v',lv:1,fr:'une foule',wc:'nf',en:'a crowd',ex:'Une foule enthousiaste attendait les artistes.',exE:'An enthusiastic crowd was waiting for the artists.'},
    {t:'v',lv:1,fr:'des retrouvailles',wc:'nfpl',en:'a reunion (of people)',ex:'Les retrouvailles entre les deux frères ont été très émouvantes.',exE:'The reunion between the two brothers was very moving.'},
    {t:'v',lv:1,fr:'célébrer / fêter',wc:'v',en:'to celebrate',ex:'Les habitants ont fêté la victoire dans la rue.',exE:'The residents celebrated the victory in the street.'},
    {t:'v',lv:1,fr:'un invité / une invitée',wc:'nm/nf',en:'a guest',ex:'Les invités sont arrivés dès dix-huit heures.',exE:'The guests arrived as early as six p.m.'},
    {t:'v',lv:1,fr:'un discours',wc:'nm',en:'a speech',ex:'Le maire a prononcé un discours devant la foule.',exE:'The mayor gave a speech in front of the crowd.'},
    {t:'v',lv:2,fr:'rassembler / réunir',wc:'v',en:'to gather / bring together',ex:'Cet événement a rassemblé des gens de toutes les générations.',exE:'This event brought together people of all generations.'},
    {t:'v',lv:2,fr:'une inauguration',wc:'nf',en:'an inauguration / opening',ex:'L\'inauguration du nouveau parc a eu lieu samedi.',exE:'The opening of the new park took place on Saturday.'},
    {t:'v',lv:2,fr:'remporter un prix',wc:'loc',en:'to win an award',ex:'Le film a remporté le prix du public.',exE:'The film won the audience award.'},
    {t:'v',lv:2,fr:'rendre hommage à quelqu\'un',wc:'loc',en:'to pay tribute to someone',ex:'Toute la ville est venue rendre hommage au pompier.',exE:'The whole town came to pay tribute to the firefighter.'},
    {t:'v',lv:2,fr:'attirer la foule',wc:'loc',en:'to draw crowds',ex:'Le spectacle a attiré la foule malgré la pluie.',exE:'The show drew crowds despite the rain.'},
    {t:'v',lv:2,fr:'une tradition',wc:'nf',en:'a tradition',ex:'C\'est une tradition qui existe depuis plus de cent ans.',exE:'It is a tradition that has existed for more than a hundred years.'},
    {t:'v',lv:2,fr:'une rencontre inattendue',wc:'nf',en:'an unexpected encounter',ex:'Une rencontre inattendue a changé sa vie.',exE:'An unexpected encounter changed his life.'},
    {t:'p',lv:2,fr:'Tout s\'est déroulé dans la bonne humeur.',en:'Everything went off in good spirits.',ex:'Tout s\'est déroulé dans la bonne humeur, malgré le froid.',exE:'Everything went off in good spirits, despite the cold.'},
    {t:'v',lv:3,fr:'les festivités',wc:'nfpl',en:'the festivities',ex:'Les festivités ont duré trois jours.',exE:'The festivities lasted three days.'},
    {t:'v',lv:3,fr:'créer l\'événement',wc:'loc',en:'to make headlines / create a stir',ex:'Ce mariage en haut d\'une montagne a créé l\'événement.',exE:'This wedding at the top of a mountain made headlines.'},
    {t:'v',lv:3,fr:'immortaliser un moment',wc:'loc',en:'to capture a moment for posterity',ex:'Les invités ont immortalisé le moment avec leurs téléphones.',exE:'The guests captured the moment with their phones.'},
    {t:'v',lv:3,fr:'un moment d\'émotion intense',wc:'nm',en:'a moment of intense emotion',ex:'Ce fut un moment d\'émotion intense pour toute la famille.',exE:'It was a moment of intense emotion for the whole family.'},
   ]},
 ],

 B:[
  {id:'structureB',fr:'Structurer',en:'Argument structure',c:'#FF6B2C',l:false,items:[
    {t:'p',lv:2,fr:'Je suis tout à fait convaincu(e) que…',en:'I am fully convinced that…',ex:'Je suis tout à fait convaincu qu\'une telle mesure serait bénéfique pour notre société.',exE:'I am fully convinced that such a measure would be beneficial for our society.'},
    {t:'p',lv:2,fr:'Certes, on peut comprendre que…, mais…',en:'Admittedly… but…',ex:'Certes, on peut comprendre que cette décision soit difficile, mais elle s\'impose.',exE:'Admittedly, one can understand that this decision is difficult, but it is necessary.'},
    {t:'p',lv:2,fr:'Il faut néanmoins reconnaître que…',en:'Nevertheless, one must recognise that…',ex:'Il faut néanmoins reconnaître que les conséquences seraient considérables.',exE:'Nevertheless, one must recognise that the consequences would be considerable.'},
    {t:'p',lv:1,fr:'En outre, / De plus,…',en:'Furthermore, / Moreover,…',ex:'En outre, cette mesure aurait un impact positif sur l\'environnement.',exE:'Furthermore, this measure would have a positive impact on the environment.'},
    {t:'p',lv:1,fr:'Par conséquent, / Ainsi,…',en:'As a result / Therefore / Thus,…',ex:'Par conséquent, il serait urgent d\'agir dès maintenant.',exE:'As a result, it would be urgent to act right now.'},
    {t:'p',lv:2,fr:'En conclusion, il apparaît clairement que…',en:'In conclusion, it is clear that…',ex:'En conclusion, il apparaît clairement que cette proposition mérite d\'être soutenue.',exE:'In conclusion, it is clear that this proposal deserves support.'},
    {t:'p',lv:1,fr:'d\'un côté… de l\'autre…',en:'on one hand… on the other…',ex:'D\'un côté, cela favorise l\'autonomie ; de l\'autre, cela crée de l\'isolement.',exE:'On one hand, it promotes autonomy; on the other, it creates isolation.'},
    {t:'p',lv:2,fr:'Je tiens à souligner que…',en:'I would like to emphasize that…',ex:'Je tiens à souligner que cette question touche directement nos enfants.',exE:'I would like to emphasize that this question directly affects our children.'},
    {t:'p',lv:2,fr:'Il serait préférable de… plutôt que de…',en:'It would be preferable to… rather than…',ex:'Il serait préférable de limiter plutôt que d\'interdire complètement.',exE:'It would be preferable to limit rather than ban completely.'},
    {t:'p',lv:3,fr:'Force est de constater que…',en:'One cannot help but notice that… / The fact is that…',ex:'Force est de constater que les résultats ne sont pas à la hauteur des attentes.',exE:'One cannot help but notice that the results do not live up to expectations.'},
    {t:'p',lv:2,fr:'Il convient de noter que…',en:'It is worth noting that…',ex:'Il convient de noter que cette mesure existe déjà dans plusieurs pays.',exE:'It is worth noting that this measure already exists in several countries.'},
    {t:'p',lv:1,fr:'En revanche, / En contrepartie,…',en:'On the other hand, / In return,…',ex:'En revanche, les opposants à ce projet soulèvent des arguments valables.',exE:'On the other hand, the opponents of this project raise valid arguments.'},
    {t:'v',lv:2,fr:'nuancé(e)',wc:'adj',en:'nuanced / balanced',ex:'Il faut adopter une position nuancée sur ce sujet complexe.',exE:'One must adopt a nuanced position on this complex topic.'},
    {t:'v',lv:2,fr:'souligner / mettre en avant',wc:'v',en:'to underline / highlight',ex:'Je tiens à souligner l\'importance de cette décision pour l\'avenir.',exE:'I would like to highlight the importance of this decision for the future.'},
    {t:'v',lv:2,fr:'néanmoins / toutefois / cependant',wc:'adv',en:'nevertheless / however / yet',ex:'Néanmoins, il ne faut pas négliger les effets négatifs de cette mesure.',exE:'Nevertheless, one must not neglect the negative effects of this measure.'},
    {t:'v',lv:2,fr:'il s\'agit de + inf',wc:'loc',en:'it is a matter of / what is at stake is',ex:'Il ne s\'agit pas simplement d\'économiser de l\'argent, mais de sauver des vies.',exE:'It is not simply a matter of saving money, but of saving lives.'},
    {t:'v',lv:2,fr:'s\'opposer à / être favorable à',wc:'v',en:'to oppose / to be in favour of',ex:'Je m\'oppose fermement à cette décision pour les raisons suivantes.',exE:'I firmly oppose this decision for the following reasons.'},
    {t:'v',lv:2,fr:'convaincant(e) / persuasif(-ive)',wc:'adj',en:'convincing / persuasive',ex:'Son argument était convaincant mais manquait d\'exemples concrets.',exE:'His argument was convincing but lacked concrete examples.'},
    {t:'v',lv:3,fr:'il va sans dire que…',en:'it goes without saying that…',wc:'loc',ex:'Il va sans dire que les autorités ont une responsabilité dans cette affaire.',exE:'It goes without saying that the authorities have a responsibility in this matter.'},
    {t:'v',lv:3,fr:'dans une certaine mesure',wc:'loc',en:'to a certain extent',ex:'Dans une certaine mesure, on peut comprendre la réaction des habitants.',exE:'To a certain extent, one can understand the reaction of the residents.'},
  
    {t:'p',lv:1,fr:'À mon avis / Selon moi,…',en:'In my opinion / According to me,…',ex:'À mon avis, cette mesure n\'aura pas l\'effet escompté sur la population.',exE:'In my opinion, this measure will not have the desired effect on the population.'},
    {t:'p',lv:1,fr:'Il me semble que…',en:'It seems to me that…',ex:'Il me semble que nous n\'avons pas encore envisagé toutes les solutions possibles.',exE:'It seems to me that we have not yet considered all the possible solutions.'},
    {t:'p',lv:1,fr:'Je pense / crois que…',en:'I think / believe that…',ex:'Je pense que chaque citoyen a une responsabilité dans cette situation.',exE:'I think that every citizen has a responsibility in this situation.'},
    {t:'p',lv:3,fr:'Même si…, il n\'en reste pas moins que…',en:'Even if…, it remains true that…',ex:'Même si les arguments sont valables, il n\'en reste pas moins que l\'impact sera négatif.',exE:'Even if the arguments are valid, it remains true that the impact will be negative.'},
    {t:'p',lv:1,fr:'Il est vrai que…, mais…',en:'It is true that…, but…',ex:'Il est vrai que cette mesure coûte cher, mais les bénéfices sont considérables.',exE:'It is true that this measure is costly, but the benefits are considerable.'},
    {t:'p',lv:2,fr:'Je voudrais souligner le fait que…',en:'I would like to highlight the fact that…',ex:'Je voudrais souligner le fait que les jeunes sont les plus touchés par ce problème.',exE:'I would like to highlight the fact that young people are the most affected by this problem.'},
    {t:'v',lv:1,fr:'Tout d\'abord,… / Premièrement,…',wc:'adv',en:'First of all / Firstly,…',ex:'Tout d\'abord, je souhaite exposer les avantages de cette initiative.',exE:'First of all, I wish to present the advantages of this initiative.'},
    {t:'v',lv:1,fr:'Deuxièmement,… / De plus,…',wc:'adv',en:'Secondly,… / Furthermore,…',ex:'Deuxièmement, il faut considérer l\'impact environnemental de cette décision.',exE:'Secondly, we must consider the environmental impact of this decision.'},
    {t:'v',lv:1,fr:'C\'est pourquoi…',wc:'loc',en:'That is why… / This is why…',ex:'C\'est pourquoi je vous encourage à soutenir cette proposition.',exE:'That is why I encourage you to support this proposal.'},
    {t:'v',lv:1,fr:'en effet / effectivement',wc:'adv',en:'indeed / in fact',ex:'En effet, les chiffres prouvent que la situation empire depuis trois ans.',exE:'Indeed, the figures prove that the situation has been getting worse for three years.'},
    {t:'v',lv:1,fr:'il faut + inf / il est nécessaire de',wc:'loc',en:'it is necessary to / one must',ex:'Il faut agir maintenant pour éviter que la situation empire encore davantage.',exE:'It is necessary to act now to prevent the situation from getting even worse.'},
    {t:'v',lv:1,fr:'pour ces raisons,…',wc:'loc',en:'for these reasons,…',ex:'Pour ces raisons, je vous demande de reconsidérer votre décision.',exE:'For these reasons, I ask you to reconsider your decision.'},
    {t:'v',lv:2,fr:'je vous remercie de bien vouloir…',wc:'form',en:'I thank you for kindly… (formal letter close)',ex:'Je vous remercie de bien vouloir prendre en compte mes suggestions.',exE:'I thank you for kindly taking my suggestions into account.'},
    {t:'v',lv:2,fr:'dans l\'attente de votre réponse,…',wc:'form',en:'awaiting your reply,… (formal close)',ex:'Dans l\'attente de votre réponse, je vous adresse mes cordiales salutations.',exE:'Awaiting your reply, I extend my warmest regards.'},
    {t:'p',lv:1,fr:'Monsieur le Rédacteur en chef,',en:'Dear Editor,',ex:'Monsieur le Rédacteur en chef, je réagis à votre article sur le télétravail.',exE:'Dear Editor, I am responding to your article on remote work.'},
    {t:'p',lv:1,fr:'Je vous écris pour réagir à…',en:'I am writing to react to…',ex:'Je vous écris pour réagir à l\'article publié hier dans votre journal.',exE:'I am writing to react to the article published yesterday in your newspaper.'},
    {t:'p',lv:1,fr:'Je suis pour / contre…',en:'I am for / against…',ex:'Je suis tout à fait pour cette proposition.',exE:'I am entirely in favour of this proposal.'},
    {t:'p',lv:1,fr:'Je suis d\'accord / pas d\'accord avec…',en:'I agree / disagree with…',ex:'Je ne suis pas d\'accord avec cette opinion.',exE:'I do not agree with this opinion.'},
    {t:'p',lv:1,fr:'Pour commencer,… / En premier lieu,…',en:'To begin with,… / Firstly,…',ex:'Pour commencer, il faut rappeler que les écrans fatiguent les yeux.',exE:'To begin with, we must remember that screens tire the eyes.'},
    {t:'p',lv:1,fr:'Ensuite,… / En plus,…',en:'Then,… / In addition,…',ex:'En plus, ce système coûte très cher à la collectivité.',exE:'In addition, this system costs the community a great deal.'},
    {t:'p',lv:1,fr:'Par exemple,… / Prenons l\'exemple de…',en:'For example,… / Take the example of…',ex:'Prenons l\'exemple d\'une famille qui n\'a pas de voiture.',exE:'Take the example of a family without a car.'},
    {t:'p',lv:1,fr:'En conclusion,… / Pour finir,…',en:'In conclusion,… / Finally,…',ex:'En conclusion, je pense que cette mesure est nécessaire.',exE:'In conclusion, I think this measure is necessary.'},
    {t:'v',lv:1,fr:'un argument',wc:'nm',en:'an argument',ex:'Mon premier argument concerne la sécurité.',exE:'My first argument concerns safety.'},
    {t:'v',lv:1,fr:'un avantage / un inconvénient',wc:'nm',en:'an advantage / a drawback',ex:'Cette solution a plus d\'avantages que d\'inconvénients.',exE:'This solution has more advantages than drawbacks.'},
    {t:'v',lv:1,fr:'parce que / car / puisque',wc:'conj',en:'because / since',ex:'Je suis contre, car cette mesure coûte trop cher.',exE:'I am against it, because this measure costs too much.'},
    {t:'p',lv:2,fr:'Je me permets de vous écrire afin de…',en:'I am taking the liberty of writing to you in order to…',ex:'Je me permets de vous écrire afin de donner mon point de vue.',exE:'I am taking the liberty of writing to you in order to give my point of view.'},
    {t:'p',lv:2,fr:'À mon sens,… / À mes yeux,…',en:'In my view,… / In my eyes,…',ex:'À mon sens, l\'éducation devrait rester gratuite.',exE:'In my view, education should remain free.'},
    {t:'p',lv:2,fr:'Il est incontestable que… (+ indicatif)',en:'It is undeniable that…',ex:'Il est incontestable que les réseaux sociaux changent nos habitudes.',exE:'It is undeniable that social media is changing our habits.'},
    {t:'p',lv:2,fr:'En ce qui concerne… / Quant à…',en:'As for… / Regarding…',ex:'Quant au coût de cette mesure, il reste raisonnable.',exE:'As for the cost of this measure, it remains reasonable.'},
    {t:'p',lv:2,fr:'Par ailleurs,… / D\'ailleurs,…',en:'Moreover,… / Besides,…',ex:'Par ailleurs, de nombreuses études confirment ce constat.',exE:'Moreover, many studies confirm this finding.'},
    {t:'p',lv:2,fr:'Au contraire,… / Cela dit,…',en:'On the contrary,… / That said,…',ex:'Cela dit, il ne faut pas oublier les risques.',exE:'That said, we must not forget the risks.'},
    {t:'p',lv:2,fr:'Il ne faut pas oublier que…',en:'We must not forget that…',ex:'Il ne faut pas oublier que tout le monde n\'a pas accès à Internet.',exE:'We must not forget that not everyone has access to the Internet.'},
    {t:'p',lv:2,fr:'Afin de / Pour + infinitif',en:'In order to…',ex:'Afin de réduire la pollution, il faut limiter les voitures.',exE:'In order to reduce pollution, we must limit cars.'},
    {t:'p',lv:2,fr:'Veuillez agréer, Monsieur, mes salutations distinguées.',en:'Yours sincerely (formal closing)',ex:'Veuillez agréer, Monsieur le Rédacteur en chef, mes salutations distinguées.',exE:'Yours sincerely, Dear Editor.'},
    {t:'p',lv:2,fr:'tandis que / alors que',en:'whereas / while',ex:'Certains travaillent à la maison, tandis que d\'autres préfèrent le bureau.',exE:'Some work from home, whereas others prefer the office.'},
    {t:'p',lv:3,fr:'À cet égard,… / Dans cette optique,…',en:'In this regard,… / With this in mind,…',ex:'À cet égard, l\'exemple des pays nordiques est éclairant.',exE:'In this regard, the example of the Nordic countries is enlightening.'},
    {t:'p',lv:3,fr:'Il est indéniable que…',en:'It is undeniable that…',ex:'Il est indéniable que les inégalités se creusent.',exE:'It is undeniable that inequalities are widening.'},
    {t:'p',lv:3,fr:'Dans la mesure où…',en:'Insofar as… / Given that…',ex:'Dans la mesure où l\'école est obligatoire, elle doit être gratuite.',exE:'Given that school is compulsory, it must be free.'},
    {t:'p',lv:3,fr:'Loin de…, cela…',en:'Far from…, this…',ex:'Loin de nous isoler, Internet nous rapproche parfois.',exE:'Far from isolating us, the Internet sometimes brings us closer.'},
    {t:'p',lv:3,fr:'Aussi bien… que…',en:'Both… and… / Just as much… as…',ex:'Cette mesure concerne aussi bien les jeunes que les aînés.',exE:'This measure concerns both young people and seniors.'},
    {t:'v',lv:3,fr:'de sorte que + subjonctif / indicatif',wc:'conj',en:'so that / with the result that',ex:'Il faut agir de sorte que chacun puisse en profiter.',exE:'We must act so that everyone can benefit.'},
]},

  {id:'techno',fr:'Technologie',en:'Technology & screens',c:'#0A6CF0',l:false,items:[
    {t:'p',lv:2,fr:'être accro à son téléphone / aux écrans',en:'to be addicted to one\'s phone / screens',ex:'De plus en plus de jeunes sont accros à leur téléphone portable.',exE:'More and more young people are addicted to their mobile phones.'},
    {t:'p',lv:2,fr:'faire défiler les réseaux sociaux pendant des heures',en:'to scroll through social media for hours',ex:'On passe des heures à faire défiler les réseaux sociaux sans vraiment s\'en rendre compte.',exE:'We spend hours scrolling through social media without even realising it.'},
    {t:'p',lv:2,fr:'limiter le temps d\'écran dès le plus jeune âge',en:'to limit screen time from an early age',ex:'Il faudrait limiter le temps d\'écran dès le plus jeune âge.',exE:'Screen time should be limited from a very young age.'},
    {t:'p',h:1,fr:'nous sommes devenus des marchandises',en:'we have become commodities',ex:'Avec Internet, nos données personnelles font de nous de véritables marchandises.',exE:'With the Internet, our personal data has made us into real commodities.'},

   {id:'eoA_phrases',fr:'Demander infos',en:'Universal info-request phrases',c:'#FF6B2C',l:false,items:[

    {t:'v',lv:3,fr:'une période d\'essai',wc:'nf',en:'a probation period',ex:'Le contrat prévoit une période d\'essai de trois mois.',exE:'The contract includes a three-month probation period.'},
    {t:'v',lv:3,fr:'une attestation',wc:'nf',en:'a certificate (of completion / attendance)',ex:'Une attestation est remise à la fin du cours.',exE:'A certificate is handed out at the end of the course.'},
    {t:'p',lv:3,fr:'Y a-t-il des possibilités d\'évolution ?',en:'Are there opportunities for advancement?',ex:'Y a-t-il des possibilités d\'évolution au sein de l\'entreprise ?',exE:'Are there opportunities for advancement within the company?'},
   ]},
  ],
  B:[
   {id:'eoB_persuasion',fr:'Convaincre',en:'Universal persuasion phrases',c:'#FF6B2C',l:false,items:[
    {t:'p',lv:1,fr:'Je voudrais te convaincre d\'essayer… avec moi.',en:'I\'d like to convince you to try… with me.',ex:'Je voudrais te convaincre d\'essayer les cours de danse avec moi ce samedi.',exE:'I\'d like to convince you to try dance classes with me this Saturday.'},
    {t:'p',lv:1,fr:'Tu ne regretteras pas d\'avoir essayé, je t\'assure.',en:'You won\'t regret trying it, I promise.',ex:'Tu ne regretteras pas d\'avoir essayé, je t\'assure — c\'est vraiment génial.',exE:'You won\'t regret trying it, I promise — it\'s really great.'},
    {t:'p',lv:1,fr:'Je comprends tes réticences, mais…',en:'I understand your reluctance, but…',ex:'Je comprends tes réticences, mais tu verras que c\'est bien moins effrayant que tu ne l\'imagines.',exE:'I understand your reluctance, but you\'ll see it\'s much less frightening than you imagine.'},
    {t:'p',lv:1,fr:'Imagine un peu… / Imagine-toi en train de…',en:'Just imagine… / Picture yourself…',ex:'Imagine-toi en train de sauter en parachute au-dessus des Alpes — quelle vue !',exE:'Picture yourself skydiving over the Alps — what a view!'},
    {t:'p',lv:2,fr:'C\'est une expérience unique / inoubliable.',en:'It\'s a unique / unforgettable experience.',ex:'C\'est une expérience vraiment unique qu\'on ne peut pas vivre ailleurs.',exE:'It\'s a truly unique experience you can\'t have anywhere else.'},
    {t:'p',lv:1,fr:'Tu n\'as rien à perdre à essayer.',en:'You have nothing to lose by trying.',ex:'Tu n\'as rien à perdre à essayer — si ça ne te plaît pas, on rentre à la maison.',exE:'You have nothing to lose by trying — if you don\'t like it, we go home.'},
    {t:'p',lv:2,fr:'Pense à tout ce que tu pourrais apprendre / découvrir.',en:'Think about everything you could learn / discover.',ex:'Pense à tout ce que tu pourrais découvrir sur toi-même en relevant ce défi.',exE:'Think about everything you could discover about yourself by taking on this challenge.'},
    {t:'p',lv:1,fr:'Ce serait l\'occasion idéale de…',en:'It would be the perfect opportunity to…',ex:'Ce serait l\'occasion idéale de sortir de ta zone de confort pour une fois.',exE:'It would be the perfect opportunity to step out of your comfort zone for once.'},
    {t:'p',lv:1,fr:'On pourrait y aller ensemble pour que tu te sentes plus à l\'aise.',en:'We could go together so you feel more comfortable.',ex:'On pourrait y aller ensemble pour que tu te sentes plus à l\'aise la première fois.',exE:'We could go together so you feel more comfortable the first time.'},
    {t:'p',lv:2,fr:'Ça ne coûte pas grand-chose et les bénéfices sont énormes.',en:'It doesn\'t cost much and the benefits are huge.',ex:'Ça ne coûte pas grand-chose et les bénéfices sur ta santé sont vraiment énormes.',exE:'It doesn\'t cost much and the health benefits are truly huge.'},
    {t:'v',lv:1,fr:'convaincre (v)',wc:'v',en:'to convince',ex:'J\'espère t\'avoir convaincu de participer à cet événement avec moi.',exE:'I hope to have convinced you to take part in this event with me.'},
    {t:'v',lv:1,fr:'persuader (v)',wc:'v',en:'to persuade',ex:'Je vais te persuader que c\'est exactement ce qu\'il te faut.',exE:'I\'m going to persuade you that it\'s exactly what you need.'},
    {t:'v',lv:1,fr:'les avantages vs les inconvénients',wc:'nm',en:'the pros vs the cons',ex:'Si on analyse les avantages et les inconvénients, les avantages l\'emportent largement.',exE:'If we weigh up the pros and cons, the pros clearly outweigh the cons.'},
    {t:'v',lv:2,fr:'sortir de sa zone de confort',wc:'loc',en:'to step out of one\'s comfort zone',ex:'Ce genre d\'activité te poussera à sortir de ta zone de confort de façon positive.',exE:'This kind of activity will push you to step outside your comfort zone in a positive way.'},
    {t:'v',lv:1,fr:'avoir peur de / craindre',wc:'v',en:'to be afraid of / to fear',ex:'Je sais que tu as peur, mais c\'est justement ce qui rend l\'expérience intéressante.',exE:'I know you\'re afraid, but that\'s exactly what makes the experience interesting.'},
    {t:'v',lv:1,fr:'ça vaut le coup / ça vaut la peine',wc:'loc',en:'it\'s worth it',ex:'Je te promets que ça vaut vraiment le coup de dépasser ses appréhensions.',exE:'I promise you it\'s truly worth overcoming your apprehensions.'},
    {t:'p',lv:1,fr:'Qu\'est-ce qui te retient vraiment ?',en:'What\'s really holding you back?',ex:'Qu\'est-ce qui te retient vraiment — ce n\'est quand même pas la peur de l\'échec ?',exE:'What\'s really holding you back — it\'s not fear of failure, is it?'},
    {t:'p',lv:2,fr:'Je suis sûr(e) que tu adoreras ça une fois que tu auras essayé.',en:'I\'m sure you\'ll love it once you\'ve tried it.',ex:'Je suis sûre que tu adoreras ça une fois que tu auras essayé la première fois.',exE:'I\'m sure you\'ll love it once you\'ve tried it the first time.'},
    {t:'v',lv:3,fr:'enthousiasmant(e) (adj)',wc:'adj',en:'exciting / thrilling',ex:'L\'idée de découvrir quelque chose de nouveau est toujours enthousiasmante.',exE:'The idea of discovering something new is always exciting.'},
    {t:'p',lv:1,fr:'Si ça ne te plaît pas, on ne recommence pas — promis.',en:'If you don\'t like it, we won\'t do it again — promise.',ex:'Si ça ne te plaît vraiment pas, on ne recommence pas — c\'est promis.',exE:'If you really don\'t like it, we won\'t do it again — that\'s a promise.'},
    {t:'v',lv:3,fr:'une appréhension (nf)',wc:'nf',en:'an apprehension / worry',ex:'Toutes tes appréhensions vont disparaître dès que tu commenceras.',exE:'All your apprehensions will disappear as soon as you start.'},
    {t:'v',lv:2,fr:'défi / relever un défi',wc:'nm',en:'challenge / to take on a challenge',ex:'Relever ce défi ensemble va renforcer notre amitié, j\'en suis convaincu.',exE:'Taking on this challenge together will strengthen our friendship, I\'m sure of it.'},
    {t:'p',lv:1,fr:'Écoute, je comprends, mais…',en:'Listen, I understand, but…',ex:'Écoute, je comprends, mais ça vaut vraiment la peine d\'essayer.',exE:'Listen, I understand, but it\'s really worth trying.'},
    {t:'p',lv:1,fr:'Tu as raison, mais…',en:'You\'re right, but…',ex:'Tu as raison, c\'est un peu cher, mais pense à ce que tu vas en retirer.',exE:'You\'re right, it\'s a bit expensive, but think about what you\'ll get out of it.'},
    {t:'p',lv:1,fr:'Ce n\'est pas si cher que ça.',en:'It\'s not that expensive.',ex:'Ce n\'est pas si cher que ça si on partage les frais.',exE:'It\'s not that expensive if we share the costs.'},
    {t:'p',lv:1,fr:'Franchement, / Honnêtement,…',en:'Frankly, / Honestly,…',ex:'Franchement, je pense que tu vas adorer.',exE:'Frankly, I think you\'re going to love it.'},
    {t:'p',lv:1,fr:'Fais-moi confiance.',en:'Trust me.',ex:'Fais-moi confiance, tu ne vas pas le regretter.',exE:'Trust me, you won\'t regret it.'},
    {t:'p',lv:1,fr:'Pourquoi pas ?',en:'Why not?',ex:'Pourquoi pas essayer une seule fois ?',exE:'Why not try just once?'},
    {t:'p',lv:1,fr:'Tu devrais vraiment essayer.',en:'You should really try it.',ex:'Tu devrais vraiment essayer, c\'est une chance unique.',exE:'You should really try it, it\'s a unique chance.'},
    {t:'p',lv:1,fr:'Je te promets que…',en:'I promise you that…',ex:'Je te promets que tu vas passer un super moment.',exE:'I promise you that you\'ll have a great time.'},
    {t:'p',lv:1,fr:'D\'abord,… ensuite,… et puis surtout,…',en:'First,… then,… and above all,…',ex:'D\'abord, c\'est pas cher, ensuite c\'est près de chez toi, et puis surtout, on y va ensemble.',exE:'First, it\'s cheap, then it\'s close to your place, and above all, we go together.'},
    {t:'p',lv:2,fr:'Je comprends que tu aies peur, mais…',en:'I understand that you\'re afraid, but…',ex:'Je comprends que tu aies peur, mais il y a des moniteurs pour t\'aider.',exE:'I understand that you\'re afraid, but there are instructors to help you.'},
    {t:'p',lv:2,fr:'Admettons que ce soit cher, mais…',en:'Let\'s say it\'s expensive, but…',ex:'Admettons que ce soit cher, mais c\'est un souvenir pour la vie.',exE:'Let\'s say it\'s expensive, but it\'s a memory for life.'},
    {t:'p',lv:2,fr:'Je vois ce que tu veux dire, pourtant…',en:'I see what you mean, yet…',ex:'Je vois ce que tu veux dire, pourtant je pense que tu te trompes sur ce point.',exE:'I see what you mean, yet I think you\'re wrong on this point.'},
    {t:'p',lv:2,fr:'Pense aux avantages : …',en:'Think about the advantages: …',ex:'Pense aux avantages : tu rencontres du monde, tu apprends et tu t\'amuses.',exE:'Think about the advantages: you meet people, you learn and you have fun.'},
    {t:'p',lv:2,fr:'C\'est un investissement, pas une dépense.',en:'It\'s an investment, not an expense.',ex:'C\'est un investissement, pas une dépense : tu vas apprendre une vraie compétence.',exE:'It\'s an investment, not an expense: you\'ll learn a real skill.'},
    {t:'p',lv:2,fr:'Dis-toi que…',en:'Tell yourself that…',ex:'Dis-toi que tu n\'as rien à perdre.',exE:'Tell yourself that you have nothing to lose.'},
    {t:'p',lv:2,fr:'Et si on essayait une seule fois ?',en:'What if we tried just once?',ex:'Et si on essayait une seule fois, juste pour voir ?',exE:'What if we tried just once, just to see?'},
    {t:'p',lv:2,fr:'Ce qui est génial, c\'est que…',en:'What\'s great is that…',ex:'Ce qui est génial, c\'est que tu peux y aller à ton rythme.',exE:'What\'s great is that you can go at your own pace.'},
    {t:'p',lv:2,fr:'À ta place, je n\'hésiterais pas.',en:'If I were you, I wouldn\'t hesitate.',ex:'À ta place, je n\'hésiterais pas une seconde.',exE:'If I were you, I wouldn\'t hesitate for a second.'},
    {t:'p',lv:2,fr:'Tu ne vas pas passer à côté de ça !',en:'You\'re not going to miss out on that!',ex:'Tu ne vas quand même pas passer à côté d\'une occasion pareille !',exE:'You\'re surely not going to miss out on such an opportunity!'},
    {t:'p',lv:3,fr:'Je te le garantis.',en:'I guarantee it.',ex:'Tu vas adorer, je te le garantis.',exE:'You\'re going to love it, I guarantee it.'},
    {t:'p',lv:3,fr:'Loin d\'être un obstacle, … est un atout.',en:'Far from being an obstacle, … is an asset.',ex:'Loin d\'être un obstacle, ton manque d\'expérience est un atout : tu vas tout découvrir.',exE:'Far from being an obstacle, your lack of experience is an asset: you\'ll discover everything.'},
    {t:'p',lv:3,fr:'Sois honnête avec toi-même : …',en:'Be honest with yourself: …',ex:'Sois honnête avec toi-même : tu en as envie depuis longtemps.',exE:'Be honest with yourself: you\'ve wanted this for a long time.'},
    {t:'p',lv:3,fr:'Tu pourrais être agréablement surpris(e).',en:'You might be pleasantly surprised.',ex:'Tu pourrais être agréablement surpris par le résultat.',exE:'You might be pleasantly surprised by the result.'},
    {t:'p',lv:3,fr:'Ce n\'est pas aussi risqué que tu le penses.',en:'It\'s not as risky as you think.',ex:'Ce n\'est pas aussi risqué que tu le penses, c\'est très bien encadré.',exE:'It\'s not as risky as you think, it\'s very well supervised.'},
   ]},

   {id:'eoB_aventure',fr:'Aventure & sport',en:'Adventure & sports persuasion',c:'#7B5BD6',l:false,items:[
    {t:'p',lv:2,fr:'Ce type d\'activité va vraiment faire monter l\'adrénaline !',en:'This type of activity will really get the adrenaline pumping!',ex:'Ce saut en chute libre va vraiment faire monter l\'adrénaline, tu verras !',exE:'This freefall jump will really get the adrenaline pumping, you\'ll see!'},
    {t:'p',lv:2,fr:'C\'est encadré par des professionnels, donc tu seras en sécurité à tout moment.',en:'It\'s supervised by professionals, so you\'ll be safe at all times.',ex:'La descente est encadrée par des professionnels donc tu seras en sécurité à tout moment.',exE:'The descent is supervised by professionals so you\'ll be safe at all times.'},
    {t:'p',lv:2,fr:'Des milliers de personnes le font chaque année sans problème.',en:'Thousands of people do it every year without any problem.',ex:'Des milliers de personnes font de la chute libre chaque année sans aucun problème.',exE:'Thousands of people go skydiving every year without any problem.'},
    {t:'p',lv:1,fr:'Tu n\'as pas besoin d\'être sportif(ve) pour y participer.',en:'You don\'t need to be sporty to take part.',ex:'Tu n\'as pas besoin d\'être sportif pour faire du vélo en ville — c\'est à ta portée.',exE:'You don\'t need to be sporty to cycle in the city — it\'s well within your reach.'},
    {t:'v',lv:2,fr:'l\'adrénaline (nf)',wc:'nf',en:'adrenaline',ex:'La montée d\'adrénaline que tu ressentiras vaut largement la peur du départ.',exE:'The rush of adrenaline you\'ll feel is well worth the initial fear.'},
    {t:'v',lv:3,fr:'le dépassement de soi (nm)',wc:'nm',en:'self-surpassing / pushing one\'s limits',ex:'Ce marathon cycliste est une belle opportunité de dépassement de soi.',exE:'This cycling marathon is a great opportunity to push your personal limits.'},
    {t:'v',lv:2,fr:'en toute sécurité (loc)',wc:'loc',en:'in complete safety',ex:'Tu pourras pratiquer cette activité en toute sécurité avec des moniteurs qualifiés.',exE:'You\'ll be able to do this activity in complete safety with qualified instructors.'},
    {t:'p',lv:2,fr:'Pense à la fierté que tu ressentiras après avoir accompli ça !',en:'Think of the pride you\'ll feel after accomplishing this!',ex:'Pense à la fierté que tu ressentiras après avoir terminé le défi cycliste !',exE:'Think of the pride you\'ll feel after completing the cycling challenge!'},
    {t:'v',lv:2,fr:'un accompagnateur (nm)',wc:'nm',en:'a companion / leader (sports)',ex:'Un accompagnateur qualifié sera présent pour encadrer toute l\'activité.',exE:'A qualified group leader will be present to supervise the entire activity.'},
    {t:'v',lv:2,fr:'accessible à tous / pour tous les niveaux',wc:'loc',en:'accessible to everyone / for all levels',ex:'L\'activité est accessible à tous les niveaux, même aux grands débutants.',exE:'The activity is accessible to all levels, even complete beginners.'},
    {t:'p',lv:2,fr:'Tu verras que tu te sentiras beaucoup plus confiant(e) après.',en:'You\'ll see you\'ll feel much more confident afterwards.',ex:'Tu verras que tu te sentiras beaucoup plus confiant après cet entraînement.',exE:'You\'ll see that you\'ll feel much more confident after this training session.'},
    {t:'v',h:1,fr:'brûler des calories (loc)',wc:'loc',en:'to burn calories',ex:'En plus du plaisir, on brûle énormément de calories lors de cette randonnée.',exE:'On top of the enjoyment, we burn a huge number of calories on this hike.'},
    {t:'v',lv:1,fr:'la randonnée (nf)',wc:'nf',en:'hiking / walking',ex:'La randonnée bénévole est un excellent moyen de combiner sport et solidarité.',exE:'Volunteer hiking is an excellent way to combine sport and solidarity.'},
    {t:'p',lv:1,fr:'L\'équipement est fourni donc tu n\'as rien à acheter.',en:'The equipment is provided so you don\'t need to buy anything.',ex:'L\'équipement de ski est entièrement fourni donc tu n\'as rien à acheter ou louer.',exE:'All the ski equipment is provided so you don\'t need to buy or rent anything.'},
    {t:'v',lv:3,fr:'incroyable / époustouflant(e)',wc:'adj',en:'incredible / breathtaking',ex:'La vue depuis le sommet est absolument époustouflante, tu ne le regretteras pas.',exE:'The view from the summit is absolutely breathtaking, you won\'t regret it.'},
    {t:'v',lv:1,fr:'le paysage (nm)',wc:'nm',en:'the landscape / scenery',ex:'Les paysages que tu vas découvrir pendant cette randonnée sont magnifiques.',exE:'The landscapes you\'ll discover during this hike are magnificent.'},
    {t:'p',lv:2,fr:'Ça te permettra de te dépasser et de découvrir tes propres limites.',en:'It will allow you to push yourself and discover your own limits.',ex:'Ce défi va te permettre de te dépasser et de découvrir tes vraies limites.',exE:'This challenge will allow you to push yourself and discover your true limits.'},
    {t:'v',lv:2,fr:'une sensation forte (nf)',wc:'nf',en:'a thrill / an intense sensation',ex:'Les sensations fortes de la chute libre sont inoubliables, je t\'assure.',exE:'The thrills of skydiving are unforgettable, I promise you.'},
    {t:'p',lv:2,fr:'On fait ça une seule fois dans sa vie — autant ne pas passer à côté.',en:'You only do this once in your life — might as well not miss out.',ex:'On fait de la chute libre une seule fois dans sa vie — autant ne pas passer à côté.',exE:'You only go skydiving once in your life — might as well not miss out.'},
    {t:'v',lv:1,fr:'s\'entraîner (v)',wc:'v',en:'to train / to work out',ex:'S\'entraîner pour ce défi va te maintenir en forme tout au long de l\'année.',exE:'Training for this challenge will keep you in shape throughout the year.'},
    {t:'v',h:1,fr:'le courage',wc:'nm',en:'courage',ex:'Il faut beaucoup de courage pour sauter en parachute.',exE:'It takes a lot of courage to skydive.'},
    {t:'v',h:1,fr:'le risque',wc:'nm',en:'risk',ex:'Le risque est faible si on respecte les consignes.',exE:'The risk is low if you follow the instructions.'},
    {t:'v',h:1,fr:'un sommet',wc:'nm',en:'a summit',ex:'Le sommet offre une vue à couper le souffle.',exE:'The summit offers a breathtaking view.'},
    {t:'v',h:1,fr:'le parachute',wc:'nm',en:'parachute',ex:'Le saut en parachute est une expérience inoubliable.',exE:'Skydiving is an unforgettable experience.'},
    {t:'v',h:1,fr:'un saut',wc:'nm',en:'a jump',ex:'Le saut dure à peine une minute.',exE:'The jump lasts barely a minute.'},
    {t:'v',h:1,fr:'la plongée',wc:'nf',en:'scuba diving',ex:'La plongée permet de découvrir des fonds marins magnifiques.',exE:'Diving lets you discover magnificent seabeds.'},
    {t:'v',h:1,fr:'le rafting / le kayak',wc:'nm',en:'rafting / kayaking',ex:'Le rafting est idéal pour les groupes d\'amis.',exE:'Rafting is ideal for groups of friends.'},
    {t:'v',h:1,fr:'la voile',wc:'nf',en:'sailing',ex:'Venez essayer la voile ce week-end !',exE:'Come and try sailing this weekend!'},
    {t:'v',h:1,fr:'la tente',wc:'nf',en:'the tent',ex:'Nous avons dormi sous la tente au bord du lac.',exE:'We slept in a tent by the lake.'},
    {t:'v',h:1,fr:'une falaise',wc:'nf',en:'a cliff',ex:'L\'escalade de cette falaise est accessible aux débutants.',exE:'Climbing this cliff is accessible to beginners.'},
    {t:'v',h:1,fr:'un sentier',wc:'nm',en:'a trail',ex:'Le sentier traverse une forêt magnifique.',exE:'The trail goes through a beautiful forest.'},
    {t:'v',h:1,fr:'la forme physique',wc:'nf',en:'physical fitness',ex:'Il faut une bonne forme physique pour cette randonnée.',exE:'You need good physical fitness for this hike.'},
    {t:'v',h:1,fr:'l\'effort',wc:'nm',en:'effort',ex:'L\'effort en vaut vraiment la peine.',exE:'The effort is really worth it.'},
    {t:'v',h:1,fr:'sauter',wc:'v',en:'to jump',ex:'Vous allez sauter avec un moniteur expérimenté.',exE:'You will jump with an experienced instructor.'},
    {t:'v',h:1,fr:'grimper',wc:'v',en:'to climb',ex:'Nous allons grimper jusqu\'au refuge.',exE:'We are going to climb up to the mountain hut.'},
    {t:'v',h:1,fr:'nager / plonger',wc:'v',en:'to swim / to dive',ex:'Vous pourrez nager avec des tortues.',exE:'You\'ll be able to swim with turtles.'},
    {t:'v',h:1,fr:'vivre une expérience unique',wc:'loc',en:'to have a one-of-a-kind experience',ex:'Venez vivre une expérience unique en pleine nature !',exE:'Come and live a unique experience in the great outdoors!'},
    {t:'v',h:1,fr:'un souvenir inoubliable',wc:'nm',en:'an unforgettable memory',ex:'Cette journée restera un souvenir inoubliable.',exE:'This day will remain an unforgettable memory.'},
    {t:'v',h:1,fr:'repousser ses limites',wc:'loc',en:'to push one\'s limits',ex:'Cette activité vous aidera à repousser vos limites.',exE:'This activity will help you push your limits.'},
    {t:'v',lv:1,fr:'le courage',wc:'nm',en:'courage',ex:'Il faut du courage, mais tu en as !',exE:'It takes courage, but you have it!'},
    {t:'v',lv:1,fr:'le risque',wc:'nm',en:'risk',ex:'Le risque est très faible si on respecte les consignes.',exE:'The risk is very low if you follow the instructions.'},
    {t:'v',lv:1,fr:'l\'effort',wc:'nm',en:'effort',ex:'L\'effort en vaut vraiment la peine.',exE:'The effort is really worth it.'},
    {t:'v',lv:1,fr:'un souvenir inoubliable',wc:'nm',en:'an unforgettable memory',ex:'Cette journée restera un souvenir inoubliable.',exE:'This day will remain an unforgettable memory.'},
    {t:'p',lv:1,fr:'Vivre une expérience unique',en:'To live a one-of-a-kind experience',ex:'Viens vivre une expérience unique en pleine nature !',exE:'Come and live a one-of-a-kind experience in the great outdoors!'},
    {t:'v',lv:2,fr:'la forme physique',wc:'nf',en:'physical fitness',ex:'Tu n\'as pas besoin d\'une grande forme physique.',exE:'You don\'t need great physical fitness.'},
    {t:'v',lv:2,fr:'repousser ses limites',wc:'loc',en:'to push one\'s limits',ex:'Cette activité t\'aidera à repousser tes limites.',exE:'This activity will help you push your limits.'},
   ]},

   {id:'eoB_culture',fr:'Culture & créativité',en:'Culture & creativity persuasion',c:'#FF3D8B',l:false,items:[
    {t:'p',lv:2,fr:'Tu vas découvrir un univers que tu ne connaissais pas du tout.',en:'You\'re going to discover a world you didn\'t know at all.',ex:'En allant à l\'opéra, tu vas découvrir un univers que tu ne connaissais vraiment pas.',exE:'By going to the opera, you\'re going to discover a world you didn\'t know at all.'},
    {t:'p',lv:2,fr:'Ce n\'est pas aussi compliqué / ennuyeux que tu le crois.',en:'It\'s not as complicated / boring as you think.',ex:'Le théâtre d\'improvisation n\'est pas aussi compliqué que tu le crois — c\'est surtout drôle !',exE:'Improv theatre isn\'t as complicated as you think — it\'s mostly funny!'},
    {t:'p',lv:2,fr:'C\'est une excellente façon de stimuler ta créativité.',en:'It\'s an excellent way to stimulate your creativity.',ex:'Les ateliers de poterie sont une excellente façon de stimuler ta créativité.',exE:'Pottery workshops are an excellent way to stimulate your creativity.'},
    {t:'p',lv:2,fr:'Ça nous donnera quelque chose à faire ensemble et à partager.',en:'It\'ll give us something to do together and share.',ex:'Ça nous donnera quelque chose de concret à faire ensemble et à partager.',exE:'It\'ll give us something concrete to do together and to share.'},
    {t:'v',lv:3,fr:'s\'épanouir (v)',wc:'v',en:'to thrive / to blossom / to flourish',ex:'Ce genre d\'activité créative te permettra vraiment de t\'épanouir.',exE:'This kind of creative activity will truly allow you to flourish.'},
    {t:'v',lv:2,fr:'libérer sa créativité (loc)',wc:'loc',en:'to unleash one\'s creativity',ex:'Les ateliers d\'écriture poétique permettent vraiment de libérer sa créativité.',exE:'Poetry writing workshops truly allow you to unleash your creativity.'},
    {t:'v',lv:1,fr:'s\'exprimer (v)',wc:'v',en:'to express oneself',ex:'La danse est une façon merveilleuse de s\'exprimer sans utiliser les mots.',exE:'Dance is a wonderful way to express oneself without using words.'},
    {t:'p',lv:2,fr:'Tu n\'as pas besoin d\'être doué(e) pour apprécier / participer.',en:'You don\'t need to be talented to enjoy / participate.',ex:'Tu n\'as pas besoin d\'être doué en dessin pour apprécier un atelier de poterie.',exE:'You don\'t need to be talented at drawing to enjoy a pottery workshop.'},
    {t:'v',lv:2,fr:'une expérience enrichissante (nf)',wc:'nf',en:'an enriching experience',ex:'Assister à un opéra est une expérience culturelle vraiment enrichissante.',exE:'Attending an opera is a truly enriching cultural experience.'},
    {t:'v',lv:3,fr:'éveiller la curiosité (loc)',wc:'loc',en:'to awaken curiosity',ex:'Ce type de spectacle est fait pour éveiller la curiosité des spectateurs.',exE:'This type of show is designed to awaken the curiosity of the audience.'},
    {t:'p',lv:1,fr:'Au pire, si tu n\'aimes pas, tu auras au moins essayé.',en:'At worst, if you don\'t like it, you\'ll have at least tried.',ex:'Au pire, si tu n\'aimes pas le concours de conte, tu auras au moins essayé quelque chose de nouveau.',exE:'At worst, if you don\'t like the storytelling competition, you\'ll have at least tried something new.'},
    {t:'v',lv:1,fr:'s\'amuser (v)',wc:'v',en:'to have fun / enjoy oneself',ex:'Je suis sûre qu\'on va énormément s\'amuser au cours de danse.',exE:'I\'m sure we\'re going to have a great time at the dance class.'},
    {t:'v',lv:1,fr:'créatif(ve) / artistique',wc:'adj',en:'creative / artistic',ex:'Tu as un côté très créatif que ces ateliers te permettront d\'explorer.',exE:'You have a very creative side that these workshops will allow you to explore.'},
    {t:'p',lv:2,fr:'C\'est l\'occasion de te faire de nouveaux amis qui partagent les mêmes intérêts.',en:'It\'s a chance to make new friends who share the same interests.',ex:'C\'est l\'occasion parfaite de te faire de nouveaux amis qui partagent les mêmes intérêts.',exE:'It\'s the perfect chance to make new friends who share the same interests.'},
    {t:'v',lv:2,fr:'le partage (nm)',wc:'nm',en:'sharing',ex:'Le partage d\'une expérience culturelle renforce toujours les liens d\'amitié.',exE:'Sharing a cultural experience always strengthens bonds of friendship.'},
    {t:'p',lv:2,fr:'Tu risques d\'y prendre goût et de vouloir y retourner !',en:'You might develop a taste for it and want to go back!',ex:'Tu risques d\'y prendre goût au théâtre et de vouloir y retourner chaque semaine !',exE:'You might develop a taste for theatre and want to go back every week!'},
    {t:'v',lv:2,fr:'y prendre goût (loc)',wc:'loc',en:'to develop a taste for it / get into it',ex:'Une fois qu\'on y a goûté, on y prend goût et on ne peut plus s\'en passer.',exE:'Once you\'ve tried it, you develop a taste for it and can\'t do without it.'},
    {t:'v',lv:3,fr:'cultiver sa passion (loc)',wc:'loc',en:'to nurture one\'s passion',ex:'Ces ateliers sont parfaits pour cultiver ta passion pour l\'écriture créative.',exE:'These workshops are perfect for nurturing your passion for creative writing.'},
    {t:'p',lv:2,fr:'On peut y aller une seule fois juste pour voir si ça nous plaît.',en:'We can go just once to see if we like it.',ex:'On peut y aller une seule fois juste pour voir si ça nous plaît — sans engagement.',exE:'We can go just once to see if we like it — with no commitment.'},
    {t:'v',lv:2,fr:'une découverte (nf)',wc:'nf',en:'a discovery',ex:'Chaque nouvelle activité artistique est une découverte sur soi-même.',exE:'Every new artistic activity is a discovery about yourself.'},
