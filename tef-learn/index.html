    {t:'v',lv:3,fr:'sortir indemne',wc:'loc',en:'to come out unharmed',ex:'Par miracle, tous les passagers sont sortis indemnes.',exE:'By a miracle, all the passengers came out unharmed.'},
    {t:'v',lv:3,fr:'un rescapé / une rescapée',wc:'nm/nf',en:'a survivor',ex:'Le seul rescapé a été retrouvé deux jours plus tard.',exE:'The only survivor was found two days later.'},
    {t:'v',lv:3,fr:'un acte de bravoure',wc:'nm',en:'an act of bravery',ex:'Son acte de bravoure lui a valu une médaille.',exE:'His act of bravery earned him a medal.'},
    {t:'v',lv:3,fr:'intervenir sur les lieux',wc:'loc',en:'to step in at the scene',ex:'Les secours sont intervenus sur les lieux en quelques minutes.',exE:'The rescue teams stepped in at the scene within minutes.'},
    {t:'v',lv:3,fr:'un effondrement',wc:'nm',en:'a collapse',ex:'L\'effondrement du toit a surpris tout le monde.',exE:'The roof\'s collapse surprised everyone.'},
    {t:'p',h:1,lv:3,fr:'Le bilan s\'est alourdi.',en:'The toll has risen.',ex:'Le bilan s\'est alourdi dans la nuit.',exE:'The toll rose during the night.'},
    {t:'p',lv:1,fr:'Un accident s\'est produit à …',en:'An accident happened at …',ex:'Un accident s\'est produit hier soir à l\'angle de la rue principale.',exE:'An accident happened last night at the corner of the main street.'},
    {t:'p',lv:1,fr:'Heureusement, il n\'y a pas eu de blessés graves.',en:'Luckily, there were no serious injuries.',ex:'Heureusement, il n\'y a pas eu de blessés graves, juste de la peur.',exE:'Luckily, there were no serious injuries, just a scare.'},
    {t:'p',lv:1,fr:'Un passant a immédiatement appelé les secours.',en:'A passer-by immediately called for help.',ex:'Un passant a immédiatement appelé les secours en voyant la fumée.',exE:'A passer-by immediately called for help when he saw the smoke.'},
    {t:'p',lv:1,fr:'Il / elle a été transporté(e) à l\'hôpital.',en:'He/she was taken to hospital.',ex:'Le conducteur a été transporté à l\'hôpital par ambulance.',exE:'The driver was taken to hospital by ambulance.'},
    {t:'p',lv:2,fr:'Il / elle a perdu le contrôle de …',en:'He/she lost control of …',ex:'Il a perdu le contrôle de sa voiture à cause du verglas.',exE:'He lost control of his car because of the ice.'},
    {t:'p',lv:2,fr:'Les pompiers sont intervenus rapidement pour …',en:'The firefighters intervened quickly to …',ex:'Les pompiers sont intervenus rapidement pour éteindre l\'incendie.',exE:'The firefighters intervened quickly to put out the fire.'},
    {t:'p',lv:2,fr:'Sous le choc, il / elle n\'arrivait plus à …',en:'In shock, he/she could no longer …',ex:'Sous le choc, elle n\'arrivait plus à parler.',exE:'In shock, she could no longer speak.'},
    {t:'p',lv:2,fr:'Il s\'en est fallu de peu pour que …',en:'It was a close call: … nearly …',ex:'Il s\'en est fallu de peu pour que la situation tourne au drame.',exE:'It was a close call; the situation almost turned into a tragedy.'},
    {t:'p',lv:3,fr:'Les causes de l\'accident restent à déterminer.',en:'The causes of the accident remain to be determined.',ex:'Les causes de l\'accident restent à déterminer, selon la police.',exE:'The causes of the accident remain to be determined, according to the police.'},
    {t:'p',lv:3,fr:'Il / elle a eu la vie sauve grâce à …',en:'He/she survived thanks to …',ex:'Il a eu la vie sauve grâce à sa ceinture de sécurité.',exE:'He survived thanks to his seatbelt.'},
   ]},
  {id:'evenement',fr:'Événements',en:'Events & gatherings',c:'#F08A00',l:false,items:[
    {t:'v',lv:1,fr:'un événement',wc:'nm',en:'an event',ex:'L\'événement a attiré plus de mille personnes.',exE:'The event attracted more than a thousand people.'},
    {t:'v',lv:1,fr:'une cérémonie',wc:'nf',en:'a ceremony',ex:'La cérémonie a eu lieu devant la mairie.',exE:'The ceremony took place in front of the town hall.'},
    {t:'v',lv:1,fr:'une fête / un festival',wc:'nf/nm',en:'a party / a festival',ex:'Le festival a lieu chaque été dans le village.',exE:'The festival takes place every summer in the village.'},
    {t:'v',lv:1,fr:'un concours',wc:'nm',en:'a competition / contest',ex:'Elle a gagné un concours de pâtisserie.',exE:'She won a baking contest.'},
    {t:'v',lv:1,fr:'un gagnant / une gagnante',wc:'nm/nf',en:'a winner',ex:'La gagnante a reçu un voyage pour deux personnes.',exE:'The winner received a trip for two.'},
    {t:'v',lv:1,fr:'une surprise',wc:'nf',en:'a surprise',ex:'Ses amis lui ont préparé une grande surprise.',exE:'His friends prepared a big surprise for him.'},
    {t:'v',lv:1,fr:'une foule',wc:'nf',en:'a crowd',ex:'Une foule enthousiaste attendait les artistes.',exE:'An enthusiastic crowd was waiting for the artists.'},
    {t:'v',lv:1,fr:'des retrouvailles',wc:'nfpl',en:'a reunion (of people)',ex:'Les retrouvailles entre les deux frères ont été très émouvantes.',exE:'The reunion between the two brothers was very moving.'},
    {t:'v',lv:1,fr:'célébrer / fêter',wc:'v',en:'to celebrate',ex:'Les habitants ont fêté la victoire dans la rue.',exE:'The residents celebrated the victory in the street.'},
    {t:'v',lv:1,fr:'un invité / une invitée',wc:'nm/nf',en:'a guest',ex:'Les invités sont arrivés dès dix-huit heures.',exE:'The guests arrived as early as six p.m.'},
    {t:'v',lv:1,fr:'un discours',wc:'nm',en:'a speech',ex:'Le maire a prononcé un discours devant la foule.',exE:'The mayor gave a speech in front of the crowd.'},
    {t:'v',lv:2,fr:'rassembler / réunir',wc:'v',en:'to gather / bring together',ex:'Cet événement a rassemblé des gens de toutes les générations.',exE:'This event brought together people of all generations.'},
    {t:'v',lv:2,fr:'une inauguration',wc:'nf',en:'an inauguration / opening',ex:'L\'inauguration du nouveau parc a eu lieu samedi.',exE:'The opening of the new park took place on Saturday.'},
    {t:'v',lv:2,fr:'remporter un prix',wc:'loc',en:'to win an award',ex:'Le film a remporté le prix du public.',exE:'The film won the audience award.'},
    {t:'v',lv:2,fr:'rendre hommage à quelqu\'un',wc:'loc',en:'to pay tribute to someone',ex:'Toute la ville est venue rendre hommage au pompier.',exE:'The whole town came to pay tribute to the firefighter.'},
    {t:'v',lv:2,fr:'attirer la foule',wc:'loc',en:'to draw crowds',ex:'Le spectacle a attiré la foule malgré la pluie.',exE:'The show drew crowds despite the rain.'},
    {t:'v',lv:2,fr:'une tradition',wc:'nf',en:'a tradition',ex:'C\'est une tradition qui existe depuis plus de cent ans.',exE:'It is a tradition that has existed for more than a hundred years.'},
    {t:'v',lv:2,fr:'une rencontre inattendue',wc:'nf',en:'an unexpected encounter',ex:'Une rencontre inattendue a changé sa vie.',exE:'An unexpected encounter changed his life.'},
    {t:'p',h:1,lv:2,fr:'Tout s\'est déroulé dans la bonne humeur.',en:'Everything went off in good spirits.',ex:'Tout s\'est déroulé dans la bonne humeur, malgré le froid.',exE:'Everything went off in good spirits, despite the cold.'},
    {t:'v',lv:3,fr:'les festivités',wc:'nfpl',en:'the festivities',ex:'Les festivités ont duré trois jours.',exE:'The festivities lasted three days.'},
    {t:'v',lv:3,fr:'créer l\'événement',wc:'loc',en:'to make headlines / create a stir',ex:'Ce mariage en haut d\'une montagne a créé l\'événement.',exE:'This wedding at the top of a mountain made headlines.'},
    {t:'v',lv:3,fr:'immortaliser un moment',wc:'loc',en:'to capture a moment for posterity',ex:'Les invités ont immortalisé le moment avec leurs téléphones.',exE:'The guests captured the moment with their phones.'},
    {t:'v',lv:3,fr:'un moment d\'émotion intense',wc:'nm',en:'a moment of intense emotion',ex:'Ce fut un moment d\'émotion intense pour toute la famille.',exE:'It was a moment of intense emotion for the whole family.'},
    {t:'p',lv:1,fr:'Ce soir-là, tout le quartier s\'était rassemblé pour …',en:'That evening, the whole neighbourhood had gathered to …',ex:'Ce soir-là, tout le quartier s\'était rassemblé pour assister au concert.',exE:'That evening, the whole neighbourhood had gathered to attend the concert.'},
    {t:'p',lv:1,fr:'L\'ambiance était …',en:'The atmosphere was …',ex:'L\'ambiance était joyeuse et chaleureuse.',exE:'The atmosphere was joyful and warm.'},
    {t:'p',lv:1,fr:'Tout s\'est bien passé jusqu\'à ce que …',en:'Everything went well until …',ex:'Tout s\'est bien passé jusqu\'à ce que la pluie se mette à tomber.',exE:'Everything went well until the rain started to fall.'},
    {t:'p',lv:1,fr:'Tout le monde a applaudi …',en:'Everyone applauded …',ex:'Tout le monde a applaudi les organisateurs à la fin de la soirée.',exE:'Everyone applauded the organisers at the end of the evening.'},
    {t:'p',lv:2,fr:'Les organisateurs ont dû annuler / reporter …',en:'The organisers had to cancel / postpone …',ex:'Les organisateurs ont dû reporter le festival à cause de l\'orage.',exE:'The organisers had to postpone the festival because of the storm.'},
    {t:'p',lv:2,fr:'Des centaines de personnes sont venues pour …',en:'Hundreds of people came to …',ex:'Des centaines de personnes sont venues pour assister au feu d\'artifice.',exE:'Hundreds of people came to watch the fireworks.'},
    {t:'p',lv:2,fr:'À la surprise générale, …',en:'To everyone\'s surprise, …',ex:'À la surprise générale, le maire est monté sur scène.',exE:'To everyone\'s surprise, the mayor climbed onto the stage.'},
    {t:'p',lv:3,fr:'Cet événement a rassemblé petits et grands.',en:'This event brought young and old together.',ex:'Cet événement a rassemblé petits et grands dans une ambiance conviviale.',exE:'This event brought young and old together in a friendly atmosphere.'},
    {t:'p',lv:3,fr:'Un moment que les participants n\'oublieront pas de sitôt.',en:'A moment the participants will not forget any time soon.',ex:'Ce fut un moment que les participants n\'oublieront pas de sitôt.',exE:'It was a moment the participants will not forget any time soon.'},
   ]},
 ],

 B:[
  {id:'structureB',fr:'Structurer',en:'Argument structure',c:'#FF6B2C',l:false,items:[
    {t:'p',lv:2,fr:'Je suis tout à fait convaincu(e) que…',en:'I am fully convinced that…',ex:'Je suis tout à fait convaincu qu\'une telle mesure serait bénéfique pour notre société.',exE:'I am fully convinced that such a measure would be beneficial for our society.'},
    {t:'p',lv:2,fr:'Certes, on peut comprendre que…, mais…',en:'Admittedly… but…',ex:'Certes, on peut comprendre que cette décision soit difficile, mais elle s\'impose.',exE:'Admittedly, one can understand that this decision is difficult, but it is necessary.'},
    {t:'p',lv:2,fr:'Il faut néanmoins reconnaître que…',en:'Nevertheless, one must recognise that…',ex:'Il faut néanmoins reconnaître que les conséquences seraient considérables.',exE:'Nevertheless, one must recognise that the consequences would be considerable.'},
    {t:'p',lv:1,fr:'En outre, / De plus,…',en:'Furthermore, / Moreover,…',ex:'En outre, cette mesure aurait un impact positif sur l\'environnement.',exE:'Furthermore, this measure would have a positive impact on the environment.'},
    {t:'p',lv:1,fr:'Par conséquent, / Ainsi,…',en:'As a result / Therefore / Thus,…',ex:'Par conséquent, il serait urgent d\'agir dès maintenant.',exE:'As a result, it would be urgent to act right now.'},
    {t:'p',lv:2,fr:'En conclusion, il apparaît clairement que…',en:'In conclusion, it is clear that…',ex:'En conclusion, il apparaît clairement que cette proposition mérite d\'être soutenue.',exE:'In conclusion, it is clear that this proposal deserves support.'},
    {t:'p',lv:1,fr:'d\'un côté… de l\'autre…',en:'on one hand… on the other…',ex:'D\'un côté, cela favorise l\'autonomie ; de l\'autre, cela crée de l\'isolement.',exE:'On one hand, it promotes autonomy; on the other, it creates isolation.'},
    {t:'p',lv:2,fr:'Je tiens à souligner que…',en:'I would like to emphasize that…',ex:'Je tiens à souligner que cette question touche directement nos enfants.',exE:'I would like to emphasize that this question directly affects our children.'},
    {t:'p',lv:2,fr:'Il serait préférable de… plutôt que de…',en:'It would be preferable to… rather than…',ex:'Il serait préférable de limiter plutôt que d\'interdire complètement.',exE:'It would be preferable to limit rather than ban completely.'},
    {t:'p',lv:3,fr:'Force est de constater que…',en:'One cannot help but notice that… / The fact is that…',ex:'Force est de constater que les résultats ne sont pas à la hauteur des attentes.',exE:'One cannot help but notice that the results do not live up to expectations.'},
    {t:'p',lv:2,fr:'Il convient de noter que…',en:'It is worth noting that…',ex:'Il convient de noter que cette mesure existe déjà dans plusieurs pays.',exE:'It is worth noting that this measure already exists in several countries.'},
    {t:'p',lv:1,fr:'En revanche, / En contrepartie,…',en:'On the other hand, / In return,…',ex:'En revanche, les opposants à ce projet soulèvent des arguments valables.',exE:'On the other hand, the opponents of this project raise valid arguments.'},
    {t:'v',lv:2,fr:'nuancé(e)',wc:'adj',en:'nuanced / balanced',ex:'Il faut adopter une position nuancée sur ce sujet complexe.',exE:'One must adopt a nuanced position on this complex topic.'},
    {t:'v',lv:2,fr:'souligner / mettre en avant',wc:'v',en:'to underline / highlight',ex:'Je tiens à souligner l\'importance de cette décision pour l\'avenir.',exE:'I would like to highlight the importance of this decision for the future.'},
    {t:'v',lv:2,fr:'néanmoins / toutefois / cependant',wc:'adv',en:'nevertheless / however / yet',ex:'Néanmoins, il ne faut pas négliger les effets négatifs de cette mesure.',exE:'Nevertheless, one must not neglect the negative effects of this measure.'},
    {t:'v',lv:2,fr:'il s\'agit de + inf',wc:'loc',en:'it is a matter of / what is at stake is',ex:'Il ne s\'agit pas simplement d\'économiser de l\'argent, mais de sauver des vies.',exE:'It is not simply a matter of saving money, but of saving lives.'},
    {t:'v',lv:2,fr:'s\'opposer à / être favorable à',wc:'v',en:'to oppose / to be in favour of',ex:'Je m\'oppose fermement à cette décision pour les raisons suivantes.',exE:'I firmly oppose this decision for the following reasons.'},
    {t:'v',lv:2,fr:'convaincant(e) / persuasif(-ive)',wc:'adj',en:'convincing / persuasive',ex:'Son argument était convaincant mais manquait d\'exemples concrets.',exE:'His argument was convincing but lacked concrete examples.'},
    {t:'v',lv:3,fr:'il va sans dire que…',en:'it goes without saying that…',wc:'loc',ex:'Il va sans dire que les autorités ont une responsabilité dans cette affaire.',exE:'It goes without saying that the authorities have a responsibility in this matter.'},
    {t:'v',lv:3,fr:'dans une certaine mesure',wc:'loc',en:'to a certain extent',ex:'Dans une certaine mesure, on peut comprendre la réaction des habitants.',exE:'To a certain extent, one can understand the reaction of the residents.'},
  
    {t:'p',lv:1,fr:'À mon avis / Selon moi,…',en:'In my opinion / According to me,…',ex:'À mon avis, cette mesure n\'aura pas l\'effet escompté sur la population.',exE:'In my opinion, this measure will not have the desired effect on the population.'},
    {t:'p',lv:1,fr:'Il me semble que…',en:'It seems to me that…',ex:'Il me semble que nous n\'avons pas encore envisagé toutes les solutions possibles.',exE:'It seems to me that we have not yet considered all the possible solutions.'},
    {t:'p',lv:1,fr:'Je pense / crois que…',en:'I think / believe that…',ex:'Je pense que chaque citoyen a une responsabilité dans cette situation.',exE:'I think that every citizen has a responsibility in this situation.'},
    {t:'p',lv:3,fr:'Même si…, il n\'en reste pas moins que…',en:'Even if…, it remains true that…',ex:'Même si les arguments sont valables, il n\'en reste pas moins que l\'impact sera négatif.',exE:'Even if the arguments are valid, it remains true that the impact will be negative.'},
    {t:'p',lv:1,fr:'Il est vrai que…, mais…',en:'It is true that…, but…',ex:'Il est vrai que cette mesure coûte cher, mais les bénéfices sont considérables.',exE:'It is true that this measure is costly, but the benefits are considerable.'},
    {t:'p',lv:2,fr:'Je voudrais souligner le fait que…',en:'I would like to highlight the fact that…',ex:'Je voudrais souligner le fait que les jeunes sont les plus touchés par ce problème.',exE:'I would like to highlight the fact that young people are the most affected by this problem.'},
    {t:'v',lv:1,fr:'Tout d\'abord,… / Premièrement,…',wc:'adv',en:'First of all / Firstly,…',ex:'Tout d\'abord, je souhaite exposer les avantages de cette initiative.',exE:'First of all, I wish to present the advantages of this initiative.'},
    {t:'v',lv:1,fr:'Deuxièmement,… / De plus,…',wc:'adv',en:'Secondly,… / Furthermore,…',ex:'Deuxièmement, il faut considérer l\'impact environnemental de cette décision.',exE:'Secondly, we must consider the environmental impact of this decision.'},
    {t:'v',lv:1,fr:'C\'est pourquoi…',wc:'loc',en:'That is why… / This is why…',ex:'C\'est pourquoi je vous encourage à soutenir cette proposition.',exE:'That is why I encourage you to support this proposal.'},
    {t:'v',lv:1,fr:'en effet / effectivement',wc:'adv',en:'indeed / in fact',ex:'En effet, les chiffres prouvent que la situation empire depuis trois ans.',exE:'Indeed, the figures prove that the situation has been getting worse for three years.'},
    {t:'v',lv:1,fr:'il faut + inf / il est nécessaire de',wc:'loc',en:'it is necessary to / one must',ex:'Il faut agir maintenant pour éviter que la situation empire encore davantage.',exE:'It is necessary to act now to prevent the situation from getting even worse.'},
    {t:'v',lv:1,fr:'pour ces raisons,…',wc:'loc',en:'for these reasons,…',ex:'Pour ces raisons, je vous demande de reconsidérer votre décision.',exE:'For these reasons, I ask you to reconsider your decision.'},
    {t:'v',lv:2,fr:'je vous remercie de bien vouloir…',wc:'form',en:'I thank you for kindly… (formal letter close)',ex:'Je vous remercie de bien vouloir prendre en compte mes suggestions.',exE:'I thank you for kindly taking my suggestions into account.'},
    {t:'v',lv:2,fr:'dans l\'attente de votre réponse,…',wc:'form',en:'awaiting your reply,… (formal close)',ex:'Dans l\'attente de votre réponse, je vous adresse mes cordiales salutations.',exE:'Awaiting your reply, I extend my warmest regards.'},
    {t:'p',lv:1,fr:'Monsieur le Rédacteur en chef,',en:'Dear Editor,',ex:'Monsieur le Rédacteur en chef, je réagis à votre article sur le télétravail.',exE:'Dear Editor, I am responding to your article on remote work.'},
    {t:'p',lv:1,fr:'Je vous écris pour réagir à…',en:'I am writing to react to…',ex:'Je vous écris pour réagir à l\'article publié hier dans votre journal.',exE:'I am writing to react to the article published yesterday in your newspaper.'},
    {t:'p',lv:1,fr:'Je suis pour / contre…',en:'I am for / against…',ex:'Je suis tout à fait pour cette proposition.',exE:'I am entirely in favour of this proposal.'},
    {t:'p',lv:1,fr:'Je suis d\'accord / pas d\'accord avec…',en:'I agree / disagree with…',ex:'Je ne suis pas d\'accord avec cette opinion.',exE:'I do not agree with this opinion.'},
    {t:'p',lv:1,fr:'Pour commencer,… / En premier lieu,…',en:'To begin with,… / Firstly,…',ex:'Pour commencer, il faut rappeler que les écrans fatiguent les yeux.',exE:'To begin with, we must remember that screens tire the eyes.'},
    {t:'p',lv:1,fr:'Ensuite,… / En plus,…',en:'Then,… / In addition,…',ex:'En plus, ce système coûte très cher à la collectivité.',exE:'In addition, this system costs the community a great deal.'},
    {t:'p',lv:1,fr:'Par exemple,… / Prenons l\'exemple de…',en:'For example,… / Take the example of…',ex:'Prenons l\'exemple d\'une famille qui n\'a pas de voiture.',exE:'Take the example of a family without a car.'},
    {t:'p',lv:1,fr:'En conclusion,… / Pour finir,…',en:'In conclusion,… / Finally,…',ex:'En conclusion, je pense que cette mesure est nécessaire.',exE:'In conclusion, I think this measure is necessary.'},
    {t:'v',lv:1,fr:'un argument',wc:'nm',en:'an argument',ex:'Mon premier argument concerne la sécurité.',exE:'My first argument concerns safety.'},
    {t:'v',lv:1,fr:'un avantage / un inconvénient',wc:'nm',en:'an advantage / a drawback',ex:'Cette solution a plus d\'avantages que d\'inconvénients.',exE:'This solution has more advantages than drawbacks.'},
    {t:'v',lv:1,fr:'parce que / car / puisque',wc:'conj',en:'because / since',ex:'Je suis contre, car cette mesure coûte trop cher.',exE:'I am against it, because this measure costs too much.'},
    {t:'p',lv:2,fr:'Je me permets de vous écrire afin de…',en:'I am taking the liberty of writing to you in order to…',ex:'Je me permets de vous écrire afin de donner mon point de vue.',exE:'I am taking the liberty of writing to you in order to give my point of view.'},
    {t:'p',lv:2,fr:'À mon sens,… / À mes yeux,…',en:'In my view,… / In my eyes,…',ex:'À mon sens, l\'éducation devrait rester gratuite.',exE:'In my view, education should remain free.'},
    {t:'p',lv:2,fr:'Il est incontestable que… (+ indicatif)',en:'It is undeniable that…',ex:'Il est incontestable que les réseaux sociaux changent nos habitudes.',exE:'It is undeniable that social media is changing our habits.'},
    {t:'p',lv:2,fr:'En ce qui concerne… / Quant à…',en:'As for… / Regarding…',ex:'Quant au coût de cette mesure, il reste raisonnable.',exE:'As for the cost of this measure, it remains reasonable.'},
    {t:'p',lv:2,fr:'Par ailleurs,… / D\'ailleurs,…',en:'Moreover,… / Besides,…',ex:'Par ailleurs, de nombreuses études confirment ce constat.',exE:'Moreover, many studies confirm this finding.'},
    {t:'p',lv:2,fr:'Au contraire,… / Cela dit,…',en:'On the contrary,… / That said,…',ex:'Cela dit, il ne faut pas oublier les risques.',exE:'That said, we must not forget the risks.'},
    {t:'p',lv:2,fr:'Il ne faut pas oublier que…',en:'We must not forget that…',ex:'Il ne faut pas oublier que tout le monde n\'a pas accès à Internet.',exE:'We must not forget that not everyone has access to the Internet.'},
    {t:'p',lv:2,fr:'Afin de / Pour + infinitif',en:'In order to…',ex:'Afin de réduire la pollution, il faut limiter les voitures.',exE:'In order to reduce pollution, we must limit cars.'},
    {t:'p',lv:2,fr:'Veuillez agréer, Monsieur, mes salutations distinguées.',en:'Yours sincerely (formal closing)',ex:'Veuillez agréer, Monsieur le Rédacteur en chef, mes salutations distinguées.',exE:'Yours sincerely, Dear Editor.'},
    {t:'p',lv:2,fr:'tandis que / alors que',en:'whereas / while',ex:'Certains travaillent à la maison, tandis que d\'autres préfèrent le bureau.',exE:'Some work from home, whereas others prefer the office.'},
    {t:'p',lv:3,fr:'À cet égard,… / Dans cette optique,…',en:'In this regard,… / With this in mind,…',ex:'À cet égard, l\'exemple des pays nordiques est éclairant.',exE:'In this regard, the example of the Nordic countries is enlightening.'},
    {t:'p',lv:3,fr:'Il est indéniable que…',en:'It is undeniable that…',ex:'Il est indéniable que les inégalités se creusent.',exE:'It is undeniable that inequalities are widening.'},
    {t:'p',lv:3,fr:'Dans la mesure où…',en:'Insofar as… / Given that…',ex:'Dans la mesure où l\'école est obligatoire, elle doit être gratuite.',exE:'Given that school is compulsory, it must be free.'},
    {t:'p',lv:3,fr:'Loin de…, cela…',en:'Far from…, this…',ex:'Loin de nous isoler, Internet nous rapproche parfois.',exE:'Far from isolating us, the Internet sometimes brings us closer.'},
    {t:'p',lv:3,fr:'Aussi bien… que…',en:'Both… and… / Just as much… as…',ex:'Cette mesure concerne aussi bien les jeunes que les aînés.',exE:'This measure concerns both young people and seniors.'},
    {t:'v',lv:3,fr:'de sorte que + subjonctif / indicatif',wc:'conj',en:'so that / with the result that',ex:'Il faut agir de sorte que chacun puisse en profiter.',exE:'We must act so that everyone can benefit.'},
]},

  {id:'sujB_ecole',fr:'★ École',en:'School debates',c:'#0A6CF0',l:false,items:[
    {t:'v',lv:1,fr:'un système scolaire',wc:'nm',en:'school system',ex:'Le système scolaire est devenu trop compétitif.',exE:'The school system has become too competitive.'},
    {t:'v',lv:1,fr:'une note',wc:'nf',en:'grade, mark',ex:'Les notes mettent beaucoup de pression sur les élèves.',exE:'Grades put a lot of pressure on students.'},

  {id:'techno',fr:'Technologie',en:'Technology & screens',c:'#0A6CF0',l:false,items:[
    {t:'p',h:1,lv:2,fr:'être accro à son téléphone / aux écrans',en:'to be addicted to one\'s phone / screens',ex:'De plus en plus de jeunes sont accros à leur téléphone portable.',exE:'More and more young people are addicted to their mobile phones.'},
    {t:'p',h:1,lv:2,fr:'faire défiler les réseaux sociaux pendant des heures',en:'to scroll through social media for hours',ex:'On passe des heures à faire défiler les réseaux sociaux sans vraiment s\'en rendre compte.',exE:'We spend hours scrolling through social media without even realising it.'},
    {t:'p',h:1,lv:2,fr:'limiter le temps d\'écran dès le plus jeune âge',en:'to limit screen time from an early age',ex:'Il faudrait limiter le temps d\'écran dès le plus jeune âge.',exE:'Screen time should be limited from a very young age.'},
    {t:'p',h:1,fr:'nous sommes devenus des marchandises',en:'we have become commodities',ex:'Avec Internet, nos données personnelles font de nous de véritables marchandises.',exE:'With the Internet, our personal data has made us into real commodities.'},
    {t:'p',h:1,fr:'supprimer la publicité ciblée destinée aux mineurs',en:'to ban targeted advertising aimed at minors',ex:'Il faudrait supprimer la publicité ciblée destinée aux enfants de moins de treize ans.',exE:'Targeted advertising aimed at children under thirteen should be banned.'},

    {t:'p',h:1,lv:2,fr:'l\'IA représente une menace / une opportunité',en:'AI represents a threat / an opportunity',ex:'L\'intelligence artificielle représente à la fois une menace et une formidable opportunité.',exE:'Artificial intelligence represents both a threat and a wonderful opportunity.'},
    {t:'v',lv:2,fr:'une dépendance / l\'addiction',wc:'nf',en:'an addiction / dependency',ex:'La dépendance aux écrans touche désormais toutes les générations.',exE:'Screen addiction now affects every generation.'},

  {id:'sante',fr:'Santé',en:'Health & lifestyle',c:'#FF6B2C',l:false,items:[

    {t:'v',lv:1,fr:'un loyer',wc:'nm',en:'rent',ex:'Le loyer a encore augmenté cette année.',exE:'Rent has gone up again this year.'},
    {t:'v',lv:1,fr:'un espace vert / un parc',wc:'nm',en:'a green space / a park',ex:'Les espaces verts améliorent la qualité de vie.',exE:'Green spaces improve quality of life.'},
    {t:'v',lv:1,fr:'le bruit',wc:'nm',en:'noise',ex:'Le bruit de la circulation gêne les habitants.',exE:'Traffic noise bothers the residents.'},

    {t:'v',lv:2,fr:'développer les transports en commun',wc:'loc',en:'to expand public transport',ex:'Il faut développer les transports en commun dans les banlieues.',exE:'Public transport must be expanded in the suburbs.'},
    {t:'v',lv:2,fr:'la qualité de vie',wc:'nf',en:'quality of life',ex:'La qualité de vie est meilleure à la campagne.',exE:'Quality of life is better in the countryside.'},

    {t:'v',lv:2,fr:'une zone piétonne',wc:'nf',en:'a pedestrian zone',ex:'Cette zone piétonne a redonné vie au quartier.',exE:'This pedestrian zone has brought the neighbourhood back to life.'},
    {t:'v',lv:2,fr:'désengorger',wc:'v',en:'to relieve congestion',ex:'Il faut désengorger le centre-ville.',exE:'Downtown needs to be decongested.'},
    {t:'v',lv:2,fr:'la mobilité douce',wc:'nf',en:'active / soft mobility (walking, cycling)',ex:'La mobilité douce se développe dans les grandes villes.',exE:'Active mobility is growing in big cities.'},
    {t:'v',lv:2,fr:'l\'étalement urbain',wc:'nm',en:'urban sprawl',ex:'L\'étalement urbain augmente le temps de transport.',exE:'Urban sprawl increases travel time.'},
    {t:'v',lv:3,fr:'l\'aménagement urbain',wc:'nm',en:'urban planning',ex:'L\'aménagement urbain doit tenir compte de l\'environnement.',exE:'Urban planning must take the environment into account.'},
    {t:'v',lv:3,fr:'une zone à faibles émissions',wc:'nf',en:'a low-emission zone',ex:'Une zone à faibles émissions a été créée au centre.',exE:'A low-emission zone has been created downtown.'},
    {t:'v',lv:3,fr:'la gentrification',wc:'nf',en:'gentrification',ex:'La gentrification chasse les familles modestes du quartier.',exE:'Gentrification is driving modest families out of the neighbourhood.'},
    {t:'p',lv:1,fr:'Vivre en ville présente des avantages et des inconvénients.',en:'Living in the city has advantages and disadvantages.',ex:'Vivre en ville présente des avantages et des inconvénients, comme le bruit.',exE:'Living in the city has advantages and disadvantages, such as noise.'},
    {t:'p',lv:1,fr:'Les transports en commun sont …',en:'Public transport is …',ex:'Les transports en commun sont souvent bondés aux heures de pointe.',exE:'Public transport is often packed at rush hour.'},
    {t:'p',lv:1,fr:'Le prix des logements ne cesse d\'augmenter.',en:'Housing prices keep rising.',ex:'Le prix des logements ne cesse d\'augmenter dans les grandes villes.',exE:'Housing prices keep rising in big cities.'},
    {t:'p',lv:1,fr:'À mon avis, la ville devrait …',en:'In my opinion, the city should …',ex:'À mon avis, la ville devrait créer plus d\'espaces verts.',exE:'In my opinion, the city should create more green spaces.'},
    {t:'p',lv:2,fr:'Il faut développer les transports en commun afin de …',en:'Public transport must be developed in order to …',ex:'Il faut développer les transports en commun afin de réduire la circulation.',exE:'Public transport must be developed in order to reduce traffic.'},
    {t:'p',lv:2,fr:'Les centres-villes sont souvent saturés par …',en:'City centres are often saturated by …',ex:'Les centres-villes sont souvent saturés par les voitures.',exE:'City centres are often saturated by cars.'},

    {t:'p',lv:2,fr:'La qualité de vie dépend de …',en:'Quality of life depends on …',ex:'La qualité de vie dépend de l\'accès aux services et aux espaces verts.',exE:'Quality of life depends on access to services and green spaces.'},
    {t:'p',lv:3,fr:'L\'étalement urbain pose de sérieux problèmes de …',en:'Urban sprawl poses serious problems of …',ex:'L\'étalement urbain pose de sérieux problèmes de mobilité.',exE:'Urban sprawl poses serious problems of mobility.'},
    {t:'p',lv:3,fr:'Les municipalités ont la responsabilité de …',en:'Municipalities have the responsibility to …',ex:'Les municipalités ont la responsabilité de garantir un logement abordable.',exE:'Municipalities have the responsibility to guarantee affordable housing.'},

 EO:{
  A:[
   {id:'eoA_phrases',fr:'Demander infos',en:'Universal info-request phrases',c:'#FF6B2C',l:false,items:[
    {t:'p',lv:2,fr:'Je vous contacte afin d\'obtenir des renseignements sur…',en:'I\'m contacting you to get information about…',ex:'Je vous contacte afin d\'obtenir des renseignements sur votre programme de cours.',exE:'I\'m contacting you to get information about your course programme.'},
    {t:'p',h:1,fr:'Pourriez-vous me préciser… ?',en:'Could you tell me more about… ?',ex:'Pourriez-vous me préciser les horaires d\'ouverture et les tarifs pratiqués ?',exE:'Could you tell me more about the opening hours and the prices?'},
    {t:'p',lv:1,fr:'J\'aimerais savoir si… / J\'aimerais savoir comment…',en:'I\'d like to know if… / I\'d like to know how…',ex:'J\'aimerais savoir si l\'inscription se fait en ligne ou en personne.',exE:'I\'d like to know if registration is done online or in person.'},
    {t:'p',lv:1,fr:'Est-ce que vous proposez… ?',en:'Do you offer… ?',ex:'Est-ce que vous proposez des formules pour les débutants complets ?',exE:'Do you offer packages for complete beginners?'},
    {t:'p',lv:2,fr:'Quelles sont les conditions requises pour… ?',en:'What are the requirements for… ?',ex:'Quelles sont les conditions requises pour participer à l\'activité ?',exE:'What are the requirements to take part in the activity?'},
    {t:'p',lv:2,fr:'Y a-t-il des restrictions concernant… ?',en:'Are there any restrictions regarding… ?',ex:'Y a-t-il des restrictions concernant l\'âge ou le niveau requis ?',exE:'Are there any restrictions regarding age or required level?'},
    {t:'p',lv:2,fr:'Dans quel délai peut-on… ?',en:'How quickly can one… ?',ex:'Dans quel délai peut-on obtenir une réponse à notre demande ?',exE:'How quickly can we get a response to our request?'},
    {t:'p',lv:1,fr:'Faut-il réserver à l\'avance ou est-ce possible de… ?',en:'Is advance booking required or is it possible to… ?',ex:'Faut-il réserver à l\'avance ou est-ce possible de venir directement sur place ?',exE:'Is advance booking required or is it possible to come directly on the spot?'},
    {t:'p',lv:1,fr:'Je souhaiterais avoir plus d\'informations sur les tarifs.',en:'I\'d like more information about the prices.',ex:'Je souhaiterais avoir plus d\'informations sur les tarifs et les modalités de paiement.',exE:'I\'d like more information about the prices and payment methods.'},
    {t:'p',lv:1,fr:'Pourriez-vous me dire ce qui est inclus dans… ?',en:'Could you tell me what is included in… ?',ex:'Pourriez-vous me dire ce qui est inclus dans le forfait de base ?',exE:'Could you tell me what is included in the basic package?'},
    {t:'p',h:1,fr:'Dans l\'attente de votre réponse, je vous adresse mes cordiales salutations.',en:'Looking forward to your reply, I send you my kind regards.',ex:'Dans l\'attente de votre réponse, je vous adresse mes cordiales salutations.',exE:'Looking forward to your reply, I send you my kind regards.'},
    {t:'v',lv:1,fr:'des renseignements (nmpl)',wc:'nm',en:'information / details',ex:'Je cherche des renseignements sur vos offres pour les familles.',exE:'I\'m looking for information about your family offers.'},
    {t:'v',lv:3,fr:'les modalités (nfpl)',wc:'nf',en:'terms / conditions / procedures',ex:'Pourriez-vous m\'expliquer les modalités d\'inscription ?',exE:'Could you explain the registration procedure to me?'},
    {t:'v',lv:1,fr:'s\'inscrire (v)',wc:'v',en:'to register / sign up',ex:'Comment puis-je m\'inscrire à votre prochain atelier ?',exE:'How can I sign up for your next workshop?'},
    {t:'v',lv:2,fr:'un forfait (nm)',wc:'nm',en:'a package / flat rate',ex:'Proposez-vous un forfait tout compris pour les groupes ?',exE:'Do you offer an all-inclusive package for groups?'},
    {t:'v',lv:2,fr:'les disponibilités (nfpl)',wc:'nf',en:'availability',ex:'Quelles sont vos disponibilités pour le mois de mars ?',exE:'What is your availability for the month of March?'},
    {t:'v',lv:2,fr:'en personne / sur place',wc:'loc',en:'in person / on-site',ex:'Est-il possible de venir s\'inscrire directement en personne ?',exE:'Is it possible to come and register directly in person?'},
    {t:'v',lv:2,fr:'obligatoire / facultatif(ve)',wc:'adj',en:'compulsory / optional',ex:'La réservation est-elle obligatoire ou facultative ?',exE:'Is booking compulsory or optional?'},
    {t:'v',lv:2,fr:'adapté(e) à + public',wc:'adj',en:'suitable for / adapted to',ex:'Ces activités sont-elles adaptées aux enfants en bas âge ?',exE:'Are these activities suitable for young children?'},
    {t:'v',lv:1,fr:'avoir une question concernant',wc:'loc',en:'to have a question about',ex:'J\'ai une question concernant les délais de livraison.',exE:'I have a question about the delivery times.'},
    {t:'p',lv:2,fr:'Serait-il possible de… ?',en:'Would it be possible to… ?',ex:'Serait-il possible de bénéficier d\'un essai gratuit avant de s\'inscrire ?',exE:'Would it be possible to have a free trial before signing up?'},
    {t:'p',lv:2,fr:'Je serais également intéressé(e) de savoir…',en:'I would also be interested to know…',ex:'Je serais également intéressé de savoir si des réductions sont prévues pour les groupes.',exE:'I would also be interested to know if discounts are available for groups.'},
    {t:'p',lv:1,fr:'Bonjour, je vous appelle au sujet de votre annonce.',en:'Hello, I\'m calling about your ad.',ex:'Bonjour madame, je vous appelle au sujet de votre annonce parue dans le journal.',exE:'Hello ma\'am, I\'m calling about your ad in the newspaper.'},
    {t:'p',lv:1,fr:'Excusez-moi, pouvez-vous répéter, s\'il vous plaît ?',en:'Sorry, could you repeat that, please?',ex:'Excusez-moi, pouvez-vous répéter, s\'il vous plaît ? Je n\'ai pas bien compris.',exE:'Sorry, could you repeat that, please? I didn\'t quite understand.'},
    {t:'p',lv:1,fr:'Pourriez-vous parler un peu plus lentement ?',en:'Could you speak a little more slowly?',ex:'Pourriez-vous parler un peu plus lentement, s\'il vous plaît ?',exE:'Could you speak a little more slowly, please?'},
    {t:'p',lv:1,fr:'Combien ça coûte ? / Quel est le prix ?',en:'How much is it? / What is the price?',ex:'Quel est le prix pour un adulte ?',exE:'What is the price for an adult?'},
    {t:'p',lv:1,fr:'Quels sont les horaires ?',en:'What are the hours / times?',ex:'Quels sont les horaires d\'ouverture le week-end ?',exE:'What are the opening hours on weekends?'},
    {t:'p',lv:1,fr:'Où est-ce que ça se passe exactement ?',en:'Where exactly does it take place?',ex:'Où est-ce que ça se passe exactement ? Y a-t-il un parking ?',exE:'Where exactly does it take place? Is there parking?'},
    {t:'p',lv:1,fr:'Quand est-ce que ça commence ?',en:'When does it start?',ex:'Quand est-ce que la prochaine session commence ?',exE:'When does the next session start?'},
    {t:'p',lv:1,fr:'Est-ce que c\'est possible de… ?',en:'Is it possible to…?',ex:'Est-ce que c\'est possible de réserver par téléphone ?',exE:'Is it possible to book by phone?'},
    {t:'p',lv:1,fr:'Je voudrais réserver une place / un rendez-vous.',en:'I would like to book a spot / an appointment.',ex:'Je voudrais réserver une place pour samedi, s\'il vous plaît.',exE:'I would like to book a spot for Saturday, please.'},
    {t:'p',lv:1,fr:'Est-ce que vous pouvez m\'envoyer des informations par courriel ?',en:'Can you send me information by email?',ex:'Est-ce que vous pouvez m\'envoyer le programme par courriel ?',exE:'Can you send me the programme by email?'},
    {t:'p',lv:1,fr:'C\'est noté. / Très bien, je vous remercie.',en:'Noted. / Very good, thank you.',ex:'Très bien, je vous remercie pour ces précisions.',exE:'Very good, thank you for these details.'},
    {t:'p',lv:1,fr:'Je vais y réfléchir et je vous rappelle.',en:'I\'ll think about it and call you back.',ex:'Je vais y réfléchir et je vous rappelle demain.',exE:'I\'ll think about it and call you back tomorrow.'},
    {t:'p',lv:1,fr:'Merci pour votre aide, bonne journée !',en:'Thank you for your help, have a nice day!',ex:'Merci pour votre aide, bonne journée !',exE:'Thank you for your help, have a nice day!'},
    {t:'p',lv:1,fr:'Je voudrais savoir si… / Je voudrais savoir comment…',en:'I would like to know if… / how…',ex:'Je voudrais savoir si les enfants peuvent participer.',exE:'I would like to know if children can take part.'},
    {t:'p',lv:2,fr:'Est-ce que je peux vous poser quelques questions ?',en:'May I ask you a few questions?',ex:'Bonjour, est-ce que je peux vous poser quelques questions sur votre offre ?',exE:'Hello, may I ask you a few questions about your offer?'},
    {t:'p',lv:2,fr:'Si je comprends bien,… c\'est bien ça ?',en:'If I understand correctly,… is that right?',ex:'Si je comprends bien, le repas est compris, c\'est bien ça ?',exE:'If I understand correctly, the meal is included, is that right?'},
    {t:'p',lv:2,fr:'Qu\'est-ce qui est compris dans le prix ?',en:'What is included in the price?',ex:'Qu\'est-ce qui est compris dans le prix ? Le matériel ?',exE:'What is included in the price? The equipment?'},
    {t:'p',lv:2,fr:'Y a-t-il des réductions pour… ?',en:'Are there discounts for…?',ex:'Y a-t-il des réductions pour les étudiants ?',exE:'Are there discounts for students?'},
    {t:'p',lv:2,fr:'À partir de quel âge… ?',en:'From what age…?',ex:'À partir de quel âge peut-on s\'inscrire ?',exE:'From what age can one register?'},
    {t:'p',lv:2,fr:'Combien de personnes… au maximum ?',en:'How many people… at most?',ex:'Combien de personnes peuvent participer au maximum ?',exE:'How many people can take part at most?'},
    {t:'p',lv:2,fr:'Quelles sont les modalités d\'inscription ?',en:'What are the registration procedures?',ex:'Quelles sont les modalités d\'inscription ?',exE:'What are the registration procedures?'},
    {t:'p',lv:2,fr:'Pourriez-vous préciser ce que vous entendez par… ?',en:'Could you clarify what you mean by…?',ex:'Pourriez-vous préciser ce que vous entendez par « tout compris » ?',exE:'Could you clarify what you mean by "all-inclusive"?'},
    {t:'p',lv:2,fr:'En cas d\'annulation, est-ce que je serai remboursé(e) ?',en:'In case of cancellation, will I be refunded?',ex:'En cas d\'annulation, est-ce que je serai remboursé ?',exE:'In case of cancellation, will I be refunded?'},
    {t:'p',lv:2,fr:'Y a-t-il des conditions particulières ?',en:'Are there any special conditions?',ex:'Y a-t-il des conditions particulières pour s\'inscrire ?',exE:'Are there any special conditions to register?'},
    {t:'p',lv:2,fr:'Auriez-vous des disponibilités pour… ?',en:'Do you have any availability for…?',ex:'Auriez-vous des disponibilités pour la semaine prochaine ?',exE:'Do you have any availability for next week?'},
    {t:'p',lv:2,fr:'Pourriez-vous me préciser… ?',en:'Could you specify for me…?',ex:'Pourriez-vous me préciser la date limite d\'inscription ?',exE:'Could you specify the registration deadline for me?'},
    {t:'p',lv:3,fr:'Auriez-vous l\'amabilité de… ?',en:'Would you be so kind as to…?',ex:'Auriez-vous l\'amabilité de me renvoyer la brochure ?',exE:'Would you be so kind as to send me the brochure again?'},
    {t:'p',lv:3,fr:'Je me permets de vous contacter car…',en:'I\'m contacting you because…',ex:'Je me permets de vous contacter car votre annonce a retenu mon attention.',exE:'I\'m contacting you because your ad caught my attention.'},
    {t:'p',lv:3,fr:'Sauf erreur de ma part,…',en:'If I\'m not mistaken,…',ex:'Sauf erreur de ma part, l\'annonce mentionne un tarif de soixante euros.',exE:'If I\'m not mistaken, the ad mentions a rate of sixty euros.'},
    {t:'p',lv:3,fr:'Pourriez-vous me communiquer… ?',en:'Could you provide me with…?',ex:'Pourriez-vous me communiquer le programme détaillé ?',exE:'Could you provide me with the detailed programme?'},
   ]},

    {t:'p',lv:2,fr:'Le matériel est-il fourni, ou dois-je apporter le mien ?',en:'Is equipment provided, or must I bring my own?',ex:'Le matériel est-il fourni, ou dois-je apporter le mien ?',exE:'Is equipment provided, or must I bring my own?'},

    {t:'p',lv:2,fr:'En cas de mauvais temps, l\'activité est-elle reportée ou remboursée ?',en:'In case of bad weather, is the activity postponed or refunded?',ex:'En cas de mauvais temps, l\'activité est-elle reportée ou remboursée ?',exE:'In case of bad weather, is the activity postponed or refunded?'},

    {t:'p',lv:3,fr:'Je vous remercie pour ces précisions, je vais en parler à …',en:'Thank you for these details, I\'ll talk to … about it',ex:'Je vous remercie pour ces précisions, je vais en parler à mon ami et je vous rappelle.',exE:'Thank you for these details, I\'ll talk to my friend about it and call you back.'},

    {t:'p',lv:1,fr:'Je vous appelle au sujet de votre offre d\'emploi.',en:'I\'m calling about your job offer.',ex:'Bonjour, je vous appelle au sujet de votre offre d\'emploi publiée en ligne.',exE:'Hello, I\'m calling about your job offer published online.'},
    {t:'p',lv:1,fr:'Quelles sont les tâches principales ?',en:'What are the main duties?',ex:'Quelles sont les tâches principales du poste ?',exE:'What are the main duties of the position?'},
    {t:'p',lv:1,fr:'Quel est l\'horaire de travail ?',en:'What are the working hours?',ex:'Quel est l\'horaire de travail ? Faut-il travailler le week-end ?',exE:'What are the working hours? Do you have to work weekends?'},
    {t:'p',lv:1,fr:'Le poste est-il à temps plein ou à temps partiel ?',en:'Is the job full-time or part-time?',ex:'Le poste est-il à temps plein ou à temps partiel ?',exE:'Is the job full-time or part-time?'},
    {t:'p',lv:1,fr:'Faut-il envoyer un CV ?',en:'Do I need to send a CV?',ex:'Faut-il envoyer un CV et une lettre de motivation ?',exE:'Do I need to send a CV and a cover letter?'},
    {t:'p',lv:1,fr:'Quelle est la durée de la formation ?',en:'How long is the course?',ex:'Quelle est la durée de la formation ? Combien d\'heures par semaine ?',exE:'How long is the course? How many hours per week?'},
    {t:'p',lv:1,fr:'Y a-t-il un certificat à la fin ?',en:'Is there a certificate at the end?',ex:'Y a-t-il un certificat ou un diplôme à la fin de la formation ?',exE:'Is there a certificate or diploma at the end of the course?'},
    {t:'v',lv:1,fr:'un poste',wc:'nm',en:'a position / job',ex:'Le poste est à pourvoir immédiatement.',exE:'The position is open immediately.'},
    {t:'v',lv:1,fr:'une formation',wc:'nf',en:'a course / training',ex:'Cette formation dure six mois.',exE:'This training lasts six months.'},
    {t:'v',lv:1,fr:'un CV',wc:'nm',en:'a résumé / CV',ex:'N\'oubliez pas de joindre votre CV.',exE:'Don\'t forget to attach your CV.'},
    {t:'v',lv:1,fr:'une lettre de motivation',wc:'nf',en:'a cover letter',ex:'La lettre de motivation est obligatoire.',exE:'A cover letter is mandatory.'},
    {t:'v',lv:1,fr:'une expérience',wc:'nf',en:'experience',ex:'Aucune expérience n\'est exigée pour ce poste.',exE:'No experience is required for this position.'},
    {t:'p',lv:2,fr:'Quel est le salaire / la rémunération ?',en:'What is the salary / pay?',ex:'Quelle est la rémunération horaire pour ce poste ?',exE:'What is the hourly pay for this position?'},
    {t:'p',lv:2,fr:'Faut-il avoir un niveau minimum ?',en:'Is a minimum level required?',ex:'Faut-il avoir un niveau minimum en français ?',exE:'Is a minimum level of French required?'},
    {t:'p',lv:2,fr:'Combien d\'élèves y a-t-il par groupe ?',en:'How many students are there per group?',ex:'Combien d\'élèves y a-t-il par groupe ?',exE:'How many students are there per group?'},
    {t:'p',lv:2,fr:'Les cours ont-ils lieu en ligne ou en personne ?',en:'Are the classes online or in person?',ex:'Les cours ont-ils lieu en ligne ou en personne ?',exE:'Are the classes online or in person?'},
    {t:'p',lv:2,fr:'Y a-t-il des frais de matériel ?',en:'Are there material fees?',ex:'Y a-t-il des frais de matériel en plus ?',exE:'Are there material fees on top?'},
    {t:'p',lv:2,fr:'Quand le poste commence-t-il ?',en:'When does the job start?',ex:'Quand le poste commence-t-il, et quelle est la durée du contrat ?',exE:'When does the job start, and how long is the contract?'},
    {t:'v',lv:2,fr:'un horaire',wc:'nm',en:'a schedule / timetable',ex:'L\'horaire des cours change chaque session.',exE:'The class schedule changes every session.'},
    {t:'v',lv:2,fr:'une candidature / poser sa candidature',wc:'nf',en:'an application / to apply',ex:'Vous pouvez poser votre candidature jusqu\'au quinze mai.',exE:'You can apply until May fifteenth.'},
    {t:'v',lv:2,fr:'la rémunération',wc:'nf',en:'pay',ex:'La rémunération dépend de l\'expérience.',exE:'Pay depends on experience.'},
    {t:'v',lv:2,fr:'un entretien d\'embauche',wc:'nm',en:'a job interview',ex:'Un entretien d\'embauche aura lieu la semaine prochaine.',exE:'A job interview will take place next week.'},
    {t:'v',lv:3,fr:'une période d\'essai',wc:'nf',en:'a probation period',ex:'Le contrat prévoit une période d\'essai de trois mois.',exE:'The contract includes a three-month probation period.'},
    {t:'v',lv:3,fr:'une attestation',wc:'nf',en:'a certificate (of completion / attendance)',ex:'Une attestation est remise à la fin du cours.',exE:'A certificate is handed out at the end of the course.'},
    {t:'p',lv:3,fr:'Y a-t-il des possibilités d\'évolution ?',en:'Are there opportunities for advancement?',ex:'Y a-t-il des possibilités d\'évolution au sein de l\'entreprise ?',exE:'Are there opportunities for advancement within the company?'},
   ]},
  ],
  B:[
   {id:'eoB_persuasion',fr:'Convaincre',en:'Universal persuasion phrases',c:'#FF6B2C',l:false,items:[
    {t:'p',lv:1,fr:'Je voudrais te convaincre d\'essayer… avec moi.',en:'I\'d like to convince you to try… with me.',ex:'Je voudrais te convaincre d\'essayer les cours de danse avec moi ce samedi.',exE:'I\'d like to convince you to try dance classes with me this Saturday.'},
    {t:'p',lv:1,fr:'Tu ne regretteras pas d\'avoir essayé, je t\'assure.',en:'You won\'t regret trying it, I promise.',ex:'Tu ne regretteras pas d\'avoir essayé, je t\'assure — c\'est vraiment génial.',exE:'You won\'t regret trying it, I promise — it\'s really great.'},
    {t:'p',lv:1,fr:'Je comprends tes réticences, mais…',en:'I understand your reluctance, but…',ex:'Je comprends tes réticences, mais tu verras que c\'est bien moins effrayant que tu ne l\'imagines.',exE:'I understand your reluctance, but you\'ll see it\'s much less frightening than you imagine.'},
    {t:'p',lv:1,fr:'Imagine un peu… / Imagine-toi en train de…',en:'Just imagine… / Picture yourself…',ex:'Imagine-toi en train de sauter en parachute au-dessus des Alpes — quelle vue !',exE:'Picture yourself skydiving over the Alps — what a view!'},
    {t:'p',lv:2,fr:'C\'est une expérience unique / inoubliable.',en:'It\'s a unique / unforgettable experience.',ex:'C\'est une expérience vraiment unique qu\'on ne peut pas vivre ailleurs.',exE:'It\'s a truly unique experience you can\'t have anywhere else.'},
    {t:'p',lv:1,fr:'Tu n\'as rien à perdre à essayer.',en:'You have nothing to lose by trying.',ex:'Tu n\'as rien à perdre à essayer — si ça ne te plaît pas, on rentre à la maison.',exE:'You have nothing to lose by trying — if you don\'t like it, we go home.'},
    {t:'p',lv:2,fr:'Pense à tout ce que tu pourrais apprendre / découvrir.',en:'Think about everything you could learn / discover.',ex:'Pense à tout ce que tu pourrais découvrir sur toi-même en relevant ce défi.',exE:'Think about everything you could discover about yourself by taking on this challenge.'},
    {t:'p',lv:1,fr:'Ce serait l\'occasion idéale de…',en:'It would be the perfect opportunity to…',ex:'Ce serait l\'occasion idéale de sortir de ta zone de confort pour une fois.',exE:'It would be the perfect opportunity to step out of your comfort zone for once.'},
    {t:'p',lv:1,fr:'On pourrait y aller ensemble pour que tu te sentes plus à l\'aise.',en:'We could go together so you feel more comfortable.',ex:'On pourrait y aller ensemble pour que tu te sentes plus à l\'aise la première fois.',exE:'We could go together so you feel more comfortable the first time.'},
    {t:'p',lv:2,fr:'Ça ne coûte pas grand-chose et les bénéfices sont énormes.',en:'It doesn\'t cost much and the benefits are huge.',ex:'Ça ne coûte pas grand-chose et les bénéfices sur ta santé sont vraiment énormes.',exE:'It doesn\'t cost much and the health benefits are truly huge.'},
    {t:'v',lv:1,fr:'convaincre (v)',wc:'v',en:'to convince',ex:'J\'espère t\'avoir convaincu de participer à cet événement avec moi.',exE:'I hope to have convinced you to take part in this event with me.'},
    {t:'v',lv:1,fr:'persuader (v)',wc:'v',en:'to persuade',ex:'Je vais te persuader que c\'est exactement ce qu\'il te faut.',exE:'I\'m going to persuade you that it\'s exactly what you need.'},
    {t:'v',lv:1,fr:'les avantages vs les inconvénients',wc:'nm',en:'the pros vs the cons',ex:'Si on analyse les avantages et les inconvénients, les avantages l\'emportent largement.',exE:'If we weigh up the pros and cons, the pros clearly outweigh the cons.'},
    {t:'v',lv:2,fr:'sortir de sa zone de confort',wc:'loc',en:'to step out of one\'s comfort zone',ex:'Ce genre d\'activité te poussera à sortir de ta zone de confort de façon positive.',exE:'This kind of activity will push you to step outside your comfort zone in a positive way.'},
    {t:'v',lv:1,fr:'avoir peur de / craindre',wc:'v',en:'to be afraid of / to fear',ex:'Je sais que tu as peur, mais c\'est justement ce qui rend l\'expérience intéressante.',exE:'I know you\'re afraid, but that\'s exactly what makes the experience interesting.'},
    {t:'v',lv:1,fr:'ça vaut le coup / ça vaut la peine',wc:'loc',en:'it\'s worth it',ex:'Je te promets que ça vaut vraiment le coup de dépasser ses appréhensions.',exE:'I promise you it\'s truly worth overcoming your apprehensions.'},
    {t:'p',lv:1,fr:'Qu\'est-ce qui te retient vraiment ?',en:'What\'s really holding you back?',ex:'Qu\'est-ce qui te retient vraiment — ce n\'est quand même pas la peur de l\'échec ?',exE:'What\'s really holding you back — it\'s not fear of failure, is it?'},
    {t:'p',lv:2,fr:'Je suis sûr(e) que tu adoreras ça une fois que tu auras essayé.',en:'I\'m sure you\'ll love it once you\'ve tried it.',ex:'Je suis sûre que tu adoreras ça une fois que tu auras essayé la première fois.',exE:'I\'m sure you\'ll love it once you\'ve tried it the first time.'},
    {t:'v',lv:3,fr:'enthousiasmant(e) (adj)',wc:'adj',en:'exciting / thrilling',ex:'L\'idée de découvrir quelque chose de nouveau est toujours enthousiasmante.',exE:'The idea of discovering something new is always exciting.'},
    {t:'p',lv:1,fr:'Si ça ne te plaît pas, on ne recommence pas — promis.',en:'If you don\'t like it, we won\'t do it again — promise.',ex:'Si ça ne te plaît vraiment pas, on ne recommence pas — c\'est promis.',exE:'If you really don\'t like it, we won\'t do it again — that\'s a promise.'},
    {t:'v',lv:3,fr:'une appréhension (nf)',wc:'nf',en:'an apprehension / worry',ex:'Toutes tes appréhensions vont disparaître dès que tu commenceras.',exE:'All your apprehensions will disappear as soon as you start.'},
    {t:'v',lv:2,fr:'défi / relever un défi',wc:'nm',en:'challenge / to take on a challenge',ex:'Relever ce défi ensemble va renforcer notre amitié, j\'en suis convaincu.',exE:'Taking on this challenge together will strengthen our friendship, I\'m sure of it.'},
    {t:'p',lv:1,fr:'Écoute, je comprends, mais…',en:'Listen, I understand, but…',ex:'Écoute, je comprends, mais ça vaut vraiment la peine d\'essayer.',exE:'Listen, I understand, but it\'s really worth trying.'},
    {t:'p',lv:1,fr:'Tu as raison, mais…',en:'You\'re right, but…',ex:'Tu as raison, c\'est un peu cher, mais pense à ce que tu vas en retirer.',exE:'You\'re right, it\'s a bit expensive, but think about what you\'ll get out of it.'},
    {t:'p',lv:1,fr:'Ce n\'est pas si cher que ça.',en:'It\'s not that expensive.',ex:'Ce n\'est pas si cher que ça si on partage les frais.',exE:'It\'s not that expensive if we share the costs.'},
    {t:'p',lv:1,fr:'Franchement, / Honnêtement,…',en:'Frankly, / Honestly,…',ex:'Franchement, je pense que tu vas adorer.',exE:'Frankly, I think you\'re going to love it.'},
    {t:'p',lv:1,fr:'Fais-moi confiance.',en:'Trust me.',ex:'Fais-moi confiance, tu ne vas pas le regretter.',exE:'Trust me, you won\'t regret it.'},
    {t:'p',lv:1,fr:'Pourquoi pas ?',en:'Why not?',ex:'Pourquoi pas essayer une seule fois ?',exE:'Why not try just once?'},
    {t:'p',lv:1,fr:'Tu devrais vraiment essayer.',en:'You should really try it.',ex:'Tu devrais vraiment essayer, c\'est une chance unique.',exE:'You should really try it, it\'s a unique chance.'},
    {t:'p',lv:1,fr:'Je te promets que…',en:'I promise you that…',ex:'Je te promets que tu vas passer un super moment.',exE:'I promise you that you\'ll have a great time.'},
    {t:'p',lv:1,fr:'D\'abord,… ensuite,… et puis surtout,…',en:'First,… then,… and above all,…',ex:'D\'abord, c\'est pas cher, ensuite c\'est près de chez toi, et puis surtout, on y va ensemble.',exE:'First, it\'s cheap, then it\'s close to your place, and above all, we go together.'},
    {t:'p',lv:2,fr:'Je comprends que tu aies peur, mais…',en:'I understand that you\'re afraid, but…',ex:'Je comprends que tu aies peur, mais il y a des moniteurs pour t\'aider.',exE:'I understand that you\'re afraid, but there are instructors to help you.'},
    {t:'p',lv:2,fr:'Admettons que ce soit cher, mais…',en:'Let\'s say it\'s expensive, but…',ex:'Admettons que ce soit cher, mais c\'est un souvenir pour la vie.',exE:'Let\'s say it\'s expensive, but it\'s a memory for life.'},
    {t:'p',lv:2,fr:'Je vois ce que tu veux dire, pourtant…',en:'I see what you mean, yet…',ex:'Je vois ce que tu veux dire, pourtant je pense que tu te trompes sur ce point.',exE:'I see what you mean, yet I think you\'re wrong on this point.'},
    {t:'p',lv:2,fr:'Pense aux avantages : …',en:'Think about the advantages: …',ex:'Pense aux avantages : tu rencontres du monde, tu apprends et tu t\'amuses.',exE:'Think about the advantages: you meet people, you learn and you have fun.'},
    {t:'p',lv:2,fr:'C\'est un investissement, pas une dépense.',en:'It\'s an investment, not an expense.',ex:'C\'est un investissement, pas une dépense : tu vas apprendre une vraie compétence.',exE:'It\'s an investment, not an expense: you\'ll learn a real skill.'},
    {t:'p',lv:2,fr:'Dis-toi que…',en:'Tell yourself that…',ex:'Dis-toi que tu n\'as rien à perdre.',exE:'Tell yourself that you have nothing to lose.'},
    {t:'p',lv:2,fr:'Et si on essayait une seule fois ?',en:'What if we tried just once?',ex:'Et si on essayait une seule fois, juste pour voir ?',exE:'What if we tried just once, just to see?'},
    {t:'p',lv:2,fr:'Ce qui est génial, c\'est que…',en:'What\'s great is that…',ex:'Ce qui est génial, c\'est que tu peux y aller à ton rythme.',exE:'What\'s great is that you can go at your own pace.'},
    {t:'p',lv:2,fr:'À ta place, je n\'hésiterais pas.',en:'If I were you, I wouldn\'t hesitate.',ex:'À ta place, je n\'hésiterais pas une seconde.',exE:'If I were you, I wouldn\'t hesitate for a second.'},
    {t:'p',lv:2,fr:'Tu ne vas pas passer à côté de ça !',en:'You\'re not going to miss out on that!',ex:'Tu ne vas quand même pas passer à côté d\'une occasion pareille !',exE:'You\'re surely not going to miss out on such an opportunity!'},
    {t:'p',lv:3,fr:'Je te le garantis.',en:'I guarantee it.',ex:'Tu vas adorer, je te le garantis.',exE:'You\'re going to love it, I guarantee it.'},
    {t:'p',lv:3,fr:'Loin d\'être un obstacle, … est un atout.',en:'Far from being an obstacle, … is an asset.',ex:'Loin d\'être un obstacle, ton manque d\'expérience est un atout : tu vas tout découvrir.',exE:'Far from being an obstacle, your lack of experience is an asset: you\'ll discover everything.'},
    {t:'p',lv:3,fr:'Sois honnête avec toi-même : …',en:'Be honest with yourself: …',ex:'Sois honnête avec toi-même : tu en as envie depuis longtemps.',exE:'Be honest with yourself: you\'ve wanted this for a long time.'},
    {t:'p',lv:3,fr:'Tu pourrais être agréablement surpris(e).',en:'You might be pleasantly surprised.',ex:'Tu pourrais être agréablement surpris par le résultat.',exE:'You might be pleasantly surprised by the result.'},
    {t:'p',lv:3,fr:'Ce n\'est pas aussi risqué que tu le penses.',en:'It\'s not as risky as you think.',ex:'Ce n\'est pas aussi risqué que tu le penses, c\'est très bien encadré.',exE:'It\'s not as risky as you think, it\'s very well supervised.'},
   ]},

   {id:'eB_sport',fr:'★ Sport & défis nature',en:'Sport & nature challenges',c:'#E5484D',l:false,items:[
    {t:'v',lv:1,fr:'dormir à la belle étoile',wc:'loc',en:'to sleep under the stars',ex:'Dormir à la belle étoile, c\'est une expérience unique.',exE:'Sleeping under the stars is a unique experience.'},
    {t:'v',lv:1,fr:'un loup',wc:'nm',en:'wolf',ex:'Les loups vivent dans un parc surveillé par des spécialistes.',exE:'The wolves live in a park watched over by specialists.'},
    {t:'v',lv:1,fr:'un sentier',wc:'nm',en:'trail',ex:'Le sentier est facile et bien balisé.',exE:'The trail is easy and well marked.'},
    {t:'v',lv:1,fr:'le vélo',wc:'nm',en:'bicycle, cycling',ex:'Le vélo en ville est rapide et bon pour la santé.',exE:'Cycling in the city is fast and good for health.'},
    {t:'v',lv:1,fr:'un défi',wc:'nm',en:'challenge',ex:'Ce défi cycliste est une belle occasion de se dépasser.',exE:'This cycling challenge is a great chance to push yourself.'},
    {t:'v',lv:1,fr:'la chute libre',wc:'nf',en:'skydiving, free fall',ex:'La chute libre, c\'est une sensation incroyable.',exE:'Skydiving is an incredible sensation.'},
    {t:'v',lv:1,fr:'un chien de traîneau',wc:'nm',en:'sled dog',ex:'Les chiens de traîneau adorent courir.',exE:'Sled dogs love running.'},
    {t:'v',lv:2,fr:'une randonnée',wc:'nf',en:'hike',ex:'Cette randonnée bénévole dure une demi-journée.',exE:'This volunteer hike lasts half a day.'},
    {t:'v',lv:2,fr:'un collecteur de pierres',wc:'nm',en:'stone collector (trail)',ex:'On installe des poubelles et des collecteurs de pierres le long du sentier.',exE:'We install bins and stone collectors along the trail.'},
    {t:'v',lv:2,fr:'la sécurité sur la route',wc:'nf',en:'road safety',ex:'La police assure la sécurité sur la route.',exE:'The police ensure road safety.'},
    {t:'v',lv:2,fr:'des frais d\'inscription libres',wc:'nm',en:'free-choice entry fee',ex:'Les frais d\'inscription sont libres, tu donnes ce que tu veux.',exE:'The entry fee is free-choice, you give what you want.'},
    {t:'v',lv:2,fr:'une équipe de cinq cyclistes',wc:'nf',en:'team of five cyclists',ex:'On forme une équipe de cinq cyclistes.',exE:'We form a team of five cyclists.'},
    {t:'v',lv:2,fr:'une association écologiste',wc:'nf',en:'environmental group',ex:'Tous les profits iront à une association écologiste.',exE:'All profits will go to an environmental group.'},
    {t:'v',lv:2,fr:'dépasser ses limites',wc:'loc',en:'to push one\'s limits',ex:'Ce marathon te permet de dépasser tes limites.',exE:'This marathon lets you push your limits.'},
    {t:'v',lv:3,fr:'l\'adrénaline',wc:'nf',en:'adrenaline',ex:'L\'adrénaline monte avant le saut.',exE:'Adrenaline rises before the jump.'},
    {t:'v',lv:3,fr:'une expérience inoubliable',wc:'nf',en:'unforgettable experience',ex:'Ce sera une expérience inoubliable pour nous deux.',exE:'It will be an unforgettable experience for both of us.'},
    {t:'p',lv:1,fr:'Écoute, j\'ai une super idée : et si on …',en:'Listen, I\'ve got a great idea: what if we …',ex:'Écoute, j\'ai une super idée : et si on faisait un marathon cycliste ensemble ?',exE:'Listen, I\'ve got a great idea: what if we did a cycling marathon together?'},
    {t:'p',lv:1,fr:'Je sais que tu as peur de …, mais …',en:'I know you\'re afraid of …, but …',ex:'Je sais que tu as peur du vide, mais le moniteur saute avec toi.',exE:'I know you\'re afraid of heights, but the instructor jumps with you.'},
    {t:'p',lv:1,fr:'Tu n\'as pas besoin d\'être sportif pour …',en:'You don\'t need to be sporty to …',ex:'Tu n\'as pas besoin d\'être sportif pour faire du vélo en ville.',exE:'You don\'t need to be sporty to cycle in the city.'},
    {t:'p',lv:1,fr:'Imagine : dormir à la belle étoile …',en:'Imagine: sleeping under the stars …',ex:'Imagine : dormir à la belle étoile, avec les loups qui hurlent au loin.',exE:'Imagine: sleeping under the stars, with wolves howling in the distance.'},
    {t:'p',lv:2,fr:'C\'est encadré par des professionnels, donc tu ne risques rien.',en:'It\'s supervised by professionals, so you\'re not at risk.',ex:'C\'est encadré par des guides professionnels, donc tu ne risques rien.',exE:'It\'s supervised by professional guides, so you\'re not at risk.'},
    {t:'p',lv:2,fr:'En plus, c\'est pour une bonne cause : …',en:'On top of that, it\'s for a good cause: …',ex:'En plus, c\'est pour une bonne cause : tous les profits vont à une association écologiste.',exE:'On top of that, it\'s for a good cause: all profits go to an environmental group.'},
    {t:'p',lv:2,fr:'On fera ça ensemble, comme ça tu ne seras pas seul(e).',en:'We\'ll do it together, so you won\'t be alone.',ex:'On fera ça ensemble, comme ça tu ne seras pas seul.',exE:'We\'ll do it together, so you won\'t be alone.'},
    {t:'p',lv:2,fr:'Pense à la fierté que tu ressentiras après …',en:'Think of the pride you\'ll feel after …',ex:'Pense à la fierté que tu ressentiras après avoir fini les 135 kilomètres.',exE:'Think of the pride you\'ll feel after finishing the 135 kilometres.'},
    {t:'p',lv:2,fr:'Et puis, il y aura une grande fête à l\'arrivée !',en:'And besides, there will be a big party at the finish!',ex:'Et puis, il y aura une grande fête à l\'arrivée, avec de la musique.',exE:'And besides, there will be a big party at the finish, with music.'},
    {t:'p',lv:3,fr:'Tu me remercieras quand tu verras …',en:'You\'ll thank me when you see …',ex:'Tu me remercieras quand tu verras le paysage au lever du soleil.',exE:'You\'ll thank me when you see the landscape at sunrise.'},
    {t:'p',lv:3,fr:'Honnêtement, tu n\'as rien à perdre, et tout à gagner.',en:'Honestly, you\'ve nothing to lose and everything to gain.',ex:'Honnêtement, tu n\'as rien à perdre, et tout à gagner : de l\'air pur et des souvenirs.',exE:'Honestly, you\'ve nothing to lose and everything to gain: fresh air and memories.'},
   ]},
  {id:'eB_voyage2',fr:'★ Vacances & voyages',en:'Holidays & trips',c:'#00968F',l:false,items:[
    {t:'v',lv:1,fr:'une roulotte',wc:'nf',en:'caravan, horse-drawn wagon',ex:'On passerait des vacances en roulotte chez un agriculteur.',exE:'We\'d spend a holiday in a caravan at a farmer\'s.'},
    {t:'v',lv:1,fr:'un agriculteur',wc:'nm',en:'farmer',ex:'Un agriculteur nous accueille dans sa ferme.',exE:'A farmer welcomes us at his farm.'},
    {t:'v',lv:1,fr:'une croisière',wc:'nf',en:'cruise',ex:'Une croisière d\'une semaine, c\'est reposant.',exE:'A week\'s cruise is relaxing.'},
    {t:'v',lv:1,fr:'louer un bateau',wc:'loc',en:'to rent a boat',ex:'On peut louer un bateau sans permis.',exE:'We can rent a boat without a licence.'},
    {t:'v',lv:1,fr:'un tuk-tuk',wc:'nm',en:'tuk-tuk',ex:'On visiterait Bruxelles en tuk-tuk.',exE:'We\'d tour Brussels by tuk-tuk.'},
    {t:'v',lv:1,fr:'un voyage gratuit',wc:'nm',en:'free trip',ex:'Ce voyage bénévole est entièrement gratuit.',exE:'This volunteer trip is entirely free.'},
    {t:'v',lv:2,fr:'un testeur de voyage',wc:'nm',en:'travel tester',ex:'Devenir testeur de voyage, c\'est voyager tous frais payés.',exE:'Becoming a travel tester means travelling all expenses paid.'},
