let P=null;
function stopAll(){
  if(!P)return;
  try{speechSynthesis.cancel()}catch(e){}
  cancelAnimationFrame(P.raf);
  if(P.audio){P.audio.pause();P.audio.src=''}
  if(P.url)URL.revokeObjectURL(P.url);
  P=null;
}
function openTrack(id){
  stopAll();
  const t=TRACKS.find(x=>x.id===id)||(loadTracks(),TRACKS.find(x=>x.id===id));
  if(!t){showLibrary();return}
  P={t,idx:0,playing:false,waiting:false,practice:false,loop:false,rate:1,src:'tts',audio:null,url:null,hasAudio:false,starts:[],dur:0,modelPlay:null,tok:0,sync:null,raf:0,view:ls.get('tef.view','fr')};
  t.lines.forEach(l=>{l.rev=false});
  renderPlayer();
  Promise.race([getAudio(t.id),new Promise(r=>setTimeout(()=>r(null),1500))]).then(b=>{if(!P||P.t!==t)return;if(b)attachAudio(b,true);else if(t.audioUrl)attachAudio(t.audioUrl,true)}).catch(()=>{if(P&&P.t===t&&t.audioUrl)attachAudio(t.audioUrl,true)});
}

function renderPlayer(){
  const t=P.t;root.innerHTML='';
  const app=h('div',{id:'app'});
  app.dataset.view=P.view;
  root.append(app);
  app.append(
    h('div',{class:'top'},
      h('button',{class:'back',onclick:showLibrary},'‹'),
      h('div',{class:'ttl'},h('span',{class:'sec'},t.kind||('Section '+t.section)),t.title)
    )
  );
  // scenario
  const sc=h('details',{class:'sc'},h('summary',{},'Consigne & phrases utiles'));
  if(t.ad)sc.append(h('div',{class:'ad'},h('b',{},t.ad.title),t.ad.text));
  if(t.task)sc.append(h('p',{},t.task));
  if(t.phrases&&t.phrases.length)sc.append(h('div',{class:'kp'},t.phrases.map(p=>h('div',{},p[0],h('i',{},p[1])))));
  if(!t.ad&&!t.task&&!(t.phrases&&t.phrases.length))sc.append(h('p',{},'Pas de consigne pour cet exercice.'));
  app.append(sc);
  // view seg
  app.append(h('div',{class:'seg',id:'viewseg'},
    [['listen','Écoute'],['fr','Français'],['both','FR + EN']].map(([k,l])=>h('button',{'data-k':k,class:P.view===k?'on':'',onclick:()=>setView(k)},l))
  ));
  // stage
  app.append(h('div',{class:'stage',id:'stage',onclick:()=>{
    const s=$('#stage');
    if(P.view==='listen'&&!s.classList.contains('peek')){s.classList.add('peek');return}
    s.classList.toggle('showen');
  }},
    h('div',{class:'who',id:'st-who'}),h('div',{class:'fr',id:'st-fr'}),h('div',{class:'ph',id:'st-ph'},'🎤 À vous de parler…'),h('div',{class:'en',id:'st-en'}),h('div',{class:'note',id:'st-note'}),
    h('div',{class:'hint',id:'st-hint'},'Touche pour voir l\'anglais')
  ));
  // waiting + sync
  app.append(h('div',{class:'wait',id:'wait'},h('b',{},'À vous de parler! Dites votre réplique à voix haute.'),
    h('div',{class:'r'},
      h('button',{class:'btn sm',onclick:revealModel},'Voir le modèle'),
      h('button',{class:'btn sm',onclick:listenModel},'Écouter le modèle'),
      h('button',{class:'btn sm pri',onclick:doContinue},'Continuer ▶')
    )));
  app.append(h('div',{class:'sync',id:'sync'},h('p',{id:'sync-p'}),h('button',{class:'big',onclick:syncTap},'Réplique suivante ▶'),h('button',{class:'btn sm',style:'margin-top:8px',onclick:cancelSync},'Annuler')));
  // transcript
  const list=h('div',{class:'list',id:'list'});
  t.lines.forEach((l,i)=>{
    const m=h('div',{class:'msg '+l.s,'data-i':i},
      h('div',{class:'bub',onclick:()=>{
        if(P.view==='listen'&&!m.classList.contains('peek')){m.classList.add('peek');return}
        m.classList.toggle('open');
      }},
        h('div',{class:'sp'},l.s==='ex'?'Examinateur':'Vous'),
        h('div',{class:'f'},l.fr),h('div',{class:'e'},l.en||'—'),l.note?h('div',{class:'n'},l.note.startsWith('⚠')?l.note:'✦ CLB 7 · '+l.note):null),
      h('button',{class:'jump',title:'Lire cette réplique',onclick:()=>jump(i)},'▶')
    );
    list.append(m);
  });
  app.append(list);
  // controls
  app.append(h('div',{class:'ctl'},
    h('div',{class:'prog'},h('span',{id:'p-l'},'0:00'),h('input',{type:'range',id:'p-r',min:0,max:100,value:0,step:'any',oninput:e=>seekSlider(+e.target.value)}),h('span',{id:'p-r2'},'')),
    h('div',{class:'row'},
      h('button',{class:'rb',onclick:()=>jump(P.idx-1),'aria-label':'Réplique précédente'},'⏮'),
      h('button',{class:'rb play',id:'playbtn',onclick:togglePlay},'▶'),
      h('button',{class:'rb',onclick:()=>jump(P.idx+1),'aria-label':'Réplique suivante'},'⏭')
    ),
    h('div',{class:'tools'},
      h('button',{class:'pill',id:'t-prac',onclick:togglePractice},'🎤 Pratique'),
      h('button',{class:'pill',id:'t-loop',onclick:toggleLoop},'🔁 Boucle'),
      h('button',{class:'pill',id:'t-rate',onclick:cycleRate},'1×'),
      h('button',{class:'pill',id:'t-src',onclick:openSource},'🔊 Voix')
    )
  ));
  // source panel
  const file=h('input',{type:'file',class:'file',id:'file',accept:'audio/*,.mp3,.m4a,.wav,.aac,.ogg',onchange:async e=>{
    const f=e.target.files[0];if(!f)return;
    try{await putAudio(P.t.id,f)}catch(err){toast('Stockage impossible — lecture seulement pendant cette session')}
    localStorage.removeItem('tef.sync.'+P.t.id);
    attachAudio(f,true);toast('Audio ajouté — touche « Synchroniser » pour caler les sous-titres');
  }});
  app.append(h('div',{class:'card',id:'srcpanel',style:'display:none;margin-top:12px'},
    h('h2',{},'Source audio'),
    h('p',{class:'sub',style:'margin:6px 0 12px'},'Par défaut, ton téléphone lit le script avec une voix française. Tu peux joindre ton propre enregistrement (10–20 min OK).'),
    h('div',{class:'seg'},h('button',{id:'s-tts',onclick:()=>setSource('tts')},'Voix de l\'appareil'),h('button',{id:'s-aud',onclick:()=>setSource('audio')},'Mon audio')),
    file,
    h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{class:'btn sm',onclick:()=>file.click()},'📎 Choisir un fichier audio'),
      h('button',{class:'btn sm',id:'b-sync',onclick:startSync},'⏱ Synchroniser'),
      h('button',{class:'btn sm',id:'b-rm',onclick:removeAudio},'Retirer l\'audio')),
    h('p',{class:'sub',style:'margin:12px 0 0;font-size:12.5px'},'Synchroniser : écoute ton audio et touche « Réplique suivante » au début de chaque réplique. Une seule fois suffit, c\'est mémorisé.'),
    P.t.custom?h('button',{class:'btn sm danger',style:'margin-top:12px',onclick:deleteTrack},'Supprimer cet exercice'):null
  ));
  $('#app').classList.toggle('prac',P.practice);
  setIdx(0,false);updateSource();updateProgress();updatePlay();
}

function setView(k){
  P.view=k;ls.set('tef.view',k);$('#app').dataset.view=k;
  document.querySelectorAll('#viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('#stage').classList.remove('peek');
  updateStage();
}

/* -------- stage / index -------- */
function setIdx(i,scroll=true){
  const n=P.t.lines.length;i=Math.max(0,Math.min(n-1,i));
  const changed=i!==P.idx;P.idx=i;
  document.querySelectorAll('.msg.act').forEach(e=>e.classList.remove('act'));
  const el=document.querySelector('.msg[data-i="'+i+'"]');
  if(el){el.classList.add('act');if(scroll)el.scrollIntoView({block:'center',behavior:'smooth'})}
  if(changed){const s=$('#stage');if(s){s.classList.remove('peek','showen')}}
  updateStage();updateProgress();
}
function updateStage(){
  const L=P.t.lines[P.idx],s=$('#stage');if(!s)return;
  s.classList.toggle('ca',L.s==='ca');
  $('#st-who').textContent=(L.s==='ex'?'Examinateur':'Vous')+' · '+(P.idx+1)+'/'+P.t.lines.length;
  $('#st-fr').textContent=L.fr;
  $('#st-en').textContent=L.en||'—';
  $('#st-note').textContent=L.note?(L.note.startsWith('⚠')?L.note:'✦ CLB 7 · '+L.note):'';
  s.classList.toggle('hid',P.practice&&L.s==='ca'&&!L.rev);
  s.classList.toggle('showen',P.view==='both'||s.classList.contains('showen'));
  $('#st-hint').textContent=(P.view==='listen'&&!s.classList.contains('peek'))?'Touche pour voir le français':'Touche pour voir l\'anglais';
}

/* -------- audio source -------- */
function attachAudio(blob,switchTo){
  if(P.audio){P.audio.pause()}
  if(P.url&&P.url.startsWith('blob:'))URL.revokeObjectURL(P.url);
  P.url=(typeof blob==='string')?blob:URL.createObjectURL(blob);
  const a=new Audio();a.preload='metadata';a.src=P.url;a.playbackRate=P.rate;P.audio=a;P.hasAudio=true;
  a.addEventListener('loadedmetadata',()=>{P.dur=a.duration;computeStarts();updateProgress()});
  a.addEventListener('ended',()=>{if(P.src==='audio')onFinished()});
  if(switchTo)setSource('audio');else updateSource();
}
function computeStarts(){
  const n=P.t.lines.length,saved=ls.get('tef.sync.'+P.t.id,null);
  if(saved&&saved.length===n){P.starts=saved;P.synced=true;return}
  P.synced=false;
  if(P.t.starts&&P.t.starts.length===n&&P.dur&&Math.abs(P.dur-P.t.starts[n-1])>0){P.starts=P.t.starts.slice();return}
  const w=P.t.lines.map(l=>l.fr.length+22),tot=w.reduce((a,b)=>a+b,0);let c=0;
  P.starts=w.map(x=>{const s=(c/tot)*(P.dur||0);c+=x;return s});
}
const lineEnd=i=>i+1<P.starts.length?P.starts[i+1]:(P.dur||0);
function indexAt(t){for(let i=P.starts.length-1;i>=0;i--)if(P.starts[i]<=t+0.02)return i;return 0}

function setSource(s){
  if(s==='audio'&&!P.hasAudio){toast('Choisis d\'abord un fichier audio');return}
  pauseAll();P.src=s;P.waiting=false;P.modelPlay=null;
  if(s==='audio'&&P.audio&&P.starts.length)P.audio.currentTime=P.starts[P.idx]||0;
  updateSource();updatePlay();updateProgress();
}
function updateSource(){
  const q=id=>document.getElementById(id);if(!q('s-tts'))return;
  q('s-tts').classList.toggle('on',P.src==='tts');q('s-aud').classList.toggle('on',P.src==='audio');
  q('b-sync').style.display=P.hasAudio?'inline-block':'none';q('b-rm').style.display=P.hasAudio?'inline-block':'none';
  q('t-src').textContent=P.src==='audio'?'🎧 Audio':'🔊 Voix';
  q('s-aud').style.opacity=P.hasAudio?1:.45;
  q('wait').classList.toggle('on',P.waiting);
}
function openSource(){const p=$('#srcpanel');p.style.display=p.style.display==='none'?'block':'none';if(p.style.display==='block')p.scrollIntoView({behavior:'smooth',block:'center'})}
async function removeAudio(){
  if(!confirm('Retirer cet audio de l\'appli ?'))return;
  pauseAll();try{await delAudio(P.t.id)}catch(e){}
  localStorage.removeItem('tef.sync.'+P.t.id);
  if(P.url&&P.url.startsWith('blob:'))URL.revokeObjectURL(P.url);P.audio=null;P.url=null;P.hasAudio=false;P.src='tts';
  if(P.t.audioUrl){attachAudio(P.t.audioUrl,true);toast('Audio d\'origine rétabli');return}
  updateSource();updatePlay();updateProgress();toast('Audio retiré');
}
function deleteTrack(){
  if(!confirm('Supprimer cet exercice ?'))return;
  const id=P.t.id;ls.set('tef.custom',ls.get('tef.custom',[]).filter(t=>t.id!==id));
  delAudio(id).catch(()=>{});localStorage.removeItem('tef.sync.'+id);showLibrary();
}

/* -------- TTS voices -------- */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('fr'))}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function voiceFor(s){
  if(!VOICES.length)loadVoices();if(!VOICES.length)return null;
  const fem=/am[ée]lie|chantal|audrey|aur[ée]lie|marie|julie|virginie|denise|sylvie|c[ée]line|amelie|female|femme/i;
  const mal=/thomas|nicolas|jacques|daniel|henri|antoine|male|homme|paul/i;
  const ca=VOICES.filter(v=>/ca/i.test(v.lang));
  const pool=ca.length?ca.concat(VOICES.filter(v=>!ca.includes(v))):VOICES;
  if(s==='ex')return pool.find(v=>fem.test(v.name))||pool[0];
  return pool.find(v=>mal.test(v.name))||VOICES.find(v=>!fem.test(v.name))||pool[pool.length>1?1:0];
}
function speakLine(i,once){
  const tok=++P.tok;try{speechSynthesis.cancel()}catch(e){}
  if(i>=P.t.lines.length){onFinished();return}
  const L=P.t.lines[i];setIdx(i);
  if(!once&&P.practice&&L.s==='ca'){enterWaiting(i);return}
  P.playing=true;P.waiting=false;updatePlay();updateSource();
  setTimeout(()=>{
    if(tok!==P.tok)return;
    const u=new SpeechSynthesisUtterance(L.fr),v=voiceFor(L.s);
    if(v){u.voice=v;u.lang=v.lang}else u.lang='fr-CA';
    u.rate=Math.min(1.6,P.rate*0.95);
    if(!v||(VOICES.length<2))u.pitch=L.s==='ex'?1.15:0.85;
    u.onend=()=>{
      if(tok!==P.tok)return;
      if(once){enterWaiting(i);return}
      if(P.loop){speakLine(i);return}
      speakLine(i+1);
    };
    try{speechSynthesis.speak(u)}catch(e){toast('Voix non disponible sur cet appareil')}
  },40);
}

/* -------- transport -------- */
function updatePlay(){const b=document.getElementById('playbtn');if(b)b.textContent=(P.playing&&!P.waiting)?'⏸':'▶'}
function pauseAll(){
  if(!P)return;P.tok++;try{speechSynthesis.cancel()}catch(e){}
  if(P.audio)P.audio.pause();cancelAnimationFrame(P.raf);P.playing=false;updatePlay();
}
function togglePlay(){
  if(P.sync)return;
  if(P.waiting){doContinue();return}
  if(P.playing){pauseAll();return}
  play();
}
function play(){
  if(P.src==='audio'){
    if(!P.audio||!P.starts.length){toast('Chargement de l\'audio…');return}
    const L=P.t.lines[P.idx];
    if(P.audio.currentTime>=P.dur-0.1||P.audio.ended)P.audio.currentTime=P.starts[0];
    else if(Math.abs(indexAt(P.audio.currentTime)-P.idx)>0)P.audio.currentTime=P.starts[P.idx];
    P.audio.playbackRate=P.rate;
    P.audio.play().then(()=>{P.playing=true;updatePlay();tick()}).catch(()=>toast('Touche ▶ pour autoriser la lecture'));
  }else{
    if(!('speechSynthesis' in window)){toast('Voix non supportée ici');return}
    speakLine(P.idx>=P.t.lines.length-1&&false?0:P.idx);
  }
}
function jump(i){
  if(P.sync)return;
  const n=P.t.lines.length;if(i<0)i=0;if(i>=n)i=n-1;
  P.waiting=false;P.modelPlay=null;updateSource();
  if(P.src==='audio'&&P.audio&&P.starts.length){
    const wasPlaying=P.playing||true;
    P.audio.currentTime=P.starts[i]+0.03;setIdx(i);
    if(P.practice&&P.t.lines[i].s==='ca'){P.audio.pause();enterWaiting(i);return}
    if(!P.playing)play();
  }else{
    P.tok++;try{speechSynthesis.cancel()}catch(e){}
    setIdx(i);speakLine(i);
  }
}
function tick(){
  if(!P||P.src!=='audio'||!P.audio)return;
  const a=P.audio;
  if(P.sync){updateProgress();P.raf=requestAnimationFrame(tick);return}
  const t=a.currentTime,i=indexAt(t);
  if(i!==P.idx&&!P.waiting){
    setIdx(i);
    if(P.practice&&P.t.lines[i].s==='ca'&&P.modelPlay!==i){a.pause();enterWaiting(i);return}
  }
  const end=lineEnd(P.idx);
  if(P.modelPlay===P.idx&&t>=end-0.05){a.pause();a.currentTime=P.starts[P.idx];P.modelPlay=null;enterWaiting(P.idx);return}
  if(P.loop&&P.modelPlay==null&&t>=end-0.05)a.currentTime=P.starts[P.idx];
  updateProgress();
  if(!a.paused&&P.playing)P.raf=requestAnimationFrame(tick);
}
function onFinished(){
  P.playing=false;P.waiting=false;cancelAnimationFrame(P.raf);updatePlay();updateSource();
  P.t.lines.forEach((l,i)=>{if(l.s==='ca')l.rev=true});refreshRev();
  toast('Dialogue terminé 🎉');
}
function seekSlider(v){
  if(P.src==='audio'&&P.audio&&P.starts.length){
    P.audio.currentTime=v;const i=indexAt(v);setIdx(i,false);
    document.getElementById('p-l').textContent=fmt(v);
  }else{
    const i=Math.round(v);if(i!==P.idx){setIdx(i);if(P.playing)speakLine(i)}
  }
}
function updateProgress(){
  const r=document.getElementById('p-r');if(!r)return;
  if(P.src==='audio'&&P.audio&&P.dur){
    r.max=P.dur;if(document.activeElement!==r)r.value=P.audio.currentTime;
    document.getElementById('p-l').textContent=fmt(P.audio.currentTime);
    document.getElementById('p-r2').textContent=fmt(P.dur)+(P.synced?' ✓':' ≈');
  }else{
    r.max=P.t.lines.length-1;if(document.activeElement!==r)r.value=P.idx;
    document.getElementById('p-l').textContent=(P.idx+1)+'/'+P.t.lines.length;
    document.getElementById('p-r2').textContent='≈'+P.t.est+' min';
  }
}

/* -------- practice mode -------- */
function togglePractice(){
  P.practice=!P.practice;
  document.getElementById('t-prac').classList.toggle('on',P.practice);
  $('#app').classList.toggle('prac',P.practice);
  if(!P.practice){P.waiting=false;updateSource()}
  else {P.t.lines.forEach(l=>{l.rev=false});refreshRev();toast('Pratique : réponds à voix haute, puis compare avec le modèle')}
  updateStage();
}
function toggleLoop(){P.loop=!P.loop;document.getElementById('t-loop').classList.toggle('on',P.loop)}
function cycleRate(){
  const rs=[0.75,0.9,1,1.15];let i=rs.indexOf(P.rate);P.rate=rs[(i+1)%rs.length];
  document.getElementById('t-rate').textContent=P.rate+'×';
  if(P.audio)P.audio.playbackRate=P.rate;
}
function enterWaiting(i){
  P.tok++;try{speechSynthesis.cancel()}catch(e){}
  if(P.audio)P.audio.pause();cancelAnimationFrame(P.raf);
  P.waiting=true;P.playing=false;setIdx(i);updatePlay();updateSource();
  document.getElementById('wait').scrollIntoView({block:'nearest'});
}
function refreshRev(){document.querySelectorAll('.msg.ca').forEach(m=>m.classList.toggle('rev',!!P.t.lines[+m.dataset.i].rev));updateStage()}
function revealModel(){const L=P.t.lines[P.idx];L.rev=true;refreshRev();$('#stage').classList.add('showen')}
function listenModel(){
  const i=P.idx;P.t.lines[i].rev=true;refreshRev();P.waiting=false;updateSource();
  if(P.src==='audio'&&P.audio&&P.starts.length){P.modelPlay=i;P.audio.currentTime=P.starts[i]+0.03;P.audio.playbackRate=P.rate;P.audio.play().then(()=>{P.playing=true;updatePlay();tick()})}
  else speakLine(i,true);
}
function doContinue(){
  const i=P.idx;P.t.lines[i].rev=true;refreshRev();
  P.waiting=false;updateSource();
  const next=i+1;
  if(next>=P.t.lines.length){onFinished();return}
  if(P.src==='audio'&&P.audio&&P.starts.length){
    P.audio.currentTime=P.starts[next]+0.03;setIdx(next);
    P.audio.play().then(()=>{P.playing=true;updatePlay();tick()});
  }else speakLine(next);
}

/* -------- sync -------- */
function startSync(){
  if(!P.audio||!P.dur){toast('Audio pas encore chargé');return}
  pauseAll();document.getElementById('srcpanel').style.display='none';
  P.src='audio';P.sync={i:0,marks:[]};
  P.audio.currentTime=0;P.audio.playbackRate=1;
  P.audio.play().then(()=>{P.playing=true;updatePlay();tick()});
  const s=document.getElementById('sync');s.classList.add('on');syncMsg();s.scrollIntoView({behavior:'smooth',block:'center'});
  setIdx(0);
}
function syncMsg(){
  const L=P.t.lines[P.sync.i];
  document.getElementById('sync-p').textContent='Touche quand cette réplique commence ('+(P.sync.i+1)+'/'+P.t.lines.length+') : « '+L.fr.slice(0,60)+(L.fr.length>60?'…':'')+' »';
}
function syncTap(){
  if(!P.sync)return;
  const t=P.audio.currentTime;
  P.sync.marks.push(Math.max(t,(P.sync.marks[P.sync.marks.length-1]||0)+0.05));
  P.sync.i++;
  if(P.sync.i>=P.t.lines.length){
    P.starts=P.sync.marks;P.starts[0]=Math.max(0,P.starts[0]-0.1);
    ls.set('tef.sync.'+P.t.id,P.starts);P.synced=true;
    P.sync=null;document.getElementById('sync').classList.remove('on');
    P.audio.pause();P.audio.currentTime=0;P.playing=false;setIdx(0);updatePlay();updateProgress();
    toast('Synchronisation enregistrée ✓');return;
  }
  setIdx(P.sync.i);syncMsg();
}
function cancelSync(){
  P.sync=null;document.getElementById('sync').classList.remove('on');
  pauseAll();computeStarts();updateProgress();
}

/* ============================================================
   Init + home-screen icon
   ============================================================ */
(function icon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#8b9bff');g.addColorStop(1,'#5eead4');
    x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle='#0d1024';x.font='800 64px -apple-system,Helvetica,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('TEF',90,98);
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.append(l);
  }catch(e){}
})();
showLibrary();
