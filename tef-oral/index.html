<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEF Oral">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1024">
<title>TEF Oral Studio</title>
<style>
:root{
  --bg:#0d1024; --bg2:#151a3a; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.1); --tx:#eef0ff; --mut:#9aa1c9;
  --you:#5eead4; --youbg:rgba(94,234,212,.13); --ex:#fbbf24; --exbg:rgba(255,255,255,.07);
  --acc:#8b9bff; --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(139,155,255,.22),transparent 60%),
  radial-gradient(700px 500px at -10% 30%,rgba(94,234,212,.12),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:600px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:14px 0 4px;letter-spacing:-.02em}
h2{font-size:18px;margin:0}
.sub{color:var(--mut);font-size:14px;line-height:1.45;margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.chip.on{background:var(--acc);color:#0d1024;border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.trk{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.badge{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--acc),#6ee7d8);color:#0d1024}
.badge.b{background:linear-gradient(135deg,#fbbf24,#fb7185)}
.trk .t{font-weight:650;font-size:16px;line-height:1.25}
.trk .m{color:var(--mut);font-size:12.5px;margin-top:4px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);margin-left:6px}
.tag.ok{background:rgba(94,234,212,.18);color:var(--you)}
.btn{display:block;width:100%;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-weight:600;text-align:center}
.btn.pri{background:var(--acc);color:#0d1024;border-color:var(--acc)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.btn.danger{color:#fda4af}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.top .ttl{font-weight:650;font-size:15px;line-height:1.2;flex:1}
.top .sec{font-size:11px;color:var(--mut);display:block;font-weight:500;margin-bottom:2px}
details.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}
details.sc summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.sc summary::after{content:"▾";color:var(--mut)}
details.sc[open] summary::after{content:"▴"}
.ad{margin:12px 0;padding:14px;border-radius:14px;background:#fffbea;color:#3b2f0b;font-size:14px;line-height:1.5;white-space:pre-line}
.ad b{display:block;font-size:16px;margin-bottom:4px}
.sc p{font-size:14px;line-height:1.5;color:#d6d9f5;margin:8px 0}
.kp{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kp div{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--card)}
.kp i{color:var(--mut);font-style:normal;display:block;font-size:12px;margin-top:2px}
/* stage */
.stage{border-radius:24px;padding:20px 18px;margin-bottom:12px;min-height:170px;background:linear-gradient(160deg,rgba(139,155,255,.2),rgba(94,234,212,.08));border:1px solid var(--line);position:relative;cursor:pointer}
.stage .who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ex)}
.stage.ca .who{color:var(--you)}
.stage .fr{font-size:21px;line-height:1.38;font-weight:600;margin-top:8px;letter-spacing:-.01em}
.stage .en{font-size:15.5px;line-height:1.45;color:#c4c9f2;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
.stage.showen .en{display:block}
.stage .hint{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--mut)}
.stage .note{margin-top:10px;font-size:12px;color:var(--you);display:none}
.stage.showen .note{display:block}
#app[data-view=listen] .stage:not(.peek) .fr{filter:blur(9px);user-select:none}
.stage.hid .fr,.stage.hid .en{display:none}
.stage .ph{display:none;font-size:19px;font-weight:600;margin-top:10px;color:var(--you)}
.stage.hid .ph{display:block}
/* segmented */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#0d1024;font-weight:700}
/* controls */
.ctl{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;background:rgba(21,26,58,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:12px 14px;margin-top:14px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;justify-content:center;gap:18px}
.rb{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:18px}
.rb.play{width:58px;height:58px;background:var(--acc);color:#0d1024;font-size:24px}
.rb.on{background:var(--you);color:#0d1024}
.prog{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--mut);margin-bottom:10px}
.prog input{flex:1;accent-color:var(--acc);height:4px}
.tools{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pill{padding:7px 11px;white-space:nowrap;border-radius:99px;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.pill.on{background:var(--youbg);border-color:var(--you);color:var(--you)}
/* waiting banner */
.wait{display:none;border-radius:18px;padding:14px;margin-bottom:10px;background:var(--youbg);border:1px solid var(--you);text-align:center}
.wait.on{display:block}
.wait b{display:block;margin-bottom:10px;color:var(--you)}
.wait .r{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* transcript */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:94%}
.msg.ca{align-self:flex-end;flex-direction:row-reverse}
.bub{border-radius:18px;padding:11px 14px;background:var(--exbg);border:1px solid transparent;cursor:pointer;transition:.2s}
.msg.ca .bub{background:var(--youbg)}
.msg.act .bub{border-color:var(--acc);box-shadow:0 0 0 3px rgba(139,155,255,.18)}
.bub .sp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ex);margin-bottom:3px}
.msg.ca .bub .sp{color:var(--you)}
.bub .f{font-size:15.5px;line-height:1.42}
.bub .e{font-size:13.5px;line-height:1.4;color:#c4c9f2;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none}
.bub .n{font-size:11.5px;color:var(--you);margin-top:6px;display:none}
.msg.open .e,.msg.open .n,#app[data-view=both] .e,#app[data-view=both] .n{display:block}
#app[data-view=listen] .msg:not(.peek):not(.open) .f{filter:blur(7px)}
#app.prac .msg.ca:not(.rev) .f,#app.prac .msg.ca:not(.rev) .e,#app.prac .msg.ca:not(.rev) .n{filter:blur(8px)}
.jump{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card);font-size:11px;color:var(--mut)}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=text],textarea,select{width:100%;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:15px}
textarea{min-height:240px;line-height:1.45;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(215px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#0d1024;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.sync{display:none;margin-bottom:10px;text-align:center}
.sync.on{display:block}
.sync .big{padding:18px;font-size:17px;font-weight:700;background:var(--ex);color:#0d1024;border-radius:18px;width:100%}
.sync p{font-size:12.5px;color:var(--mut);margin:0 0 8px}
.file{display:none}
</style>
</head>
<body>
<div class="app" id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONTENT — TEF Canada Expression orale, niveau cible NCLC/CLB 7
   Ligne = [orateur, français, anglais, note optionnelle]
   E = examinateur, V = vous
   ============================================================ */
const DATA = [
{
  id:'a-photo', section:'A', title:'Atelier de photographie pour débutants', est:5,
  kind:'Section A — Obtenir des informations',
  ad:{title:'ATELIER DE PHOTOGRAPHIE POUR DÉBUTANTS',
      text:'Centre communautaire Riverdale\nApprenez les bases de la photographie en 8 semaines.\nMatériel fourni · Places limitées\nRenseignements : 416-555-0142'},
  task:'Vous avez vu cette annonce et vous téléphonez au centre. Posez un maximum de questions pour obtenir des informations (dates, horaire, matériel, prix, formateur, inscription…). Visez au moins 10 questions variées, en vouvoyant l\'examinatrice.',
  phrases:[
    ['Pourriez-vous m\'expliquer en quoi consiste…?','Could you explain what … involves?'],
    ['Est-ce qu\'il serait possible de…?','Would it be possible to…?'],
    ['En ce qui concerne le matériel / le prix…','As for the equipment / the price…'],
    ['Passons au prix : combien coûte… ?','Let\'s move on to price: how much is…?'],
    ['Pardon, c\'était bien… ? Je veux être certain d\'avoir bien compris.','Sorry, was it … ? I want to be sure I understood.'],
    ['Ça m\'arrange beaucoup.','That works really well for me.'],
    ['Dans ce cas, j\'aimerais m\'inscrire.','In that case, I\'d like to sign up.']
  ],
  lines:[
  ['E','Centre communautaire Riverdale, bonjour! Comment puis-je vous aider?','Riverdale Community Centre, hello! How can I help you?'],
  ['V','Bonjour, madame. Je vous appelle au sujet de l\'annonce pour l\'atelier de photographie que j\'ai vue sur votre site Web. Est-ce qu\'il reste encore des places?','Hello, ma\'am. I\'m calling about the ad for the photography workshop that I saw on your website. Are there still spots left?','Ouverture polie : « au sujet de » + question directe'],
  ['E','Oui, il nous en reste quelques-unes. Qu\'est-ce que vous aimeriez savoir?','Yes, we have a few left. What would you like to know?'],
  ['V','Pour commencer, pourriez-vous m\'expliquer en quoi consiste exactement l\'atelier? Je n\'ai jamais fait de photographie, alors j\'aimerais savoir si c\'est vraiment adapté aux débutants.','To start, could you explain what exactly the workshop involves? I\'ve never done photography, so I\'d like to know if it\'s really suited to beginners.','Conditionnel de politesse + « en quoi consiste »'],
  ['E','Oui, tout à fait. C\'est un cours de huit semaines. On commence par les bases : la lumière, la composition et le fonctionnement de l\'appareil. Ensuite, on fait des sorties sur le terrain.','Yes, absolutely. It\'s an eight-week course. We start with the basics: light, composition and how the camera works. Then we go on field outings.'],
  ['V','Ah, d\'accord, ça m\'intéresse beaucoup. Et quand est-ce que le cours commence? Et à quel moment de la semaine a-t-il lieu?','Ah, okay, that interests me a lot. And when does the course start? And at what point in the week does it take place?','Inversion à l\'oral : « a-t-il lieu »'],
  ['E','Le prochain groupe commence le 18 janvier. Les séances ont lieu le mardi soir, de dix-huit heures trente à vingt et une heures.','The next group starts on January 18th. Sessions are on Tuesday evenings, from 6:30 to 9:00 p.m.'],
  ['V','Pardon, c\'était bien le dix-huit janvier? Je veux être certain d\'avoir bien compris.','Sorry, was it indeed January 18th? I want to be sure I understood properly.','Vérifier / reformuler : technique clé au TEF'],
  ['E','Oui, c\'est ça, le dix-huit janvier.','Yes, that\'s right, January 18th.'],
  ['V','Parfait, merci. Le mardi soir me convient très bien, parce que je travaille jusqu\'à dix-sept heures. Est-ce que les séances ont toujours lieu en salle, ou est-ce qu\'il y a aussi des activités à l\'extérieur?','Perfect, thank you. Tuesday evening suits me very well, because I work until 5 p.m. Are the sessions always held indoors, or are there also outdoor activities?','Justifier avec « parce que » + question à deux choix'],
  ['E','Il y a quatre séances en salle et quatre sorties. Les sorties se font dans le quartier ou au centre-ville, selon la météo.','There are four indoor sessions and four outings. The outings are in the neighbourhood or downtown, depending on the weather.'],
  ['V','Très bien. Et si je devais m\'absenter une semaine, par exemple à cause du travail, est-ce qu\'il serait possible de rattraper la séance?','Very good. And if I had to be absent for a week, for example because of work, would it be possible to make up the session?','Hypothèse : si + imparfait → conditionnel'],
  ['E','Euh… on n\'offre pas de reprise, mais le formateur envoie les notes de cours par courriel. Alors vous ne manquez pas la matière.','Uh… we don\'t offer make-ups, but the instructor emails the course notes. So you don\'t miss the material.'],
  ['V','D\'accord, c\'est bon à savoir. Maintenant, en ce qui concerne le matériel : est-ce que je dois apporter mon propre appareil photo? Pour l\'instant, je n\'ai que mon téléphone.','Okay, good to know. Now, as for the equipment: do I have to bring my own camera? For now, I only have my phone.','« En ce qui concerne » pour changer de sujet'],
  ['E','Le matériel est fourni : on prête un appareil pendant les séances. Vous pouvez aussi utiliser votre téléphone pour certaines activités.','The equipment is provided: we lend a camera during the sessions. You can also use your phone for some activities.'],
  ['V','Parfait. Est-ce que je pourrais l\'emprunter à la maison pour m\'exercer entre les séances? Je pense que ce serait important pour progresser.','Perfect. Could I borrow it at home to practise between sessions? I think that would be important in order to improve.','Conditionnel + opinion personnelle'],
  ['E','Non, malheureusement, les appareils restent au centre. Mais il y a une salle de pratique qui est ouverte le samedi matin.','No, unfortunately, the cameras stay at the centre. But there\'s a practice room that\'s open Saturday mornings.'],
  ['V','C\'est une bonne solution. Passons au prix : combien coûte l\'atelier au complet? Et est-ce qu\'il y a des frais supplémentaires, comme des frais d\'inscription ou de matériel?','That\'s a good solution. Let\'s move on to price: how much does the whole workshop cost? And are there any extra fees, like registration or equipment fees?','Transition : « Passons à… »'],
  ['E','Le cours coûte cent quatre-vingt-quinze dollars, taxes incluses. Il n\'y a pas d\'autres frais. Par contre, si vous voulez imprimer vos photos à la fin, c\'est en supplément.','The course costs one hundred ninety-five dollars, taxes included. There are no other fees. However, if you want to print your photos at the end, that\'s extra.'],
  ['V','Je vois. Est-ce qu\'on peut payer en plusieurs versements? Cent quatre-vingt-quinze dollars, c\'est un certain budget pour moi en ce moment.','I see. Can one pay in several instalments? A hundred and ninety-five dollars is a bit of a budget for me right now.','Demander une facilité de paiement avec tact'],
  ['E','Oui, c\'est possible. On peut diviser le montant en deux paiements : le premier à l\'inscription et le deuxième à la quatrième semaine.','Yes, that\'s possible. We can split the amount into two payments: the first at registration and the second in the fourth week.'],
  ['V','Ça m\'arrange beaucoup. Et combien de personnes y a-t-il par groupe? Je préfère les petits groupes, parce qu\'on peut poser plus de questions au formateur.','That works really well for me. And how many people are there per group? I prefer small groups, because you can ask the instructor more questions.','Réaction naturelle + nouvelle question'],
  ['E','Le maximum est de douze personnes. En ce moment, il y en a déjà huit d\'inscrites.','The maximum is twelve people. Right now, eight are already registered.'],
  ['V','Donc il reste quatre places. Je devrais m\'inscrire assez vite, alors. Qui donne le cours? Est-ce que le formateur est un photographe professionnel?','So there are four spots left. I should sign up fairly quickly, then. Who teaches the course? Is the instructor a professional photographer?','Déduire à voix haute : « Donc… alors »'],
  ['E','Oui, c\'est Marc Lefebvre. Il est photographe de mariage et de portrait depuis plus de quinze ans, et il enseigne chez nous depuis trois ans.','Yes, it\'s Marc Lefebvre. He\'s been a wedding and portrait photographer for over fifteen years, and he\'s been teaching with us for three years.'],
  ['V','Excellent. Est-ce qu\'on reçoit une attestation à la fin du cours? Et le cours est-il donné seulement en français?','Excellent. Do we receive a certificate at the end of the course? And is the course given only in French?'],
  ['E','On remet une attestation de participation, oui. Et le cours est entièrement en français, mais le formateur parle aussi anglais. Donc, s\'il y a un mot que vous ne comprenez pas, il peut vous aider.','We do give a certificate of participation, yes. And the course is entirely in French, but the instructor also speaks English. So if there\'s a word you don\'t understand, he can help you.'],
  ['V','C\'est rassurant, merci. Alors, comment est-ce que je peux m\'inscrire? Faut-il venir sur place, ou est-ce que je peux le faire par téléphone?','That\'s reassuring, thank you. So, how can I sign up? Do I need to come in person, or can I do it by phone?','« Faut-il » : structure plus soutenue'],
  ['E','Vous pouvez le faire tout de suite par téléphone, avec une carte de crédit, ou encore sur notre site Web.','You can do it right now by phone, with a credit card, or else on our website.'],
  ['V','Dans ce cas, j\'aimerais m\'inscrire maintenant, si c\'est possible. Est-ce que je recevrai une confirmation par la suite?','In that case, I\'d like to sign up now, if that\'s possible. Will I receive a confirmation afterwards?','Futur simple : « je recevrai »'],
  ['E','Bien sûr. Je vous l\'envoie par courriel. Il me faudrait votre nom complet et votre adresse courriel.','Of course. I\'ll send it to you by email. I\'d need your full name and your email address.'],
  ['V','Avec plaisir. Et merci beaucoup pour toutes ces informations, madame. Vous m\'avez vraiment été très utile.','With pleasure. And thank you very much for all this information, ma\'am. You were really very helpful.','Clôture chaleureuse et naturelle']
  ]
},
{
  id:'b-garden', section:'B', title:'Convaincre un ami : le jardin communautaire', est:5,
  kind:'Section B — Convaincre',
  task:'Vous avez lu que la ville ouvre un jardin communautaire dans votre quartier. Vous voulez vous inscrire et convaincre un(e) ami(e) de le faire avec vous. Il/elle est réticent(e) : répondez à chaque objection avec des arguments, des exemples et des solutions. Vous tutoyez votre ami(e).',
  phrases:[
    ['Je comprends tout à fait, mais…','I completely understand, but…'],
    ['Justement, c\'est ça l\'avantage.','That\'s precisely the advantage.'],
    ['Il y a même des études qui montrent que…','There are even studies showing that…'],
    ['Rien à voir avec…','Nothing like…'],
    ['De toute façon, ce qui compte, c\'est…','Anyway, what matters is…'],
    ['Tu ne prends aucun risque.','You\'re taking no risk at all.'],
    ['Qu\'est-ce que tu en dis?','What do you say?'],
    ['Marché conclu!','Deal!']
  ],
  lines:[
  ['E','Salut! Alors, c\'est quoi cette idée dont tu voulais me parler? Tu m\'as dit au téléphone que c\'était important.','Hey! So, what\'s this idea you wanted to talk to me about? You told me on the phone it was important.'],
  ['V','Salut! Merci d\'être venu. Alors voilà : j\'ai vu une annonce hier. La ville ouvre un jardin communautaire dans notre quartier, et les inscriptions sont ouvertes jusqu\'à la fin du mois. J\'aimerais beaucoup m\'inscrire, et je voudrais que tu le fasses avec moi.','Hey! Thanks for coming. So here\'s the thing: I saw an ad yesterday. The city is opening a community garden in our neighbourhood, and registration is open until the end of the month. I\'d really like to sign up, and I\'d like you to do it with me.','Subjonctif après « vouloir que »'],
  ['E','Un jardin? Moi? Franchement, je n\'ai jamais planté quoi que ce soit de ma vie. Je réussirais même à tuer un cactus.','A garden? Me? Honestly, I\'ve never planted anything in my life. I\'d manage to kill even a cactus.'],
  ['V','Ha! Justement, personne ne s\'attend à ce que tu sois un expert. Bien que ce soit nouveau pour toi, le programme est fait pour les débutants, et il y a des jardiniers bénévoles qui donnent des conseils chaque semaine. Tu apprendrais en faisant, c\'est tout.','Ha! Precisely, nobody expects you to be an expert. Even though it\'s new to you, the program is made for beginners, and there are volunteer gardeners who give advice every week. You\'d learn by doing, that\'s all.','Subjonctif : « s\'attendre à ce que », « bien que »'],
  ['E','Ouais, mais bon… je suis déjà débordé. Entre le travail, le gym et le reste, je n\'ai vraiment pas le temps de m\'occuper de plantes.','Yeah, but still… I\'m already swamped. Between work, the gym and everything else, I really don\'t have time to look after plants.'],
  ['V','Je comprends tout à fait, moi aussi j\'ai un horaire chargé. Mais ça ne prend pas beaucoup de temps : deux ou trois heures par semaine, et on peut s\'organiser à deux. Si tu ne peux pas venir une semaine, j\'irai à ta place, et la fois suivante, ce sera ton tour.','I completely understand, I have a busy schedule too. But it doesn\'t take much time: two or three hours a week, and we can share it between the two of us. If you can\'t come one week, I\'ll go in your place, and the next time it\'ll be your turn.','Concession → contre-argument → solution concrète'],
  ['E','Deux ou trois heures, c\'est quand même beaucoup. Moi, je préfère garder mes fins de semaine pour me reposer.','Two or three hours is still a lot. Me, I prefer to keep my weekends for resting.'],
  ['V','Je sais, mais justement, ça pourrait te servir de repos. Tu passes ta semaine devant un écran, non? Être dehors, les mains dans la terre, ça aide vraiment à décompresser. Il y a même des études qui montrent que le jardinage réduit le stress.','I know, but actually, it could serve as rest for you. You spend your week in front of a screen, right? Being outside, hands in the soil, really helps you unwind. There are even studies showing that gardening reduces stress.','Retourner l\'objection + appui sur des faits'],
  ['E','Peut-être, mais moi, pour décompresser, je préfère aller marcher ou regarder un film. Et puis, à quoi ça sert? On peut acheter des légumes à l\'épicerie, c\'est plus simple.','Maybe, but me, to unwind I prefer going for a walk or watching a movie. And besides, what\'s the point? You can buy vegetables at the grocery store, it\'s simpler.'],
  ['V','C\'est vrai que c\'est plus simple, mais avec les prix actuels, ce n\'est pas si économique. Un panier de légumes frais coûte cher! Si on fait pousser nos propres tomates, nos herbes et nos salades, on dépensera beaucoup moins, et en plus, ce sera bien meilleur. Rien à voir avec ce qu\'on trouve au supermarché.','It\'s true that it\'s simpler, but with today\'s prices, it\'s not that economical. A basket of fresh vegetables is expensive! If we grow our own tomatoes, herbs and salads, we\'ll spend a lot less, and on top of that, it\'ll taste much better. Nothing like what you find at the supermarket.','si + présent → futur ; « Rien à voir avec »'],
  ['E','Mouais… Et ça coûte combien, ton jardin? Parce que s\'il faut payer une fortune, je ne suis pas intéressé.','Meh… And how much does your garden cost? Because if I have to pay a fortune, I\'m not interested.'],
  ['V','Pas du tout. L\'inscription est de quarante dollars pour toute la saison, et l\'outillage est fourni. Si on se partage une parcelle, ça fait vingt dollars chacun. C\'est moins cher qu\'un repas au restaurant.','Not at all. Registration is forty dollars for the whole season, and the tools are provided. If we share a plot, that\'s twenty dollars each. That\'s cheaper than a meal at a restaurant.','Chiffres + comparaison parlante'],
  ['E','Vingt dollars, ça va. Mais il y a un autre problème : l\'été, je pars souvent en voyage. Qui va s\'occuper du jardin quand je serai parti?','Twenty dollars, that\'s fine. But there\'s another problem: in the summer, I often go travelling. Who\'s going to look after the garden when I\'m away?'],
  ['V','Bonne question, mais ce n\'est pas un problème. Comme on serait deux, je m\'en occuperais pendant ton absence. Et puis, les autres membres s\'entraident : quand quelqu\'un part en vacances, un voisin s\'occupe de ses plantes. C\'est un vrai esprit de communauté.','Good question, but it\'s not a problem. Since there\'d be two of us, I\'d take care of it while you\'re away. And besides, the other members help each other out: when someone goes on vacation, a neighbour looks after their plants. It\'s a real community spirit.','Pronom « en » : s\'en occuper'],
  ['E','Ah, tu penses? Moi, je ne connais personne là-bas. Je ne suis pas très à l\'aise pour rencontrer du monde comme ça.','Oh, you think? Me, I don\'t know anyone there. I\'m not very comfortable meeting people like that.'],
  ['V','Moi non plus, au début. Mais c\'est justement l\'avantage : le jardin, c\'est une excuse naturelle pour parler aux gens. On a tous quelque chose en commun, les plantes. Et honnêtement, tu m\'as dit que tu te sentais un peu isolé depuis ton déménagement. Ça pourrait t\'aider à te faire des amis dans le quartier.','Me neither, at first. But that\'s precisely the advantage: the garden is a natural excuse to talk to people. We all have something in common: plants. And honestly, you told me you\'ve been feeling a bit isolated since your move. It could help you make friends in the neighbourhood.','Argument personnel et empathique'],
  ['E','C\'est vrai que je ne connais pas grand monde depuis que j\'ai déménagé… Mais j\'ai peur de me planter. Si mes légumes ne poussent pas, je vais me sentir ridicule.','It\'s true I don\'t know many people since I moved… But I\'m afraid of messing up. If my vegetables don\'t grow, I\'m going to feel ridiculous.'],
  ['V','Mais non, voyons! Même les jardiniers expérimentés ont des échecs. Et de toute façon, ce n\'est pas la récolte qui compte le plus, c\'est l\'expérience. Imagine : dans quelques mois, on pourrait cuisiner ensemble avec des légumes qu\'on a fait pousser nous-mêmes. Tu ne trouves pas que ce serait génial?','Oh come on! Even experienced gardeners have failures. And anyway, it\'s not the harvest that matters most, it\'s the experience. Imagine: in a few months, we could cook together with vegetables we grew ourselves. Don\'t you think that would be great?','Appel à l\'émotion + hypothèse'],
  ['E','Hmm, c\'est vrai que ça fait rêver, je dois l\'avouer. Mais la saison commence quand? Parce qu\'il fait encore froid, non?','Hmm, it\'s true that it sounds dreamy, I have to admit. But when does the season start? Because it\'s still cold, no?'],
  ['V','La saison officielle commence en mai, mais il y a trois ateliers de préparation en avril pour apprendre les bases. Donc, on aurait le temps de se préparer tranquillement, sans pression.','The official season starts in May, but there are three preparation workshops in April to learn the basics. So we\'d have time to get ready calmly, without pressure.'],
  ['E','Et si je m\'inscris et que je change d\'avis après un mois? Je ne veux pas m\'engager pour rien.','And what if I sign up and change my mind after a month? I don\'t want to commit for nothing.'],
  ['V','C\'est tout à fait raisonnable. Je me suis renseigné : on peut annuler dans les deux premières semaines et être remboursé. Donc, tu ne prends aucun risque. Tu essaies, et si ça ne te plaît pas, tu arrêtes.','That\'s completely reasonable. I looked into it: you can cancel within the first two weeks and get a refund. So you\'re taking no risk at all. You try it, and if you don\'t like it, you stop.','Passé composé réflexif : je me suis renseigné'],
  ['E','Ah, ça change un peu les choses… Tu as déjà tout vérifié, on dirait.','Ah, that changes things a bit… You\'ve already checked everything, it seems.'],
  ['V','Oui, parce que j\'y tiens vraiment. Je pense que ça nous ferait du bien à tous les deux, et ce serait beaucoup plus motivant de le faire ensemble que tout seul. Alors, qu\'est-ce que tu en dis? Tu es prêt à essayer?','Yes, because I really care about it. I think it would do us both good, and it would be much more motivating to do it together than alone. So, what do you say? Are you ready to try?','Pronom « y » : j\'y tiens ; conclusion + question directe'],
  ['E','Bon… d\'accord, mais à une condition : que tu me montres comment faire, parce que je n\'y connais vraiment rien.','Well… okay, but on one condition: that you show me how, because I really don\'t know anything about it.'],
  ['V','Ça marche, promis! On commence par aller à la séance d\'information, samedi prochain. Tu viens voir, et si tu n\'aimes pas l\'endroit, tu ne t\'inscris pas. Ça te va?','Deal, I promise! We\'ll start by going to the information session next Saturday. You come and see, and if you don\'t like the place, you don\'t sign up. Is that okay with you?'],
  ['E','Ça me va. Mais c\'est toi qui apportes les cafés.','That works for me. But you\'re the one bringing the coffees.'],
  ['V','Marché conclu! Merci, tu vas voir, tu ne le regretteras pas.','Deal! Thanks, you\'ll see, you won\'t regret it.']
  ]
},
{"id":"b-sejour","section":"B","title":"Convaincre un ami : séjours linguistiques (audio réel)","est":15,"kind":"Section B — Convaincre · enregistrement réel de 15 min","ad":{"title":"SÉJOURS LINGUISTIQUES — DEVENEZ ACCOMPAGNATEUR","text":"Accompagnez des groupes pendant leurs séjours : trajets, visites, accueil et coordination des départs et retours en gare.\nAucune formation exigée · Disponible pendant les vacances scolaires\nInscription obligatoire : CV + lettre de motivation sur notre site Web\n(affiche reconstituée d'après le dialogue)"},"task":"Vous avez lu cette annonce et vous appelez un(e) ami(e) pour le/la convaincre de devenir accompagnateur(trice). Il/elle est réticent(e) : il/elle n'aime pas travailler avec des élèves, doute de la rémunération, craint la fatigue, le manque de formation, les imprévus et la langue. Répondez à chaque objection (tutoiement).","phrases":[["Je comprends, c'est tout à fait compréhensible, mais…","I understand, that's totally understandable, but…"],["Non seulement… mais aussi…","Not only… but also…"],["Il est important / Il vaut mieux que tu + subjonctif","It's important / It's better that you…"],["Ce n'est pas la mer à boire.","It's not that big a deal."],["Tu ne perds rien à essayer.","You have nothing to lose by trying."],["On ne fait pas d'omelette sans casser des œufs.","You can't make an omelette without breaking eggs."],["Si j'étais à ta place, j'aimerais…","If I were you, I'd like to…"]],"audioUrl":"audio/b-sejour.mp3","starts":[0.2,1.85,3.2,6.93,15.83,23.65,32.73,40.31,48.73,58.7,65.93,78.93,87.4,97.68,102.61,105.47,115.06,129.82,140.16,155.43,163.12,172.73,177.75,184.46,198.12,204.68,218.93,226.91,240.35,247.73,253.24,261.45,269.69,281.95,289.08,301.2,319.3,321.27,323.81,338.06,354.48,361.84,372.35,384.56,391.65,395.57,409.28,418.33,433.09,445.48,460.73,462.8,466.48,489.95,501.87,510.15,526.77,532.75,538.17,539.92,553.28,572.75,586.59,601.46,609.45,623.75,628.68,633.4,640.53,659.75,672.42,687.28,699.15,710.46,713.17,716.68,739.45,759.33,770.98,783.31,796.08,803.31,813.95,816.77,840.35,858.18,875.41,887.98,891.8,894.77,907.49],"lines":[["V","Salut mon ami, comment ça va ?","Hey my friend, how's it going?"],["E","Très bien et toi ?","Very well, and you?"],["V","Oui, je vais très bien. Aujourd'hui, je t'appelle pour te parler d'une annonce qui pourrait vraiment t'intéresser.","Yes, I'm doing very well. Today I'm calling to tell you about an ad that could really interest you.","Conditionnel pour une suggestion douce"],["V","Dès que je l'ai lue, j'ai pensé à toi, car tu m'avais déjà dit que tu aimais faire quelque chose en plein air et quelque chose un peu différent du côté de la ville.","As soon as I read it, I thought of you, because you had already told me you liked doing something outdoors and something a bit different from the city side of things.","Plus-que-parfait : tu m'avais déjà dit"],["V","Il s'agit d'une activité pour participer à un organisme qu'ils appellent séjour linguistique, mon ami. C'est totalement facile à suivre.","It's about an activity to take part in an organization they call a language stay, my friend. It's totally easy to follow.","« Il s'agit de » pour présenter le sujet"],["V","Laisse-moi t'expliquer comment ça marche, comment ça se déroule. Tu peux accompagner des gens partant en séjour, des trajets ou des visites.","Let me explain how it works, how it unfolds. You can accompany people going on a stay, on trips or visits."],["V","Ah, de plus, tu peux acquérir les groupes et coordonner leur départ ou retour en gare.","Ah, also, you can welcome the groups and coordinate their departure or return at the station.","⚠ « acquérir » (to acquire) : on veut dire « accueillir » (to welcome)"],["V","Donc, mon ami, il y aura beaucoup de responsabilités, mais je sais que tu es une personne très sérieuse.","So, my friend, there will be a lot of responsibilities, but I know you're a very serious person.","Futur proche/simple + « mais » pour nuancer"],["V","Cette association recherche une personne très responsable, intéressante et bien encadrée, qui va aider beaucoup de gens.","This association is looking for a very responsible, interesting and well-supervised person who will help a lot of people."],["V","Donc, mon ami, ça va être très facile à suivre et ça serait très génial pour toi.","So, my friend, it's going to be very easy to follow and it would be really great for you."],["V","Je sais que tu es une personne qui est disponible pendant les vacances scolaires. Et de plus, d'ailleurs, mon ami, la meilleure chose, c'est qu'il n'y a aucune formation exigée.","I know you're someone who is available during school holidays. And besides, my friend, the best part is that no training is required.","Connecteurs : de plus, d'ailleurs"],["V","Donc, mon ami, n'importe qui peut participer. C'est à la portée de tout le monde. Donc, l'inscription est obligatoire.","So, my friend, anyone can take part. It's within everyone's reach. So, registration is mandatory.","Expression : à la portée de tout le monde"],["V","Tu peux simplement envoyer ton CV et ta lettre de motivation, ou visiter leur site web, mon ami. L'inscription est obligatoire, comme j'ai déjà mentionné.","You can simply send your résumé and cover letter, or visit their website, my friend. Registration is mandatory, as I already mentioned."],["V","J'ai l'impression que ça vaut vraiment la peine d'essayer. Qu'est-ce que tu en penses ?","I have the feeling it's really worth trying. What do you think?","Formule de clôture : « Qu'est-ce que tu en penses ? »"],["E","Honnêtement mon ami, je n'aime pas travailler avec des élèves.","Honestly my friend, I don't like working with students."],["V","D'accord, mon ami, d'accord. C'est tout à fait compréhensible, parce que tu n'aimes pas travailler avec beaucoup de gens, surtout les élèves, mon ami.","Okay, my friend, okay. That's completely understandable, because you don't like working with a lot of people, especially students, my friend.","Validation de l'objection avant de répondre"],["V","Mais tu sais quoi ? Laisse-moi t'expliquer : ça va être très amusant et un peu unique pour toi. Cette association est très crédible, donc tu vas avoir une expérience très sympa et bien organisée.","But you know what? Let me explain: it's going to be very fun and a bit unique for you. This association is very credible, so you'll have a very nice and well-organized experience.","Argument de crédibilité"],["V","Il y aura beaucoup d'accompagnateurs là-bas pour t'aider, mon ami. Donc, en cas d'urgence, tu vas avoir une expérience très sérieuse et conviviale.","There will be many chaperones there to help you, my friend. So in case of emergency, you'll have a very serious and friendly experience."],["V","De plus, mon ami, tu peux acquérir une nouvelle compétence très enrichissante et valorisante. Donc non seulement tu peux améliorer tes compétences techniques ou professionnelles, mais aussi tes compétences transversales, interpersonnelles.","Also, my friend, you can acquire a new, very enriching and rewarding skill. So not only can you improve your technical or professional skills, but also your transferable, interpersonal skills.","« Non seulement… mais aussi » — structure CLB 7"],["V","La communication, la patience : travailler avec des élèves va peut-être te donner une expérience très géniale, mon ami.","Communication, patience: working with students may give you a really great experience, my friend."],["V","Donc, je te recommande que tu t'inscrives dès que possible, parce que pourquoi remettre à demain ce qu'on peut faire aujourd'hui, non ? Qu'est-ce que tu en penses ?","So I recommend that you sign up as soon as possible, because why put off until tomorrow what you can do today, right? What do you think?","Subjonctif après « recommander que » + proverbe"],["E","Je ne pense pas que ce soit bien rémunéré.","I don't think it's well paid."],["V","D'accord, mon ami, d'accord. Tu as absolument raison d'avoir ce doute, parce que tu as cette peur concernant la rémunération.","Okay, my friend, okay. You're absolutely right to have this doubt, because you have this fear about the pay."],["V","Mais mon ami, tu as complètement collé dans la plaque, parce que le principal but ici est d'améliorer et de rencontrer beaucoup de gens et de découvrir de nouveaux endroits.","But my friend, you've hit the nail right on the head, because the main goal here is to improve, meet lots of people and discover new places.","⚠ « collé dans la plaque » n'existe pas en français. Dites plutôt « tu as mis le doigt dessus » ou « tu as tout à fait raison »"],["V","Parce qu'il y aura beaucoup d'activités que tu peux fabriquer et participer.","Because there will be lots of activities that you can make and take part in.","⚠ « fabriquer » → « faire » ; « participer » → « participer à »"],["V","De plus, mon ami, comme je l'ai déjà mentionné, tu peux simplement repartir sans frustration si rien ne te plaît pas. Et tu sais quoi ? Je ne te souhaite jamais quelque chose qui ne te convient pas.","Also, my friend, as I already mentioned, you can simply leave without frustration if nothing pleases you. And you know what? I would never wish on you something that doesn't suit you.","⚠ « si rien ne te plaît » (sans « pas ») ; « suggère » plutôt que « souhaite »"],["V","Le plus, mon ami, comme j'ai déjà mentionné, c'est que tu peux voyager et visiter beaucoup de nouveaux endroits totalement gratuitement.","The best part, my friend, as I already mentioned, is that you can travel and visit lots of new places totally for free."],["V","Donc je sais qu'il y a du bon et du mauvais aussi, mais il faut accepter certains inconvénients, et tu verras que c'est très raisonnable et abordable, mon ami.","So I know there's good and bad too, but you have to accept certain drawbacks, and you'll see that it's very reasonable and affordable, my friend.","Concession : « il y a du bon et du mauvais »"],["V","Donc, bien que ça soit difficile au début, mon ami, il est important d'essayer, non ? Qu'est-ce que tu en penses ?","So, even though it's difficult at the start, my friend, it's important to try, right? What do you think?","Subjonctif après « bien que »"],["E","Tu as raison mon ami, mais il faut être disponible très tôt ou les nuits. Je ne suis pas pour cela.","You're right, my friend, but you have to be available very early or at night. I'm not up for that."],["V","Ah d'accord, d'accord, mon ami. Je suis d'accord avec toi jusqu'à un certain point, parce que ce n'est pas la mer à boire, mon ami.","Ah okay, okay, my friend. I agree with you up to a certain point, because it's not that big a deal, my friend.","Expression : ce n'est pas la mer à boire (it's not that hard)"],["V","Tu sais quoi ? Parfois, on pense qu'on a besoin de rester à la maison pour se reposer, assis sur le canapé pendant toute la journée.","You know what? Sometimes we think we need to stay home to rest, sitting on the couch all day long.","Retourner l'objection : le repos"],["V","Mais nous nous fatiguons encore plus, parce que, assis sur le canapé, tu scrolles sur Instagram, tu utilises Snapchat ou tu regardes la télé. En résultat, nous nous fatiguons encore plus, mon ami, comme je l'ai déjà mentionné.","But we actually get even more tired, because sitting on the couch you scroll on Instagram, use Snapchat or watch TV. As a result, we get even more tired, my friend, as I already mentioned.","⚠ « En résultat » → « Résultat : » ou « Par conséquent, »"],["V","Donc ici, en revanche, tu te sens mieux et tu peux gagner beaucoup de compétences nouvelles, mon ami.","So here, on the other hand, you feel better and you can gain lots of new skills, my friend.","« En revanche » : contraste"],["V","Et de plus, mon ami, comment tu peux faire une omelette sans casser des œufs ? C'est une bonne façon pour toi de sortir de ta zone de confort, non, mon ami ?","And besides, my friend, how can you make an omelette without breaking eggs? It's a good way for you to step out of your comfort zone, right, my friend?","Proverbe : on ne fait pas d'omelette sans casser des œufs"],["V","Donc c'est une bonne façon d'acquérir une nouvelle compétence très enrichissante, et aussi de participer à cette activité qui va te donner une formation bien encadrée et bien organisée.","So it's a good way to acquire a very enriching new skill, and also to take part in this activity that will give you well-supervised and well-organized training."],["V","Donc, mon ami, il est important que tu essaies au moins une fois.","So, my friend, it's important that you try at least once.","Subjonctif après « il est important que »"],["E","Mon ami, je pense que c'est vraiment fatigant.","My friend, I think it's really tiring."],["V","D'accord, d'accord, mon ami. Je vois pourquoi tu dis ça. Parce que tu es une personne un peu incertaine, c'est tout à fait compréhensible. Je te connais bien, mon ami. Mais tu sais quoi, mon ami ? Tu sais quoi ?","Okay, okay, my friend. I see why you say that. Because you're a somewhat uncertain person, it's totally understandable. I know you well, my friend. But you know what, my friend? You know what?"],["V","Parfois, on pense qu'on a besoin de rester à la maison pour se reposer. Mais en réalité, assis sur le canapé, à scroller sur Instagram, regarder la télé, utiliser Snapchat, par conséquent nous nous fatiguons encore plus.","Sometimes we think we need to stay home to rest. But in reality, sitting on the couch, scrolling on Instagram, watching TV, using Snapchat, consequently we get even more tired.","Connecteur de conséquence : par conséquent"],["V","En revanche, ici, tu peux découvrir de nouveaux lieux avec différentes histoires, quelques lieux de patrimoine.","On the other hand, here you can discover new places with different stories, a few heritage sites."],["V","Donc, mon ami, tu peux acquérir de nouvelles connaissances très enrichissantes et valorisantes. Tu sais quoi ? Il y aura beaucoup de gens pour t'aider aussi.","So, my friend, you can gain new knowledge that's very enriching and rewarding. You know what? There will be lots of people to help you too."],["V","Si ça te convient, mon ami. Donc, si rien ne te plaît, on peut simplement repartir sans frustration. Ici, le but principal est de commencer quelque part, non, mon ami ?","If it suits you, my friend. So if nothing pleases you, we can simply leave without frustration. Here, the main goal is to start somewhere, right, my friend?","Réduire le risque perçu : « repartir sans frustration »"],["V","Donc il est important que tu prennes une décision rapidement. Qu'est-ce que tu penses ?","So it's important that you make a decision quickly. What do you think?","Subjonctif : il est important que tu prennes"],["E","Je n'ai pas la formation spécifique pour ce type de travail.","I don't have the specific training for this kind of work."],["V","D'accord, d'accord, mon ami. Tu as complètement raison, parce que pour cette exacte raison, cette activité est spécialement pour toi, parce qu'il n'y a aucune formation exigée.","Okay, okay, my friend. You're completely right, because for this exact reason, this activity is especially for you, because no training is required.","Retourner l'objection en argument"],["V","C'est clairement mentionné dans cette affiche. Et de plus, mon ami, tu n'as pas besoin de compétences particulières ni d'avoir un diplôme pour cette activité.","It's clearly mentioned on this poster. And also, my friend, you don't need any particular skills nor to have a diploma for this activity.","Appui sur le document de l'examen"],["V","De plus, je ne te suggère jamais quelque chose qui ne te convient pas. C'est une très bonne façon d'améliorer tes compétences techniques et aussi transversales, mon ami.","Also, I never suggest something that doesn't suit you. It's a very good way to improve your technical and also transferable skills, my friend."],["V","Parce que non seulement tu peux améliorer des compétences comme la patience, la communication, mais aussi apprendre à bien gérer les situations inconnues.","Because not only can you improve skills like patience and communication, but also learn to manage unfamiliar situations well."],["V","Il faut accepter certains inconvénients, mais je te recommande que tu n'attendes pas. C'est une bonne façon, mon ami, et il faut que tu fasses ça.","You have to accept certain drawbacks, but I recommend that you not wait. It's a good way, my friend, and you have to do this.","Subjonctif : il faut que tu fasses"],["V","Qu'est-ce que tu en penses ?","What do you think?"],["E","Oui, c'est vrai mon ami, mais il y a toujours des imprévus pendant le séjour.","Yes, that's true my friend, but there are always unexpected things during the trip."],["V","Oui, oui, mon ami, je suis d'accord avec toi, totalement, parce que ça va être un peu imprévisible. Cependant, justement, mon ami, ça va être très, très hyper pratique pour toi, parce que c'est une bonne façon d'améliorer, comme je l'ai déjà mentionné, ton organisation et ta façon de gérer une situation inconnue, non, mon ami ?","Yes, yes, my friend, I agree with you completely, because it's going to be a bit unpredictable. However, precisely, my friend, it's going to be very, very practical for you, because it's a good way to improve, as I already mentioned, your organization and how you handle an unfamiliar situation, right, my friend?","Concession + « cependant, justement »"],["V","Tu peux simplement voir cette activité avec différents points de vue, et résoudre les problèmes au fur et à mesure, sur demande.","You can simply look at this activity from different points of view, and solve problems as they come, on demand.","⚠ Le passage original est confus dans l'enregistrement ; texte reconstitué"],["V","Donc, mon ami, ne t'inquiète de rien. Et tu sais quoi ? Il y aura beaucoup de gens pour t'aider, non, mon ami ?","So, my friend, don't worry about anything. And you know what? There will be lots of people to help you, right, my friend?"],["V","Parce qu'il y aura beaucoup d'accompagnateurs là-bas. De plus, mon ami, si rien ne te plaît, tu repars simplement, et je suis sûr qu'après avoir essayé au moins une fois, tu te sentiras à l'aise et tu gagneras confiance en toi-même, mon ami.","Because there will be many chaperones there. Also, my friend, if nothing pleases you, you simply leave, and I'm sure that after trying at least once, you'll feel comfortable and gain confidence in yourself, my friend.","Infinitif passé : après avoir essayé"],["V","Donc, petit à petit, l'oiseau fait son nid. Il est important pour toi de commencer quelque part, non ?","So, little by little, the bird builds its nest. It's important for you to start somewhere, right?","Proverbe : petit à petit, l'oiseau fait son nid"],["V","Donc il est important que tu prennes une décision rapidement. Qu'est-ce que tu penses ?","So it's important that you make a decision quickly. What do you think?"],["E","Oui, mon ami, mais je ne parle pas les langues étrangères.","Yes, my friend, but I don't speak foreign languages."],["V","Pas du tout, ce n'est pas un problème, tu sais. Parce que tu sais quoi ? Cette activité, c'est un séjour linguistique. Donc tout le monde là-bas est très accueillant.","Not at all, it's not a problem, you know. Because you know what? This activity is a language stay. So everyone there is very welcoming."],["V","Et si tu as quelques préoccupations ou quelques problèmes, les personnes là-bas sont très accueillantes. Tout le monde respecte ton autonomie.","And if you have any concerns or problems, the people there are very welcoming. Everyone respects your autonomy.","si + présent → présent/impératif"],["V","De plus, mon ami, comme je l'ai déjà mentionné, il y aura une formation aussi, brève, avant que tu t'inscrives.","Also, my friend, as I already mentioned, there will be a short training too, before you sign up.","Subjonctif après « avant que »"],["V","Donc tu peux passer la voir avant d'être inscrit. Et j'ai déjà confirmé toutes les informations en visitant leur site web, et tu vas être surpris de savoir qu'ils ont d'excellents avis de centaines de personnes.","So you can drop by to see it before being registered. And I already confirmed all the information by visiting their website, and you'll be surprised to learn they have excellent reviews from hundreds of people.","Gérondif : en visitant ; preuve sociale"],["V","Donc c'est totalement légit, et l'association va t'aider à trouver ce qu'il te faut, mon ami.","So it's totally legit, and the association will help you find what you need, my friend."],["V","Donc, tu ne perds rien à tester, j'ai l'impression. Et je veux que tu saches que c'est une bonne façon de participer à cette activité et de sortir de ta routine, mon ami.","So you have nothing to lose by trying, I feel. And I want you to know that it's a good way to take part in this activity and break out of your routine, my friend.","Subjonctif : je veux que tu saches"],["V","Donc il faut que tu fasses ça, mon ami. Qu'est-ce que tu penses ?","So you have to do this, my friend. What do you think?"],["E","Oui, mon ami, mais je ne sais pas quelles activités je vais pouvoir leur proposer pendant le voyage.","Yes, my friend, but I don't know what activities I'll be able to suggest to them during the trip."],["V","D'accord, d'accord, mon ami, je vois pourquoi tu dis ça. Et c'est une réaction tout à fait compréhensible.","Okay, okay, my friend, I see why you say that. And it's a completely understandable reaction."],["V","Mais justement, mon ami, comme je l'ai déjà mentionné, tous les accompagnateurs là-bas vont t'aider à trouver ce qu'il te faut. Donc tu peux simplement discuter et consulter avec eux, et de cette manière tu vas avoir une expérience bien organisée.","But precisely, my friend, as I already mentioned, all the chaperones there will help you find what you need. So you can simply talk and consult with them, and this way you'll have a well-organized experience."],["V","Et cette activité va être très dynamique. De plus, mon ami, la meilleure chose, c'est que chaque journée va avoir une expérience totalement différente de l'autre.","And this activity is going to be very dynamic. Also, my friend, the best thing is that each day will have a totally different experience from the other."],["V","Donc ce n'est pas grave, j'ai l'impression que ça va être très facile à suivre pour toi. Si tu veux, je peux t'aider à trouver ce qu'il te faut aussi, et nous pouvons faire cette activité ensemble.","So it's no big deal, I feel it'll be very easy to follow for you. If you want, I can help you find what you need too, and we can do this activity together.","Proposer son aide : « Si tu veux, je peux… »"],["V","De plus, mon ami, tu as déjà tout ce qu'il faut pour réussir, parce que je te connais bien : tu es une personne très responsable et intéressante, et tu aimes faire quelque chose avec des gens.","Also, my friend, you already have everything it takes to succeed, because I know you well: you're a very responsible and interesting person, and you like doing something with people."],["V","Donc, mon ami, je t'assure qu'il n'y a aucun risque. Pour que tu réussisses, il faut travailler, non ?","So, my friend, I assure you there's no risk at all. For you to succeed, you have to work, right?","Subjonctif après « pour que »"],["V","Qu'est-ce que tu en penses ?","What do you think?"],["E","Oui, mais je ne profiterai pas du tout de ce jour moi-même.","Yes, but I won't enjoy this day myself at all."],["V","Mon ami, c'est totalement logique. Je sais que tu as peur que ça va être un peu fatigant et qu'il n'y aura aucune nouvelle connaissance, mais je t'assure, mon ami, que tu vas avoir une expérience très enrichissante et valorisante et acquérir de nouvelles compétences.","My friend, that's totally logical. I know you're afraid it'll be a bit tiring and that there won't be any new knowledge, but I assure you, my friend, that you'll have a very enriching and rewarding experience and acquire new skills.","⚠ « peur que ça va être » → « peur que ce soit » (subjonctif)"],["V","Parce que, tu sais quoi ? Comme j'ai déjà mentionné, tu peux découvrir et visiter beaucoup de nouveaux endroits et de nouveaux lieux, avec différentes origines, histoires, patrimoines. Donc ça va être très, très amusant et hyper pratique, mon ami.","Because, you know what? As I already mentioned, you can discover and visit many new places and sites, with different origins, stories and heritage. So it's going to be very, very fun and extremely practical, my friend."],["V","Tu sais quoi ? J'ai lu sur le site web officiel de RBC Bank et j'ai trouvé que beaucoup de recruteurs apprécient ce type d'expérience, mon ami.","You know what? I read on the official RBC Bank website and found that many recruiters value this type of experience, my friend.","Argument d'autorité : source officielle"],["V","Donc tu peux améliorer tes chances d'obtenir un emploi avec un salaire très attractif, non, mon ami ? Tu peux simplement ajouter ce type d'expérience à ton CV.","So you can improve your chances of getting a job with a very attractive salary, right, my friend? You can simply add this type of experience to your résumé.","Réponse directe à l'objection sur la rémunération"],["V","Donc, mon ami, dépenser un peu maintenant pour gagner beaucoup après, c'est totalement logique, non ? De plus, mon ami, tu peux sensibiliser des gens en faisant quelque chose de très écologique aussi.","So, my friend, spending a little now to gain a lot later is totally logical, right? Also, my friend, you can raise people's awareness by doing something very eco-friendly too."],["V","Donc, mon ami, soyons le changement que nous voulons voir dans le monde, c'est totalement logique pour moi aussi.","So, my friend, let's be the change we want to see in the world, that's totally logical to me too.","Citation d'appel à l'action"],["V","Tu peux avoir une expérience très géniale et très sympa. Je t'assure qu'il n'y a aucun risque. Il vaut mieux que tu participes dès maintenant. Qu'est-ce que tu penses ?","You can have a really great and very nice experience. I assure you there's no risk. It's better that you take part right now. What do you think?","Subjonctif : il vaut mieux que tu participes"],["E","Je ne pense pas que ce soit bien rémunéré.","I don't think it's well paid."],["V","D'accord, d'accord, mon ami. Je vois pourquoi tu dis ça. Parce que tu as cette peur concernant la rémunération. Cependant, mon ami, ce n'est pas la mer à boire. Il y a du bon et du mauvais aussi. Ça dépend totalement de comment tu vois cette activité, mon ami.","Okay, okay, my friend. I see why you say that. Because you have this fear about the pay. However, my friend, it's not that big a deal. There's good and bad too. It depends entirely on how you see this activity, my friend."],["V","Je te recommande que tu voies cette activité avec beaucoup d'avantages, parce que visiter beaucoup d'endroits, des trajets, des séjours linguistiques, ça améliorerait aussi ta compétence linguistique, et aussi rencontrer beaucoup de gens et échanger tes idées avec eux.","I recommend that you see this activity as having lots of advantages, because visiting many places, trips, language stays would also improve your language skills, and also meeting lots of people and exchanging your ideas with them.","Conditionnel : ça améliorerait"],["V","Donc, mon ami, il y aura beaucoup d'avantages. Comparé à la rémunération, le principal but ici doit être d'acquérir de nouvelles compétences et de nouvelles connaissances, non ?","So, my friend, there will be lots of advantages. Compared to the pay, the main goal here should be to acquire new skills and new knowledge, right?","Comparaison : comparé à"],["V","Donc, mon ami, il faut accepter certains compromis, voyons, mais je t'assure que tu vas avoir une bonne expérience, mon ami.","So, my friend, you have to accept certain compromises, come on, but I assure you you'll have a good experience, my friend."],["V","Donc il faut que tu fasses ça, non ? Qu'est-ce que tu penses ?","So you have to do this, right? What do you think?"],["E","D'accord, tu as raison. Tu m'as presque convaincu. Je vais y réfléchir.","Okay, you're right. You almost convinced me. I'll think about it."],["V","Oh, mon ami, c'est parfait. En fin de compte, c'est ta décision si tu veux le faire ou pas. Mais franchement, si j'étais à ta place, j'aimerais avoir une expérience de ce genre dont je me souviendrai pour le reste de ma vie.","Oh, my friend, that's perfect. In the end, it's your decision whether you want to do it or not. But frankly, if I were in your place, I'd like to have an experience of this kind that I would remember for the rest of my life.","Hypothèse : si + imparfait → conditionnel ; pronom relatif « dont »"],["V","À la prochaine, mon ami. Passe une bonne journée.","See you next time, my friend. Have a good day."]]}

const root=document.getElementById('root');
const h=(tag,a={},...kids)=>{const e=document.createElement(tag);for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const $=s=>root.querySelector(s);
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
const fmt=s=>{s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('tef-oral',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putAudio(id,blob){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('audio','readwrite');tx.objectStore('audio').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getAudio(id){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('audio').objectStore('audio').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function delAudio(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('audio','readwrite');tx.objectStore('audio').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function audioIds(){
  const work=(async()=>{try{const db=await idb();return await new Promise(res=>{const r=db.transaction('audio').objectStore('audio').getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}catch(e){return[]}})();
  return Promise.race([work,new Promise(res=>setTimeout(()=>res([]),1200))]);
}

   Add custom exercise

function parseScript(txt){
  const out=[];
  for(const raw of txt.split('\n')){
    const m=raw.trim().match(/^([EV]):\s*(.*)$/i);if(!m)continue;
    const p=m[2].split('|');const fr=p[0].trim(),en=(p[1]||'').trim();
    if(fr)out.push({s:m[1].toUpperCase()==='E'?'ex':'ca',fr,en,note:''});
  }
  return out;
}
function showAdd(){
  stopAll();root.innerHTML='';
  const title=h('input',{type:'text',placeholder:'Ex. Section B — Convaincre : télétravail'});
  const sec=h('select',{},h('option',{value:'A'},'Section A — Obtenir des informations'),h('option',{value:'B'},'Section B — Convaincre'));
  const task=h('textarea',{style:'min-height:80px',placeholder:'La consigne / la situation (facultatif)'});
  const txt=h('textarea',{placeholder:'E: Bonjour, que puis-je faire pour vous? | Hello, how can I help you?\nV: Bonjour, je vous appelle au sujet de… | Hello, I\'m calling about…\nE: …'});
  root.append(
    h('div',{class:'top'},h('button',{class:'back',onclick:showLibrary},'‹'),h('div',{class:'ttl'},'Nouvel exercice')),
    h('p',{class:'sub'},'Une réplique par ligne. Commence par E: (examinateur) ou V: (vous), puis le français, une barre verticale |, puis l\'anglais. Tu pourras ensuite joindre ton fichier audio.'),
    h('label',{},'Titre'),title,h('label',{},'Section'),sec,h('label',{},'Consigne'),task,h('label',{},'Script'),txt,
    h('div',{style:'height:14px'}),
    h('button',{class:'btn pri',onclick:()=>{
      const lines=parseScript(txt.value);
      if(!title.value.trim()||lines.length<2){toast('Ajoute un titre et au moins 2 répliques');return}
      const list=ls.get('tef.custom',[]);
      const id='c-'+Date.now();
      list.push({id,section:sec.value,title:title.value.trim(),kind:sec.value==='A'?'Section A — Obtenir des informations':'Section B — Convaincre',task:task.value.trim(),phrases:[],lines,est:Math.max(2,Math.round(lines.reduce((a,l)=>a+l.fr.length,0)/900))});
      ls.set('tef.custom',list);toast('Exercice ajouté');openTrack(id);
    }},'Enregistrer')
  );
}
