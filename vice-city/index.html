<title>Vice City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL city; HUD frames the edges. Top resource bar, district roster left, intel panel right, camera + time dock bottom, minimap bottom-left, radio ticker along the floor. */
:root{
  --night:#0a0620; --panel:rgba(18,9,48,.68); --panel-hi:rgba(34,14,74,.82);
  --line:rgba(255,110,200,.26); --line-hi:rgba(255,110,200,.6);
  --pink:#ff3fa4; --cyan:#2ff3ff; --amber:#ffb347; --mint:#7dffd2; --violet:#9b5cff;
  --ink:#fbeaff; --dim:#a79bcb; --bad:#ff4d6d;
  --hud:'Chakra Petch',system-ui,sans-serif; --mono:'Share Tech Mono',ui-monospace,monospace; --script:'Yellowtail','Brush Script MT',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--night);color:var(--ink);font:500 13px/1.35 var(--hud);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:minmax(0,260px) 1fr minmax(0,320px);grid-template-rows:auto 1fr auto auto;gap:12px;
  grid-template-areas:"top top top" "left . right" "mm dock right" "tick tick tick"}
#hud>*{pointer-events:auto;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 10px 40px rgba(10,0,40,.55),inset 0 0 28px rgba(255,63,164,.06);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
h2{margin:0 0 8px;font:700 11px/1 var(--hud);letter-spacing:.22em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:22px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.logo{font:400 38px/1 var(--script);color:#fff;text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 26px var(--pink),0 0 48px #ff0f8a;letter-spacing:.01em;padding-right:6px}
.sub{font:600 9px/1 var(--hud);letter-spacing:.42em;color:var(--cyan);margin-top:4px;text-shadow:0 0 8px rgba(47,243,255,.7)}
.clock{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono)}
.clock b{font:400 24px/1 var(--mono);color:var(--amber);text-shadow:0 0 12px rgba(255,179,71,.6)}
.clock span{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.res{display:flex;gap:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:3px;min-width:78px}
.stat label{font:600 9px/1 var(--hud);letter-spacing:.24em;color:var(--dim)}
.stat b{font:400 20px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat b.up{color:var(--mint)} .stat b.down{color:var(--bad)}
.stars{display:flex;gap:3px}.stars i{width:12px;height:12px;background:rgba(255,255,255,.14);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.stars i.on{background:var(--bad);filter:drop-shadow(0 0 4px var(--bad))}
.bar{height:4px;width:96px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.bar u{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--amber),var(--bad));box-shadow:0 0 10px var(--bad);transition:width .4s}
/* roster */
#roster{grid-area:left;align-self:start;padding:14px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
#dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#dlist li{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-left:0;background:rgba(255,255,255,.035);cursor:pointer;transition:background .2s,border-color .2s}
#dlist li:hover{background:rgba(255,63,164,.12)}
#dlist li.sel{background:var(--panel-hi);border-color:var(--line-hi);box-shadow:0 0 18px rgba(255,63,164,.25)}
#dlist li:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.dot{width:8px;height:30px;background:var(--c);box-shadow:0 0 10px var(--c)}
.dn{font-weight:600;font-size:13px;display:block}.dm{font:400 10px/1.2 var(--mono);color:var(--dim)}
.dv{font:400 13px var(--mono);text-align:right;color:var(--mint);font-variant-numeric:tabular-nums}
.fac{display:flex;flex-direction:column;gap:7px}
.fac div{display:grid;grid-template-columns:1fr auto;font-size:11px;gap:3px 8px}
.fac .tr{grid-column:1/3;height:5px;background:rgba(255,255,255,.1)}.fac .tr u{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .5s}
.obj{font-size:12px;color:var(--ink)}.obj .bar{width:100%;margin-top:6px;height:5px}.obj .bar u{background:linear-gradient(90deg,var(--violet),var(--pink),var(--amber))}
/* intel */
#intel{grid-area:right;align-self:start;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h3{margin:0;font:400 32px/1 var(--script);color:#fff;text-shadow:0 0 10px var(--pink),0 0 24px var(--pink)}
.tag{font:400 11px/1.3 var(--mono);color:var(--dim);margin-top:4px}
.pill{font:700 10px/1 var(--hud);letter-spacing:.14em;padding:5px 8px;border:1px solid var(--c);color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{padding:8px 10px;background:rgba(255,255,255,.04);border-left:2px solid var(--line-hi)}
.kv label{display:block;font:600 9px/1 var(--hud);letter-spacing:.2em;color:var(--dim);margin-bottom:5px}
.kv b{font:400 18px/1 var(--mono);font-variant-numeric:tabular-nums}
.kv .bar{width:100%;margin-top:6px}
canvas#spark{width:100%;height:72px;display:block;background:linear-gradient(#ffffff08,transparent)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{position:relative;text-align:left;padding:9px 10px;border:1px solid var(--line-hi);background:linear-gradient(135deg,rgba(255,63,164,.2),rgba(155,92,255,.12));cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:transform .12s,box-shadow .2s,background .2s}
.btn:hover:not(:disabled){box-shadow:0 0 18px rgba(255,63,164,.5);background:linear-gradient(135deg,rgba(255,63,164,.38),rgba(155,92,255,.22))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn b{font:700 12px/1 var(--hud);letter-spacing:.08em}.btn span{font:400 11px/1.2 var(--mono);color:var(--amber)}
.btn small{font:400 10px/1.2 var(--mono);color:var(--dim)}
.hint{font:400 10px/1.4 var(--mono);color:var(--dim);margin:0}
/* dock */
#dock{grid-area:dock;justify-self:center;align-self:end;display:flex;gap:10px 18px;align-items:center;padding:10px 16px;flex-wrap:wrap;justify-content:center;max-width:100%}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{padding:7px 11px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font:600 11px/1 var(--hud);letter-spacing:.1em;text-transform:uppercase;transition:all .2s}
.chip:hover{border-color:var(--line-hi);background:rgba(255,63,164,.14)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#1a0630;box-shadow:0 0 16px rgba(255,63,164,.7)}
#tod{-webkit-appearance:none;appearance:none;width:200px;height:4px;background:linear-gradient(90deg,#1a0b3d,#ff7ac0 28%,#7cc4f0 50%,#ffd08a 70%,#ff2f8f 80%,#1a0b3d);outline:none}
#tod::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:#fff;box-shadow:0 0 12px #fff,0 0 20px var(--pink);cursor:pointer}
#tod::-moz-range-thumb{width:14px;height:22px;border:0;border-radius:0;background:#fff;box-shadow:0 0 12px #fff,0 0 20px var(--pink);cursor:pointer}
/* minimap */
#mmw{grid-area:mm;align-self:end;padding:8px;width:196px}
#mm{width:180px;height:156px;display:block;cursor:crosshair}
/* ticker */
#tick{grid-area:tick;display:flex;align-items:center;gap:12px;padding:7px 14px;overflow:hidden}
#tick b{font:700 10px/1 var(--hud);letter-spacing:.2em;color:#1a0630;background:var(--cyan);padding:4px 7px;white-space:nowrap}
#tickt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 12px var(--mono);color:var(--ink);min-width:0}
#radio{margin-left:auto}
/* labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;will-change:transform;transition:opacity .25s}
.lab span{display:block;font:400 22px/1 var(--script);color:#fff;text-shadow:0 0 4px #fff,0 0 12px var(--c),0 0 24px var(--c)}
.lab i{display:block;font:600 9px/1 var(--hud);font-style:normal;letter-spacing:.3em;color:var(--c);margin-top:3px;text-shadow:0 0 8px var(--c)}
.lab.sel span{font-size:28px}
/* toast + boot */
#toast{position:fixed;left:50%;top:116px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;padding:12px 22px;background:var(--panel-hi);border:1px solid var(--pink);box-shadow:0 0 30px rgba(255,63,164,.55);font:600 13px var(--hud);letter-spacing:.08em;transition:all .35s;z-index:20;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:14px;text-align:center;background:radial-gradient(120% 90% at 50% 100%,#ff3fa4 -20%,#3a0f6e 35%,#0a0620 75%);transition:opacity .9s .1s}
#boot.gone{opacity:0;pointer-events:none}
#boot .logo{font-size:96px}#boot p{margin:0;font:400 12px var(--mono);letter-spacing:.3em;color:var(--cyan)}
#err{position:fixed;inset:auto 16px 16px;z-index:60;padding:12px;background:#3a0010;border:1px solid var(--bad);display:none;font:12px var(--mono)}
.ctl{display:flex;height:10px;gap:2px;background:rgba(255,255,255,.05)}.ctl u{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .5s}.leg{display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--dim);margin-top:7px;flex-wrap:wrap;gap:4px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1100px){#hud{grid-template-columns:minmax(0,220px) 1fr minmax(0,290px)}.res{gap:14px}}
@media (max-width:860px){
  #hud{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto auto;grid-template-areas:"top" "." "right" "dock" "tick";gap:8px}
  #roster,#mmw{display:none}
  #top{gap:10px;padding:8px 12px}.logo{font-size:30px}.res{gap:12px;width:100%}.stat{min-width:60px}.stat b{font-size:16px}.clock{position:absolute;right:16px;top:12px}
  #intel{align-self:end;max-height:40vh;padding:12px}.dh h3{font-size:26px}
  #tod{width:140px}#dock{padding:8px 10px;gap:8px}.lab span{font-size:17px}
  #tick b{display:none}#toast{top:150px}
  .res .stat:nth-child(3){display:none}.stat b{font-size:15px}#intel{max-height:31vh}
  #dock .grp:nth-child(3),#dock [data-t],#cams [data-cam]:nth-child(n+5){display:none}#dock .chip{padding:6px 9px}
}
</style>

<canvas id="gl" tabindex="0" aria-label="Interactive 3D map of Vice City"></canvas>
<div id="labels"></div>
<div id="hud">
  <header id="top" class="panel">
    <div class="brand"><span class="logo">Vice City</span><span class="sub">TERRITORY COMMAND · 1986</span></div>
    <div class="res">
      <div class="stat"><label>CASH</label><b id="cash">$0</b></div>
      <div class="stat"><label>INCOME / MIN</label><b id="inc">$0</b></div>
      <div class="stat"><label>INFLUENCE</label><b id="infl">0</b></div>
      <div class="stat"><label>HEAT</label><span class="stars" id="stars"></span><div class="bar"><u id="heatbar"></u></div></div>
      <div class="stat"><label>TURF</label><b id="turf">0 / 6</b></div>
    </div>
    <div class="clock"><b id="clk">18:00</b><span id="phase">GOLDEN HOUR</span></div>
  </header>

  <aside id="roster" class="panel">

    <section class="obj"><h2>Objective</h2><div id="objt">Hold 4 of 6 districts</div><div class="bar"><u id="objb"></u></div></section>
  </aside>

  <aside id="intel" class="panel" aria-live="polite"></aside>

  <section id="mmw" class="panel"><canvas id="mm" width="360" height="312" aria-label="Minimap"></canvas></section>

  <nav id="dock" class="panel" aria-label="Camera and time controls">
    <div class="grp" id="cams">
      <button class="chip on" data-cam="command" title="Key 1">Command</button>
      <button class="chip" data-cam="boulevard" title="Key 2">Boulevard</button>
      <button class="chip" data-cam="skyline" title="Key 3">Skyline</button>
      <button class="chip" data-cam="overhead" title="Key 4">Overhead</button>
      <button class="chip" data-cam="beach" title="Key 5">Beach</button>
      <button class="chip" data-cam="harbour" title="Key 6">Harbour</button>
      <button class="chip" data-cam="canyon" title="Key 7">Canyon</button>
      <button class="chip" data-cam="airport" title="Key 8">Airport</button>
      <button class="chip" data-cam="chase" title="Key 9">Chase</button>
    </div>
    <div class="grp">
      <button class="chip" data-t="6.6" title="Dawn">Dawn</button>
      <button class="chip" data-t="13" title="Day">Day</button>
      <button class="chip" data-t="17.3" title="Golden hour">Golden</button>
      <button class="chip" data-t="19.2" title="Neon night">Neon</button>
      <input id="tod" type="range" min="0" max="24" step="0.01" aria-label="Time of day">
      <button class="chip on" id="play" title="Run day cycle">Cycle</button>
    </div>
    <div class="grp">
      <button class="chip on" id="tTerr">Turf</button>
      <button class="chip on" id="tLab">Labels</button>
      <button class="chip on" id="tTraf">Traffic</button>
      <button class="chip" id="tOrb">Orbit</button>
    </div>
  </nav>

  <footer id="tick" class="panel"><b>NEON FM 104.2</b><span id="tickt"></span><button class="chip" id="radio">Radio</button></footer>
</div>
<div id="toast" role="status"></div>
<div id="boot"><span class="logo">Vice City</span><p>BUILDING THE SKYLINE…</p></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

window.__vc = 'loading';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const V3 = THREE.Vector3, Col = THREE.Color;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(1986);

const pick = a => a[Math.floor(rnd() * a.length)];
const ri = (a, b) => Math.floor(rr(a, b + 1));

/* ---------- infinite city grid + coast ---------- */
const P = 34, B = 24, R = 10, CHUNK_BLOCKS = 3, CSZ = P * CHUNK_BLOCKS;
const bx = i => (i + .5) * P, bz = j => (j + .5) * P;
const coastX = z => 140 + 46 * Math.sin(z * .0065 + .7) + 24 * Math.sin(z * .019 + 2.1) + 10 * Math.sin(z * .05);
const BAY = {x: -150, z: -170};
function wsd(x, z) { const d1 = x - coastX(z), r = Math.hypot(x - BAY.x, z - BAY.z), br = 70 + 7 * Math.sin(x * .05) + 6 * Math.sin(z * .07); return Math.max(d1, br - r); }
const COAST_GLSL = `
float coastX(float z){return 140.+46.*sin(z*.0065+.7)+24.*sin(z*.019+2.1)+10.*sin(z*.05);}
float wsd(vec2 p){float d1=p.x-coastX(p.y);float r=length(p-vec2(-150.,-170.));float br=70.+7.*sin(p.x*.05)+6.*sin(p.y*.07);return max(d1,br-r);}`;
const hash2 = (i, j) => { let h = (i * 374761393 + j * 668265263) ^ 0x5bd1e995; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };

const fbm2 = (x, z) => vnoise(x, z) * .55 + vnoise(x * 2.1 + 5, z * 2.1 + 9) * .3 + vnoise(x * 4.3 + 11, z * 4.3 + 3) * .15;

/* ---------- renderer / scene ---------- */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: false, powerPreference: 'high-performance'});
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xff88aa, 0.002);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 3200);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {enableDamping: true, dampingFactor: 0.07, maxPolarAngle: Math.PI * 0.492, minDistance: 18, maxDistance: 520, screenSpacePanning: false, zoomToCursor: true, rotateSpeed: 0.6, autoRotateSpeed: 0.55});

/* ---------- sky + water shaders ---------- */
const U = {
  uZen: {value: new Col()}, uMid: {value: new Col()}, uHor: {value: new Col()}, uSunCol: {value: new Col()},
  uSunDir: {value: new V3(1, 0.1, 0.2)}, uMoonDir: {value: new V3(-1, 0.5, 0)}, uNight: {value: 0}, uTime: {value: 0},

const SKY_GLSL = `
uniform vec3 uZen,uMid,uHor,uSunDir,uSunCol,uMoonDir; uniform float uNight,uTime;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(7.1,3.7);a*=.5;}return s;}
vec3 skyBase(vec3 d){
  float t=pow(max(d.y,0.0),0.5);
  vec3 c=mix(uHor,uMid,smoothstep(0.0,0.38,t));
  c=mix(c,uZen,smoothstep(0.3,1.0,t));
  c=mix(c,uHor*0.55,smoothstep(0.0,-0.15,d.y));
  float sd=max(dot(d,uSunDir),0.0); float up=smoothstep(-0.3,0.08,uSunDir.y);
  c+=uSunCol*(pow(sd,6.0)*0.28+pow(sd,48.0)*0.55)*up;
  float md=max(dot(d,uMoonDir),0.0); c+=vec3(0.45,0.5,1.0)*pow(md,40.0)*0.25*uNight;
  return c;

mm.addEventListener('pointerdown', e => { const r = mm.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * mm.width, pz = (e.clientY - r.top) / r.height * mm.height; const x = (px - mm.width / 2) / MSC + controls.target.x, z = (pz - mm.height / 2) / MSC + controls.target.z; const off = camera.position.clone().sub(controls.target); chase.on = false; setCamChip(''); flyTo(new V3(x, controls.target.y, z).add(off).toArray(), [x, controls.target.y, z], 1.4); });

/* ---------- dock controls ---------- */
const clockEl = $('#clk'), phaseEl = $('#phase'), todEl = $('#tod'); let playing = true, speed = .045, lastEnv = -9, sliderDrag = false;
todEl.value = state.hour; todEl.addEventListener('input', () => { state.hour = +todEl.value; sliderDrag = true; applyTime(state.hour); updateEnv(); });
todEl.addEventListener('change', () => sliderDrag = false);
$$('[data-t]').forEach(b => b.addEventListener('click', () => { const h = +b.dataset.t; const from = state.hour, k = {v: 0}; const iv = setInterval(() => { k.v += .06; const e = k.v >= 1 ? 1 : k.v * k.v * (3 - 2 * k.v); const d = ((h - from + 36) % 24) - 12; state.hour = (from + d * e + 24) % 24; todEl.value = state.hour; applyTime(state.hour); if (k.v >= 1) { clearInterval(iv); updateEnv(); } }, 30); }));
$('#play').addEventListener('click', e => { playing = !playing; e.currentTarget.classList.toggle('on', playing); });

addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const k = e.key; if (/^[1-9]$/.test(k)) goCam(CAM_ORDER[+k - 1]); else if (k === ' ') { e.preventDefault(); $('#play').click(); } else if (k === 't' || k === 'T') $('#tTerr').click(); else if (k === 'o' || k === 'O') $('#tOrb').click(); });
/* ---------- synth radio ---------- */
let ac = null, master, radioOn = false, nextT = 0, stepN = 0, rTimer = null, nbuf = null;
const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], mtof = m => 440 * 2 ** ((m - 69) / 12), SPB = 60 / 104 / 4;
function tone(type, f, t, dur, vol, lp, det = 0) { const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter(); o.type = type; o.frequency.value = f; o.detune.value = det; fl.type = 'lowpass'; fl.frequency.value = lp; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05); }

    if (s % 4 === 0) kick(t); if (s % 8 === 4) { nz(t, .16, .22, 1500); tone('triangle', 190, t, .1, .12, 2000); } if (s % 2 === 1) nz(t, .04, .06, 7000);

    tone('square', mtof(ch[s % 3] + 12 + ((s >> 2) % 2) * 12), t, .13, .03, 2600);
    if (s % 16 === 0) ch.forEach((n, i) => { tone('sawtooth', mtof(n), t, 16 * SPB, .028, 1000, -8); tone('sawtooth', mtof(n), t, 16 * SPB, .028, 1000, 8); });

}

});


/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const HF = new URLSearchParams(location.search).has('hf'); const terrC = new Col(), snap = (v, s) => Math.round(v / s) * s, tmpV = new V3(), tmpW = new V3();
let last = performance.now(), simT = 0, slow = 0, quality = 0, hudAcc = 0;
function frame(now) {

  const dt = Math.min(.1, (now - last) / 1000); last = now; simT += dt; idle += dt;
  U.uTime.value = simT; grade.uniforms.uTime.value = simT;

/* ---------- boot ---------- */
