<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wealth City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout concept: a full-bleed night city is the page. Glass HUD floats on top:
   wealth readout top-left, time-travel dock bottom, a four-tab control panel on the right (bottom sheet on phones).
   Single committed look: deep indigo night, gold for growth, sky blue for money put in. */
:root{
  --night:#060a1a; --night-2:#0b1330;
  --glass:rgba(9,15,38,.78); --glass-2:rgba(20,30,68,.62);
  --line:rgba(150,172,255,.17); --line-2:rgba(150,172,255,.3);
  --ink:#eef1ff; --dim:#a0abd9; --faint:#6f7bb0;
  --gold:#f6bf55; --gold-hi:#ffe3a6; --sky:#47c6ff; --mint:#44dfa1; --coral:#ff6b7d; --wa:#2bd46f;
  --f-display:"Bricolage Grotesque","Noto Sans Devanagari",system-ui,sans-serif;
  --f-body:"Hanken Grotesk","Noto Sans Devanagari",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gutR:max(16px, env(safe-area-inset-right, 0px));
  --panel-w:396px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,#14214d 0%,var(--night) 70%)}
#stage{position:absolute;inset:0;touch-action:none}
#gl{display:block;width:100%;height:100%;cursor:grab;outline:none}
#gl:active{cursor:grabbing}

/* header */
#top{position:absolute;top:12px;left:var(--gut);right:var(--gutR);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 10px rgba(246,191,85,.45))}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.brand-t span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;gap:8px;flex:none}
.pill{height:34px;min-width:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
.pill svg{width:16px;height:16px}
.lang i{font-style:normal;color:var(--faint)}
.lang span{color:var(--faint)}
.lang span.on{color:var(--gold-hi)}

/* wealth readout */
#stats{position:absolute;top:62px;left:var(--gut);z-index:4;display:flex;flex-direction:column;gap:8px;max-width:min(430px,calc(100% - 32px));pointer-events:none}
.s-main{display:flex;flex-direction:column}
.k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
.s-main strong{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff2cf,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(246,191,85,.25)}
.s-sub{font-size:12px;color:var(--dim);margin-top:4px;font-family:var(--f-mono)}
.s-row{display:flex;flex-wrap:wrap;gap:6px}
.s-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:10px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.s-chip .k{font-size:10px}
.s-chip b{font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.sky{background:var(--sky);box-shadow:0 0 8px var(--sky)}
.dot.gold{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#banner{pointer-events:auto;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;max-width:360px;animation:rise .35s ease}
#banner.bad{border-color:rgba(255,107,125,.55)}
#banner.good{border-color:rgba(68,223,161,.55)}
#banner b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);z-index:30;padding:10px 16px;border-radius:99px;background:linear-gradient(90deg,#f6bf55,#ffdf9a);color:#1b1304;font-weight:700;font-size:13px;box-shadow:0 10px 40px rgba(246,191,85,.35);transition:transform .45s cubic-bezier(.2,.9,.2,1);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,56px)}

/* dock */
#dock{z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.round{width:42px;height:42px;border-radius:50%;border:0;flex:none;background:linear-gradient(180deg,#ffe3a6,#f6bf55);color:#1b1304;display:grid;place-items:center;box-shadow:0 6px 22px rgba(246,191,85,.35)}
.round svg{width:18px;height:18px}
.speed{height:30px;min-width:40px;padding:0 8px;border-radius:8px;border:1px solid var(--line-2);background:transparent;font-family:var(--f-mono);font-size:12px;flex:none}
.scrub{position:relative;flex:1;min-width:0;padding-bottom:26px;padding-top:10px}
#marks{position:absolute;left:11px;right:11px;top:24px;height:30px;pointer-events:none}
.mk{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--dim);white-space:nowrap;line-height:1.1}
.mk::before{content:"";width:2px;height:7px;background:var(--gold);border-radius:2px;margin-bottom:2px}
.mk.lo{margin-top:11px}
.mk.done{color:var(--gold-hi);font-weight:700}
.dock-y{flex:none;text-align:right;min-width:54px;font-family:var(--f-mono);font-size:12px;color:var(--dim);line-height:1.2}
.dock-y b{display:block;color:var(--ink);font-size:16px;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:0;border-radius:99px;background:linear-gradient(90deg,var(--gold) var(--p,40%),rgba(255,255,255,.15) var(--p,40%));cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:6px}
input[type=range]::-moz-range-track{background:transparent;height:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--gold);border:2px solid #1b1304;box-shadow:0 0 0 4px rgba(246,191,85,.22),0 0 18px rgba(246,191,85,.65)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid #1b1304;box-shadow:0 0 0 4px rgba(246,191,85,.22),0 0 18px rgba(246,191,85,.65)}

/* panel */
#panel{z-index:6;display:flex;flex-direction:column;min-height:0;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 80px rgba(0,0,0,.45);overflow:hidden}
.tabs{display:flex;align-items:stretch;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;min-width:0;border:0;background:transparent;padding:10px 4px 11px;font-weight:600;font-size:13px;color:var(--dim);border-radius:10px 10px 0 0;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected=true]{color:var(--gold-hi)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
#btnSheet{display:none;flex:none;width:38px;border:0;background:transparent;color:var(--dim)}
#btnSheet svg{width:18px;height:18px;transition:transform .2s}
#panel.collapsed #btnSheet svg{transform:rotate(180deg)}
#panel.collapsed .tab-body,#panel.collapsed .disc{display:none}
.tab-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 8px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.tab-body>section{display:flex;flex-direction:column;gap:14px}
.lead{margin:0;color:var(--dim);font-size:13px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:12px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.big{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--ink);letter-spacing:-.01em;text-transform:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line-2);background:transparent;font-size:12.5px;font-weight:600;color:var(--dim)}
.chip[aria-pressed=true]{background:rgba(246,191,85,.16);border-color:var(--gold);color:var(--gold-hi)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.seg button b{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--ink)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,rgba(246,191,85,.28),rgba(246,191,85,.12));color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold)}
.result{padding:12px;border-radius:14px;background:linear-gradient(180deg,rgba(71,198,255,.08),rgba(246,191,85,.08));border:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.result h4{margin:0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:600}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.r3>div{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:10px;background:rgba(0,0,0,.25);min-width:0}
.r3 span{font-size:11px;color:var(--faint)}
.r3 b{font-family:var(--f-mono);font-weight:500;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.r3 .mid b{color:var(--gold-hi)}
.r-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.r-line b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.score{display:flex;align-items:center;gap:10px}
.score .meter{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.score .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:99px;transition:width .5s}
.score b{font-family:var(--f-display);font-size:20px;min-width:40px;text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text]{height:40px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.28);color:var(--ink);padding:0 12px;font:inherit;font-size:15px}
.cta{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14px;text-decoration:none;text-align:center;line-height:1.2}
.btn svg{width:18px;height:18px;flex:none}
.btn.wa{background:var(--wa);color:#04170b;box-shadow:0 8px 26px rgba(43,212,111,.28)}
.btn.gold{background:linear-gradient(180deg,#ffe3a6,#f6bf55);color:#1b1304;box-shadow:0 8px 26px rgba(246,191,85,.3)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.phone{font-family:var(--f-mono);font-size:12px;color:var(--dim);text-align:center;user-select:all}
.miles{display:flex;flex-wrap:wrap;gap:6px}
.ms{padding:5px 10px;border-radius:99px;font-size:12px;border:1px dashed var(--line-2);color:var(--faint)}
.ms.lit{border-style:solid;border-color:var(--gold);color:var(--gold-hi);background:rgba(246,191,85,.12);box-shadow:0 0 14px rgba(246,191,85,.2)}
.h5{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700}
.board{border:1px solid var(--line-2);border-radius:12px;background:#04071a;overflow:hidden;font-family:var(--f-mono);font-size:12px}
.board .row{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.board .row:first-child{border-top:0}
.board .d{color:var(--gold-hi)}
.board .ok{color:var(--mint);display:inline-flex;align-items:center;gap:5px;font-size:11px}
.board .ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

/* goals */
.goal{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,opacity .2s}
.goal:hover{border-color:var(--line-2)}
.goal.off{opacity:.5}
.goal h5{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700}
.goal .sub{grid-column:1/-1;font-size:12px;color:var(--dim)}
.goal .bar{grid-column:1/-1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.goal .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--gold));width:0;transition:width .5s}
.goal .bar i.full{background:linear-gradient(90deg,var(--mint),#a6ffd9)}
.goal .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-family:var(--f-mono);color:var(--dim)}
.goal .meta b{color:var(--ink);font-weight:500}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.14);transition:background .2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--gold)}
.sw input:checked+i::after{transform:translateX(18px);background:#1b1304}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}

/* events */
.evs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line);min-width:0}
.ev b{font-family:var(--f-display);font-size:14.5px;line-height:1.15}
.ev span{font-size:11.5px;color:var(--dim)}
.ev[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ev.crash b{color:var(--coral)} .ev.storm b{color:#9db6ff} .ev.bull b{color:var(--mint)} .ev.wait b{color:var(--gold-hi)}
.evbody{padding:12px;border-radius:14px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:10px}
.evbody p{margin:0}
.infl{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:12px}
.infl div{display:flex;justify-content:space-between;gap:8px}
.infl b{color:var(--coral);font-weight:500}

/* compare */
.race{display:flex;flex-direction:column;gap:12px}
.rb .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px}
.rb .t b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.rb .tr{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.rb .tr i{display:block;height:100%;width:0;border-radius:7px;transition:width .35s}
.rb.sip i{background:linear-gradient(90deg,var(--gold),#ffe3a6)}
.rb.fd i{background:var(--sky)} .rb.sav i{background:#7d8ccc} .rb.cash i{background:var(--coral)}
.note{font-size:11.5px;color:var(--faint);margin:0}
.waitcard{padding:12px;border-radius:14px;border:1px solid var(--line-2);background:rgba(246,191,85,.07);display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.waitcard b{color:var(--gold-hi)}
.disc{flex:none;padding:8px 16px 10px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.35;color:var(--faint)}
.disc b{color:var(--dim);font-weight:600}

/* intro + modal */
#intro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px var(--gutR) 16px var(--gut);background:radial-gradient(90% 70% at 50% 50%,rgba(6,10,26,.45),rgba(6,10,26,.82));overflow-y:auto;transition:opacity .7s,visibility .7s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.i-card{width:min(580px,100%);padding:clamp(18px,4vw,30px);border-radius:24px;background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:18px}
.i-eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.i-card h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.i-card .lead{font-size:14px}
.i-adv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);padding-top:4px;border-top:1px solid var(--line);padding-top:12px}
#modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:16px var(--gutR) 16px var(--gut);background:rgba(3,6,18,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto}
.m-card{position:relative;width:min(440px,100%);padding:18px;border-radius:20px;background:var(--night-2);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:12px}
.m-card h3{margin:0;font-family:var(--f-display);font-size:20px}
.m-card img{width:100%;height:auto;border-radius:12px;display:block;background:#000}
.m-note{margin:0;font-size:12.5px;color:var(--dim)}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass);display:grid;place-items:center}
.x svg{width:14px;height:14px}

@media (min-width:900px){
  #hudBottom{display:contents}
  #dock{position:absolute;left:var(--gut);right:calc(var(--panel-w) + var(--gutR) + 14px);bottom:16px}
  #panel{position:absolute;top:12px;right:var(--gutR);bottom:16px;width:var(--panel-w)}
  #top{right:calc(var(--panel-w) + var(--gutR) + 14px)}
  #stats{top:66px}
}
@media (max-width:899px){
  #hudBottom{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding:0 var(--gutR) 10px var(--gut)}
  #panel{max-height:min(44vh,400px)}
  #btnSheet{display:grid;place-items:center}
  #dock{padding:8px 12px 4px;gap:8px}
  .round{width:38px;height:38px}
  .s-chip .k{display:none}
  #stats{top:58px}
  .tab{font-size:12.5px}
  .evs{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){ .r3 b{font-size:12.5px} .big{font-size:24px} }
/* premium polish */
#top::before{content:"";position:absolute;left:-20px;right:-20px;top:-14px;height:100px;background:linear-gradient(180deg,rgba(5,8,22,.8),rgba(5,8,22,0));pointer-events:none;z-index:-1}
#stats{text-shadow:0 2px 22px rgba(0,0,0,.7)}
#panel{background:linear-gradient(180deg,rgba(19,30,72,.82),rgba(6,10,28,.92));box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(150,172,255,.07)}
#dock{background:linear-gradient(180deg,rgba(16,26,62,.8),rgba(7,11,30,.88));box-shadow:0 14px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.adv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(246,191,85,.16),rgba(71,198,255,.07));border:1px solid var(--line-2)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:#1b1304;background:linear-gradient(135deg,#ffe9b8,#f6bf55 60%,#e29a2a);box-shadow:0 0 0 3px rgba(246,191,85,.22),0 8px 24px rgba(246,191,85,.32)}
.adv-t{display:flex;flex-direction:column;min-width:0}
.adv-t b{font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adv-t span{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#spark{display:block;width:min(270px,64vw);height:auto;margin-top:4px;overflow:visible}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:13px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));text-align:left;transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.tile:hover{transform:translateY(-1px)}
.tile svg{width:28px;height:28px;color:var(--faint);transition:color .2s}
.tile span{font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.15;color:var(--dim)}
.tile[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(180deg,rgba(246,191,85,.2),rgba(246,191,85,.06));box-shadow:0 0 28px rgba(246,191,85,.22),inset 0 0 0 1px var(--gold)}
.tile[aria-pressed=true] svg{color:var(--gold-hi)}
.tile[aria-pressed=true] span{color:var(--ink)}
.i-card{background:linear-gradient(180deg,rgba(19,30,72,.84),rgba(7,11,30,.92));animation:rise .9s cubic-bezier(.2,.9,.2,1)}
.i-card h1{background:linear-gradient(180deg,#fff 30%,#c7d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro{background:radial-gradient(90% 70% at 50% 50%,rgba(6,10,26,.2),rgba(6,10,26,.72))}
#btnQ{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
#btnQ[aria-pressed=false]{color:var(--faint)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ============================================================ finance model */
const mRate = (r) => Math.pow(1 + r, 1 / 12) - 1;
/* SIP paid at the start of each month, stepping up once a year */
function simulate(sip, step, r, years) {
  const n = years * 12, mr = mRate(r);
  const inv = new Float64Array(n + 1), val = new Float64Array(n + 1);
  let v = 0, i = 0, s = sip;
  for (let m = 1; m <= n; m++) {
    if (m > 1 && (m - 1) % 12 === 0) s *= 1 + step;
    v = (v + s) * (1 + mr); i += s; inv[m] = i; val[m] = v;
  }
  return { inv, val };
}
function fvOnly(sip, step, r, years) {
  const n = years * 12, mr = mRate(r); let v = 0, s = sip;
  for (let m = 1; m <= n; m++) { if (m > 1 && (m - 1) % 12 === 0) s *= 1 + step; v = (v + s) * (1 + mr); }
  return v;
}

  return arr[i] * (1 - f) + arr[Math.min(i + 1, L)] * f;
}

function flatNeed(fc, years, r) {

  return fc / (((Math.pow(1 + mr, n) - 1) / mr) * (1 + mr));
}

function recalc() {

  M.main = simulate(S.sip, S.step, S.rate, S.H);
  M.inv = M.main.inv[S.H * 12]; M.val = M.main.val[S.H * 12];
  M.range = ASSUME.scenarios.map((r) => fvOnly(S.sip, S.step, r, S.H));
  GOALS.forEach((g) => { g.fc = g.cost * Math.pow(1 + g.infl, g.years); g.need = g.fc / fvOnly(1, S.step, S.rate, g.years); });
  const sumNeed = act.reduce((a, g) => a + g.need, 0);
  GOALS.forEach((g) => {
    if (!S.on[g.id]) { g.share = 0; g.sip = 0; g.sim = null; g.funded = 0; return; }
    g.share = S.alloc === "smart" ? g.need / sumNeed : 1 / act.length;
    g.sip = S.sip * g.share;
    g.sim = simulate(g.sip, S.step, S.rate, g.years);
    g.funded = g.sim.val[g.years * 12] / g.fc;

  M.score = act.length ? Math.round(Math.min(...act.map((g) => Math.min(1, g.funded))) * 100) : 0;

}

const invAt = (tm) => interp(M.main.inv, tm);

function waitStats(D = 5) {

  const grad = g.createLinearGradient(0, 870, 0, 970); grad.addColorStop(0, "#fff2cf"); grad.addColorStop(1, "#f6bf55"); g.fillStyle = grad; g.font = "800 104px " + FD; g.fillText(t("sc_line", inr(M.val), yearLabel(S.H * 12)), 60, 950, 960);
  g.fillStyle = "#a0abd9"; g.font = "500 32px " + FM; g.fillText(t("sc_sub", inr(S.sip), Math.round(S.step * 100), S.H), 60, 1002, 960);
  g.fillStyle = "#6f7bb0"; g.font = "500 26px " + FM; g.fillText(t("sc_range") + ": " + M.range.map(inr).join(" / "), 60, 1046, 960);
  g.font = "600 30px " + FB; activeGoals().forEach((q, i) => { const x = 60 + (i % 2) * 500, y = 1112 + Math.floor(i / 2) * 48; g.fillStyle = q.funded >= 1 ? "#44dfa1" : "#f6bf55"; g.fillRect(x, y - 22, 8, 28); g.fillStyle = "#eef1ff"; g.fillText(gname(q.id) + "  " + Math.round(q.funded * 100) + "%", x + 20, y, 440); });
  g.fillStyle = "rgba(150,172,255,.25)"; g.fillRect(60, 1196, 960, 2);
  g.fillStyle = "#eef1ff"; g.font = "700 34px " + FD; g.fillText(ADVISOR.name + "  ·  " + ADVISOR.firm, 60, 1244, 960);
  g.fillStyle = "#a0abd9"; g.font = "500 26px " + FB; const ph = (ADVISOR.phone || "").replace(/\D/g, ""); g.fillText(t("adv_title") + "  ·  " + ADVISOR.arn + (ph.length >= 11 && !/x/i.test(ADVISOR.phone) ? "  ·  +" + ph : ""), 60, 1282, 960);
  g.fillStyle = "#6f7bb0"; g.font = "400 21px " + FB; wrapText(g, t("d1") + " " + t("d2"), 60, 1316, 960, 26);
  $("shareImg").src = c.toDataURL("image/jpeg", .92); renderLinks(); $("modal").hidden = false; $("mClose").focus();
}

/* ---------- layout ---------- */
function layout() {
  if (!World) return;
  const wide = window.innerWidth >= 900;
  if (wide) World.layout(Math.round(($("panel").offsetWidth + 30) / 2), 0); else World.layout(0, Math.round($("hudBottom").offsetHeight / 2));
}

/* ---------- wiring ---------- */
function setTab(n) { S.tab = n; ["plan", "goals", "events", "compare"].forEach((k) => { const on = k === n; $("tb-" + k).setAttribute("aria-selected", String(on)); $("tab-" + k).hidden = !on; }); $("panel").classList.remove("collapsed"); }
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("btnSheet").onclick = () => { $("panel").classList.toggle("collapsed"); };
$("sip").addEventListener("input", (e) => setSip(+e.target.value));
$("iSip").addEventListener("input", (e) => setSip(+e.target.value));
$("scrub").addEventListener("input", (e) => { S.tm = +e.target.value; S.playing = false; syncPlay(); tick(); });
$("btnPlay").onclick = () => { if (!S.playing && S.tm >= S.H * 12) S.tm = 0; S.playing = !S.playing; if (S.ev && S.playing) stopEvent(); syncPlay(); };
$("btnSpeed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; syncPlay(); };
$("btnReset").onclick = () => { if (World) World.reset(); };
$("btnLang").onclick = () => { S.lang = S.lang === "en" ? "hi" : "en"; try { localStorage.setItem("wc-lang", S.lang); } catch (e) {} applyLang(); };
$("cname").addEventListener("input", (e) => { S.name = e.target.value; renderLinks(); });
$("btnAuto").onclick = () => { S.alloc = S.alloc === "smart" ? "equal" : "smart"; modelChanged(); };
$("btnShare").onclick = openShare;
$("mClose").onclick = () => { $("modal").hidden = true; };
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) $("modal").hidden = true; });
$("iGo").onclick = () => {
  introOpen = false; $("intro").classList.add("gone"); setTimeout(() => { $("intro").hidden = true; }, 800);
  S.tm = REDUCE ? S.H * 12 : 0; S.playing = !REDUCE; syncPlay();
  if (World) { World.intro(); World.snap(); } tick();
};
if (World) {
  World.onPick = (id) => { World.flyTo(id); if (id === "tower") setTab("plan"); else { setTab("goals"); const r = ui.goalRows[id]; if (r) r.row.scrollIntoView({ block: "nearest", behavior: REDUCE ? "auto" : "smooth" }); } };
  $("btnDN").hidden = false;
  $("btnDN").onclick = () => { const o = ["auto", "night", "day"], nx = o[(o.indexOf(World.dayMode()) + 1) % 3]; World.setDay(nx); $("btnDN").textContent = { auto: "Auto", night: "\u263E Night", day: "\u2600 Day" }[nx]; };
  $("btnQ").hidden = false;
  World.onQuality = (l, auto) => { $("btnQ").textContent = l > 0 ? "HD" : "Lite"; $("btnQ").setAttribute("aria-pressed", String(l > 0)); if (auto) toast(t("q_auto")); };
  $("btnQ").onclick = () => World.setQuality(World.quality() > 0 ? 0 : 2);
  World.onGoalDone = (G) => { if (!introOpen) toast(t("t_goal", gname(G.id), yearLabel(G.years * 12))); };
  new ResizeObserver(() => { World.resize(); layout(); }).observe($("stage"));
  new ResizeObserver(layout).observe($("hudBottom"));
  new ResizeObserver(layout).observe($("panel"));
}
window.addEventListener("resize", layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (World) World.labelsDirty(); });

/* ---------- start ---------- */
(function init() {
  try { if (!localStorage.getItem("wc-lang") && /^hi/i.test(navigator.language || "")) S.lang = "hi"; } catch (e) {}
  refreshModel(); S.tm = Math.round(S.H * 12 * .55);
  applyLang(); syncPlay(); setTab("plan"); layout();
  if (World) World.snap();
  requestAnimationFrame(loop);
})();
</script></body></html>
